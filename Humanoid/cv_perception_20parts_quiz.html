6 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq09","label":"Additional Question 9","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eNếu chỉ thay \u003ccode\u003ecriteria\u003c/code\u003e từ tối đa 10 iteration thành tối đa 30 iteration, còn các tham số khác giữ nguyên, điều gì được thay đổi trực tiếp?\u003c/p\u003e\n      \n    ","choices":["Giới hạn iteration của quá trình tối ưu tăng lên","Shape \u003ccode\u003eprevPts\u003c/code\u003e tự động tăng gấp ba","RGB-depth tolerance tự động tăng gấp ba","EMA alpha tự động giảm còn một phần ba"],"correct":0},{"id":"cv-d0we2zsdk7a1","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq10","label":"Additional Question 10","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003ecalcOpticalFlowPyrLK\u003c/code\u003e, \u003ccode\u003eminEigThreshold\u003c/code\u003e được dùng để hỗ trợ loại các điểm như thế nào?\u003c/p\u003e\n      \n    ","choices":["Các điểm có timestamp cách depth frame quá xa","Các điểm có chất lượng gradient/eigenvalue quá thấp","Các điểm có tọa độ 3D nằm ngoài base frame","Các điểm có class label khác object đang track"],"correct":1},{"id":"cv-ly04j3qmpvhx","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq11","label":"Additional Question 11","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eGiả sử tracker dùng quy tắc đơn giản \u003ccode\u003equality \u0026gt;= minEigThreshold\u003c/code\u003e. Output là gì khi thay threshold từ \u003ccode\u003e0.01\u003c/code\u003e lên \u003ccode\u003e0.03\u003c/code\u003e?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nquality = np.array([\n    0.005, 0.010, 0.020,\n    0.030, 0.050\n])\n\nn1 = (\n    quality \u0026gt;= 0.01\n).sum()\n\nn2 = (\n    quality \u0026gt;= 0.03\n).sum()\n\nprint(n1, n2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e3 2\u003c/code\u003e","\u003ccode\u003e4 3\u003c/code\u003e","\u003ccode\u003e4 2\u003c/code\u003e","\u003ccode\u003e5 3\u003c/code\u003e"],"correct":2},{"id":"cv-y5zp351vrfqe9","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq12","label":"Additional Question 12","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003ecalcOpticalFlowPyrLK\u003c/code\u003e, khi sử dụng flag cho phép dùng giá trị flow ban đầu, ý nghĩa phù hợp nhất là gì?\u003c/p\u003e\n      \n    ","choices":["Dùng các giá trị trong \u003ccode\u003enextPts\u003c/code\u003e như ước lượng ban đầu","Dùng depth image làm optical-flow initialization","Dùng \u003ccode\u003estatus\u003c/code\u003e làm tọa độ ban đầu của feature","Dùng camera intrinsics làm displacement ban đầu"],"correct":0},{"id":"cv-1yoocn76u47ad","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq13","label":"Additional Question 13","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eForward–backward check thực hiện hai lần optical flow theo hướng nào?\u003c/p\u003e\n      \n    ","choices":["Depth → RGB rồi RGB → base frame","Frame trước → frame sau rồi frame sau → frame trước","Camera → base rồi base → world frame","Detection → mask rồi mask → bounding box"],"correct":1},{"id":"cv-1l65b0txye0hr","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq14","label":"Additional Question 14","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eThay forward–backward threshold từ \u003ccode\u003e2.0 px\u003c/code\u003e xuống \u003ccode\u003e0.5 px\u003c/code\u003e. Với cùng các error, output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nerror = np.array([\n    0.2, 0.5, 0.7, 1.5, 2.1\n])\n\na = (\n    error \u0026lt;= 2.0\n).sum()\n\nb = (\n    error \u0026lt;= 0.5\n).sum()\n\nprint(a, b)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e5 2\u003c/code\u003e","\u003ccode\u003e4 3\u003c/code\u003e","\u003ccode\u003e3 2\u003c/code\u003e","\u003ccode\u003e4 2\u003c/code\u003e"],"correct":3},{"id":"cv-2sa9ao16a7uf0","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq15","label":"Additional Question 15","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eMột synchronizer dùng tolerance \u003ccode\u003e0.05 s\u003c/code\u003e. Với các sai lệch timestamp dưới đây và điều kiện \u003ccode\u003e|Δt| \u0026lt;= tolerance\u003c/code\u003e, có bao nhiêu cặp đạt điều kiện?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ndt = np.array([\n    0.01, 0.05, 0.06, 0.02\n])\n\nprint(\n    (dt \u0026lt;= 0.05).sum()\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e3\u003c/code\u003e","\u003ccode\u003e4\u003c/code\u003e","\u003ccode\u003e1\u003c/code\u003e"],"correct":1},{"id":"cv-155mvihg1g17t","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq16","label":"Additional Question 16","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eTrong một approximate timestamp synchronizer, tăng tolerance/slop chủ yếu tạo trade-off nào?\u003c/p\u003e\n      \n    ","choices":["Giảm số channel RGB nhưng tăng số channel depth","Luôn làm hai sensor đồng bộ vật lý chính xác hơn","Cho phép ghép timestamp lệch nhiều hơn nhưng giảm độ chặt về thời gian","Biến depth camera thành RGB camera mà không cần calibration"],"correct":2},{"id":"cv-1kttbhd6988xz","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq17","label":"Additional Question 17","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eMột hàng đợi đồng bộ có giới hạn \u003ccode\u003equeue_size=3\u003c/code\u003e. Theo mô hình đơn giản dưới đây, khi thêm phần tử thứ tư thì phần tử cũ nhất bị loại. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003equeue = [\n    1.00, 1.10, 1.20\n]\n\nqueue.append(1.30)\n\nif len(queue) \u0026gt; 3:\n    queue.pop(0)\n\nprint(queue)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1.00,1.10,1.20]\u003c/code\u003e","\u003ccode\u003e[1.00,1.20,1.30]\u003c/code\u003e","\u003ccode\u003e[1.10,1.20,1.30]\u003c/code\u003e","\u003ccode\u003e[1.30]\u003c/code\u003e"],"correct":2},{"id":"cv-hhuyzs1a20cxi","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq18","label":"Additional Question 18","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eEMA dùng công thức \u003ccode\u003esmooth = α·new + (1-α)·old\u003c/code\u003e. Khi tăng \u003ccode\u003ealpha\u003c/code\u003e từ \u003ccode\u003e0.1\u003c/code\u003e lên \u003ccode\u003e0.9\u003c/code\u003e, hành vi nào đúng?\u003c/p\u003e\n      \n    ","choices":["Output mới phụ thuộc nhiều hơn vào measurement mới","Output mới phụ thuộc nhiều hơn vào giá trị lịch sử","Output luôn trở thành trung bình cộng của toàn bộ lịch sử","Output không còn phụ thuộc vào measurement mới"],"correct":0},{"id":"cv-a6ans7bya01h","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq19","label":"Additional Question 19","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eHai giá trị biên của \u003ccode\u003ealpha\u003c/code\u003e được dùng trong công thức EMA. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eold = 2.0\nnew = 10.0\n\nx0 = (\n    0.0*new +\n    1.0*old\n)\n\nx1 = (\n    1.0*new +\n    0.0*old\n)\n\nprint(x0, x1)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e10.0 2.0\u003c/code\u003e","\u003ccode\u003e6.0 6.0\u003c/code\u003e","\u003ccode\u003e0.0 10.0\u003c/code\u003e","\u003ccode\u003e2.0 10.0\u003c/code\u003e"],"correct":3},{"id":"cv-owtjijhv55dn","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq20","label":"Additional Question 20","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eTrack record sau được kiểm tra để bảo đảm centroid 3D có frame và đơn vị rõ ràng, đồng thời lưu timestamp. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erecord = {\n    \"track_id\": 12,\n    \"frame_index\": 81,\n    \"timestamp\": 4.25,\n    \"xyz\": [0.4, -0.2, 1.1],\n    \"frame\": \"base\",\n    \"unit\": \"m\",\n    \"status\": \"tracked\"\n}\n\nok = (\n    record[\"frame\"] == \"base\"\n    and record[\"unit\"] == \"m\"\n    and record[\"timestamp\"] \u0026gt;= 0\n    and len(record[\"xyz\"]) == 3\n)\n\nprint(ok)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eNone\u003c/code\u003e","\u003ccode\u003e\"tracked\"\u003c/code\u003e","\u003ccode\u003eFalse\u003c/code\u003e","\u003ccode\u003eTrue\u003c/code\u003e"],"correct":3},{"id":"cv-1syojjr5w3z6v","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q01","label":"Câu 1","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eDùng mô hình radial distortion đơn giản với tọa độ chuẩn hóa: \u003ccode\u003ex_d = x(1 + k1·r²)\u003c/code\u003e, \u003ccode\u003ey_d = y(1 + k1·r²)\u003c/code\u003e, trong đó \u003ccode\u003er²=x²+y²\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 0.6\ny = 0.8\nk1 = 0.1\n\nr2 = x*x + y*y\nscale = 1 + k1*r2\n\nxd = x*scale\nyd = y*scale\n\nprint(r2, xd, yd)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0 0.60 0.80\u003c/code\u003e","\u003ccode\u003e1.0 0.66 0.88\u003c/code\u003e","\u003ccode\u003e1.4 0.66 0.88\u003c/code\u003e","\u003ccode\u003e1.0 0.54 0.72\u003c/code\u003e"],"correct":1},{"id":"cv-i2jhm93stzgr","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q02","label":"Câu 2","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eDùng mô hình \u003ccode\u003escale = 1 + k1·r²\u003c/code\u003e. Với hệ số radial âm, output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 0.3\ny = 0.4\nk1 = -0.2\n\nr2 = x*x + y*y\nscale = 1 + k1*r2\n\nprint(\n    r2,\n    scale,\n    x*scale,\n    y*scale\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.25 0.95 0.285 0.380\u003c/code\u003e","\u003ccode\u003e0.25 1.05 0.315 0.420\u003c/code\u003e","\u003ccode\u003e0.50 0.90 0.270 0.360\u003c/code\u003e","\u003ccode\u003e0.50 1.10 0.330 0.440\u003c/code\u003e"],"correct":0},{"id":"cv-ps27wpxrl4wh","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q03","label":"Câu 3","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eMô hình radial dùng \u003ccode\u003e1 + k1·r² + k2·r⁴\u003c/code\u003e. Output của \u003ccode\u003escale\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 0.6\ny = 0.8\n\nk1 = 0.10\nk2 = -0.02\n\nr2 = x*x + y*y\nr4 = r2*r2\n\nscale = (\n    1\n    + k1*r2\n    + k2*r4\n)\n\nprint(scale)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.88\u003c/code\u003e","\u003ccode\u003e0.98\u003c/code\u003e","\u003ccode\u003e1.08\u003c/code\u003e","\u003ccode\u003e1.12\u003c/code\u003e"],"correct":2},{"id":"cv-b4d6s45ewaae","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q04","label":"Câu 4","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eĐiểm nằm đúng tại tâm quang học nên tọa độ chuẩn hóa là \u003ccode\u003e(x,y)=(0,0)\u003c/code\u003e. Chỉ xét radial distortion. Kết quả nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 0.0\ny = 0.0\n\nk1 = 0.4\nk2 = -0.2\n\nr2 = x*x + y*y\n\nscale = (\n    1\n    + k1*r2\n    + k2*r2*r2\n)\n\nxd = x*scale\nyd = y*scale\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(xd,yd)=(0.4,-0.2)\u003c/code\u003e","\u003ccode\u003e(xd,yd)=(1.0,1.0)\u003c/code\u003e","\u003ccode\u003e(xd,yd)=(-0.2,0.4)\u003c/code\u003e","\u003ccode\u003e(xd,yd)=(0.0,0.0)\u003c/code\u003e"],"correct":3},{"id":"cv-1rh65ihks8ot9","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q05","label":"Câu 5","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eReprojection error của một điểm được tính bằng khoảng cách Euclidean giữa pixel quan sát và pixel chiếu lại. Error bằng bao nhiêu pixel?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nobserved = np.array([\n    120.0, 80.0\n])\n\nprojected = np.array([\n    123.0, 84.0\n])\n\nerror = np.linalg.norm(\n    observed - projected\n)\n\nprint(error)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e7.0 px\u003c/code\u003e","\u003ccode\u003e5.0 px\u003c/code\u003e","\u003ccode\u003e4.0 px\u003c/code\u003e","\u003ccode\u003e3.5 px\u003c/code\u003e"],"correct":1},{"id":"cv-tcwcpe1r5d7ds","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q06","label":"Câu 6","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eBa điểm có reprojection error lần lượt là \u003ccode\u003e1, 2, 2 px\u003c/code\u003e. RMS reprojection error được tính bằng \u003ccode\u003esqrt(mean(e²))\u003c/code\u003e. Kết quả là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ne = np.array([\n    1.0, 2.0, 2.0\n])\n\nrms = np.sqrt(\n    np.mean(e**2)\n)\n\nprint(rms)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.414 px\u003c/code\u003e","\u003ccode\u003e2.000 px\u003c/code\u003e","\u003ccode\u003e1.732 px\u003c/code\u003e","\u003ccode\u003e3.000 px\u003c/code\u003e"],"correct":2},{"id":"cv-9ggvmw1700f5y","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q07","label":"Câu 7","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eĐịnh nghĩa \u003ccode\u003eT_a_from_b\u003c/code\u003e biến tọa độ từ frame b sang frame a. Cho \u003ccode\u003eT_base_from_cam\u003c/code\u003e có \u003ccode\u003eR=I\u003c/code\u003e, \u003ccode\u003et=(1,2,0) m\u003c/code\u003e. Điểm camera \u003ccode\u003ep_cam=(0.5,0.5,2) m\u003c/code\u003e. \u003ccode\u003ep_base\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\np_cam = np.array([\n    0.5, 0.5, 2.0\n])\n\nR = np.eye(3)\n\nt = np.array([\n    1.0, 2.0, 0.0\n])\n\np_base = R @ p_cam + t\n\nprint(p_base.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.5,0.5,2.0]\u003c/code\u003e","\u003ccode\u003e[-0.5,-1.5,2.0]\u003c/code\u003e","\u003ccode\u003e[1.5,2.5,2.0]\u003c/code\u003e","\u003ccode\u003e[1.5,1.5,2.0]\u003c/code\u003e"],"correct":2},{"id":"cv-ri5yppx55093","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q08","label":"Câu 8","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eT_a_from_b\u003c/code\u003e có \u003ccode\u003eR=I\u003c/code\u003e và \u003ccode\u003et=(1,2,3)\u003c/code\u003e. Khi đảo transform thành \u003ccode\u003eT_b_from_a\u003c/code\u003e, translation mới bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nR = np.eye(3)\n\nt = np.array([\n    1.0, 2.0, 3.0\n])\n\nR_inv = R.T\nt_inv = -R_inv @ t\n\nprint(t_inv.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1,2,3]\u003c/code\u003e","\u003ccode\u003e[3,2,1]\u003c/code\u003e","\u003ccode\u003e[-3,-2,-1]\u003c/code\u003e","\u003ccode\u003e[-1,-2,-3]\u003c/code\u003e"],"correct":3},{"id":"cv-1up0py1hziyrd","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q09","label":"Câu 9","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eCho rotation 90° quanh trục z và translation của \u003ccode\u003eT_a_from_b\u003c/code\u003e. Tính translation của transform nghịch đảo \u003ccode\u003eT_b_from_a\u003c/code\u003e bằng \u003ccode\u003e−Rᵀt\u003c/code\u003e.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nR = np.array([\n    [ 0., -1., 0.],\n    [ 1.,  0., 0.],\n    [ 0.,  0., 1.]\n])\n\nt = np.array([\n    1., 2., 0.\n])\n\nt_inv = -R.T @ t\n\nprint(t_inv.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[-2,1,0]\u003c/code\u003e","\u003ccode\u003e[-1,-2,0]\u003c/code\u003e","\u003ccode\u003e[-2,-1,0]\u003c/code\u003e","\u003ccode\u003e[2,-1,0]\u003c/code\u003e"],"correct":0},{"id":"cv-qo12ve1m4cg3u","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q10","label":"Câu 10","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eT_a_from_b\u003c/code\u003e dưới đây. Điểm \u003ccode\u003ep_a\u003c/code\u003e đã biết. Dùng transform nghịch đảo để tìm \u003ccode\u003ep_b\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nR = np.array([\n    [0., -1., 0.],\n    [1.,  0., 0.],\n    [0.,  0., 1.]\n])\n\nt = np.array([\n    1., 2., 0.\n])\n\np_a = np.array([\n    0., 3., 4.\n])\n\np_b = R.T @ (\n    p_a - t\n)\n\nprint(p_b.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1,1,4]\u003c/code\u003e","\u003ccode\u003e[1,1,-4]\u003c/code\u003e","\u003ccode\u003e[1,-1,4]\u003c/code\u003e","\u003ccode\u003e[-1,1,4]\u003c/code\u003e"],"correct":0},{"id":"cv-199f19090t6co","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q11","label":"Câu 11","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eStereo đã rectify. Dùng công thức \u003ccode\u003eZ=fB/d\u003c/code\u003e, với \u003ccode\u003ef=600 px\u003c/code\u003e, baseline \u003ccode\u003eB=0.10 m\u003c/code\u003e, disparity \u003ccode\u003ed=30 px\u003c/code\u003e. Depth là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ef = 600.0\nB = 0.10\nd = 30.0\n\nZ = f*B/d\n\nprint(Z)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.5 m\u003c/code\u003e","\u003ccode\u003e2.0 m\u003c/code\u003e","\u003ccode\u003e20.0 m\u003c/code\u003e","\u003ccode\u003e180.0 m\u003c/code\u003e"],"correct":1},{"id":"cv-13gd3dt2kndhz","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q12","label":"Câu 12","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eHai điểm tương ứng trong stereo rectified có \u003ccode\u003eu_left=350 px\u003c/code\u003e và \u003ccode\u003eu_right=330 px\u003c/code\u003e. Quy ước disparity \u003ccode\u003ed=u_left-u_right\u003c/code\u003e. Với \u003ccode\u003ef=500 px\u003c/code\u003e, \u003ccode\u003eB=0.12 m\u003c/code\u003e, depth là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eu_left = 350.0\nu_right = 330.0\n\nf = 500.0\nB = 0.12\n\nd = u_left - u_right\nZ = f*B/d\n\nprint(d, Z)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e20 px, 3.0 m\u003c/code\u003e","\u003ccode\u003e20 px, 2.5 m\u003c/code\u003e","\u003ccode\u003e30 px, 2.0 m\u003c/code\u003e","\u003ccode\u003e30 px, 3.0 m\u003c/code\u003e"],"correct":0},{"id":"cv-154d89c1q9zl1i","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q13","label":"Câu 13","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eGiữ \u003ccode\u003ef\u003c/code\u003e và \u003ccode\u003eB\u003c/code\u003e không đổi. Nếu disparity giảm từ \u003ccode\u003e40 px\u003c/code\u003e xuống \u003ccode\u003e20 px\u003c/code\u003e, depth thay đổi thế nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ef = 800.0\nB = 0.1\n\nZ1 = f*B/40.0\nZ2 = f*B/20.0\n\nprint(Z1, Z2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e4.0 m, 2.0 m\u003c/code\u003e","\u003ccode\u003e2.0 m, 2.0 m\u003c/code\u003e","\u003ccode\u003e2.0 m, 4.0 m\u003c/code\u003e","\u003ccode\u003e2.0 m, 8.0 m\u003c/code\u003e"],"correct":2},{"id":"cv-102odto1uhj5jk","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q14","label":"Câu 14","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eStereo rectified có \u003ccode\u003ef=700 px\u003c/code\u003e, \u003ccode\u003eB=0.2 m\u003c/code\u003e. Tính depth cho ba disparity dưới đây.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nd = np.array([\n    70.0, 35.0, 20.0\n])\n\nZ = 700.0*0.2/d\n\nprint(Z.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1,2,3.5]\u003c/code\u003e","\u003ccode\u003e[7,4,2]\u003c/code\u003e","\u003ccode\u003e[2,4,7]\u003c/code\u003e","\u003ccode\u003e[2,3.5,7]\u003c/code\u003e"],"correct":2},{"id":"cv-19u68kjn6kc7l","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q15","label":"Câu 15","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eVới stereo rectified và quy ước \u003ccode\u003ed=u_left-u_right\u003c/code\u003e, code loại disparity không dương trước khi tính depth. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nd = np.array([\n    20.0, 0.0, -5.0, 40.0\n])\n\nvalid = d \u0026gt; 0\n\nprint(valid.tolist())\nprint(valid.sum())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[True,True,False,True]\u003c/code\u003e, \u003ccode\u003e3\u003c/code\u003e","\u003ccode\u003e[True,False,True,True]\u003c/code\u003e, \u003ccode\u003e3\u003c/code\u003e","\u003ccode\u003e[False,True,True,False]\u003c/code\u003e, \u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e[True,False,False,True]\u003c/code\u003e, \u003ccode\u003e2\u003c/code\u003e"],"correct":3},{"id":"cv-jmkyfm17jo08u","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q16","label":"Câu 16","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eẢnh stereo đã rectify nên hai điểm tương ứng lý tưởng nằm trên cùng scanline. Cặp nào phù hợp nhất?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eleft=(420,200)\u003c/code\u003e, \u003ccode\u003eright=(390,200)\u003c/code\u003e","\u003ccode\u003eleft=(420,200)\u003c/code\u003e, \u003ccode\u003eright=(390,250)\u003c/code\u003e","\u003ccode\u003eleft=(420,200)\u003c/code\u003e, \u003ccode\u003eright=(420,170)\u003c/code\u003e","\u003ccode\u003eleft=(420,200)\u003c/code\u003e, \u003ccode\u003eright=(450,240)\u003c/code\u003e"],"correct":0},{"id":"cv-15nuzb314w6eth","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q17","label":"Câu 17","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eStereo đã rectify. Cho \u003ccode\u003ecx=320 px\u003c/code\u003e, \u003ccode\u003efx=500 px\u003c/code\u003e. Một điểm ở ảnh trái có \u003ccode\u003eu=420 px\u003c/code\u003e và depth triangulated \u003ccode\u003eZ=2 m\u003c/code\u003e. Tọa độ \u003ccode\u003eX\u003c/code\u003e trong camera trái là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eu = 420.0\ncx = 320.0\nfx = 500.0\nZ = 2.0\n\nX = (u-cx)*Z/fx\n\nprint(X)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.2 m\u003c/code\u003e","\u003ccode\u003e0.4 m\u003c/code\u003e","\u003ccode\u003e0.5 m\u003c/code\u003e","\u003ccode\u003e1.0 m\u003c/code\u003e"],"correct":1},{"id":"cv-1o3vj0aoiyhbe","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q18","label":"Câu 18","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eCho projection matrices của stereo rectified:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = [\n    [100, 0, 0,   0],\n    [  0,100, 0,   0],\n    [  0, 0, 1,   0]\n]\n\nP2 = [\n    [100, 0, 0, -20],\n    [  0,100, 0,   0],\n    [  0, 0, 1,   0]\n]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eVới dạng \u003ccode\u003eP2[0,3] = -fx·B\u003c/code\u003e, baseline \u003ccode\u003eB\u003c/code\u003e bằng bao nhiêu mét?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.02 m\u003c/code\u003e","\u003ccode\u003e2.00 m\u003c/code\u003e","\u003ccode\u003e0.20 m\u003c/code\u003e","\u003ccode\u003e20.0 m\u003c/code\u003e"],"correct":2},{"id":"cv-15fxgpk1glg562","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q19","label":"Câu 19","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003e\u003ccode\u003ecv.triangulatePoints\u003c/code\u003e trả tọa độ homogeneous 4×N. Với một điểm có vector \u003ccode\u003e[2,4,10,2]ᵀ\u003c/code\u003e, tọa độ Euclidean 3D là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nXh = np.array([\n    2.0, 4.0, 10.0, 2.0\n])\n\nX = Xh[:3] / Xh[3]\n\nprint(X.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2,4,10]\u003c/code\u003e","\u003ccode\u003e[1,2,5]\u003c/code\u003e","\u003ccode\u003e[4,8,20]\u003c/code\u003e","\u003ccode\u003e[1,2,10]\u003c/code\u003e"],"correct":1},{"id":"cv-1x997kdmjuiln","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-q20","label":"Câu 20","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eTrace pipeline stereo sau. Ảnh đã rectify. Sau khi tính disparity và depth, điểm được back-project trong camera trái. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003euL = 420.0\nuR = 380.0\nv = 290.0\n\nfx = 400.0\nfy = 400.0\ncx = 320.0\ncy = 240.0\nB = 0.20\n\nd = uL - uR\nZ = fx*B/d\n\nX = (uL-cx)*Z/fx\nY = (v-cy)*Z/fy\n\nprint(\n    d,\n    X,\n    Y,\n    Z\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e40, 0.25, 0.125, 1.0\u003c/code\u003e","\u003ccode\u003e40, 0.50, 0.250, 2.0\u003c/code\u003e","\u003ccode\u003e80, 0.50, 0.250, 2.0\u003c/code\u003e","\u003ccode\u003e40, 1.00, 0.500, 4.0\u003c/code\u003e"],"correct":1},{"id":"cv-fko71and38is","chapter":"17","topic":"Phần 17 — Distortion, pose và stereo","source":{"id":"cv-p17-aq01","label":"Additional Question 1","batch":"cv-p17"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003ecv.projectPoints\u003c/code\u003e, nhóm tham số nào mô tả pose của object/world points đối với camera?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003ecameraMatrix\u003c/code\u003e và \u003ccode\u003edistC tch":"cv-p18"},"html":"\n      \n      \u003cp\u003eKhoảng cách đại số đã chuẩn hóa từ điểm \u003ccode\u003ex=(u,v,1)\u003c/code\u003e đến epipolar line \u003ccode\u003el=(a,b,c)\u003c/code\u003e được tính bằng \u003ccode\u003e|au+bv+c|/sqrt(a²+b²)\u003c/code\u003e. Kết quả là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\na = 3.0\nb = 4.0\nc = -10.0\n\nu = 2.0\nv = 1.0\n\nd = abs(\n    a*u + b*v + c\n) / np.sqrt(\n    a*a + b*b\n)\n\nprint(d)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.2\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e"],"correct":0},{"id":"cv-1xp58zq1a1cg4w","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q06","label":"Câu 6","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003eGiả sử essential matrix được tạo theo \u003ccode\u003eE=[t]×R\u003c/code\u003e. Với \u003ccode\u003eR=I\u003c/code\u003e và \u003ccode\u003et=(1,0,0)\u003c/code\u003e, matrix nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e[t]x = [\n    [ 0, -tz,  ty],\n    [ tz,  0, -tx],\n    [-ty, tx,   0]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[[0,0,0],[0,0,1],[0,-1,0]]\u003c/code\u003e","\u003ccode\u003e[[0,0,0],[0,0,-1],[0,1,0]]\u003c/code\u003e","\u003ccode\u003e[[0,-1,0],[1,0,0],[0,0,0]]\u003c/code\u003e","\u003ccode\u003e[[0,0,1],[0,0,0],[-1,0,0]]\u003c/code\u003e"],"correct":1},{"id":"cv-1oyoo34gjnf7","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q07","label":"Câu 7","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003eHai translation vector dưới đây có cùng hướng. Sau khi chuẩn hóa về unit vector, output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nt1 = np.array([\n    1., 2., 2.\n])\n\nt2 = np.array([\n    3., 6., 6.\n])\n\nu1 = t1 / np.linalg.norm(t1)\nu2 = t2 / np.linalg.norm(t2)\n\nprint(\n    np.round(u1, 3).tolist(),\n    np.round(u2, 3).tolist()\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.333,0.667,0.667]\u003c/code\u003e và \u003ccode\u003e[0.333,0.667,0.667]\u003c/code\u003e","\u003ccode\u003e[1,2,2]\u003c/code\u003e và \u003ccode\u003e[1,2,2]\u003c/code\u003e","\u003ccode\u003e[0.5,0.5,0.5]\u003c/code\u003e và \u003ccode\u003e[0.5,0.5,0.5]\u003c/code\u003e","\u003ccode\u003e[0.333,0.667,0.667]\u003c/code\u003e và \u003ccode\u003e[1,2,2]\u003c/code\u003e"],"correct":0},{"id":"cv-11vq89rpt8byt","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q08","label":"Câu 8","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003eGiả sử pose được suy ra chỉ từ essential matrix của hai camera monocular đã calibrated, không có thêm thông tin metric. Kết luận nào phù hợp về translation?\u003c/p\u003e\n      \n    ","choices":["Cả hướng và độ dài translation đều được xác định theo mét","Chỉ độ dài translation được xác định, hướng còn mơ hồ","Translation luôn có độ dài chính xác bằng 1 mét","Hướng translation có thể suy ra nhưng metric scale chưa được xác định"],"correct":3},{"id":"cv-uzahqk1n8kxwk","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q09","label":"Câu 9","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003eTrong bài này, pose PnP được hiểu theo chiều object→camera: \u003ccode\u003eX_cam = R·X_obj + t\u003c/code\u003e. Với \u003ccode\u003eR=I\u003c/code\u003e, output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nX_obj = np.array([\n    1., 2., 3.\n])\n\nR = np.eye(3)\n\nt = np.array([\n    0.5, -1.0, 2.0\n])\n\nX_cam = R @ X_obj + t\n\nprint(X_cam.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.5,3.0,1.0]\u003c/code\u003e","\u003ccode\u003e[1.0,2.0,3.0]\u003c/code\u003e","\u003ccode\u003e[1.5,1.0,5.0]\u003c/code\u003e","\u003ccode\u003e[0.5,-1.0,2.0]\u003c/code\u003e"],"correct":2},{"id":"cv-12yci5iuko58w","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q10","label":"Câu 10","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003ePose object→camera có rotation 90° quanh z như dưới đây. Điểm object được transform thành tọa độ camera nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nR = np.array([\n    [0., -1., 0.],\n    [1.,  0., 0.],\n    [0.,  0., 1.]\n])\n\nt = np.array([\n    1., 2., 0.\n])\n\nX_obj = np.array([\n    2., 1., 3.\n])\n\nX_cam = R @ X_obj + t\n\nprint(X_cam.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[3,3,3]\u003c/code\u003e","\u003ccode\u003e[0,4,3]\u003c/code\u003e","\u003ccode\u003e[2,1,3]\u003c/code\u003e","\u003ccode\u003e[2,4,3]\u003c/code\u003e"],"correct":1},{"id":"cv-18unsmrsunuo","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q11","label":"Câu 11","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003eCho điểm đã ở camera frame \u003ccode\u003e(X,Y,Z)=(1,0.5,2) m\u003c/code\u003e. Camera không distortion có \u003ccode\u003efx=400\u003c/code\u003e, \u003ccode\u003efy=400\u003c/code\u003e, \u003ccode\u003ecx=320\u003c/code\u003e, \u003ccode\u003ecy=240\u003c/code\u003e pixel. Pixel chiếu lại là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX = 1.0\nY = 0.5\nZ = 2.0\n\nfx = fy = 400.0\ncx = 320.0\ncy = 240.0\n\nu = fx*X/Z + cx\nv = fy*Y/Z + cy\n\nprint(u, v)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(420,290)\u003c/code\u003e","\u003ccode\u003e(520,340)\u003c/code\u003e","\u003ccode\u003e(720,440)\u003c/code\u003e","\u003ccode\u003e(520,440)\u003c/code\u003e"],"correct":1},{"id":"cv-11zb4m01i7u2ie","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q12","label":"Câu 12","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003ePixel quan sát là \u003ccode\u003e(522,337)\u00   \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ninliers = np.array([\n    [0],\n    [1],\n    [3],\n    [5],\n    [6],\n    [8]\n])\n\nprint(\n    inliers.reshape(-1).tolist(),\n    len(inliers)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0,1,3,5,6,8]\u003c/code\u003e, \u003ccode\u003e5\u003c/code\u003e","\u003ccode\u003e[0,1,3,5,6,8]\u003c/code\u003e, \u003ccode\u003e6\u003c/code\u003e","\u003ccode\u003e[1,2,4,6,7,9]\u003c/code\u003e, \u003ccode\u003e6\u003c/code\u003e","\u003ccode\u003e[0,1,2,3,4,5]\u003c/code\u003e, \u003ccode\u003e6\u003c/code\u003e"],"correct":1},{"id":"cv-rgn69m1f0khf6","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q15","label":"Câu 15","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003eCó 10 correspondence, và \u003ccode\u003esolvePnPRansac\u003c/code\u003e trả về 7 inlier index. Nếu xem ba correspondence còn lại là outlier, inlier ratio là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003en_total = 10\nn_inlier = 7\n\nratio = n_inlier / n_total\n\nprint(ratio)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.3\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e0.7\u003c/code\u003e","\u003ccode\u003e0.8\u003c/code\u003e"],"correct":2},{"id":"cv-13i7161z60zc5","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q16","label":"Câu 16","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003eĐã có pose object→camera. Muốn lấy camera center trong object frame, dùng \u003ccode\u003eC_obj = -Rᵀt\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nR = np.eye(3)\n\nt = np.array([\n    1., 2., 3.\n])\n\nC_obj = -R.T @ t\n\nprint(C_obj.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1,2,3]\u003c/code\u003e","\u003ccode\u003e[3,2,1]\u003c/code\u003e","\u003ccode\u003e[-3,-2,-1]\u003c/code\u003e","\u003ccode\u003e[-1,-2,-3]\u003c/code\u003e"],"correct":3},{"id":"cv-jau0ag2x9a6w","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q17","label":"Câu 17","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003ePose object→camera có rotation dưới đây. Camera center trong object frame được tính bằng \u003ccode\u003e-Rᵀt\u003c/code\u003e. Kết quả là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nR = np.array([\n    [0., -1., 0.],\n    [1.,  0., 0.],\n    [0.,  0., 1.]\n])\n\nt = np.array([\n    1., 2., 0.\n])\n\nC = -R.T @ t\n\nprint(C.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[-1,-2,0]\u003c/code\u003e","\u003ccode\u003e[-2,1,0]\u003c/code\u003e","\u003ccode\u003e[2,-1,0]\u003c/code\u003e","\u003ccode\u003e[1,2,0]\u003c/code\u003e"],"correct":1},{"id":"cv-1qaxlxt1qgwy35","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q18","label":"Câu 18","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003eCho ba correspondence với giá trị epipolar residual đã tính sẵn. Quy tắc là inlier nếu \u003ccode\u003e|x2ᵀEx1| \u0026lt; 0.02\u003c/code\u003e, lưu ý bất đẳng thức là \u003cstrong\u003e\u0026lt;\u003c/strong\u003e, không phải \u003cstrong\u003e\u0026lt;=\u003c/strong\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nr = np.array([\n    -0.010,\n     0.020,\n     0.019,\n    -0.025\n])\n\nmask = np.abs(r) \u0026lt; 0.02\n\nprint(mask.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[True,True,True,False]\u003c/code\u003e","\u003ccode\u003e[True,False,False,False]\u003c/code\u003e","\u003ccode\u003e[True,False,True,False]\u003c/code\u003e","\u003ccode\u003e[False,True,True,False]\u003c/code\u003e"],"correct":2},{"id":"cv-r0t4ju1x02e9g","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q19","label":"Câu 19","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003eMột pose PnP đã được solver trả về. Ta chỉ kiểm tra pose bằng reprojection, không chạy lại solver. RMS reprojection error là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nobserved = np.array([\n    [100.,100.],\n    [200.,100.],\n    [200.,200.]\n])\n\nprojected = np.array([\n    [101.,100.],\n    [200.,102.],\n    [197.,200.]\n])\n\ndiff = observed - projected\n\nsq = np.sum(\n    diff**2,\n    axis=1\n)\n\nrms = np.sqrt(\n    np.mean(sq)\n)\n\nprint(\n    sq.tolist(),\n    round(rms, 3)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1,4,9]\u003c/code\u003e, \u003ccode\u003e2.160\u003c/code\u003e","\u003ccode\u003e[1,2,3]\u003c/code\u003e, \u003ccode\u003e1.414\u003c/code\u003e","\u003ccode\u003e[1,4,9]\u003c/code\u003e, \u003ccode\u003e4.667\u003c/code\u003e","\u003ccode\u003e[1,4,9]\u003c/code\u003e, \u003ccode\u003e3.742\u003c/code\u003e"],"correct":0},{"id":"cv-14sy5e5bey5d7","chapter":"18","topic":"Phần 18 — Epipolar geometry và PnP","source":{"id":"cv-p18-q20","label":"Câu 20","batch":"cv-p18"},"html":"\n      \n      \u003cp\u003eTrace pipeline PnP sau. Pose object→camera đã được cung cấp sẵn nên không cần dự đoán output solver. Điểm được transform rồi project bằng pinhole không distortion. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nX_obj = np.array([\n    1., 0., 2.\n])\n\nR = np.eye(3)\n\nt = np.array([\n    0., 0., 2.\n])\n\nfx = 400.0\nfy = 400.0\ncx = 320.0\ncy = 240.0\n\nX_cam = R @ X_obj + t\n\nX, Y, Z = X_cam\n\nu = fx*X/Z + cx\nv = fy*Y/Z + cy\n\nobserved = np.array([\n    421., 240.\n])\n\nprojected = np.array([\n    u, v\n])\n\nerror = np.linalg.norm(\n    observed - projected\n)\n\nprint(X_cam.tolist())\nprint(projected.tolist())\nprint(error)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1,0,2]\u003c/code\u003e, \u003ccode\u003e[520,240]\u003c/code\u003e, \ ","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eTính khoảng cách từ điểm \u003ccode\u003e(1,1,2)\u003c/code\u003e đến plane \u003ccode\u003ex+2y+2z-9=0\u003c/code\u003e.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\np = np.array([\n    1., 1., 2.\n])\n\na, b, c, d = (\n    1., 2., 2., -9.\n)\n\nnum = abs(\n    a*p[0]\n    + b*p[1]\n    + c*p[2]\n    + d\n)\n\nden = np.sqrt(\n    a*a + b*b + c*c\n)\n\nprint(num / den)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1/3 m\u003c/code\u003e","\u003ccode\u003e1/2 m\u003c/code\u003e","\u003ccode\u003e2/3 m\u003c/code\u003e","\u003ccode\u003e1 m\u003c/code\u003e"],"correct":2},{"id":"cv-s9s83bulw3nx","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q08","label":"Câu 8","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003ePlane là \u003ccode\u003ez=1.0 m\u003c/code\u003e. Một điểm được xem là inlier nếu khoảng cách tới plane \u003cstrong\u003e\u0026lt;= 0.05 m\u003c/strong\u003e. Có bao nhiêu inlier?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nz = np.array([\n    0.94,\n    0.96,\n    1.00,\n    1.05,\n    1.08\n])\n\ndist = np.abs(z - 1.0)\ninlier = dist \u0026lt;= 0.05\n\nprint(inlier.tolist())\nprint(inlier.sum())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[True,True,True,True,False]\u003c/code\u003e, \u003ccode\u003e4\u003c/code\u003e","\u003ccode\u003e[False,True,True,False,False]\u003c/code\u003e, \u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e[False,True,True,True,True]\u003c/code\u003e, \u003ccode\u003e4\u003c/code\u003e","\u003ccode\u003e[False,True,True,True,False]\u003c/code\u003e, \u003ccode\u003e3\u003c/code\u003e"],"correct":3},{"id":"cv-1fagu9i1ggda22","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q09","label":"Câu 9","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eMột lần chạy RANSAC đã cho sẵn plane model và danh sách inlier. Không cần dự đoán RANSAC sẽ tìm plane nào. Có bao nhiêu outlier trong cloud gồm 10 điểm?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003einliers = [\n    0, 1, 2, 4,\n    5, 7, 8\n]\n\nn_points = 10\n\nn_outliers = (\n    n_points - len(inliers)\n)\n\nprint(n_outliers)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e7\u003c/code\u003e","\u003ccode\u003e3\u003c/code\u003e","\u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e1\u003c/code\u003e"],"correct":1},{"id":"cv-11zsrkf12ws79j","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q10","label":"Câu 10","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eCho danh sách inlier do RANSAC trả về. Đoạn code lấy các điểm không thuộc plane. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\npoints = np.array([\n    [0,0,0],\n    [1,0,0],\n    [2,0,1],\n    [3,0,0],\n    [4,0,2]\n])\n\ninliers = np.array([\n    0, 1, 3\n])\n\nmask = np.ones(\n    len(points),\n    dtype=bool\n)\n\nmask[inliers] = False\n\noutliers = points[mask]\n\nprint(outliers.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[[0,0,0],[1,0,0],[3,0,0]]\u003c/code\u003e","\u003ccode\u003e[[1,0,0],[3,0,0]]\u003c/code\u003e","\u003ccode\u003e[[2,0,1],[4,0,2]]\u003c/code\u003e","\u003ccode\u003e[[0,0,0],[2,0,1],[4,0,2]]\u003c/code\u003e"],"correct":2},{"id":"cv-1wgktxujsfc8c","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q11","label":"Câu 11","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eAABB của point cloud được xác định bởi min/max trên từng trục. Với các điểm dưới đây, \u003ccode\u003emin_bound\u003c/code\u003e và \u003ccode\u003emax_bound\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\npoints = np.array([\n    [ 1.,  2., 3.],\n    [-1.,  5., 4.],\n    [ 3., -2., 8.],\n    [ 2.,  1., 0.]\n])\n\nmin_bound = points.min(axis=0)\nmax_bound = points.max(axis=0)\n\nprint(min_bound.tolist())\nprint(max_bound.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[-1,-2,0]\u003c/code\u003e và \u003ccode\u003e[3,5,8]\u003c/code\u003e","\u003ccode\u003e[1,1,0]\u003c/code\u003e và \u003ccode\u003e[3,5,8]\u003c/code\u003e","\u003ccode\u003e[-1,-2,3]\u003c/code\u003e và \u003ccode\u003e[2,5,8]\u003c/code\u003e","\u003ccode\u003e[-1,1,0]\u003c/code\u003e và \u003ccode\u003e[3,2,8]\u003c/code\u003e"],"correct":0},{"id":"cv-qh0d0s1reigwk","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q12","label":"Câu 12","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eAABB có \u003ccode\u003emin_bound=(-1,-2,0)\u003c/code\u003e và \u003ccode\u003emax_bound=(3,4,6)\u003c/code\u003e mét. Center của box là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nmn = np.array([\n    -1., -2., 0.\n])\n\nmx = np.array([\n     3.,  4., 6.\n])\n\ncenter = (mn + mx) / 2\n\nprint(center.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2,3,3]\u003c/code\u003e","\u003ccode\u003e[1,2,3]\u003c/code\u003e","\u003ccode\u003e[1,1,6]\u003c/code\u003e","\u003ccode\u003e[1,1,3]\u003c/code\u003e"],"correct":3},{"id":"cv-zqo5vy1qclb7u","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q13","label":"Câu 13","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eAABB có min/max như dưới đây. Extent \u003ccode\u003e(dx,dy,dz)\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nmn = np.array([\n    -1., 2., 3.\n])\n\nmx = np.array([\n     4., 8., 10.\n])\n\nextent = mx - mn\n\nprint(extent.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[3,6,7]\u003c/code\u003e","\u003ccode\u003e[5,10,13]\u003c/code\u003e","\u003ccode\u003e[5,6,7]\u003c/code\u003e","\u003ccode\u003e[4,8,10]\u003c/code\u003e"],"correct":2},{"id":"cv-1mlyalfp2f7qp","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q14","label":"Câu 14","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eAABB có extent \u003ccode\u003e(2,3,4) m\u003c/code\u003e. Volume của box là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nextent = np.array([\n    2., 3., 4.\n])\n\nvolume = np.prod(extent)\n\nprint(volume)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e9 m³\u003c/code\u003e","\u003ccode\u003e24 m³\u003c/code\u003e","\u003ccode\u003e12 m³\u003c/code\u003e","\u003ccode\u003e36 m³\u003c/code\u003e"],"correct":1},{"id":"cv-raj7cnijpedf","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q15","label":"Câu 15","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eHai AABB 3D được cho bởi min/max. Intersection extent được tính bằng \u003ccode\u003emax(0, min(max1,max2)-max(min1,min2))\u003c/code\u003e. Intersection volume là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nmin1 = np.array([0.,0.,0.])\nmax1 = np.array([2.,2.,2.])\n\nmin2 = np.array([1.,1.,1.])\nmax2 = np.array([3.,3.,3.])\n\ninter_min = np.maximum(\n    min1, min2\n)\n\ninter_max = np.minimum(\n    max1, max2\n)\n\ninter_extent = np.maximum(\n    0,\n    inter_max - inter_min\n)\n\ninter_volume = np.prod(\n    inter_extent\n)\n\nprint(\n    inter_extent.tolist(),\n    inter_volume\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2,2,2]\u003c/code\u003e, \u003ccode\u003e8\u003c/code\u003e","\u003ccode\u003e[1,1,1]\u003c/code\u003e, \u003ccode\u003e8\u003c/code\u003e","\u003ccode\u003e[2,2,2]\u003c/code\u003e, \u003ccode\u003e1\u003c/code\u003e","\u003ccode\u003e[1,1,1]\u003c/code\u003e, \u003ccode\u003e1\u003c/code\u003e"],"correct":3},{"id":"cv-1gx4l2gz33hjc","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q16","label":"Câu 16","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eHai AABB đều có volume \u003ccode\u003e8 m³\u003c/code\u003e và intersection volume \u003ccode\u003e1 m³\u003c/code\u003e. IoU3D bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ev1 = 8.0\nv2 = 8.0\ninter = 1.0\n\nunion = v1 + v2 - inter\niou = inter / union\n\nprint(\n    union,\n    iou\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e15\u003c/code\u003e, \u003ccode\u003e1/15\u003c/code\u003e","\u003ccode\u003e16\u003c/code\u003e, \u003ccode\u003e1/16\u003c/code\u003e","\u003ccode\u003e15\u003c/code\u003e, \u003ccode\u003e1/8\u003c/code\u003e","\u003ccode\u003e17\u003c/code\u003e, \u003ccode\u003e1/17\u003c/code\u003e"],"correct":0},{"id":"cv-1yxqq57oagj39","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q17","label":"Câu 17","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eHai AABB không overlap trên trục x. IoU3D bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nmin1 = np.array([0.,0.,0.])\nmax1 = np.array([1.,2.,2.])\n\nmin2 = np.array([2.,0.,0.])\nmax2 = np.array([3.,2.,2.])\n\ninter_extent = np.maximum(\n    0,\n    np.minimum(max1,max2)\n    - np.maximum(min1,min2)\n)\n\nprint(inter_extent.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.25\u003c/code\u003e"],"correct":2},{"id":"cv-340d7r2jm1ih","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q18","label":"Câu 18","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eHai AABB giống hệt nhau và đều có volume dương. IoU3D bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e"],"correct":1},{"id":"cv-4icpog1lr9lby","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q19","label":"Câu 19","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eTrace toàn bộ phép tính IoU3D cho hai AABB dưới đây. Kết quả cuối là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nmn1 = np.array([0.,0.,0.])\nmx1 = np.array([4.,2.,2.])\n\nmn2 = np.array([2.,1.,0.])\nmx2 = np.array([5.,3.,2.])\n\ne1 = mx1 - mn1\ne2 = mx2 - mn2\n\nv1 = np.prod(e1)\nv2 = np.prod(e2)\n\nimn = np.maximum(\n    mn1, mn2\n)\n\nimx = np.minimum(\n    mx1, mx2\n)\n\nie = np.maximum(\n    0,\n    imx - imn\n)\n\nvi = np.prod(ie)\n\niou = vi / (\n    v1 + v2 - vi\n)\n\nprint(\n    v1, v2, vi,\n    round(iou, 3)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e16,12,2,0.077\u003c/code\u003e","\u003ccode\u003e16,12,8,0.400\u003c/code\u003e","\u003ccode\u003e8,12,4,0.250\u003c/code\u003e","\u003ccode\u003e16,12,4,0.167\u003c/code\u003e"],"correct":3},{"id":"cv-jo0fmy174ugmw","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-q20","label":"Câu 20","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eMột object cloud sau khi loại plane có các điểm dưới đây. Tính AABB center, extent và volume.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\npoints = np.array([\n    [1., 2., 1.],\n    [3., 2., 1.],\n    [1., 6., 1.],\n    [3., 6., 5.],\n    [2., 4., 3.]\n])\n\nmn = points.min(axis=0)\nmx = points.max(axis=0)\n\ncenter = (\n    mn + mx\n) / 2\n\nextent = mx - mn\nvolume = np.prod(extent)\n\nprint(center.tolist())\nprint(extent.tolist())\nprint(volume)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003ecenter=[2,4,3]\u003c/code\u003e, \u003ccode\u003eextent=[2,4,4]\u003c/code\u003e, \u003ccode\u003evolume=32\u003c/code\u003e","\u003ccode\u003ecenter=[2,4,3]\u003c/code\u003e, \u003ccode\u003eextent=[3,6,5]\u003c/code\u003e, \u003ccode\u003evolume=90\u003c/code\u003e","\u003ccode\u003ecenter=[1,2,1]\u003c/code\u003e, \u003ccode\u003eextent=[2,4,4]\u003c/code\u003e, \u003ccode\u003evolume=32\u003c/code\u003e","\u003ccode\u003ecenter=[2,4,2]\u003c/code\u003e, \u003ccode\u003eextent=[2,4,5]\u003c/code\u003e, \u003ccode\u003evolume=40\u003c/code\u003e"],"correct":0},{"id":"cv-plegg1iky03k","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-aq01","label":"Additional Question 1","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eTrong Open3D, lời gọi nào thực hiện voxel downsampling với kích thước voxel \u003ccode\u003e0.05\u003c/code\u003e theo đơn vị tọa độ của point cloud?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003epcd.voxel_down_sample(voxel_size=0.05)\u003c/code\u003e","\u003ccode\u003epcd.voxel_down_sample(radius=0.05)\u003c/code\u003e","\u003ccode\u003epcd.voxel_down_sample(eps=0.05)\u003c/code\u003e","\u003ccode\u003epcd.voxel_down_sample(scale=0.05)\u003c/code\u003e"],"correct":0},{"id":"cv-8g3nmf19sqfpp","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-aq02","label":"Additional Question 2","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003evoxel_down_sample(voxel_size)\u003c/code\u003e, tham số \u003ccode\u003evoxel_size\u003c/code\u003e điều khiển trực tiếp yếu tố nào?\u003c/p\u003e\n      \n    ","choices":["Số iteration của RANSAC","Kích thước voxel dùng để giảm mật độ point cloud","Khoảng cách tối đa giữa hai AABB","Số cluster tối đa của point cloud"],"correct":1},{"id":"cv-14j5jpvf7wlon","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-aq03","label":"Additional Question 3","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eGiữ nguyên một point cloud. Nếu tăng \u003ccode\u003evoxel_size\u003c/code\u003e đáng kể, xu hướng thông thường của số điểm sau voxel downsampling là gì?\u003c/p\u003e\n      \n    ","choices":["Luôn tăng chính xác gấp đôi","Luôn giữ nguyên bất kể dữ liệu","Thường giảm vì nhiều điểm được gom vào cùng voxel hơn","Luôn bằng đúng số voxel của cloud ban đầu"],"correct":2},{"id":"cv-v8qm4a16plhu","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-aq04","label":"Additional Question 4","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eHai lần downsample cùng một cloud dùng \u003ccode\u003evoxel_size=0.01\u003c/code\u003e và \u003ccode\u003evoxel_size=0.10\u003c/code\u003e. Phát biểu nào phù hợp nhất?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.01\u003c/code\u003e luôn tạo ít điểm hơn \u003ccode\u003e0.10\u003c/code\u003e","Hai giá trị bắt buộc tạo cùng số điểm","\u003ccode\u003e0.10\u003c/code\u003e làm cloud dày hơn cloud ban đầu","\u003ccode\u003e0.10\u003c/code\u003e thường giảm dữ liệu mạnh hơn \u003ccode\u003e0.01\u003c/code\u003e"],"correct":3},{"id":"cv-1blzl0jk7ikg7","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-aq05","label":"Additional Question 5","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eTrong Open3D, lời gọi nào có cấu trúc tham số phù hợp để segment một plane bằng RANSAC?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003epcd.segment_plane(distance_threshold=0.01, ransac_n=3, num_iterations=1000)\u003c/code\u003e","\u003ccode\u003epcd.segment_plane(eps=0.01, min_points=3, max_iter=1000)\u003c/code\u003e","\u003ccode\u003epcd.segment_plane(radius=0.01, samples=3, epochs=1000)\u003c/code\u003e","\u003ccode\u003epcd.segment_plane(voxel=0.01, neighbors=3, steps=1000)\u003c/code\u003e"],"correct":0},{"id":"cv-1qmp0w51d85do3","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-aq06","label":"Additional Question 6","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003esegment_plane\u003c/code\u003e, tham số \u003ccode\u003edistance_threshold\u003c/code\u003e chủ yếu quyết định điều gì?\u003c/p\u003e\n      \n    ","choices":["Số điểm tối thiểu trong toàn bộ point cloud","Khoảng cách tối đa tới plane để điểm có thể được xem là inlier","Kích thước voxel dùng trước khi fit plane","Chiều dài normal vector sau khi chuẩn hóa"],"correct":1},{"id":"cv-18i85lneikkh3","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-aq07","label":"Additional Question 7","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eGiữ nguyên plane candidate và các điểm. Nếu tăng \u003ccode\u003edistance_threshold\u003c/code\u003e từ \u003ccode\u003e0.01\u003c/code\u003e lên \u003ccode\u003e0.05\u003c/code\u003e, điều gì thường xảy ra với tập inlier theo tiêu chuẩn khoảng cách?\u003c/p\u003e\n      \n    ","choices":["Số inlier bắt buộc giảm về 0","Plane normal tự động đổi dấu","Nhiều điểm hơn có thể đủ điều kiện trở thành inlier","Mọi điểm tự động trở thành outlier"],"correct":2},{"id":"cv-h2vvsxw31zr5","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-aq08","label":"Additional Question 8","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eCho các khoảng cách tới một plane candidate. So sánh số inlier với threshold \u003ccode\u003e0.02\u003c/code\u003e và \u003ccode\u003e0.05\u003c/code\u003e, dùng điều kiện \u003ccode\u003edistance \u0026lt;= threshold\u003c/code\u003e.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nd = np.array([\n    0.01,\n    0.02,\n    0.03,\n    0.05,\n    0.08\n])\n\nn1 = (\n    d \u0026lt;= 0.02\n).sum()\n\nn2 = (\n    d \u0026lt;= 0.05\n).sum()\n\nprint(n1, n2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1 3\u003c/code\u003e","\u003ccode\u003e2 3\u003c/code\u003e","\u003ccode\u003e1 4\u003c/code\u003e","\u003ccode\u003e2 4\u003c/code\u003e"],"correct":3},{"id":"cv-1jw66vhu2nljt","chapter":"19","topic":"Phần 19 — Voxel, plane và box 3D","source":{"id":"cv-p19-aq09","label":"Additional Question 9","batch":"cv-p19"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\
