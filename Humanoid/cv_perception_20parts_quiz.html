np\n\nc_cam = np.array([\n    0.2,0.1,1.0\n])\n\nt = np.array([\n    0.5,-0.2,0.3\n])\n\nc_base = c_cam + t\n\nrecord = {\n    \"centroid\": c_base.tolist(),\n    \"frame\": \"base\",\n    \"unit\": \"m\",\n    \"status\": \"valid\"\n}\n\nprint(record[\"centroid\"])\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.3,0.3,0.7]\u003c/code\u003e","\u003ccode\u003e[0.7,0.1,1.3]\u003c/code\u003e","\u003ccode\u003e[0.7,-0.1,1.3]\u003c/code\u003e","\u003ccode\u003e[0.5,-0.2,0.3]\u003c/code\u003e"],"correct":2},{"id":"cv-h2rg5014zgfcs","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-q20","label":"Câu 20","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eDepth đã aligned với RGB và dùng mét. Pipeline: threshold mask \u003ccode\u003e\u0026gt;=0.5\u003c/code\u003e → chỉ giữ \u003ccode\u003e0 \u0026lt; depth \u0026lt;= 3.0\u003c/code\u003e → lấy median depth → tạo status. Nếu có ít nhất 2 depth hợp lệ thì status là \u003ccode\u003e\"valid\"\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nmask_prob = np.array([\n    [0.8,0.6,0.4],\n    [0.9,0.7,0.5]\n])\n\ndepth = np.array([\n    [1.0,0.0,2.0],\n    [1.4,3.5,1.2]\n])\n\nmask = mask_prob \u0026gt;= 0.5\n\nvalid = (\n    mask\n    \u0026amp; (depth \u0026gt; 0)\n    \u0026amp; (depth \u0026lt;= 3.0)\n)\n\nz = depth[valid]\n\nmedian_depth = (\n    float(np.median(z))\n    if len(z) \u0026gt; 0\n    else None\n)\n\nstatus = (\n    \"valid\"\n    if len(z) \u0026gt;= 2\n    else \"insufficient_depth\"\n)\n\nprint(z.tolist())\nprint(median_depth)\nprint(status)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1.0,1.4,1.2]\u003c/code\u003e, \u003ccode\u003e1.2\u003c/code\u003e, \u003ccode\u003e\"valid\"\u003c/code\u003e","\u003ccode\u003e[1.0,0.0,1.4,1.2]\u003c/code\u003e, \u003ccode\u003e1.1\u003c/code\u003e, \u003ccode\u003e\"valid\"\u003c/code\u003e","\u003ccode\u003e[1.0,1.4,3.5,1.2]\u003c/code\u003e, \u003ccode\u003e1.3\u003c/code\u003e, \u003ccode\u003e\"valid\"\u003c/code\u003e","\u003ccode\u003e[1.0,1.4,1.2]\u003c/code\u003e, \u003ccode\u003e1.2\u003c/code\u003e, \u003ccode\u003e\"insufficient_depth\"\u003c/code\u003e"],"correct":0},{"id":"cv-wg1ady11sfhna","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq01","label":"Additional Question 1","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eTrong phép back-projection, thay đổi \u003ccode\u003efx\u003c/code\u003e trong khi giữ nguyên \u003ccode\u003eu,cx,Z\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eu = 420\ncx = 320\nZ = 2.0\n\nfx1 = 500.0\nfx2 = 1000.0\n\nX1 = (u-cx)*Z/fx1\nX2 = (u-cx)*Z/fx2\n\nprint(X1, X2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.2 0.4\u003c/code\u003e","\u003ccode\u003e0.4 0.2\u003c/code\u003e","\u003ccode\u003e0.4 0.8\u003c/code\u003e","\u003ccode\u003e0.2 0.1\u003c/code\u003e"],"correct":1},{"id":"cv-drh7j0id6am6","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq02","label":"Additional Question 2","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eGiữ nguyên pixel và intrinsics nhưng tăng depth từ \u003ccode\u003e1 m\u003c/code\u003e lên \u003ccode\u003e2 m\u003c/code\u003e. Output X thay đổi thế nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eu = 400\ncx = 320\nfx = 400\n\nZ1 = 1.0\nZ2 = 2.0\n\nX1 = (u-cx)*Z1/fx\nX2 = (u-cx)*Z2/fx\n\nprint(X1, X2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.2 0.4\u003c/code\u003e","\u003ccode\u003e0.4 0.2\u003c/code\u003e","\u003ccode\u003e0.2 0.2\u003c/code\u003e","\u003ccode\u003e0.4 0.8\u003c/code\u003e"],"correct":0},{"id":"cv-gwfzp01qa69xg","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq03","label":"Additional Question 3","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eHai \u003ccode\u003edepth_scale\u003c/code\u003e khác nhau được áp dụng lên cùng raw depth. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eraw = 2000.0\n\nz1 = raw / 1000.0\nz2 = raw / 5000.0\n\nprint(z1, z2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.5 2.0\u003c/code\u003e","\u003ccode\u003e2.0 4.0\u003c/code\u003e","\u003ccode\u003e2.0 0.4\u003c/code\u003e","\u003ccode\u003e0.4 2.0\u003c/code\u003e"],"correct":2},{"id":"cv-1meek0z1nnv1bf","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq04","label":"Additional Question 4","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eTrong pipeline RGB-D, vai trò của \u003ccode\u003edepth_trunc\u003c/code\u003e phù hợp nhất là gì?\u003c/p\u003e\n      \n    ","choices":["Đổi RGB từ BGR sang RGB trước khi tạo point cloud","Loại hoặc bỏ qua depth xa hơn giới hạn được chọn","Thay đổi focal length của camera depth khi back-project","Chuyển point cloud từ camera frame sang base frame"],"correct":1},{"id":"cv-1sqcbp61y3pbts","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq05","label":"Additional Question 5","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eThay đổi \u003ccode\u003edepth_trunc\u003c/code\u003e từ \u003ccode\u003e3.0\u003c/code\u003e xuống \u003ccode\u003e2.0 m\u003c/code\u003e. Với điều kiện \u003ccode\u003e0 \u0026lt; Z \u0026lt;= depth_trunc\u003c/code\u003e, số depth hợp lệ thay đổi thế nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nz = np.array([\n    0.5, 1.5, 2.0, 2.5, 3.0\n])\n\nn1 = (\n    (z \u0026gt; 0) \u0026amp;\n    (z \u0026lt;= 3.0)\n).sum()\n\nn2 = (\n    (z \u0026gt; 0) \u0026amp;\n    (z \u0026lt;= 2.0)\n).sum()\n\nprint(n1, n2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e5 2\u003c/code\u003e","\u003ccode\u003e4 3\u003c/code\u003e","\u003ccode\u003e5 3\u003c/code\u003e","\u003ccode\u003e3 5\u003c/code\u003e"],"correct":2},{"id":"cv-148xqog7fobi0","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq06","label":"Additional Question 6","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003eRGBDImage.create_from_color_and_depth(...)\u003c/code\u003e, tham số \u003ccode\u003edepth_scale\u003c/code\u003e có vai trò phù hợp nhất nào?\u003c/p\u003e\n      \n    ","choices":["Quy đổi giá trị depth lưu trữ sang độ sâu theo scale tương ứng","Thay đổi resolution của color image để khớp depth image","Đặt số channel đầu ra của point cloud thành ba channel","Định nghĩa translation giữa RGB camera và depth camera"],"correct":0},{"id":"cv-1k39zjq1pgbvnm","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq07","label":"Additional Question 7","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eTrong quá trình tạo RGB-D image, tham số \u003ccode\u003econvert_rgb_to_intensity=True\u003c/code\u003e chủ yếu điều khiển điều gì?\u003c/p\u003e\n      \n    ","choices":["Depth có được đổi từ millimet sang mét hay không","Color có được chuyển thành ảnh intensity hay không","Point cloud có được transform sang world frame hay không","Các pixel depth bằng 0 có được nội suy tự động hay không"],"correct":1},{"id":"cv-eq8clk1f5j0u4","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq08","label":"Additional Question 8","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eGiả sử hàm tạo point cloud nhận một tham số \u003ccode\u003eextrinsic\u003c/code\u003e 4×4. Vai trò hình học của tham số này là gì?\u003c/p\u003e\n      \n    ","choices":["Lưu focal length và principal point của camera","Lưu score threshold của detector trước khi tạo cloud","Biểu diễn phép biến đổi rigid giữa các hệ tọa độ liên quan","Lưu width và height của ảnh depth đầu vào"],"correct":2},{"id":"cv-1spy5jpgf7cgx","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq09","label":"Additional Question 9","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eMột pipeline tự viết chỉ project các pixel có depth hợp lệ. Thay đổi \u003ccode\u003eproject_valid_depth_only\u003c/code\u003e từ \u003ccode\u003eTrue\u003c/code\u003e sang \u003ccode\u003eFalse\u003c/code\u003e về mặt ý nghĩa nhằm thay đổi điều gì?\u003c/p\u003e\n      \n    ","choices":["Chính sách chỉ tạo điểm từ depth hợp lệ hay giữ cấu trúc liên quan tới pixel không hợp lệ","Thứ tự channel của color image giữa RGB và BGR","Đơn vị của translation từ millimet thành mét","Class ID mà detector cho phép đi vào pipeline"],"correct":0},{"id":"cv-9ajkfd15aotgr","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq10","label":"Additional Question 10","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eĐoạn code dùng \u003ccode\u003enp.median\u003c/code\u003e trên số lượng phần tử chẵn. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nz = np.array([\n    1.0, 1.2, 1.4, 4.0\n])\n\nprint(np.median(z))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.2\u003c/code\u003e","\u003ccode\u003e1.3\u003c/code\u003e","\u003ccode\u003e1.4\u003c/code\u003e","\u003ccode\u003e1.9\u003c/code\u003e"],"correct":1},{"id":"cv-1fd657bgao5j9","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq11","label":"Additional Question 11","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eĐoạn code chọn median depth chỉ từ pixel vừa nằm trong mask vừa có depth hợp lệ. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nmask = np.array([\n    [1,0,1],\n    [1,1,0]\n], dtype=bool)\n\ndepth = np.array([\n    [1.0,8.0,1.4],\n    [0.0,1.2,2.0]\n])\n\nz = depth[\n    mask \u0026amp; (depth \u0026gt; 0)\n]\n\nprint(\n    z.tolist(),\n    np.median(z)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1.0,8.0,1.4,1.2]\u003c/code\u003e và \u003ccode\u003e1.3\u003c/code\u003e","\u003ccode\u003e[1.0,1.4,0.0,1.2]\u003c/code\u003e và \u003ccode\u003e1.1\u003c/code\u003e","\u003ccode\u003e[1.0,1.4,1.2]\u003c/code\u003e và \u003ccode\u003e1.2\u003c/code\u003e","\u003ccode\u003e[1.0,1.4,2.0]\u003c/code\u003e và \u003ccode\u003e1.4\u003c/code\u003e"],"correct":2},{"id":"cv-13ferkuayd226","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq12","label":"Additional Question 12","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eĐoạn code dùng homogeneous transform cho nhiều điểm cùng lúc. Output của điểm đầu tiên là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\npoints = np.array([\n    [0.,0.,1.],\n    [1.,0.,1.]\n])\n\nT = np.array([\n    [1.,0.,0.,0.5],\n    [0.,1.,0.,1.0],\n    [0.,0.,1.,0.2],\n    [0.,0.,0.,1.0]\n])\n\nones = np.ones(\n    (len(points),1)\n)\n\nph = np.hstack([\n    points, ones\n])\n\nout = (\n    T @ ph.T\n).T[:, :3]\n\nprint(out[0].tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.0,0.0,1.0]\u003c/code\u003e","\u003ccode\u003e[1.0,0.5,1.2]\u003c/code\u003e","\u003ccode\u003e[0.5,1.0,1.0]\u003c/code\u003e","\u003ccode\u003e[0.5,1.0,1.2]\u003c/code\u003e"],"correct":3},{"id":"cv-npczgwpzz40q","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq13","label":"Additional Question 13","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003e\u003ccode\u003eT_base_from_cam\u003c/code\u003e đổi camera → base. Nếu centroid hiện đang ở camera frame, biểu thức nào đúng để đưa centroid sang base frame?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003ep_base = R_base_from_cam @ p_cam + t_base_from_cam\u003c/code\u003e","\u003ccode\u003ep_base = R_base_from_cam.T @ p_cam + t_base_from_cam\u003c/code\u003e","\u003ccode\u003ep_base = p_cam - t_base_from_cam\u003c/code\u003e","\u003ccode\u003ep_base = K @ p_cam + t_base_from_cam\u003c/code\u003e"],"correct":0},{"id":"cv-ypgzt1r7gn8h","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq14","label":"Additional Question 14","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eRGB mask được tạo trong RGB image nhưng depth chưa aligned. Cách xử lý nào phù hợp nhất trước khi lấy depth của object?\u003c/p\u003e\n      \n    ","choices":["Dùng trực tiếp cùng index \u003ccode\u003e[v,u]\u003c/code\u003e vì hai ảnh đều là ma trận","Chỉ resize depth cho cùng resolution rồi xem là đã registration","Dùng intrinsics/extrinsics để đăng ký depth sang RGB hoặc ánh xạ tương ứng","Đổi RGB thành grayscale rồi index depth bằng object mask"],"correct":2},{"id":"cv-1uf7mjwpssd7k","chapter":"14","topic":"Phần 14 — Detection + depth thành vật thể 3D","source":{"id":"cv-p14-aq15","label":"Additional Question 15","batch":"cv-p14"},"html":"\n      \n      \u003cp\u003eMột pipeline trả record sau. Kiểm tra yêu cầu: status phải \u003ccode\u003e\"valid\"\u003c/code\u003e, unit phải \u003ccode\u003e\"m\"\u003c/code\u003e, frame phải \u003ccode\u003e\"base\"\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erecord = {\n    \"class\": \"cup\",\n    \"centroid\": [0.6, -0.2, 0.9],\n    \"frame\": \"base\",\n    \"unit\": \"m\",\n    \"status\": \"valid\"\n}\n\nok = (\n    record[\"status\"] == \"valid\"\n    and record[\"unit\"] == \"m\"\n    and record[\"frame\"] == \"base\"\n)\n\nprint(ok)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eFalse\u003c/code\u003e","\u003ccode\u003eNone\u003c/code\u003e","\u003ccode\u003e\"valid\"\u003c/code\u003e","\u003ccode\u003eTrue\u003c/code\u003e"],"correct":3},{"id":"cv-5voc8xyy2txv","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q01","label":"Câu 1","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eHai box dùng định dạng \u003ccode\u003e[x1,y1,x2,y2]\u003c/code\u003e, trong đó \u003ccode\u003ex2,y2\u003c/code\u003e là biên ngoài. IoU của hai box bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = [0, 0, 4, 4]\nB = [2, 0, 6, 4]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e1/3\u003c/code\u003e","\u003ccode\u003e2/3\u003c/code\u003e"],"correct":2},{"id":"cv-kub8stizi54n","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q02","label":"Câu 2","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eHai box không giao nhau. Đoạn code tính IoU theo quy tắc intersection/union. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = [0, 0, 2, 2]\nB = [3, 0, 5, 2]\n\nix1 = max(A[0], B[0])\niy1 = max(A[1], B[1])\nix2 = min(A[2], B[2])\niy2 = min(A[3], B[3])\n\niw = max(0, ix2 - ix1)\nih = max(0, iy2 - iy1)\n\ninter = iw * ih\n\nareaA = (A[2]-A[0]) * (A[3]-A[1])\nareaB = (B[2]-B[0]) * (B[3]-B[1])\n\niou = inter / (areaA + areaB - inter)\n\nprint(iou)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e"],"correct":0},{"id":"cv-msx3xr64risl","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q03","label":"Câu 3","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eMa trận IoU giữa 2 track cũ và 3 detection mới đã được cho. Mỗi track chọn detection có IoU lớn nhất, nhưng một detection không được dùng cho hai track. Trong dữ liệu này các lựa chọn tốt nhất không xung đột. Kết quả ghép là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\niou = np.array([\n    [0.80, 0.20, 0.10],\n    [0.15, 0.75, 0.30]\n])\n\nprint(np.argmax(iou, axis=1).tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Track 0 → detection 1; track 1 → detection 0","Track 0 → detection 0; track 1 → detection 1","Track 0 → detection 0; track 1 → detection 2","Track 0 → detection 2; track 1 → detection 1"],"correct":1},{"id":"cv-1bv4pyp1wd6a4x","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q04","label":"Câu 4","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eAssociation dùng chi phí \u003ccode\u003ecost = 1 - IoU\u003c/code\u003e. Output của ma trận \u003ccode\u003ecost\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\niou = np.array([\n    [0.9, 0.2],\n    [0.4, 0.7]\n])\n\ncost = 1.0 - iou\n\nprint(cost.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[[0.9,0.2],[0.4,0.7]]\u003c/code\u003e","\u003ccode\u003e[[0.1,0.8],[0.6,0.3]]\u003c/code\u003e","\u003ccode\u003e[[0.1,0.2],[0.4,0.3]]\u003c/code\u003e","\u003ccode\u003e[[1.9,1.2],[1.4,1.7]]\u003c/code\u003e"],"correct":1},{"id":"cv-1kgikwa141ejke","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q05","label":"Câu 5","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eHungarian algorithm cần chọn một phần tử trên mỗi hàng và mỗi cột sao cho tổng chi phí nhỏ nhất. Với ma trận sau, assignment tối ưu là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ecost = [\n    [1, 5],\n    [4, 2]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Track 0 → detection 0; track 1 → detection 1; tổng = 3","Track 0 → detection 1; track 1 → detection 0; tổng = 9","Track 0 → detection 0; track 1 → detection 0; tổng = 5","Track 0 → detection 1; track 1 → detection 1; tổng = 7"],"correct":0},{"id":"cv-19j9uu71fif8sr","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q06","label":"Câu 6","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eCho ma trận chi phí 3×3. Assignment nào có tổng chi phí nhỏ nhất?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ecost = [\n    [4, 1, 3],\n    [2, 0, 5],\n    [3, 2, 2]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(0→0, 1→1, 2→2)\u003c/code\u003e, tổng \u003ccode\u003e6\u003c/code\u003e","\u003ccode\u003e(0→2, 1→1, 2→0)\u003c/code\u003e, tổng \u003ccode\u003e6\u003c/code\u003e","\u003ccode\u003e(0→1, 1→0, 2→2)\u003c/code\u003e, tổng \u003ccode\u003e5\u003c/code\u003e","\u003ccode\u003e(0→1, 1→2, 2→0)\u003c/code\u003e, tổng \u003ccode\u003e9\u003c/code\u003e"],"correct":2},{"id":"cv-m755gl17tfu7l","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q07","label":"Câu 7","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eAssociation dùng \u003ccode\u003ecost = 1 - IoU\u003c/code\u003e. Hungarian trả assignment \u003ccode\u003e(track0,det0)\u003c/code\u003e và \u003ccode\u003e(track1,det1)\u003c/code\u003e. Sau đó chỉ chấp nhận match nếu \u003ccode\u003eIoU \u0026gt;= 0.5\u003c/code\u003e. Match nào được giữ?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\niou = np.array([\n    [0.80, 0.20],\n    [0.10, 0.45]\n])\n\nassignment = [\n    (0,0),\n    (1,1)\n]\n\naccepted = [\n    (r,c)\n    for r,c in assignment\n    if iou[r,c] \u0026gt;= 0.5\n]\n\nprint(accepted)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[(0,0),(1,1)]\u003c/code\u003e","\u003ccode\u003e[(0,0)]\u003c/code\u003e","\u003ccode\u003e[(1,1)]\u003c/code\u003e","\u003ccode\u003e[]\u003c/code\u003e"],"correct":1},{"id":"cv-ympi3q710reu","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q08","label":"Câu 8","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eTracker tăng \u003ccode\u003emissed\u003c/code\u003e lên 1 nếu track không được match. Track bị kết thúc khi \u003ccode\u003emissed \u0026gt; max_missed\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emissed = 2\nmax_missed = 2\n\nmissed += 1\n\nstatus = (\n    \"terminated\"\n    if missed \u0026gt; max_missed\n    else \"active\"\n)\n\nprint(missed, status)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2 active\u003c/code\u003e","\u003ccode\u003e3 active\u003c/code\u003e","\u003ccode\u003e2 terminated\u003c/code\u003e","\u003ccode\u003e3 terminated\u003c/code\u003e"],"correct":3},{"id":"cv-1fyaiqh1camakr","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q09","label":"Câu 9","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eTracker dùng quy tắc: khi match thì cập nhật box và đặt \u003ccode\u003emissed=0\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrack = {\n    \"id\": 7,\n    \"box\": [10,10,30,30],\n    \"missed\": 2\n}\n\nnew_detection = [\n    12,11,32,31\n]\n\nmatched = True\n\nif matched:\n    track[\"box\"] = new_detection\n    track[\"missed\"] = 0\nelse:\n    track[\"missed\"] += 1\n\nprint(\n    track[\"box\"],\n    track[\"missed\"]\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[10,10,30,30] 0\u003c/code\u003e","\u003ccode\u003e[12,11,32,31] 2\u003c/code\u003e","\u003ccode\u003e[12,11,32,31] 0\u003c/code\u003e","\u003ccode\u003e[10,10,30,30] 3\u003c/code\u003e"],"correct":2},{"id":"cv-ejtlkh1t10ofj","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q10","label":"Câu 10","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eMột detection không được match với track hiện tại nên tracker tạo track mới. \u003ccode\u003enext_id=12\u003c/code\u003e trước khi tạo. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003enext_id = 12\n\nnew_track = {\n    \"id\": next_id,\n    \"missed\": 0,\n    \"age\": 1\n}\n\nnext_id += 1\n\nprint(\n    new_track[\"id\"],\n    next_id\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e11 12\u003c/code\u003e","\u003ccode\u003e12 13\u003c/code\u003e","\u003ccode\u003e13 13\u003c/code\u003e","\u003ccode\u003e12 12\u003c/code\u003e"],"correct":1},{"id":"cv-1xd2uwk1pisroc","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q11","label":"Câu 11","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eBox dùng \u003ccode\u003e[x1,y1,x2,y2]\u003c/code\u003e. Tâm box được tính bằng trung bình hai biên. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebox = [\n    20, 10, 60, 50\n]\n\ncx = (box[0] + box[2]) / 2\ncy = (box[1] + box[3]) / 2\n\nprint(cx, cy)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e40.0 30.0\u003c/code\u003e","\u003ccode\u003e20.0 20.0\u003c/code\u003e","\u003ccode\u003e40.0 20.0\u003c/code\u003e","\u003ccode\u003e30.0 40.0\u003c/code\u003e"],"correct":0},{"id":"cv-6c93gvooc6n1","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q12","label":"Câu 12","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eTâm object chuyển từ \u003ccode\u003e(100,50) px\u003c/code\u003e tại \u003ccode\u003et=2.0 s\u003c/code\u003e sang \u003ccode\u003e(112,56) px\u003c/code\u003e tại \u003ccode\u003et=2.5 s\u003c/code\u003e. Vận tốc pixel là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ec0 = (100.0, 50.0)\nc1 = (112.0, 56.0)\n\nt0 = 2.0\nt1 = 2.5\n\nvx = (c1[0]-c0[0])/(t1-t0)\nvy = (c1[1]-c0[1])/(t1-t0)\n\nprint(vx, vy)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e12 6 px/s\u003c/code\u003e","\u003ccode\u003e24 12 px/s\u003c/code\u003e","\u003ccode\u003e6 3 px/s\u003c/code\u003e","\u003ccode\u003e48 24 px/s\u003c/code\u003e"],"correct":1},{"id":"cv-fsyerv10uxyft","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q13","label":"Câu 13","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eHai box của cùng một track được quan sát ở hai timestamp. Vận tốc tâm box theo trục x bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eb0 = [10,20,30,40]\nb1 = [18,22,38,42]\n\nt0 = 1.0\nt1 = 1.4\n\ncx0 = (b0[0]+b0[2])/2\ncx1 = (b1[0]+b1[2])/2\n\nvx = (cx1-cx0)/(t1-t0)\n\nprint(vx)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e8 px/s\u003c/code\u003e","\u003ccode\u003e16 px/s\u003c/code\u003e","\u003ccode\u003e20 px/s\u003c/code\u003e","\u003ccode\u003e40 px/s\u003c/code\u003e"],"correct":2},{"id":"cv-pok0z8gnfpx2","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q14","label":"Câu 14","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eĐoạn code tính tốc độ Euclidean của tâm box. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport math\n\nvx = 30.0\nvy = 40.0\n\nspeed = math.sqrt(\n    vx*vx + vy*vy\n)\n\nprint(speed)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e35.0\u003c/code\u003e","\u003ccode\u003e50.0\u003c/code\u003e","\u003ccode\u003e70.0\u003c/code\u003e","\u003ccode\u003e2500.0\u003c/code\u003e"],"correct":1},{"id":"cv-kvke791w0r505","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q15","label":"Câu 15","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eLucas–Kanade tại một điểm dẫn đến hệ tuyến tính \u003ccode\u003eA·[u,v]ᵀ=b\u003c/code\u003e. Với hệ sau, optical flow \u003ccode\u003e(u,v)\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nA = np.array([\n    [2.0, 0.0],\n    [0.0, 4.0]\n])\n\nb = np.array([\n    6.0,\n    8.0\n])\n\nflow = np.linalg.solve(A, b)\n\nprint(flow.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2.0,3.0]\u003c/code\u003e","\u003ccode\u003e[3.0,2.0]\u003c/code\u003e","\u003ccode\u003e[6.0,8.0]\u003c/code\u003e","\u003ccode\u003e[12.0,32.0]\u003c/code\u003e"],"correct":1},{"id":"cv-mxcm0514miun9","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q16","label":"Câu 16","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eGiải hệ Lucas–Kanade sau. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nA = np.array([\n    [2.0, 1.0],\n    [1.0, 2.0]\n])\n\nb = np.array([\n    5.0,\n    4.0\n])\n\nflow = np.linalg.solve(A, b)\n\nprint(flow.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1.0,2.0]\u003c/code\u003e","\u003ccode\u003e[3.0,1.0]\u003c/code\u003e","\u003ccode\u003e[2.0,1.0]\u003c/code\u003e","\u003ccode\u003e[2.5,2.0]\u003c/code\u003e"],"correct":2},{"id":"cv-13kfhha18i1flq","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q17","label":"Câu 17","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eCho hệ Lucas–Kanade với ma trận \u003ccode\u003eA\u003c/code\u003e suy biến. Điều gì xảy ra với lời gọi dưới đây?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nA = np.array([\n    [1.0, 2.0],\n    [2.0, 4.0]\n])\n\nb = np.array([\n    3.0,\n    6.0\n])\n\nflow = np.linalg.solve(A, b)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Luôn trả chính xác \u003ccode\u003e[1,1]\u003c/code\u003e","Luôn trả chính xác \u003ccode\u003e[3,0]\u003c/code\u003e","Trả vector zero vì \u003ccode\u003eb\u003c/code\u003e phụ thuộc tuyến tính","Không có nghiệm duy nhất để \u003ccode\u003enp.linalg.solve\u003c/code\u003e trả bình thường"],"correct":3},{"id":"cv-1oug4v56mky4j","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q18","label":"Câu 18","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eTracker có 3 track. Quy tắc: track không match tăng \u003ccode\u003emissed\u003c/code\u003e thêm 1; track match đặt \u003ccode\u003emissed=0\u003c/code\u003e; kết thúc khi \u003ccode\u003emissed \u0026gt; 2\u003c/code\u003e. Track 0 và 2 được match. Output \u003ccode\u003emissed\u003c/code\u003e mới là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emissed = [1, 2, 0]\nmatched = [True, False, True]\n\nfor i in range(3):\n    if matched[i]:\n        missed[i] = 0\n    else:\n        missed[i] += 1\n\nprint(missed)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0,3,0]\u003c/code\u003e","\u003ccode\u003e[1,3,0]\u003c/code\u003e","\u003ccode\u003e[0,2,0]\u003c/code\u003e","\u003ccode\u003e[0,3,1]\u003c/code\u003e"],"correct":0},{"id":"cv-dckv9y5xuzyc","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q19","label":"Câu 19","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eTiếp tục với quy tắc kết thúc track khi \u003ccode\u003emissed \u0026gt; 2\u003c/code\u003e. Sau cập nhật, \u003ccode\u003emissed=[0,3,0]\u003c/code\u003e. Danh sách index track còn active là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emissed = [0, 3, 0]\nmax_missed = 2\n\nactive = [\n    i\n    for i,m in enumerate(missed)\n    if m \u0026lt;= max_missed\n]\n\nprint(active)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1]\u003c/code\u003e","\u003ccode\u003e[0,1]\u003c/code\u003e","\u003ccode\u003e[0,2]\u003c/code\u003e","\u003ccode\u003e[1,2]\u003c/code\u003e"],"correct":2},{"id":"cv-y28n9vocwgnd","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-q20","label":"Câu 20","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003ePipeline association có 2 track và 3 detection. Hungarian đã trả hai cặp \u003ccode\u003e(0,0)\u003c/code\u003e và \u003ccode\u003e(1,1)\u003c/code\u003e. Chỉ nhận match nếu \u003ccode\u003eIoU \u0026gt;=0.5\u003c/code\u003e. Detection không được match sẽ tạo track mới. Kết quả nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\niou = np.array([\n    [0.80, 0.10, 0.20],\n    [0.15, 0.60, 0.25]\n])\n\nassignment = [\n    (0,0),\n    (1,1)\n]\n\nthreshold = 0.5\n\nmatches = [\n    (r,c)\n    for r,c in assignment\n    if iou[r,c] \u0026gt;= threshold\n]\n\nmatched_dets = {\n    c for _,c in matches\n}\n\nunmatched_dets = [\n    d for d in range(3)\n    if d not in matched_dets\n]\n\nprint(matches)\nprint(unmatched_dets)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[(0,0)]\u003c/code\u003e và \u003ccode\u003e[1,2]\u003c/code\u003e","\u003ccode\u003e[(0,0),(1,1)]\u003c/code\u003e và \u003ccode\u003e[2]\u003c/code\u003e","\u003ccode\u003e[(0,0),(1,2)]\u003c/code\u003e và \u003ccode\u003e[1]\u003c/code\u003e","\u003ccode\u003e[(0,2),(1,1)]\u003c/code\u003e và \u003ccode\u003e[0]\u003c/code\u003e"],"correct":1},{"id":"cv-17lbj69xw2gyn","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq01","label":"Additional Question 1","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eboxes1\u003c/code\u003e có 3 box và \u003ccode\u003eboxes2\u003c/code\u003e có 5 box. Shape đầu ra của \u003ccode\u003etorchvision.ops.box_iou(boxes1, boxes2)\u003c/code\u003e là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(3,5)\u003c/code\u003e","\u003ccode\u003e(5,3)\u003c/code\u003e","\u003ccode\u003e(3,4)\u003c/code\u003e","\u003ccode\u003e(5,4)\u003c/code\u003e"],"correct":0},{"id":"cv-wftrcn1ft9bwv","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq02","label":"Additional Question 2","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eMa trận IoU có shape \u003ccode\u003e(2,3)\u003c/code\u003e. Sau phép biến đổi \u003ccode\u003ecost = 1 - iou\u003c/code\u003e, shape của \u003ccode\u003ecost\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eiou.shape == (2,3)\n\ncost = 1.0 - iou\n\nprint(cost.shape)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(3,2)\u003c/code\u003e","\u003ccode\u003e(2,3)\u003c/code\u003e","\u003ccode\u003e(2,2)\u003c/code\u003e","\u003ccode\u003e(3,3)\u003c/code\u003e"],"correct":1},{"id":"cv-16cfczst06buw","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq03","label":"Additional Question 3","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003e\u003ccode\u003elinear_sum_assignment\u003c/code\u003e được dùng với ma trận chi phí sau. Cặp assignment tối ưu là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ecost = [\n    [0.2, 0.8],\n    [0.7, 0.1]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(0→1, 1→0)\u003c/code\u003e","\u003ccode\u003e(0→0, 1→0)\u003c/code\u003e","\u003ccode\u003e(0→0, 1→1)\u003c/code\u003e","\u003ccode\u003e(0→1, 1→1)\u003c/code\u003e"],"correct":2},{"id":"cv-gyri977atwkj","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq04","label":"Additional Question 4","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eVới một ma trận chi phí có 2 hàng và 4 cột, Hungarian one-to-one có thể tạo tối đa bao nhiêu cặp assignment?\u003c/p\u003e\n      \n    ","choices":["4 cặp","6 cặp","8 cặp","2 cặp"],"correct":3},{"id":"cv-u1hm63p6lrgl","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq05","label":"Additional Question 5","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eAssociation dùng \u003ccode\u003ecost=1-IoU\u003c/code\u003e. Nếu tăng ngưỡng chấp nhận từ \u003ccode\u003eIoU \u0026gt;=0.3\u003c/code\u003e lên \u003ccode\u003eIoU \u0026gt;=0.7\u003c/code\u003e, số match được chấp nhận thay đổi thế nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ematched_iou = [\n    0.25, 0.40, 0.70, 0.85\n]\n\nn1 = sum(\n    x \u0026gt;= 0.3\n    for x in matched_iou\n)\n\nn2 = sum(\n    x \u0026gt;= 0.7\n    for x in matched_iou\n)\n\nprint(n1, n2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e4 2\u003c/code\u003e","\u003ccode\u003e3 2\u003c/code\u003e","\u003ccode\u003e3 3\u003c/code\u003e","\u003ccode\u003e2 3\u003c/code\u003e"],"correct":1},{"id":"cv-1rhfcp8uir0lc","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq06","label":"Additional Question 6","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eTham số \u003ccode\u003emax_missed\u003c/code\u003e trong tracker đơn giản chủ yếu kiểm soát điều gì?\u003c/p\u003e\n      \n    ","choices":["Số frame không match mà track có thể tồn tại trước khi bị kết thúc","Số detection tối đa mà detector được phép trả trong mỗi frame","IoU tối đa giữa hai box trước khi chúng được ghép với nhau","Số pixel tối đa mà optical flow được phép dịch chuyển"],"correct":0},{"id":"cv-3hg4e3am100r","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq07","label":"Additional Question 7","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eHai tracker chỉ khác \u003ccode\u003emax_missed\u003c/code\u003e. Một track không được match liên tiếp 3 frame và bắt đầu với \u003ccode\u003emissed=0\u003c/code\u003e. Track bị kết thúc khi \u003ccode\u003emissed \u0026gt; max_missed\u003c/code\u003e. Kết quả sau frame thứ ba là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eTracker A:\nmax_missed = 1\n\nTracker B:\nmax_missed = 3\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Cả A và B đều còn active","A còn active, B bị kết thúc","A bị kết thúc, B vẫn active","Cả A và B đều bị kết thúc"],"correct":2},{"id":"cv-1cvqn4q1gelxks","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq08","label":"Additional Question 8","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eVận tốc tâm box được tính bằng \u003ccode\u003e(c1-c0)/(t1-t0)\u003c/code\u003e. Nếu vị trí thay đổi giống nhau nhưng khoảng thời gian tăng gấp đôi thì độ lớn vận tốc thay đổi thế nào?\u003c/p\u003e\n      \n    ","choices":["Tăng gấp đôi","Giảm còn một nửa","Không thay đổi","Tăng gấp bốn"],"correct":1},{"id":"cv-1a08z212frjfl","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq09","label":"Additional Question 9","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eĐoạn code kiểm tra timestamp trước khi tính vận tốc. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003et0 = 2.5\nt1 = 2.5\n\nif t1 \u0026lt;= t0:\n    status = \"invalid_dt\"\nelse:\n    status = \"valid\"\n\nprint(status)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e\"valid\"\u003c/code\u003e","\u003ccode\u003e\"zero_velocity\"\u003c/code\u003e","\u003ccode\u003e\"invalid_dt\"\u003c/code\u003e","\u003ccode\u003e\"new_track\"\u003c/code\u003e"],"correct":2},{"id":"cv-tr8jazxl6vgx","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq10","label":"Additional Question 10","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eTrong Lucas–Kanade, tăng kích thước cửa sổ theo dõi về mặt ứng dụng thường có trade-off nào phù hợp nhất?\u003c/p\u003e\n      \n    ","choices":["Cửa sổ lớn luôn làm optical flow chính xác tuyệt đối trong mọi trường hợp","Cửa sổ lớn dùng nhiều vùng lân cận hơn nhưng có thể làm giảm tính cục bộ","Cửa sổ lớn tự động biến sparse optical flow thành dense optical flow","Cửa sổ lớn loại bỏ hoàn toàn yêu cầu về texture trong vùng theo dõi"],"correct":1},{"id":"cv-1bo9m321jobxkm","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq11","label":"Additional Question 11","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003ecv.calcOpticalFlowPyrLK\u003c/code\u003e, tham số \u003ccode\u003ewinSize\u003c/code\u003e biểu diễn điều gì?\u003c/p\u003e\n      \n    ","choices":["Kích thước ảnh đầu ra sau khi optical flow hoàn tất","Số frame được lưu trong lịch sử của mỗi track","Kích thước cửa sổ tìm kiếm tại mỗi mức pyramid","Ngưỡng IoU dùng để association giữa các detection"],"correct":2},{"id":"cv-g4kgk16xwm08","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq12","label":"Additional Question 12","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003ecv.calcOpticalFlowPyrLK\u003c/code\u003e, tăng \u003ccode\u003emaxLevel\u003c/code\u003e từ \u003ccode\u003e0\u003c/code\u003e lên một giá trị lớn hơn chủ yếu thay đổi điều gì?\u003c/p\u003e\n      \n    ","choices":["Cho phép sử dụng thêm các mức của image pyramid","Thay đổi box format từ \u003ccode\u003exyxy\u003c/code\u003e sang \u003ccode\u003exywh\u003c/code\u003e","Thay đổi số channel của ảnh từ RGB sang grayscale","Ép tất cả feature point phải có status bằng 1"],"correct":0},{"id":"cv-enbwn4l43yo","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq13","label":"Additional Question 13","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eTrong lời gọi Lucas–Kanade, \u003ccode\u003eprevPts\u003c/code\u003e có shape thường gặp \u003ccode\u003e(N,1,2)\u003c/code\u003e. Với 8 điểm cần track, shape nào phù hợp?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(1,8,2)\u003c/code\u003e","\u003ccode\u003e(8,2,1)\u003c/code\u003e","\u003ccode\u003e(8,1,2)\u003c/code\u003e","\u003ccode\u003e(2,8,1)\u003c/code\u003e"],"correct":2},{"id":"cv-1ohimdh1h924u7","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq14","label":"Additional Question 14","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eGiả sử Lucas–Kanade trả \u003ccode\u003estatus\u003c/code\u003e cho 5 điểm như dưới đây. Bao nhiêu điểm được xem là track thành công theo điều kiện \u003ccode\u003estatus==1\u003c/code\u003e?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nstatus = np.array([\n    [1],\n    [0],\n    [1],\n    [1],\n    [0]\n])\n\ngood = (\n    status.reshape(-1) == 1\n)\n\nprint(good.sum())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e3\u003c/code\u003e","\u003ccode\u003e4\u003c/code\u003e","\u003ccode\u003e5\u003c/code\u003e"],"correct":1},{"id":"cv-qpxcye16p5gl6","chapter":"15","topic":"Phần 15 — Association và tracking theo frame","source":{"id":"cv-p15-aq15","label":"Additional Question 15","batch":"cv-p15"},"html":"\n      \n      \u003cp\u003eMột tracker kết hợp IoU association và optical flow. Vai trò ứng dụng hợp lý nhất của optical flow trong pipeline này là gì?\u003c/p\u003e\n      \n    ","choices":["Thay thế intrinsics để back-project detection thành point cloud 3D","Ước lượng chuyển động ảnh giữa các frame để hỗ trợ theo dõi vị trí","Tính class probability của object mà không cần detector","Chuyển đổi trực tiếp pixel velocity thành vận tốc 3D metric mà không cần depth"],"correct":1},{"id":"cv-136x8yp1om3h1","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q01","label":"Câu 1","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003e\u003ccode\u003ecalcOpticalFlowPyrLK\u003c/code\u003e theo dõi 4 điểm. Giả sử \u003ccode\u003enextPts\u003c/code\u003e có shape giống \u003ccode\u003eprevPts\u003c/code\u003e và \u003ccode\u003estatus\u003c/code\u003e có một trạng thái cho mỗi điểm. Shape phù hợp nhất của hai output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eprevPts.shape == (4, 1, 2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003enextPts: (4,2)\u003c/code\u003e, \u003ccode\u003estatus: (4,2)\u003c/code\u003e","\u003ccode\u003enextPts: (4,1,2)\u003c/code\u003e, \u003ccode\u003estatus: (4,1)\u003c/code\u003e","\u003ccode\u003enextPts: (1,4,2)\u003c/code\u003e, \u003ccode\u003estatus: (1,4)\u003c/code\u003e","\u003ccode\u003enextPts: (4,1)\u003c/code\u003e, \u003ccode\u003estatus: (4,1,2)\u003c/code\u003e"],"correct":1},{"id":"cv-1eznpwo1jduh4m","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q02","label":"Câu 2","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eOptical flow trả \u003ccode\u003estatus=1\u003c/code\u003e cho điểm được tìm thấy thành công. Đoạn code dưới đây giữ lại bao nhiêu điểm?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nstatus = np.array([\n    [1],\n    [0],\n    [1],\n    [1],\n    [0],\n    [1]\n])\n\ngood = status.reshape(-1) == 1\n\nprint(good.sum())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e3\u003c/code\u003e","\u003ccode\u003e5\u003c/code\u003e","\u003ccode\u003e4\u003c/code\u003e"],"correct":3},{"id":"cv-6y6gykai6dqm","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q03","label":"Câu 3","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eCho output optical flow sau. Chỉ lấy các điểm có \u003ccode\u003estatus==1\u003c/code\u003e. Output của \u003ccode\u003egood_new\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nnextPts = np.array([\n    [[11., 10.]],\n    [[21., 20.]],\n    [[31., 30.]]\n])\n\nstatus = np.array([\n    [1],\n    [0],\n    [1]\n])\n\ngood_new = nextPts[\n    status.reshape(-1) == 1\n].reshape(-1, 2)\n\nprint(good_new.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[[11,10],[21,20]]\u003c/code\u003e","\u003ccode\u003e[[21,20],[31,30]]\u003c/code\u003e","\u003ccode\u003e[[11,10],[31,30]]\u003c/code\u003e","\u003ccode\u003e[[11,10],[21,20],[31,30]]\u003c/code\u003e"],"correct":2},{"id":"cv-1nebfkr1bl5x0l","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q04","label":"Câu 4","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eMột điểm được track forward từ frame 0 → frame 1, sau đó track backward frame 1 → frame 0. Forward–backward error được định nghĩa là khoảng cách Euclidean giữa điểm ban đầu và điểm quay về. Error bằng bao nhiêu pixel?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\np0 = np.array([10., 20.])\np_back = np.array([13., 24.])\n\nfb_error = np.linalg.norm(\n    p0 - p_back\n)\n\nprint(fb_error)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e7.0\u003c/code\u003e","\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e3.5\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e"],"correct":3},{"id":"cv-1na5lpl72ny81","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q05","label":"Câu 5","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eĐiểm được chấp nhận nếu cả forward và backward đều có \u003ccode\u003estatus==1\u003c/code\u003e và \u003ccode\u003efb_error \u0026lt;= 1.0 px\u003c/code\u003e. Có bao nhiêu điểm được giữ?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nstatus_f = np.array([1,1,1,0])\nstatus_b = np.array([1,1,0,1])\n\nfb_error = np.array([\n    0.2, 1.4, 0.3, 0.1\n])\n\ngood = (\n    (status_f == 1)\n    \u0026amp; (status_b == 1)\n    \u0026amp; (fb_error \u0026lt;= 1.0)\n)\n\nprint(good.tolist())\nprint(good.sum())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[True,False,False,False]\u003c/code\u003e và \u003ccode\u003e1\u003c/code\u003e","\u003ccode\u003e[True,True,False,False]\u003c/code\u003e và \u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e[True,False,True,False]\u003c/code\u003e và \u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e[True,False,False,True]\u003c/code\u003e và \u003ccode\u003e2\u003c/code\u003e"],"correct":0},{"id":"cv-7s2m8819ogroq","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q06","label":"Câu 6","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eForward–backward threshold được đổi từ \u003ccode\u003e0.5 px\u003c/code\u003e sang \u003ccode\u003e1.0 px\u003c/code\u003e. Điều kiện dùng \u003ccode\u003e\u0026lt;=\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ne = np.array([\n    0.2, 0.5, 0.8, 1.0, 1.2\n])\n\nn05 = (e \u0026lt;= 0.5).sum()\nn10 = (e \u0026lt;= 1.0).sum()\n\nprint(n05, n10)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1 3\u003c/code\u003e","\u003ccode\u003e2 4\u003c/code\u003e","\u003ccode\u003e2 3\u003c/code\u003e","\u003ccode\u003e3 4\u003c/code\u003e"],"correct":1},{"id":"cv-1vf4l9dxgm93f","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q07","label":"Câu 7","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eCần ghép mỗi RGB frame với depth frame gần timestamp nhất, với điều kiện \u003ccode\u003e|t_rgb-t_depth| \u0026lt;= 0.03 s\u003c/code\u003e. Mỗi depth frame chỉ được dùng một lần. Với RGB đầu tiên, depth nào được chọn?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eRGB timestamps:\n[1.00, 1.10]\n\nDepth timestamps:\n[0.98, 1.04, 1.11]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Depth tại \u003ccode\u003e1.04 s\u003c/code\u003e","Depth tại \u003ccode\u003e1.11 s\u003c/code\u003e","Depth tại \u003ccode\u003e0.98 s\u003c/code\u003e","Không depth nào hợp lệ"],"correct":2},{"id":"cv-mmdazay4wlck","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q08","label":"Câu 8","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eGhép lần lượt từng RGB frame với depth chưa dùng gần nhất, yêu cầu \u003ccode\u003e|Δt| \u0026lt;= 0.03 s\u003c/code\u003e. Một depth không được tái sử dụng. Kết quả là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eRGB:\n[1.00, 1.05]\n\nDepth:\n[1.02]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Cả hai RGB đều dùng depth \u003ccode\u003e1.02\u003c/code\u003e","RGB \u003ccode\u003e1.05\u003c/code\u003e dùng depth \u003ccode\u003e1.02\u003c/code\u003e, RGB đầu không match","Cả hai RGB đều không match vì chỉ có một depth","RGB \u003ccode\u003e1.00\u003c/code\u003e dùng depth \u003ccode\u003e1.02\u003c/code\u003e, RGB \u003ccode\u003e1.05\u003c/code\u003e không match"],"correct":3},{"id":"cv-1gzt781vgnimt","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q09","label":"Câu 9","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eĐoạn code tìm depth chưa dùng có sai lệch timestamp nhỏ nhất. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ergb_t = 2.00\n\ndepth_t = [\n    1.96, 1.99, 2.02\n]\n\nused = [\n    False, True, False\n]\n\ncandidates = [\n    (abs(t-rgb_t), i)\n    for i,t in enumerate(depth_t)\n    if not used[i]\n]\n\ndt, idx = min(candidates)\n\nprint(idx, dt)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1 0.01\u003c/code\u003e","\u003ccode\u003e2 0.02\u003c/code\u003e","\u003ccode\u003e0 0.04\u003c/code\u003e","\u003ccode\u003e2 0.04\u003c/code\u003e"],"correct":1},{"id":"cv-qdg98t139ct3l","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q10","label":"Câu 10","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eRGB và depth chỉ được ghép nếu \u003ccode\u003e|Δt| \u0026lt;= 0.025 s\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ergb_t = 5.000\ndepth_t = 5.030\n\ndt = abs(rgb_t - depth_t)\n\nvalid = dt \u0026lt;= 0.025\n\nprint(round(dt, 3), valid)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.025 True\u003c/code\u003e","\u003ccode\u003e0.030 True\u003c/code\u003e","\u003ccode\u003e0.030 False\u003c/code\u003e","\u003ccode\u003e0.025 False\u003c/code\u003e"],"correct":2},{"id":"cv-1t9p71l1to2c5","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q11","label":"Câu 11","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eTrack 3D dùng EMA theo công thức \u003ccode\u003ep_smooth = α·p_new + (1-α)·p_old\u003c/code\u003e. Với \u003ccode\u003eα=0.25\u003c/code\u003e, output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nold = np.array([\n    1.0, 2.0, 3.0\n])\n\nnew = np.array([\n    3.0, 4.0, 5.0\n])\n\nalpha = 0.25\n\nsmooth = (\n    alpha * new\n    + (1-alpha) * old\n)\n\nprint(smooth.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2.5,3.5,4.5]\u003c/code\u003e","\u003ccode\u003e[1.5,2.5,3.5]\u003c/code\u003e","\u003ccode\u003e[2.0,3.0,4.0]\u003c/code\u003e","\u003ccode\u003e[0.5,1.0,1.5]\u003c/code\u003e"],"correct":1},{"id":"cv-152rjag1sstcl8","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q12","label":"Câu 12","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eEMA dùng \u003ccode\u003eα=0.5\u003c/code\u003e. Bắt đầu từ \u003ccode\u003ex=0\u003c/code\u003e, lần lượt nhận measurement \u003ccode\u003e2\u003c/code\u003e rồi \u003ccode\u003e4\u003c/code\u003e. Giá trị sau measurement thứ hai là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 0.0\nalpha = 0.5\n\nfor measurement in [2.0, 4.0]:\n    x = (\n        alpha * measurement\n        + (1-alpha) * x\n    )\n\nprint(x)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e","\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e3.0\u003c/code\u003e"],"correct":1},{"id":"cv-47vjrymv3qei","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q13","label":"Câu 13","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eHai track dùng cùng dữ liệu nhưng \u003ccode\u003ealpha\u003c/code\u003e khác nhau. Với công thức \u003ccode\u003eEMA = α·new + (1-α)·old\u003c/code\u003e, output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eold = 1.0\nnew = 5.0\n\na = 0.2\nb = 0.8\n\nx_a = a*new + (1-a)*old\nx_b = b*new + (1-b)*old\n\nprint(x_a, x_b)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e4.2 1.8\u003c/code\u003e","\u003ccode\u003e1.8 4.2\u003c/code\u003e","\u003ccode\u003e2.0 4.0\u003c/code\u003e","\u003ccode\u003e1.2 4.8\u003c/code\u003e"],"correct":1},{"id":"cv-r7mzg84e65qe","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q14","label":"Câu 14","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eTrack 3D lưu centroid trong \u003ccode\u003ebase\u003c/code\u003e frame, đơn vị mét. Record nào nhất quán với quy ước đó?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e{\"track_id\":8,\"xyz\":[0.4,-0.1,1.2],\"frame\":\"base\",\"unit\":\"m\",\"status\":\"tracked\"}\u003c/code\u003e","\u003ccode\u003e{\"track_id\":8,\"xyz\":[0.4,-0.1,1.2],\"frame\":\"camera\",\"unit\":\"px\",\"status\":\"tracked\"}\u003c/code\u003e","\u003ccode\u003e{\"track_id\":8,\"xyz\":[0.4,-0.1,1.2],\"frame\":\"base\",\"unit\":\"px\",\"status\":\"tracked\"}\u003c/code\u003e","\u003ccode\u003e{\"track_id\":8,\"xyz\":[0.4,-0.1,1.2],\"frame\":\"rgb\",\"unit\":\"mm\",\"status\":\"tracked\"}\u003c/code\u003e"],"correct":0},{"id":"cv-1lruftlxcaax3","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q15","label":"Câu 15","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eMột track có ID cố định qua các frame. Đoạn code cập nhật record sau khi nhận measurement 3D mới. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrack = {\n    \"track_id\": 5,\n    \"frame_index\": 20,\n    \"xyz\": [1.0, 2.0, 3.0]\n}\n\nnew_xyz = [\n    1.2, 2.1, 3.0\n]\n\ntrack[\"frame_index\"] = 21\ntrack[\"xyz\"] = new_xyz\n\nprint(\n    track[\"track_id\"],\n    track[\"frame_index\"],\n    track[\"xyz\"]\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e21 5 [1.2,2.1,3.0]\u003c/code\u003e","\u003ccode\u003e5 20 [1.0,2.0,3.0]\u003c/code\u003e","\u003ccode\u003e5 21 [1.2,2.1,3.0]\u003c/code\u003e","\u003ccode\u003e21 21 [1.0,2.0,3.0]\u003c/code\u003e"],"correct":2},{"id":"cv-vqeyf511ermp7","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q16","label":"Câu 16","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eCentroid 3D chuyển từ \u003ccode\u003e(0.2,0.1,1.0) m\u003c/code\u003e tại \u003ccode\u003et=3.0 s\u003c/code\u003e sang \u003ccode\u003e(0.5,0.1,1.2) m\u003c/code\u003e tại \u003ccode\u003et=3.5 s\u003c/code\u003e. Vận tốc 3D là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\np0 = np.array([\n    0.2, 0.1, 1.0\n])\n\np1 = np.array([\n    0.5, 0.1, 1.2\n])\n\ndt = 0.5\n\nv = (p1-p0)/dt\n\nprint(v.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.3,0.0,0.2] m/s\u003c/code\u003e","\u003ccode\u003e[0.6,0.0,0.4] m/s\u003c/code\u003e","\u003ccode\u003e[0.15,0.0,0.1] m/s\u003c/code\u003e","\u003ccode\u003e[1.0,0.2,2.4] m/s\u003c/code\u003e"],"correct":1},{"id":"cv-qysngn1dt60ex","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q17","label":"Câu 17","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003ePipeline yêu cầu RGB-depth synchronized trước khi tạo measurement 3D. Nếu không tìm được depth chưa sử dụng trong tolerance, đoạn code cho status nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edepth_match = None\n\nif depth_match is None:\n    status = \"no_synced_depth\"\nelse:\n    status = \"3d_updated\"\n\nprint(status)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e\"3d_updated\"\u003c/code\u003e","\u003ccode\u003e\"new_track\"\u003c/code\u003e","\u003ccode\u003e\"flow_failed\"\u003c/code\u003e","\u003ccode\u003e\"no_synced_depth\"\u003c/code\u003e"],"correct":3},{"id":"cv-18hz9075x3wj","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q18","label":"Câu 18","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eTrack được xem là hợp lệ để cập nhật 3D khi optical flow tốt, RGB-depth synchronized và depth hợp lệ. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eflow_ok = True\nsync_ok = True\ndepth_valid = False\n\nupdate_3d = (\n    flow_ok\n    and sync_ok\n    and depth_valid\n)\n\nprint(update_3d)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eFalse\u003c/code\u003e","\u003ccode\u003eTrue\u003c/code\u003e","\u003ccode\u003eNone\u003c/code\u003e","\u003ccode\u003e\"tracked\"\u003c/code\u003e"],"correct":0},{"id":"cv-a52eag1297p36","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q19","label":"Câu 19","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eForward và backward tracking cho ba điểm. Chỉ điểm có cả hai status bằng 1 và forward–backward error \u003ccode\u003e\u0026lt;=0.5 px\u003c/code\u003e được giữ. Những index nào hợp lệ?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\np0 = np.array([\n    [10.,10.],\n    [20.,20.],\n    [30.,30.]\n])\n\np_back = np.array([\n    [10.3,10.4],\n    [20.6,20.0],\n    [30.1,30.1]\n])\n\nstatus_f = np.array([1,1,1])\nstatus_b = np.array([1,1,0])\n\nerr = np.linalg.norm(\n    p0-p_back,\n    axis=1\n)\n\ngood = (\n    (status_f == 1)\n    \u0026amp; (status_b == 1)\n    \u0026amp; (err \u0026lt;= 0.5)\n)\n\nprint(np.where(good)[0].tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0,1]\u003c/code\u003e","\u003ccode\u003e[1]\u003c/code\u003e","\u003ccode\u003e[0]\u003c/code\u003e","\u003ccode\u003e[0,2]\u003c/code\u003e"],"correct":2},{"id":"cv-fhofox1w14ybv","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-q20","label":"Câu 20","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eTrace pipeline nhỏ dưới đây. RGB-depth đã được registration đúng. Measurement và EMA đều ở \u003ccode\u003ebase\u003c/code\u003e frame, đơn vị mét. Output cuối cùng là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nflow_status = 1\nfb_error = 0.3\nfb_threshold = 0.5\n\nrgb_t = 10.000\ndepth_t = 10.018\nsync_threshold = 0.020\n\nold_xyz = np.array([\n    1.0, 2.0, 1.0\n])\n\nmeasurement = np.array([\n    1.4, 2.2, 1.2\n])\n\nalpha = 0.5\n\nflow_ok = (\n    flow_status == 1\n    and fb_error \u0026lt;= fb_threshold\n)\n\nsync_ok = (\n    abs(rgb_t-depth_t)\n    \u0026lt;= sync_threshold\n)\n\nif flow_ok and sync_ok:\n    xyz = (\n        alpha*measurement\n        + (1-alpha)*old_xyz\n    )\n    status = \"3d_updated\"\nelse:\n    xyz = old_xyz\n    status = \"not_updated\"\n\nprint(xyz.tolist())\nprint(status)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1.4,2.2,1.2]\u003c/code\u003e và \u003ccode\u003e\"3d_updated\"\u003c/code\u003e","\u003ccode\u003e[1.0,2.0,1.0]\u003c/code\u003e và \u003ccode\u003e\"not_updated\"\u003c/code\u003e","\u003ccode\u003e[1.2,2.1,1.1]\u003c/code\u003e và \u003ccode\u003e\"not_updated\"\u003c/code\u003e","\u003ccode\u003e[1.2,2.1,1.1]\u003c/code\u003e và \u003ccode\u003e\"3d_updated\"\u003c/code\u003e"],"correct":3},{"id":"cv-f366r31h3yv9h","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq01","label":"Additional Question 1","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eTrong lời gọi Python \u003ccode\u003ecv.calcOpticalFlowPyrLK(prevImg, nextImg, prevPts, nextPts, ...)\u003c/code\u003e, tham số \u003ccode\u003eprevPts\u003c/code\u003e có vai trò nào?\u003c/p\u003e\n      \n    ","choices":["Chứa các điểm 2D cần theo dõi từ ảnh trước","Chứa timestamp của toàn bộ frame trước","Chứa ma trận intrinsics của camera trước","Chứa các centroid 3D đã transform sang base"],"correct":0},{"id":"cv-1ps2kl94thykn","chapter":"16","topic":"Phần 16 — Optical flow, đồng bộ và track 3D","source":{"id":"cv-p16-aq02","label":"Additional Question 2","batch":"cv-p16"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003ecalcOpticalFlowPyr
