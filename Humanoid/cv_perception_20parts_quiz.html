đã ở đúng target frame, phương thức phù hợp là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eget_axis_aligned_bounding_box()\u003c/code\u003e","\u003ccode\u003ecluster_dbscan()\u003c/code\u003e","\u003ccode\u003eestimate_normals()\u003c/code\u003e","\u003ccode\u003eremove_radius_outlier()\u003c/code\u003e"],"correct":0},{"id":"cv-vdtr5qavyzke","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq15","label":"Additional Question 15","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột record kết quả tabletop chứa \u003ccode\u003ecentroid=[0.5,0.2,1.1]\u003c/code\u003e nhưng không lưu frame hoặc đơn vị. Vấn đề chính là gì?\u003c/p\u003e\n      \n    ","choices":["Không thể diễn giải đầy đủ centroid thuộc hệ tọa độ và đơn vị nào","Centroid 3D bắt buộc phải chứa bốn giá trị homogeneous","Centroid chỉ hợp lệ nếu mọi thành phần đều là số nguyên","Centroid phải luôn được biểu diễn bằng pixel thay vì mét"],"correct":0},{"id":"cv-tkzumaotji4","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q01","label":"Câu 1","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eMột bàn cờ calibration có \u003ccode\u003e9×6\u003c/code\u003e inner corners. Khoảng cách vật lý giữa hai corner kề nhau là \u003ccode\u003e25 mm\u003c/code\u003e. Nếu chọn corner đầu tiên làm \u003ccode\u003e(0,0,0)\u003c/code\u003e và mặt bàn cờ là \u003ccode\u003eZ=0\u003c/code\u003e, tọa độ object point tại chỉ số cột \u003ccode\u003e4\u003c/code\u003e, hàng \u003ccode\u003e3\u003c/code\u003e là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(100,75,0) mm\u003c/code\u003e","\u003ccode\u003e(75,100,0) mm\u003c/code\u003e","\u003ccode\u003e(4,3,0) mm\u003c/code\u003e","\u003ccode\u003e(125,100,0) mm\u003c/code\u003e"],"correct":0},{"id":"cv-rp2ffl1r7abul","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q02","label":"Câu 2","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eMột bàn cờ calibration có square size \u003ccode\u003e30 mm\u003c/code\u003e. Object points được tạo theo:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e(0,0,0)\n(1,0,0)\n(2,0,0)\n...\n(0,1,0)\n(1,1,0)\n...\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eĐể các translation vector thu được từ calibration có đơn vị mét, cách chuẩn bị object points nào phù hợp?\u003c/p\u003e\n      \n    ","choices":["Nhân tọa độ lưới với \u003ccode\u003e0.03 m\u003c/code\u003e","Nhân tọa độ lưới với \u003ccode\u003e30 m\u003c/code\u003e","Chia tọa độ lưới cho \u003ccode\u003e30\u003c/code\u003e","Giữ nguyên vì calibration tự suy ra mét"],"correct":0},{"id":"cv-1ev034151wsb3","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q03","label":"Câu 3","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eMột bàn cờ có \u003ccode\u003e8×5\u003c/code\u003e inner corners, square size \u003ccode\u003e20 mm\u003c/code\u003e. Corner ở cột \u003ccode\u003e7\u003c/code\u003e, hàng \u003ccode\u003e4\u003c/code\u003e có object coordinate nào nếu gốc nằm tại corner cột 0, hàng 0?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(140,80,0) mm\u003c/code\u003e","\u003ccode\u003e(160,100,0) mm\u003c/code\u003e","\u003ccode\u003e(80,140,0) mm\u003c/code\u003e","\u003ccode\u003e(7,4,20) mm\u003c/code\u003e"],"correct":0},{"id":"cv-n31w00nyhtyg","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q04","label":"Câu 4","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eMột lập trình viên dùng square size thực tế \u003ccode\u003e25 mm\u003c/code\u003e nhưng tạo object points với khoảng cách \u003ccode\u003e1\u003c/code\u003e và coi đơn vị đó là mét. Điều gì sai rõ nhất?\u003c/p\u003e\n      \n    ","choices":["Scale vật lý của translation sẽ không còn đúng theo mét thực tế","Principal point chắc chắn bị đổi dấu trên cả hai trục ảnh","Ảnh calibration tự động chuyển từ BGR thành RGB","Số inner corners được detector trả về sẽ tăng gấp đôi"],"correct":0},{"id":"cv-1nwoufmz422qk","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q05","label":"Câu 5","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eMột ảnh calibration có bốn corner. Reprojection errors theo Euclidean pixel distance là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ee1 = 1 px\ne2 = 2 px\ne3 = 2 px\ne4 = 1 px\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eRMS reprojection error được tính bằng \u003ccode\u003esqrt((e1²+e2²+e3²+e4²)/4)\u003c/code\u003e. Giá trị gần nhất là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e1.58 px\u003c/code\u003e","\u003ccode\u003e1.50 px\u003c/code\u003e","\u003ccode\u003e2.50 px\u003c/code\u003e","\u003ccode\u003e1.25 px\u003c/code\u003e"],"correct":0},{"id":"cv-19guoqs1ck4dc6","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q06","label":"Câu 6","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eBa điểm calibration có reprojection errors lần lượt là \u003ccode\u003e0 px\u003c/code\u003e, \u003ccode\u003e3 px\u003c/code\u003e, \u003ccode\u003e4 px\u003c/code\u003e. RMS reprojection error bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e2.89 px\u003c/code\u003e","\u003ccode\u003e2.33 px\u003c/code\u003e","\u003ccode\u003e3.50 px\u003c/code\u003e","\u003ccode\u003e5.00 px\u003c/code\u003e"],"correct":0},{"id":"cv-11avm2c1qdmp56","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q07","label":"Câu 7","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eCho ba observed image points và ba reprojected points:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eObserved:     (10,10), (20,10), (30,10)\nReprojected:  (11,10), (20,12), (27,14)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng Euclidean error cho từng point và RMS trên ba error. RMS gần nhất là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e3.16 px\u003c/code\u003e","\u003ccode\u003e2.67 px\u003c/code\u003e","\u003ccode\u003e5.48 px\u003c/code\u003e","\u003ccode\u003e2.00 px\u003c/code\u003e"],"correct":0},{"id":"cv-d7bzs31xxkglp","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q08","label":"Câu 8","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eHai calibration result được đánh giá trên cùng tập validation corners bằng cùng công thức RMS:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eCalibration A: RMS = 0.42 px\nCalibration B: RMS = 1.35 px\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNếu chỉ xét reprojection RMS trên tập này, kết luận nào đúng?\u003c/p\u003e\n      \n    ","choices":["A có reprojection error nhỏ hơn B","B có reprojection error nhỏ hơn A","Hai calibration có reprojection error bằng nhau","RMS nhỏ hơn luôn có nghĩa focal length nhỏ hơn"],"correct":0},{"id":"cv-65yywh4l2zpl","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q09","label":"Câu 9","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eXét radial distortion đơn giản trong normalized image coordinates:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex_d = x * (1 + k1*r²)\ny_d = y * (1 + k1*r²)\n\nr² = x² + y²\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCho \u003ccode\u003e(x,y)=(0.6,0.8)\u003c/code\u003e và \u003ccode\u003ek1=0.1\u003c/code\u003e. Tọa độ distorted là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0.66,0.88)\u003c/code\u003e","\u003ccode\u003e(0.54,0.72)\u003c/code\u003e","\u003ccode\u003e(0.60,0.80)\u003c/code\u003e","\u003ccode\u003e(0.70,0.90)\u003c/code\u003e"],"correct":0},{"id":"cv-10cy5rb1g5fhi5","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q10","label":"Câu 10","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eDùng model:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex_d = x * (1 + k1*r²)\ny_d = y * (1 + k1*r²)\nr² = x² + y²\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCho \u003ccode\u003e(x,y)=(0.3,0.4)\u003c/code\u003e, \u003ccode\u003ek1=-0.2\u003c/code\u003e. Tọa độ distorted là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0.285,0.380)\u003c/code\u003e","\u003ccode\u003e(0.315,0.420)\u003c/code\u003e","\u003ccode\u003e(0.250,0.350)\u003c/code\u003e","\u003ccode\u003e(0.300,0.400)\u003c/code\u003e"],"correct":0},{"id":"cv-1omc5n11dzq2xj","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q11","label":"Câu 11","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eVới model radial chỉ có \u003ccode\u003ek1\u003c/code\u003e, một điểm nằm đúng tại normalized image center \u003ccode\u003e(x,y)=(0,0)\u003c/code\u003e. Bất kể giá trị hữu hạn của \u003ccode\u003ek1\u003c/code\u003e, tọa độ distorted của điểm là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0,0)\u003c/code\u003e","\u003ccode\u003e(k1,k1)\u003c/code\u003e","\u003ccode\u003e(1+k1,1+k1)\u003c/code\u003e","Không xác định vì \u003ccode\u003er=0\u003c/code\u003e"],"correct":0},{"id":"cv-12u5kny10z4fog","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q12","label":"Câu 12","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eRANSAC fit plane bằng cách lấy \u003ccode\u003es=3\u003c/code\u003e điểm trong mỗi iteration. Giả sử xác suất một điểm bất kỳ là inlier là \u003ccode\u003ew=0.8\u003c/code\u003e, các lần lấy mẫu được xem là độc lập. Xác suất một mẫu gồm cả 3 điểm đều là inlier bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.512\u003c/code\u003e","\u003ccode\u003e0.640\u003c/code\u003e","\u003ccode\u003e0.800\u003c/code\u003e","\u003ccode\u003e0.488\u003c/code\u003e"],"correct":0},{"id":"cv-1rmf6071rlowln","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q13","label":"Câu 13","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eRANSAC dùng sample size \u003ccode\u003es=3\u003c/code\u003e, inlier ratio \u003ccode\u003ew=0.5\u003c/code\u003e. Xác suất một iteration lấy được toàn bộ mẫu inlier là \u003ccode\u003ew^s\u003c/code\u003e. Xác suất iteration đó thất bại là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.875\u003c/code\u003e","\u003ccode\u003e0.125\u003c/code\u003e","\u003ccode\u003e0.500\u003c/code\u003e","\u003ccode\u003e0.750\u003c/code\u003e"],"correct":0},{"id":"cv-1270o31qz5w4h","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q14","label":"Câu 14","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eĐể đạt xác suất thành công ít nhất \u003ccode\u003ep\u003c/code\u003e, số iteration RANSAC tối thiểu được ước lượng bởi:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eN = ceil( log(1-p) / log(1-w^s) )\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCho \u003ccode\u003ep=0.99\u003c/code\u003e, \u003ccode\u003ew=0.5\u003c/code\u003e, \u003ccode\u003es=3\u003c/code\u003e. Biết \u003ccode\u003elog(0.01)≈-4.6052\u003c/code\u003e và \u003ccode\u003elog(0.875)≈-0.1335\u003c/code\u003e. Giá trị \u003ccode\u003eN\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e35\u003c/code\u003e","\u003ccode\u003e34\u003c/code\u003e","\u003ccode\u003e24\u003c/code\u003e","\u003ccode\u003e69\u003c/code\u003e"],"correct":0},{"id":"cv-1onua8g1fw41rw","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q15","label":"Câu 15","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eDùng:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eN = ceil( log(1-p) / log(1-w^s) )\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCho \u003ccode\u003ep=0.95\u003c/code\u003e, \u003ccode\u003ew=0.8\u003c/code\u003e, \u003ccode\u003es=3\u003c/code\u003e. Biết \u003ccode\u003ew³=0.512\u003c/code\u003e, \u003ccode\u003elog(0.05)≈-2.996\u003c/code\u003e, \u003ccode\u003elog(0.488)≈-0.718\u003c/code\u003e. Số iteration tối thiểu là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e5\u003c/code\u003e","\u003ccode\u003e4\u003c/code\u003e","\u003ccode\u003e6\u003c/code\u003e","\u003ccode\u003e8\u003c/code\u003e"],"correct":0},{"id":"cv-6fy8541g5chv6","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q16","label":"Câu 16","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eHai bài toán RANSAC plane đều dùng \u003ccode\u003es=3\u003c/code\u003e và cùng xác suất mục tiêu \u003ccode\u003ep=0.99\u003c/code\u003e. Trường hợp A có \u003ccode\u003ew=0.8\u003c/code\u003e, trường hợp B có \u003ccode\u003ew=0.4\u003c/code\u003e. Nhận xét nào đúng về số iteration theo công thức RANSAC?\u003c/p\u003e\n      \n    ","choices":["Trường hợp B cần nhiều iteration hơn trường hợp A","Trường hợp A cần nhiều iteration hơn trường hợp B","Hai trường hợp luôn cần cùng số iteration","Inlier ratio không ảnh hưởng số iteration cần thiết"],"correct":0},{"id":"cv-122xr1d4yiu39","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q17","label":"Câu 17","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eMột plane được trả về dưới dạng normalized:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003en = (0.02, -0.01, -0.99975)\nd = 0.80\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTrong ứng dụng, normal của mặt bàn được yêu cầu hướng gần \u003ccode\u003e+z\u003c/code\u003e. Thao tác nào phù hợp?\u003c/p\u003e\n      \n    ","choices":["Đổi dấu cả \u003ccode\u003en\u003c/code\u003e và \u003ccode\u003ed\u003c/code\u003e","Chỉ đổi dấu thành phần z của \u003ccode\u003en\u003c/code\u003e","Chỉ đổi dấu \u003ccode\u003ed\u003c/code\u003e, giữ nguyên \u003ccode\u003en\u003c/code\u003e","Đổi chỗ thành phần x và z của \u003ccode\u003en\u003c/code\u003e"],"correct":0},{"id":"cv-fcvdh71lze49d","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q18","label":"Câu 18","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eMột plane candidate có unit normal \u003ccode\u003en=(0.10,0.10,0.98995)\u003c/code\u003e. Yêu cầu normal mặt bàn phải tạo góc không quá \u003ccode\u003e15°\u003c/code\u003e với \u003ccode\u003e+z\u003c/code\u003e. Cho \u003ccode\u003ecos(15°)≈0.966\u003c/code\u003e. Dùng kiểm tra \u003ccode\u003en·(0,0,1) \u0026gt;= cos(15°)\u003c/code\u003e. Kết luận nào đúng?\u003c/p\u003e\n      \n    ","choices":["Plane đạt kiểm tra hướng vì \u003ccode\u003e0.98995 \u0026gt;= 0.966\u003c/code\u003e","Plane không đạt vì thành phần x khác 0","Plane không đạt vì thành phần y khác 0","Plane chỉ đạt nếu thành phần z bằng đúng 1"],"correct":0},{"id":"cv-1akdvpk17p2iso","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q19","label":"Câu 19","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eHai plane candidate đã có unit normal:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003enA = (0.00, 0.20, 0.98)\nnB = (0.60, 0.00, 0.80)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eYêu cầu normal phải hướng về \u003ccode\u003e+z\u003c/code\u003e và có \u003ccode\u003en·z_axis \u0026gt;= 0.95\u003c/code\u003e. Plane nào vượt qua kiểm tra?\u003c/p\u003e\n      \n    ","choices":["Chỉ plane A","Chỉ plane B","Cả plane A và B","Không plane nào"],"correct":0},{"id":"cv-7z0bla1xhb33e","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-q20","label":"Câu 20","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eMột pipeline calibration + tabletop sử dụng các điều kiện:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eCalibration validation RMS phải \u0026lt;= 0.8 px.\n\nPlane RANSAC:\ndistance_threshold = 0.02 m\nYêu cầu normal sau khi định hướng:\nn · z_axis \u0026gt;= 0.95\n\nKết quả:\nRMS = 0.60 px\nplane_model = [0.10, 0.00, -0.995, 0.75]\nmean inlier distance = 0.012 m\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003 l Question 10","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eTrong OpenCV, \u003ccode\u003ecv.projectPoints(objectPoints, rvec, tvec, cameraMatrix, distCoeffs)\u003c/code\u003e chủ yếu được dùng để làm gì?\u003c/p\u003e\n      \n    ","choices":["Project các điểm 3D thành image points theo pose và camera model","Back-project depth pixels thành point cloud trong camera frame","Nhóm các point 3D thành cluster bằng density","Ước lượng plane từ một tập point cloud bằng RANSAC"],"correct":0},{"id":"cv-1xar1yc59swdk","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-aq11","label":"Additional Question 11","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eTrong Open3D, \u003ccode\u003epcd.segment_plane(distance_threshold, ransac_n, num_iterations)\u003c/code\u003e sử dụng \u003ccode\u003edistance_threshold\u003c/code\u003e để làm gì?\u003c/p\u003e\n      \n    ","choices":["Đặt khoảng cách tối đa để một point được xem là plane inlier","Đặt số point được lấy để tạo một plane candidate","Đặt tổng số lần lấy mẫu RANSAC được thực hiện","Đặt góc tối đa giữa plane normal và trục z"],"correct":0},{"id":"cv-yhk00kszn9ce","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-aq12","label":"Additional Question 12","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003esegment_plane(distance_threshold, ransac_n, num_iterations)\u003c/code\u003e, nếu đang fit một plane 3D thông thường, giá trị tối thiểu tự nhiên của \u003ccode\u003eransac_n\u003c/code\u003e để một mẫu không suy biến có thể xác định plane là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e3\u003c/code\u003e","\u003ccode\u003e1\u003c/code\u003e","\u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e4\u003c/code\u003e"],"correct":0},{"id":"cv-eje57yoco88y","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-aq13","label":"Additional Question 13","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003esegment_plane(..., num_iterations)\u003c/code\u003e, tăng \u003ccode\u003enum_iterations\u003c/code\u003e chủ yếu thay đổi yếu tố nào?\u003c/p\u003e\n      \n    ","choices":["Tăng số lần RANSAC thử lấy mẫu và đánh giá model","Tăng số hệ số trong phương trình plane từ 4 lên 5","Tăng trực tiếp số point bắt buộc phải là inlier","Tăng trực tiếp kích thước voxel trước khi fit plane"],"correct":0},{"id":"cv-886qxo19za8fs","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-aq14","label":"Additional Question 14","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eTrong công thức RANSAC \u003ccode\u003eN = ceil(log(1-p)/log(1-w^s))\u003c/code\u003e, tham số \u003ccode\u003ep\u003c/code\u003e biểu diễn điều gì?\u003c/p\u003e\n      \n    ","choices":["Xác suất mục tiêu có ít nhất một mẫu toàn inlier","Xác suất một điểm bất kỳ là một outlier","Số point tối thiểu cần để xác định model","Khoảng cách tối đa từ point đến model"],"correct":0},{"id":"cv-1y8czat1ecbyif","chapter":"9","topic":"Phần 9 — Calibration và RANSAC mặt phẳng","source":{"id":"cv-p09-aq15","label":"Additional Question 15","batch":"cv-p09"},"html":"\n      \n      \u003cp\u003eTrong công thức RANSAC \u003ccode\u003eN = ceil(log(1-p)/log(1-w^s))\u003c/code\u003e, nếu giữ \u003ccode\u003ew\u003c/code\u003e và \u003ccode\u003es\u003c/code\u003e cố định nhưng tăng xác suất mục tiêu \u003ccode\u003ep\u003c/code\u003e từ \u003ccode\u003e0.95\u003c/code\u003e lên \u003ccode\u003e0.999\u003c/code\u003e, xu hướng nào đúng?\u003c/p\u003e\n      \n    ","choices":["Số iteration cần thiết thường tăng","Số iteration cần thiết luôn giảm","Số iteration không phụ thuộc \u003ccode\u003ep\u003c/code\u003e","Sample size \u003ccode\u003es\u003c/code\u003e tự động giảm xuống 1"],"correct":0},{"id":"cv-tq062716vmxr9","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q01","label":"Câu 1","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eCamera pinhole có \u003ccode\u003efx=500 px\u003c/code\u003e, \u003ccode\u003ecx=320 px\u003c/code\u003e. Với pixel \u003ccode\u003eu=420\u003c/code\u003e, tọa độ X được back-project bằng \u003ccode\u003eX=(u-cx)Z/fx\u003c/code\u003e. Chạy đoạn code sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efx, cx = 500.0, 320.0\nu = 420.0\nZ1, Z2 = 2.00, 2.10\n\nX1 = (u - cx) * Z1 / fx\nX2 = (u - cx) * Z2 / fx\n\nprint(round(X2 - X1, 3))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.010\u003c/code\u003e","\u003ccode\u003e0.020\u003c/code\u003e","\u003ccode\u003e0.040\u003c/code\u003e","\u003ccode\u003e0.100\u003c/code\u003e"],"correct":1},{"id":"cv-g6zrey1u8n2ck","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q02","label":"Câu 2","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eVới \u003ccode\u003efy=400 px\u003c/code\u003e, \u003ccode\u003ecy=240 px\u003c/code\u003e, pixel \u003ccode\u003ev=200\u003c/code\u003e, dùng \u003ccode\u003eY=(v-cy)Z/fy\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efy, cy = 400.0, 240.0\nv = 200.0\nZ_true = 1.5\nZ_pred = 1.6\n\nY_true = (v-cy)*Z_true/fy\nY_pred = (v-cy)*Z_pred/fy\n\nprint(round(Y_pred - Y_true, 3))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.010\u003c/code\u003e","\u003ccode\u003e-0.010\u003c/code\u003e","\u003ccode\u003e-0.100\u003c/code\u003e","\u003ccode\u003e0.100\u003c/code\u003e"],"correct":1},{"id":"cv-1vd65ye9vlqee","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q03","label":"Câu 3","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eMột pixel có \u003ccode\u003e(u,v)=(420,290)\u003c/code\u003e. Camera có \u003ccode\u003efx=fy=500 px\u003c/code\u003e, \u003ccode\u003e(cx,cy)=(320,240)\u003c/code\u003e. Depth tăng từ \u003ccode\u003e2.0 m\u003c/code\u003e lên \u003ccode\u003e2.1 m\u003c/code\u003e. Đoạn code sau in ra gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eu, v = 420.0, 290.0\nfx = fy = 500.0\ncx, cy = 320.0, 240.0\n\ndef backproject(Z):\n    X = (u-cx)*Z/fx\n    Y = (v-cy)*Z/fy\n    return X, Y, Z\n\np1 = backproject(2.0)\np2 = backproject(2.1)\n\ndelta = [round(b-a, 3) for a, b in zip(p1, p2)]\nprint(delta)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.02, 0.01, 0.1]\u003c/code\u003e","\u003ccode\u003e[0.01, 0.02, 0.1]\u003c/code\u003e","\u003ccode\u003e[0.02, 0.01, 0.2]\u003c/code\u003e","\u003ccode\u003e[0.10, 0.10, 0.1]\u003c/code\u003e"],"correct":0},{"id":"cv-ni9e3813eal3u","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q04","label":"Câu 4","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eHai depth estimates của cùng pixel lần lượt là \u003ccode\u003e1.95 m\u003c/code\u003e và \u003ccode\u003e2.00 m\u003c/code\u003e. Với \u003ccode\u003eu=cx\u003c/code\u003e và \u003ccode\u003ev=cy\u003c/code\u003e, output của code là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\np_true = np.array([0.0, 0.0, 2.00])\np_pred = np.array([0.0, 0.0, 1.95])\n\nerr = np.linalg.norm(p_pred - p_true)\nprint(round(err, 3))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.025\u003c/code\u003e","\u003ccode\u003e0.100\u003c/code\u003e","\u003ccode\u003e0.050\u003c/code\u003e","\u003ccode\u003e0.150\u003c/code\u003e"],"correct":2},{"id":"cv-1uxqe005gegqm","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q05","label":"Câu 5","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eMột validation set dùng để chọn \u003ccode\u003eplane distance threshold\u003c/code\u003e. Chọn threshold có F1 lớn nhất; nếu hòa thì chọn threshold nhỏ hơn. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eresults = {\n    0.005: 0.72,\n    0.010: 0.84,\n    0.015: 0.88,\n    0.020: 0.88,\n    0.025: 0.85\n}\n\nbest = max(results, key=lambda t: (results[t], -t))\nprint(best)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.020\u003c/code\u003e","\u003ccode\u003e0.025\u003c/code\u003e","\u003ccode\u003e0.015\u003c/code\u003e","\u003ccode\u003e0.010\u003c/code\u003e"],"correct":2},{"id":"cv-utdx0nd77bhd","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q06","label":"Câu 6","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eMột validation set cho số liệu sau. Với mỗi threshold, dùng \u003ccode\u003eF1=2TP/(2TP+FP+FN)\u003c/code\u003e. Threshold nào có F1 cao nhất?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ethreshold   TP   FP   FN\n0.01         6    1    4\n0.02         8    2    2\n0.03         9    5    1\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.01\u003c/code\u003e","\u003ccode\u003e0.03\u003c/code\u003e","Cả ba bằng nhau","\u003ccode\u003e0.02\u003c/code\u003e"],"correct":3},{"id":"cv-1r74gpp1eucp6b","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q07","label":"Câu 7","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003ePredicted centroid và ground-truth centroid đều ở frame \u003ccode\u003ebase\u003c/code\u003e, đơn vị mét. Một cặp được xem là match nếu khoảng cách Euclidean \u003ccode\u003e\u0026lt;=0.15 m\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\npred = np.array([0.10, 0.20, 0.50])\ngt   = np.array([0.16, 0.28, 0.50])\n\nd = np.linalg.norm(pred - gt)\nprint(round(d, 2), d \u0026lt;= 0.15)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.14 True\u003c/code\u003e","\u003ccode\u003e0.10 True\u003c/code\u003e","\u003ccode\u003e0.10 False\u003c/code\u003e","\u003ccode\u003e0.08 True\u003c/code\u003e"],"correct":1},{"id":"cv-13jb4kmkdw2tw","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q08","label":"Câu 8","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eCác centroid đều ở cùng frame và đơn vị mét. Ghép one-to-one theo thứ tự prediction; mỗi prediction chọn ground truth chưa dùng gần nhất nếu khoảng cách \u003ccode\u003e\u0026lt;=0.20 m\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\npreds = [\n    np.array([0.05, 0.0, 1.0]),\n    np.array([0.10, 0.0, 1.0])\n]\n\ngts = [\n    np.array([0.00, 0.0, 1.0])\n]\n\nused = set()\nmatches = 0\n\nfor p in preds:\n    candidates = [\n        (np.linalg.norm(p-g), j)\n        for j, g in enumerate(gts)\n        if j not in used\n    ]\n    if candidates:\n        d, j = min(candidates)\n        if d \u0026lt;= 0.20:\n            used.add(j)\n            matches += 1\n\nprint(matches)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e0\u003c/code\u003e","\u003ccode\u003e1\u003c/code\u003e","\u003ccode\u003e3\u003c/code\u003e"],"correct":2},{"id":"cv-nf5m3cdy81g4","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q09","label":"Câu 9","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eTiếp tục quy tắc one-to-one: một ground truth không được dùng cho hai prediction. Có \u003ccode\u003e3\u003c/code\u003e predictions, \u003ccode\u003e2\u003c/code\u003e ground truths và tìm được \u003ccode\u003e2\u003c/code\u003e matches hợp lệ. Bộ \u003ccode\u003e(TP,FP,FN)\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003en_pred = 3\nn_gt = 2\nmatches = 2\n\nTP = matches\nFP = n_pred - matches\nFN = n_gt - matches\n\nprint(TP, FP, FN)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2 1 0\u003c/code\u003e","\u003ccode\u003e2 0 1\u003c/code\u003e","\u003ccode\u003e3 1 0\u003c/code\u003e","\u003ccode\u003e1 2 0\u003c/code\u003e"],"correct":0},{"id":"cv-rmln381ejl754","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q10","label":"Câu 10","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eCho kết quả đánh giá \u003ccode\u003eTP=8\u003c/code\u003e, \u003ccode\u003eFP=2\u003c/code\u003e, \u003ccode\u003eFN=4\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eTP, FP, FN = 8, 2, 4\n\nprecision = TP / (TP + FP)\nrecall = TP / (TP + FN)\n\nprint(round(precision, 2), round(recall, 2))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.67 0.80\u003c/code\u003e","\u003ccode\u003e0.80 0.67\u003c/code\u003e","\u003ccode\u003e0.80 0.50\u003c/code\u003e","\u003ccode\u003e0.67 0.50\u003c/code\u003e"],"correct":1},{"id":"cv-4v3bn4subc32","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q11","label":"Câu 11","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eTP=6\u003c/code\u003e, \u003ccode\u003eFP=2\u003c/code\u003e, \u003ccode\u003eFN=3\u003c/code\u003e. Đoạn code sau in gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eTP, FP, FN = 6, 2, 3\n\np = TP / (TP + FP)\nr = TP / (TP + FN)\nf1 = 2*p*r / (p+r)\n\nprint(round(f1, 3))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.750\u003c/code\u003e","\u003ccode\u003e0.667\u003c/code\u003e","\u003ccode\u003e0.706\u003c/code\u003e","\u003ccode\u003e0.800\u003c/code\u003e"],"correct":2},{"id":"cv-1mk5wm5160fvw5","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q12","label":"Câu 12","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eĐoạn code sau tính F1 trực tiếp từ TP/FP/FN. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eTP, FP, FN = 9, 3, 1\nf1 = 2*TP / (2*TP + FP + FN)\n\nprint(round(f1, 3))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.818\u003c/code\u003e","\u003ccode\u003e0.900\u003c/code\u003e","\u003ccode\u003e0.750\u003c/code\u003e","\u003ccode\u003e0.667\u003c/code\u003e"],"correct":0},{"id":"cv-1y6g67vj65vez","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q13","label":"Câu 13","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eBa scene có kết quả sau. Đoạn code cộng TP/FP/FN trước rồi tính precision. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003escenes = [\n    {\"tp\": 4, \"fp\": 1, \"fn\": 1},\n    {\"tp\": 2, \"fp\": 2, \"fn\": 0},\n    {\"tp\": 4, \"fp\": 1, \"fn\": 2},\n]\n\nTP = sum(s[\"tp\"] for s in scenes)\nFP = sum(s[\"fp\"] for s in scenes)\nFN = sum(s[\"fn\"] for s in scenes)\n\nprecision = TP / (TP + FP)\n\nprint(TP, FP, FN, round(precision, 3))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e10 4 3 0.714\u003c/code\u003e","\u003ccode\u003e10 3 4 0.769\u003c/code\u003e","\u003ccode\u003e9 4 3 0.692\u003c/code\u003e","\u003ccode\u003e10 4 3 0.769\u003c/code\u003e"],"correct":0},{"id":"cv-k8d5g61nod20q","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q14","label":"Câu 14","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eHai scene có precision lần lượt là \u003ccode\u003e1.0\u003c/code\u003e và \u003ccode\u003e0.5\u003c/code\u003e. Code sau tính macro average theo scene. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nprecision_per_scene = [1.0, 0.5]\nmacro_precision = np.mean(precision_per_scene)\n\nprint(macro_precision)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.5\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e0.75\u003c/code\u003e","\u003ccode\u003e0.25\u003c/code\u003e"],"correct":2},{"id":"cv-1bn41ul7t84x5","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q15","label":"Câu 15","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eHai scene có:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eScene A: TP=9, FP=1\nScene B: TP=1, FP=1\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCode sau tính micro precision bằng cách cộng count trước. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eTP = 9 + 1\nFP = 1 + 1\n\nmicro_precision = TP / (TP + FP)\nprint(round(micro_precision, 3))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.750\u003c/code\u003e","\u003ccode\u003e0.833\u003c/code\u003e","\u003ccode\u003e0.900\u003c/code\u003e","\u003ccode\u003e0.500\u003c/code\u003e"],"correct":1},{"id":"cv-13g71nq1f11yym","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q16","label":"Câu 16","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eMột hệ thống đánh giá centroid dùng threshold \u003ccode\u003e0.10 m\u003c/code\u003e và điều kiện \u003ccode\u003ed \u0026lt;= threshold\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edistances = [0.04, 0.10, 0.11, 0.08]\nthreshold = 0.10\n\naccepted = [d for d in distances if d \u0026lt;= threshold]\nprint(len(accepted), accepted)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2 [0.04, 0.08]\u003c/code\u003e","\u003ccode\u003e4 [0.04, 0.10, 0.11, 0.08]\u003c/code\u003e","\u003ccode\u003e3 [0.04, 0.10, 0.08]\u003c/code\u003e","\u003ccode\u003e3 [0.04, 0.11, 0.08]\u003c/code\u003e"],"correct":2},{"id":"cv-1i4k3r160qxu7","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q17","label":"Câu 17","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eCác centroid đều ở frame \u003ccode\u003ebase\u003c/code\u003e. Quy tắc: xử lý predictions theo thứ tự; với mỗi prediction, chọn ground truth chưa dùng có khoảng cách nhỏ nhất; match nếu \u003ccode\u003ed \u0026lt;= 0.25 m\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\npred = np.array([\n    [0.10, 0.0, 1.0],\n    [0.90, 0.0, 1.0],\n    [2.00, 0.0, 1.0]\n])\n\ngt = np.array([\n    [0.00, 0.0, 1.0],\n    [1.00, 0.0, 1.0]\n])\n\nused = set()\nmatches = []\n\nfor i, p in enumerate(pred):\n    candidates = []\n    for j, g in enumerate(gt):\n        if j not in used:\n            candidates.append((np.linalg.norm(p-g), j))\n\n    if candidates:\n        d, j = min(candidates)\n        if d \u0026lt;= 0.25:\n            matches.append((i, j))\n            used.add(j)\n\nprint(matches)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[(0,0), (1,1), (2,1)]\u003c/code\u003e","\u003ccode\u003e[(0,1), (1,0)]\u003c/code\u003e","\u003ccode\u003e[(0,0), (2,1)]\u003c/code\u003e","\u003ccode\u003e[(0,0), (1,1)]\u003c/code\u003e"],"correct":3},{"id":"cv-1p35cjk1fom0uk","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q18","label":"Câu 18","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eBa matched centroid pairs có 3D errors \u003ccode\u003e0.02 m\u003c/code\u003e, \u003ccode\u003e0.05 m\u003c/code\u003e, \u003ccode\u003e0.08 m\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nerrors = np.array([0.02, 0.05, 0.08])\n\nprint(\n    round(errors.mean(), 3),\n    round(np.median(errors), 3),\n    round(errors.max(), 3)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.050 0.050 0.080\u003c/code\u003e","\u003ccode\u003e0.050 0.080 0.080\u003c/code\u003e","\u003ccode\u003e0.150 0.050 0.080\u003c/code\u003e","\u003ccode\u003e0.050 0.020 0.080\u003c/code\u003e"],"correct":0},{"id":"cv-87c5b41med59s","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q19","label":"Câu 19","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eMột scene có ground-truth centroid tại \u003ccode\u003e[0.5,0.2,1.0] m\u003c/code\u003e. Hai predictions đã được ghép one-to-one với hai ground truths khác nhau. Với matched pair đang xét, code tính absolute error từng trục như sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ngt   = np.array([0.50, 0.20, 1.00])\npred = np.array([0.47, 0.26, 1.08])\n\nerr_xyz = np.abs(pred - gt)\nprint(err_xyz)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.03, 0.06, 0.08]\u003c/code\u003e","\u003ccode\u003e[0.03, 0.04, 0.08]\u003c/code\u003e","\u003ccode\u003e[0.97, 0.46, 2.08]\u003c/code\u003e","\u003ccode\u003e[-0.03, 0.06, 0.08]\u003c/code\u003e"],"correct":0},{"id":"cv-1i0u2ell3cl13","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-q20","label":"Câu 20","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eMột evaluation pipeline xử lý ba scene độc lập. Mỗi tuple là \u003ccode\u003e(TP,FP,FN)\u003c/code\u003e. Đoạn code sau in gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003escenes = [\n    (5, 1, 0),\n    (3, 2, 1),\n    (2, 1, 2)\n]\n\nTP = sum(x[0] for x in scenes)\nFP = sum(x[1] for x in scenes)\nFN = sum(x[2] for x in scenes)\n\nprecision = TP / (TP + FP)\nrecall = TP / (TP + FN)\nf1 = 2 * TP / (2*TP + FP + FN)\n\nprint(\n    TP, FP, FN,\n    round(precision, 2),\n    round(recall, 2),\n    round(f1, 2)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e10 4 3 0.77 0.71 0.74\u003c/code\u003e","\u003ccode\u003e10 4 3 0.71 0.77 0.74\u003c/code\u003e","\u003ccode\u003e10 3 4 0.77 0.71 0.74\u003c/code\u003e","\u003ccode\u003e10 4 3 0.71 0.77 0.71\u003c/code\u003e"],"correct":1},{"id":"cv-1caruu2sifre6","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq01","label":"Additional Question 1","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eĐoạn code sau dùng \u003ccode\u003esklearn.metrics.precision_score\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.metrics import precision_score\n\ny_true = [1, 1, 0, 0]\ny_pred = [1, 0, 1, 0]\n\nprint(precision_score(y_true, y_pred))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e0.75\u003c/code\u003e","\u003ccode\u003e1.00\u003c/code\u003e"],"correct":1},{"id":"cv-ieyeyh7en3dl","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq02","label":"Additional Question 2","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eĐoạn code sau in gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.metrics import recall_score\n\ny_true = [1, 1, 1, 1, 0]\ny_pred = [1, 0, 1, 0, 1]\n\nprint(recall_score(y_true, y_pred))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.40\u003c/code\u003e","\u003ccode\u003e0.60\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e0.80\u003c/code\u003e"],"correct":2},{"id":"cv-1hnnslmrz537k","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq03","label":"Additional Question 3","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eOutput của đoạn code là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.metrics import f1_score\n\ny_true = [1, 1, 0, 0]\ny_pred = [1, 0, 1, 0]\n\nprint(f1_score(y_true, y_pred))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.75\u003c/code\u003e","\u003ccode\u003e1.00\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e"],"correct":3},{"id":"cv-1lnekot1ydp5zf","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq04","label":"Additional Question 4","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eTrong trường hợp không có positive ground truth và cũng không có positive prediction, tham số \u003ccode\u003ezero_division=1\u003c/code\u003e được đặt như sau. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.metrics import f1_score\n\ny_true = [0, 0, 0]\ny_pred = [0, 0, 0]\n\nscore = f1_score(\n    y_true,\n    y_pred,\n    zero_division=1\n)\n\nprint(score)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003eNaN\u003c/code\u003e"],"correct":1},{"id":"cv-tmphhj149j28r","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq05","label":"Additional Question 5","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eThay \u003ccode\u003ezero_division=1\u003c/code\u003e bằng \u003ccode\u003ezero_division=0\u003c/code\u003e trong cùng trường hợp. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.metrics import precision_score\n\ny_true = [0, 0, 0]\ny_pred = [0, 0, 0]\n\nprint(\n    precision_score(\n        y_true,\n        y_pred,\n        zero_division=0\n    )\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003eNaN\u003c/code\u003e","\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e"],"correct":2},{"id":"cv-z2o5341qz9vji","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq06","label":"Additional Question 6","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eĐoạn code multiclass sau dùng \u003ccode\u003eaverage=\"macro\"\u003c/code\u003e. Giả sử F1 của ba class lần lượt là \u003ccode\u003e1.0\u003c/code\u003e, \u003ccode\u003e0.5\u003c/code\u003e, \u003ccode\u003e0.0\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nper_class_f1 = np.array([1.0, 0.5, 0.0])\nmacro_f1 = per_class_f1.mean()\n\nprint(macro_f1)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.75\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e1.50\u003c/code\u003e","\u003ccode\u003e0.33\u003c/code\u003e"],"correct":1},{"id":"cv-1xn121ncai233","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq07","label":"Additional Question 7","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eBa class có F1 và support như sau. Đoạn code mô phỏng cách weighted average dùng support làm trọng số. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\nf1 = np.array([1.0, 0.5, 0.0])\nsupport = np.array([6, 3, 1])\n\nweighted = np.sum(f1 * support) / support.sum()\n\nprint(round(weighted, 2))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e0.65\u003c/code\u003e","\u003ccode\u003e0.75\u003c/code\u003e","\u003ccode\u003e0.90\u003c/code\u003e"],"correct":2},{"id":"cv-1t0x1zr1u8ce5f","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq08","label":"Additional Question 8","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eTrong Open3D, depth raw là \u003ccode\u003e2500\u003c/code\u003e. Đoạn code tạo RGB-D dùng \u003ccode\u003edepth_scale=1000.0\u003c/code\u003e. Bỏ qua truncation, depth theo mét tương ứng là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edepth_raw = 2500\ndepth_scale = 1000.0\n\nz = depth_raw / depth_scale\nprint(z)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2500.0\u003c/code\u003e","\u003ccode\u003e0.4\u003c/code\u003e","\u003ccode\u003e25.0\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e"],"correct":3},{"id":"cv-1v2ac7b1f8lxnh","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq09","label":"Additional Question 9","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eVới \u003ccode\u003eRGBDImage.create_from_color_and_depth\u003c/code\u003e, depth được scale trước rồi so với \u003ccode\u003edepth_trunc\u003c/code\u003e. Giả sử:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edepth_raw = 4200\ndepth_scale = 1000.0\ndepth_trunc = 3.0\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eSau scale, depth là \u003ccode\u003e4.2 m\u003c/code\u003e. Vì vượt \u003ccode\u003edepth_trunc\u003c/code\u003e, giá trị depth kết quả tại pixel này là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e4.2\u003c/code\u003e","\u003ccode\u003e3.0\u003c/code\u003e","\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e1.2\u003c/code\u003e"],"correct":2},{"id":"cv-edmwe51ch7o53","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq10","label":"Additional Question 10","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eHai lần gọi chỉ khác \u003ccode\u003edepth_scale\u003c/code\u003e. Với cùng raw depth \u003ccode\u003e2000\u003c/code\u003e, bỏ qua truncation, kết quả nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eraw = 2000\n\nz1 = raw / 1000.0\nz2 = raw / 2000.0\n\nprint(z1, z2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0 2.0\u003c/code\u003e","\u003ccode\u003e2.0 1.0\u003c/code\u003e","\u003ccode\u003e2.0 2.0\u003c/code\u003e","\u003ccode\u003e1.0 1.0\u003c/code\u003e"],"correct":1},{"id":"cv-4g56081ibapk6","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq11","label":"Additional Question 11","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003eRGBDImage.create_from_color_and_depth\u003c/code\u003e, nếu muốn giữ ảnh màu thay vì chuyển RGB thành intensity, lời gọi nào phù hợp?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ergbd = o3d.geometry.RGBDImage.create_from_color_and_depth(\n    color,\n    depth,\n    depth_scale=1000.0,\n    depth_trunc=3.0,\n    convert_rgb_to_intensity=?\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eNone\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003eTrue\u003c/code\u003e","\u003ccode\u003eFalse\u003c/code\u003e"],"correct":3},{"id":"cv-luav8xa1aq2p","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq12","label":"Additional Question 12","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eMột hàm đánh giá centroid nhận \u003ccode\u003emax_distance\u003c/code\u003e. Điều kiện match là \u003ccode\u003ed \u0026lt;= max_distance\u003c/code\u003e. Output thay đổi thế nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edistances = [0.04, 0.08, 0.12, 0.20]\n\ndef count_matches(max_distance):\n    return sum(\n        d \u0026lt;= max_distance\n        for d in distances\n    )\n\nprint(\n    count_matches(0.10),\n    count_matches(0.15)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2 3\u003c/code\u003e","\u003ccode\u003e3 2\u003c/code\u003e","\u003ccode\u003e2 4\u003c/code\u003e","\u003ccode\u003e1 3\u003c/code\u003e"],"correct":0},{"id":"cv-17rf8tcza15ii","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq13","label":"Additional Question 13","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eMột hàm evaluation có tham số \u003ccode\u003estrict\u003c/code\u003e. Khi \u003ccode\u003estrict=False\u003c/code\u003e dùng \u003ccode\u003e\u0026lt;=\u003c/code\u003e; khi \u003ccode\u003estrict=True\u003c/code\u003e dùng \u003ccode\u003e\u0026lt;\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edef matched(d, threshold, strict):\n    if strict:\n        return d \u0026lt; threshold\n    return d \u0026lt;= threshold\n\nprint(\n    matched(0.10, 0.10, False),\n    matched(0.10, 0.10, True)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eFalse False\u003c/code\u003e","\u003ccode\u003eTrue True\u003c/code\u003e","\u003ccode\u003eTrue False\u003c/code\u003e","\u003ccode\u003eFalse True\u003c/code\u003e"],"correct":2},{"id":"cv-1yy9zoz1pp22nr","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq14","label":"Additional Question 14","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eMột hàm báo cáo hỗ trợ hai chế độ \u003ccode\u003e\"macro\"\u003c/code\u003e và \u003ccode\u003e\"micro\"\u003c/code\u003e. Đoạn code sau in gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003escenes = [\n    (9, 1),\n    (1, 1)\n]\n\nmacro = (\n    9/(9+1) +\n    1/(1+1)\n) / 2\n\nTP = 9 + 1\nFP = 1 + 1\nmicro = TP / (TP + FP)\n\nprint(round(macro, 3), round(micro, 3))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.833 0.700\u003c/code\u003e","\u003ccode\u003e0.700 0.833\u003c/code\u003e","\u003ccode\u003e0.900 0.500\u003c/code\u003e","\u003ccode\u003e0.700 0.700\u003c/code\u003e"],"correct":1},{"id":"cv-ox121c5r879a","chapter":"10","topic":"Phần 10 — Đánh giá kết quả perception 3D","source":{"id":"cv-p10-aq15","label":"Additional Question 15","batch":"cv-p10"},"html":"\n      \n      \u003cp\u003eMột hàm chọn threshold nhận \u003ccode\u003eprefer_smaller_on_tie\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003escores = {\n    0.01: 0.82,\n    0.02: 0.90,\n    0.03: 0.90,\n    0.04: 0.86\n}\n\nprefer_smaller_on_tie = True\n\nif prefer_smaller_on_tie:\n    best = max(\n        scores,\n        key=lambda t: (scores[t], -t)\n    )\nelse:\n    best = max(\n        scores,\n        key=lambda t: (scores[t], t)\n    )\n\nprint(best)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.01\u003c/code\u003e","\u003ccode\u003e0.04\u003c/code\u003e","\u003ccode\u003e0.03\u003c/code\u003e","\u003ccode\u003e0.02\u003c/code\u003e"],"correct":3},{"id":"cv-1aohywq1f7i0","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q01","label":"Câu 1","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eBox dùng định dạng \u003ccode\u003exyxy = [x1,y1,x2,y2]\u003c/code\u003e, trong đó \u003ccode\u003ex2,y2\u003c/code\u003e là biên ngoài. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebox = [10, 20, 50, 70]\n\nx1, y1, x2, y2 = box\nw = x2 - x1\nh = y2 - y1\n\nprint(w, h)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e40 50\u003c/code\u003e","\u003ccode\u003e41 51\u003c/code\u003e","\u003ccode\u003e50 70\u003c/code\u003e","\u003ccode\u003e60 90\u003c/code\u003e"],"correct":0},{"id":"cv-5nzaktyhzgwt","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q02","label":"Câu 2","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eĐoạn code chuyển box từ \u003ccode\u003exyxy\u003c/code\u003e sang \u003ccode\u003exywh\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebox = [20, 30, 80, 90]\n\nx1, y1, x2, y2 = box\nxywh = [\n    x1,\n    y1,\n    x2 - x1,\n    y2 - y1\n]\n\nprint(xywh)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[20, 30, 80, 90]\u003c/code\u003e","\u003ccode\u003e[20, 30, 60, 60]\u003c/code\u003e","\u003ccode\u003e[50, 60, 60, 60]\u003c/code\u003e","\u003ccode\u003e[20, 30, 100, 120]\u003c/code\u003e"],"correct":1},{"id":"cv-8ukl2mqx8ey0","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q03","label":"Câu 3","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eĐoạn code chuyển \u003ccode\u003exywh\u003c/code\u003e sang \u003ccode\u003exyxy\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebox = [15, 25, 40, 30]\n\nx, y, w, h = box\nxyxy = [x, y, x+w, y+h]\n\nprint(xyxy)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[15, 25, 40, 30]\u003c/code\u003e","\u003ccode\u003e[15, 25, 55, 55]\u003c/code\u003e","\u003ccode\u003e[15, 25, 25, 5]\u003c/code\u003e","\u003ccode\u003e[55, 55, 40, 30]\u003c/code\u003e"],"correct":1},{"id":"cv-1hqg0wz102vyvx","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q04","label":"Câu 4","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eCho box \u003ccode\u003exyxy\u003c/code\u003e với biên phải/dưới là biên ngoài. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebox = [10, 10, 30, 40]\n\narea = (\n    (box[2] - box[0]) *\n    (box[3] - box[1])\n)\n\nprint(area)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1200\u003c/code\u003e","\u003ccode\u003e600\u003c/code\u003e","\u003ccode\u003e651\u003c/code\u003e","\u003ccode\u003e300\u003c/code\u003e"],"correct":1},{"id":"cv-1i65cyc1b3hbwc","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q05","label":"Câu 5","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eHai box dùng quy ước \u003ccode\u003exyxy\u003c/code\u003e với biên ngoài. Đoạn code tính diện tích intersection. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = [0, 0, 20, 20]\nB = [10, 10, 30, 30]\n\nix1 = max(A[0], B[0])\niy1 = max(A[1], B[1])\nix2 = min(A[2], B[2])\niy2 = min(A[3], B[3])\n\niw = max(0, ix2 - ix1)\nih = max(0, iy2 - iy1)\n\nprint(iw * ih)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e200\u003c/code\u003e","\u003ccode\u003e300\u003c/code\u003e","\u003ccode\u003e100\u003c/code\u003e","\u003ccode\u003e400\u003c/code\u003e"],"correct":2},{"id":"cv-uhchqyb5uzge","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q06","label":"Câu 6","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eHai box \u003ccode\u003eA=[0,0,20,20]\u003c/code\u003e và \u003ccode\u003eB=[10,10,30,30]\u003c/code\u003e đều có diện tích \u003ccode\u003e400\u003c/code\u003e, intersection có diện tích \u003ccode\u003e100\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003earea_a = 400\narea_b = 400\ninter = 100\n\nunion = area_a + area_b - inter\niou = inter / union\n\nprint(union, round(iou, 3))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e800 0.125\u003c/code\u003e","\u003ccode\u003e700 0.143\u003c/code\u003e","\u003ccode\u003e700 0.250\u003c/code\u003e","\u003ccode\u003e900 0.111\u003c/code\u003e"],"correct":1},{"id":"cv-tbqzcs1co1ets","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q07","label":"Câu 7","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eHai box không giao nhau. Output của hàm IoU sau là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edef iou(a, b):\n    ix1 = max(a[0], b[0])\n    iy1 = max(a[1], b[1])\n    ix2 = min(a[2], b[2])\n    iy2 = min(a[3], b[3])\n\n    inter = (\n        max(0, ix2-ix1) *\n        max(0, iy2-iy1)\n    )\n\n    area_a = (a[2]-a[0]) * (a[3]-a[1])\n    area_b = (b[2]-b[0]) * (b[3]-b[1])\n\n    return inter / (area_a + area_b - inter)\n\nprint(iou(\n    [0, 0, 10, 10],\n    [20, 20, 30, 30]\n))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e-1.0\u003c/code\u003e"],"correct":0},{"id":"cv-i2qrwj1ggjmi3","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q08","label":"Câu 8","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eHai box giống hệt nhau. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = [10, 20, 40, 60]\nB = [10, 20, 40, 60]\n\narea = (40-10) * (60-20)\ninter = area\n\niou = inter / (area + area - inter)\n\nprint(iou)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e"],"correct":3},{"id":"cv-1k5hdkup419vm","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q09","label":"Câu 9","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eDetector trả về ba prediction. Lọc bằng điều kiện \u003ccode\u003escores \u0026gt;= 0.5\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\n\nscores = torch.tensor([0.90, 0.50, 0.49])\nkeep = scores \u0026gt;= 0.5\n\nprint(keep.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[True, False, False]\u003c/code\u003e","\u003ccode\u003e[True, True, False]\u003c/code\u003e","\u003ccode\u003e[True, True, True]\u003c/code\u003e","\u003ccode\u003e[False, True, True]\u003c/code\u003e"],"correct":1},{"id":"cv-1dbgop51spldw3","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q10","label":"Câu 10","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eViệc lọc detection phải giữ đồng bộ \u003ccode\u003eboxes\u003c/code\u003e, \u003ccode\u003escores\u003c/code\u003e và \u003ccode\u003elabels\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\n\nboxes = torch.tensor([\n    [0, 0, 10, 10],\n    [20, 20, 40, 40],\n    [50, 50, 80, 80]\n])\n\nscores = torch.tensor([0.9, 0.4, 0.8])\nlabels = torch.tensor([3, 7, 5])\n\nkeep = scores \u0026gt;= 0.5\n\nprint(labels[keep].tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[3, 7]\u003c/code\u003e","\u003ccode\u003e[7, 5]\u003c/code\u003e","\u003ccode\u003e[3, 5]\u003c/code\u003e","\u003ccode\u003e[3, 7, 5]\u003c/code\u003e"],"correct":2},{"id":"cv-6ltbha1uf204m","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q11","label":"Câu 11","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eTiếp tục lọc đồng bộ detection. Output của \u003ccode\u003eboxes[keep]\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\n\nboxes = torch.tensor([\n    [0, 0, 10, 10],\n    [10, 10, 20, 20],\n    [20, 20, 30, 30],\n    [30, 30, 40, 40]\n])\n\nscores = torch.tensor([0.2, 0.8, 0.7, 0.3])\nkeep = scores \u0026gt; 0.5\n\nprint(boxes[keep].tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[[0,0,10,10],[30,30,40,40]]\u003c/code\u003e","\u003ccode\u003e[[10,10,20,20],[20,20,30,30]]\u003c/code\u003e","\u003ccode\u003e[[10,10,20,20],[30,30,40,40]]\u003c/code\u003e","\u003ccode\u003e[[20,20,30,30],[30,30,40,40]]\u003c/code\u003e"],"correct":1},{"id":"cv-1msgeb14rc4cz","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q12","label":"Câu 12","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eẢnh gốc có kích thước \u003ccode\u003eW=640, H=480\u003c/code\u003e, được resize thành \u003ccode\u003eW=320, H=240\u003c/code\u003e. Box ban đầu là \u003ccode\u003e[100,60,300,220]\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebox = [100, 60, 300, 220]\n\nsx = 320 / 640\nsy = 240 / 480\n\nnew_box = [\n    box[0] * sx,\n    box[1] * sy,\n    box[2] * sx,\n    box[3] * sy\n]\n\nprint(new_box)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[50.0,30.0,150.0,110.0]\u003c/code\u003e","\u003ccode\u003e[50.0,30.0,300.0,220.0]\u003c/code\u003e","\u003ccode\u003e[200.0,120.0,600.0,440.0]\u003c/code\u003e","\u003ccode\u003e[100.0,60.0,150.0,110.0]\u003c/code\u003e"],"correct":0},{"id":"cv-2nhvynmbwrwx","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q13","label":"Câu 13","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eẢnh được resize không đồng đều: \u003ccode\u003esx=0.5\u003c/code\u003e, \u003ccode\u003esy=2.0\u003c/code\u003e. Box ban đầu là \u003ccode\u003e[20,30,100,80]\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebox = [20, 30, 100, 80]\nsx, sy = 0.5, 2.0\n\nout = [\n    box[0]*sx,\n    box[1]*sy,\n    box[2]*sx,\n    box[3]*sy\n]\n\nprint(out)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[40,15,200,40]\u003c/code\u003e","\u003ccode\u003e[10,60,50,160]\u003c/code\u003e","\u003ccode\u003e[10,15,50,40]\u003c/code\u003e","\u003ccode\u003e[40,60,200,160]\u003c/code\u003e"],"correct":1},{"id":"cv-1qkw27npn0ep7","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q14","label":"Câu 14","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eCho output IoU đã tính sẵn. NMS xử lý box theo score giảm dần. Sau khi giữ một box, mọi box còn lại có \u003ccode\u003eIoU \u0026gt; 0.5\u003c/code\u003e với nó bị loại.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003escores = [0.95, 0.80, 0.60]\n\nIoU(0,1) = 0.70\nIoU(0,2) = 0.10\nIoU(1,2) = 0.20\n\niou_threshold = 0.5\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCác index nào được giữ?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[0]\u003c/code\u003e","\u003ccode\u003e[0,1]\u003c/code\u003e","\u003ccode\u003e[0,2]\u003c/code\u003e","\u003ccode\u003e[1,2]\u003c/code\u003e"],"correct":2},{"id":"cv-2jiros1ocz3au","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q15","label":"Câu 15","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eNMS loại box khi \u003ccode\u003eIoU \u0026gt; threshold\u003c/code\u003e. Cho:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003escore(A) = 0.9\nscore(B) = 0.8\nIoU(A,B) = 0.5\niou_threshold = 0.5\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eKết quả nào đúng?\u003c/p\u003e\n      \n    ","choices":["Chỉ A được giữ","Chỉ B được giữ","Không box nào được giữ","Cả A và B được giữ"],"correct":3},{"id":"cv-1m9yk87pq5fet","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q16","label":"Câu 16","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eCho ba box đã được sắp theo score giảm dần. Đoạn code mô phỏng NMS với các IoU đã biết. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003escores = [0.9, 0.8, 0.7]\n\niou = {\n    (0,1): 0.6,\n    (0,2): 0.2,\n    (1,2): 0.7\n}\n\nthreshold = 0.5\n\n# Giữ box 0 trước.\n# Box 1 bị loại vì IoU(0,1)=0.6.\n# Box 2 không bị loại bởi box 0.\n\nkeep = [0, 2]\n\nprint(keep)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0,1]\u003c/code\u003e","\u003ccode\u003e[0,2]\u003c/code\u003e","\u003ccode\u003e[1,2]\u003c/code\u003e","\u003ccode\u003e[0,1,2]\u003c/code\u003e"],"correct":1},{"id":"cv-abnq2x1xmomzr","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q17","label":"Câu 17","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eHai detection có box giống hệt nhau nhưng thuộc hai class khác nhau. Giả sử dùng NMS riêng theo class.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eboxes = [\n    [0,0,100,100],\n    [0,0,100,100]\n]\n\nscores = [0.9, 0.8]\nlabels = [1, 2]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eKết quả mong đợi là gì?\u003c/p\u003e\n      \n    ","choices":["Chỉ index 0 được giữ","Chỉ index 1 được giữ","Cả index 0 và 1 được giữ","Cả hai đều bị loại"],"correct":2},{"id":"cv-1783qi41o5iew","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q18","label":"Câu 18","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eBox được chuyển bằng \u003ccode\u003etorchvision.ops.box_convert\u003c/code\u003e. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\nfrom torchvision.ops import box_convert\n\nboxes = torch.tensor([\n    [10., 20., 50., 80.]\n])\n\nout = box_convert(\n    boxes,\n    in_fmt=\"xyxy\",\n    out_fmt=\"xywh\"\n)\n\nprint(out.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[[10.0,20.0,40.0,60.0]]\u003c/code\u003e","\u003ccode\u003e[[30.0,50.0,40.0,60.0]]\u003c/code\u003e","\u003ccode\u003e[[10.0,20.0,50.0,80.0]]\u003c/code\u003e","\u003ccode\u003e[[10.0,20.0,60.0,100.0]]\u003c/code\u003e"],"correct":0},{"id":"cv-1qu38dvcyplz3","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q19","label":"Câu 19","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003e\u003ccode\u003ebox_iou\u003c/code\u003e nhận 2 box ở tập thứ nhất và 3 box ở tập thứ hai. Output shape là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\nfrom torchvision.ops import box_iou\n\nboxes1 = torch.tensor([\n    [0.,0.,10.,10.],\n    [20.,20.,30.,30.]\n])\n\nboxes2 = torch.tensor([\n    [0.,0.,5.,5.],\n    [10.,10.,20.,20.],\n    [20.,20.,30.,30.]\n])\n\nout = box_iou(boxes1, boxes2)\n\nprint(out.shape)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003etorch.Size([2,2])\u003c/code\u003e","\u003ccode\u003etorch.Size([3,2])\u003c/code\u003e","\u003ccode\u003etorch.Size([6])\u003c/code\u003e","\u003ccode\u003etorch.Size([2,3])\u003c/code\u003e"],"correct":3},{"id":"cv-1ggglzs1ehnajg","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-q20","label":"Câu 20","batch":"cv-p11"},"html":"\n      \n      \u003cp\u003eMột detector trả về bốn detection. Pipeline giữ \u003ccode\u003escore \u0026gt;= 0.5\u003c/code\u003e, sau đó giả sử NMS trả về index cục bộ \u003ccode\u003e[0,2]\u003c/code\u003e trên tập đã lọc. Output cuối cùng là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\n\nboxes = torch.tensor([\n    [0.,0.,10.,10.],\n    [2.,2.,12.,12.],\n    [20.,20.,30.,30.],\n    [40.,40.,50.,50.]\n])\n\nscores = torch.tensor([0.9, 0.4, 0.8, 0.7])\nlabels = torch.tensor([1, 2, 3, 4])\n\nmask = scores \u0026gt;= 0.5\n\nboxes_f  = boxes[mask]\nscores_f = scores[mask]\nlabels_f = labels[mask]\n\n# NMS trên boxes_f trả về:\nkeep = torch.tensor([0, 2])\n\nprint(labels_f[keep].tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1,3]\u003c/code\u003e","\u003ccode\u003e[1,4]\u003c/code\u003e","\u003ccode\u003e[2,4]\u003c/code\u003e","\u003ccode\u003e[3,4]\u003c/code\u003e"],"correct":1},{"id":"cv-15eavgx19uei4x","chapter":"11","topic":"Phần 11 — Bounding box và detection","source":{"id":"cv-p11-aq01","label":"Additional Question 1","b
