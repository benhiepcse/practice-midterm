n      \n      \u003cp\u003eMột stereo camera đã rectify có \u003ccode\u003ef=800 px\u003c/code\u003e, \u003ccode\u003eB=0.12 m\u003c/code\u003e. Một điểm có disparity \u003ccode\u003ed=48 px\u003c/code\u003e. Theo \u003ccode\u003eZ=fB/d\u003c/code\u003e, depth bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e1.5 m\u003c/code\u003e","\u003ccode\u003e2.0 m\u003c/code\u003e","\u003ccode\u003e2.5 m\u003c/code\u003e","\u003ccode\u003e4.0 m\u003c/code\u003e"],"correct":1},{"id":"cv-n9t7vbhq22c5","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-q03","label":"Câu 3","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eCho stereo camera đã rectify với \u003ccode\u003ef=500 px\u003c/code\u003e, \u003ccode\u003eB=0.20 m\u003c/code\u003e. Hai điểm có disparity lần lượt \u003ccode\u003ed1=50 px\u003c/code\u003e và \u003ccode\u003ed2=25 px\u003c/code\u003e. Depth \u003ccode\u003eZ1\u003c/code\u003e và \u003ccode\u003eZ2\u003c/code\u003e tương ứng là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eZ1=1 m\u003c/code\u003e, \u003ccode\u003eZ2=2 m\u003c/code\u003e","\u003ccode\u003eZ1=2 m\u003c/code\u003e, \u003ccode\u003eZ2=4 m\u003c/code\u003e","\u003ccode\u003eZ1=4 m\u003c/code\u003e, \u003ccode\u003eZ2=2 m\u003c/code\u003e","\u003ccode\u003eZ1=5 m\u003c/code\u003e, \u003ccode\u003eZ2=10 m\u003c/code\u003e"],"correct":1},{"id":"cv-11qd97e7rixy2","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-q04","label":"Câu 4","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eTrong cùng một stereo camera với \u003ccode\u003ef\u003c/code\u003e và \u003ccode\u003eB\u003c/code\u003e cố định, điểm A có disparity \u003ccode\u003e80 px\u003c/code\u003e, điểm B có disparity \u003ccode\u003e40 px\u003c/code\u003e. Quan hệ nào đúng theo \u003ccode\u003eZ=fB/d\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["Depth của A gấp đôi depth của B","Depth của A bằng depth của B","Depth của A bằng một nửa depth của B","Không thể so sánh nếu chưa biết principal point"],"correct":2},{"id":"cv-1o1a2yckg8k0","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-q05","label":"Câu 5","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eMột depth sensor lưu depth dưới dạng millimeter. Giá trị raw tại pixel \u003ccode\u003e(u,v)\u003c/code\u003e là \u003ccode\u003e2500\u003c/code\u003e. Dùng quy ước \u003ccode\u003eZ_m = depth_raw / 1000\u003c/code\u003e. Depth theo mét là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.25 m\u003c/code\u003e","\u003ccode\u003e2.50 m\u003c/code\u003e","\u003ccode\u003e25.0 m\u003c/code\u003e","\u003ccode\u003e250.0 m\u003c/code\u003e"],"correct":1},{"id":"cv-x4pm4v19tt7v5","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-q06","label":"Câu 6","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eMột depth image chứa giá trị raw sau. Quy ước \u003ccode\u003edepth_scale=1000\u003c/code\u003e, nghĩa là \u003ccode\u003eZ_m = depth_raw / depth_scale\u003c/code\u003e. Ma trận depth theo mét là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edepth_raw = [\n    [1000, 1500],\n    [2000, 2500]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[[1.0,1.5],[2.0,2.5]] m\u003c/code\u003e","\u003ccode\u003e[[0.1,0.15],[0.2,0.25]] m\u003c/code\u003e","\u003ccode\u003e[[10,15],[20,25]] m\u003c/code\u003e","\u003ccode\u003e[[1000,1500],[2000,2500]] m\u003c/code\u003e"],"correct":0},{"id":"cv-1xi6h4j1kbrmn","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-q07","label":"Câu 7","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eDepth image có đơn vị mét. Một pixel được xem là valid khi \u003ccode\u003eZ \u0026gt; 0\u003c/code\u003e và \u003ccode\u003eZ \u0026lt;= 3.0 m\u003c/code\u003e. Valid mask nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edepth = [\n    [0.0, 1.2, 3.0],\n    [3.1, 2.5, 0.0]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[[0,1,1],[0,1,0]]\u003c/code\u003e","\u003ccode\u003e[[1,1,1],[0,1,1]]\u003c/code\u003e","\u003ccode\u003e[[0,1,0],[1,1,0]]\u003c/code\u003e","\u003ccode\u003e[[0,0,1],[0,1,0]]\u003c/code\u003e"],"correct":0},{"id":"cv-14dri6m9s4vx4","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-q08","label":"Câu 8","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eDepth image đã được đổi sang mét. Pixel hợp lệ khi \u003ccode\u003e0.5 \u0026lt;= Z \u0026lt; 2.0\u003c/code\u003e. Có bao nhiêu pixel hợp lệ?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edepth = [\n    [0.2, 0.5, 1.0],\n    [1.9, 2.0, 2.5]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e3\u003c/code\u003e","\u003ccode\u003e4\u003c/code\u003e","\u003ccode\u003e5\u003c/code\u003e"],"correct":1},{"id":"cv-70o0x513qsrel","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-q09","label":"Câu 9","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eMột RGB-D camera đã aligned depth vào RGB. Pixel \u003ccode\u003e(u,v)=(420,290) px\u003c/code\u003e có depth \u003ccode\u003eZ=2 m\u003c/code\u003e. Intrinsics là \u003ccode\u003efx=500 px\u003c/code\u003e, \u003ccode\u003efy=500 px\u003c/code\u003e, \u003ccode\u003ecx=320 px\u003c/code\u003e, \u003ccode\u003ecy=240 px\u003c/code\u003e. Dùng:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX = (u-cx) * Z / fx\nY = (v-cy) * Z / fy\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eĐiểm 3D trong camera frame là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0.2,0.1,2.0) m\u003c/code\u003e","\u003ccode\u003e(0.4,0.2,2.0) m\u003c/code\u003e","\u003ccode\u003e(0.4,0.1,1.0) m\u003c/code\u003e","\u003ccode\u003e(0.2,0.2,1.0) m\u003c/code\u003e"],"correct":1},{"id":"cv-1hgc7un1yhlsgz","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-q10","label":"Câu 10","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eMột pixel trong depth image đã aligned có \u003ccode\u003e(u,v)=(220,340) px\u003c/code\u003e, \u003ccode\u003eZ=4 m\u003c/code\u003e. Intrinsics của depth đã aligned là \u003ccode\u003efx=400 px\u003c/code\u003e, \u003ccode\u003efy=500 px\u003c/code\u003e, \u003ccode\u003ecx=320 px\u003c/code\u003e, \u003ccode\u003ecy=240 px\u003c/code\u003e. Điểm 3D trong camera frame là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(-1.0,0.8,4.0) m\u003c/code\u003e","\u003ccode\u003e(-0.8,1.0,4.0) m\u003c/code\u003e","\u003ccode\u003e(1.0,-0.8,4.0) m\u003c/code\u003e","\u003ccode\u003e(-1.0,0.8,1.0) m\u003c/code\u003e"],"correct":0},{"id":"cv-1hkw3xccb0yq6","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-q11","label":"Câu 11","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eDepth image 2×3 đã aligned với RGB. Intrinsics là \u003ccode\u003efx=fy=1 px\u003c/code\u003e, \u003ccode\u003ecx=0\u003c/code\u003e, \u003ccode\u003ecy=0\u003c/code\u003e. Chỉ pixel có \u003ccode\u003eZ\u0026gt;0\u003c/code\u003e được back-project. Với pixel \u003ccode\u003e(u,v)=(2,1)\u003c/code\u003e có \u003ccode\u003eZ=2 m\u003c/code\u003e, điểm 3D là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(1,2,2) m\u003c/code\u003e","\u003ccode\u003e(2,1,2) m\u003c/code\u003e","\u003ccode\u003e(4,2,2) m\u003c/code\u003e","\u003ccode\u003e(2,4,2) m\u003c/code\u003e"],"correct":2},{"id":"cv-fghu2ug707j0","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-q12","label":"Câu 12","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eCho depth image đã đổi sang mét. Pixel valid khi \u003ccode\u003eZ\u0026gt;0\u003c/code\u003e. Mỗi valid pixel tạo đúng một điểm trong point cloud. Point cloud có bao nhiêu điểm?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edepth = [\n    [1.0, code\u003e(u,v)\u003c/code\u003e là gì?\u003c/p\u003e\n      \n    ","choices":["Lấy màu RGB tại chính pixel \u003ccode\u003e(u,v)\u003c/code\u003e","Lấy màu RGB tại pixel \u003ccode\u003e(v,u)\u003c/code\u003e","Lấy trung bình màu của toàn bộ RGB image","Lấy màu tại principal point của RGB camera"],"correct":0},{"id":"cv-1gcriti1aplzqm","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-aq12","label":"Additional Question 12","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eCho NumPy array \u003ccode\u003edepth\u003c/code\u003e theo mét. Biểu thức nào tạo mask cho các pixel có depth dương và không vượt quá \u003ccode\u003emax_depth\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(depth \u0026gt; 0) \u0026amp; (depth \u0026lt;= max_depth)\u003c/code\u003e","\u003ccode\u003e(depth \u0026lt; 0) \u0026amp; (depth \u0026gt;= max_depth)\u003c/code\u003e","\u003ccode\u003e(depth == 0) | (depth \u0026gt; max_depth)\u003c/code\u003e","\u003ccode\u003e(depth \u0026gt; 0) | (depth \u0026gt; max_depth)\u003c/code\u003e"],"correct":0},{"id":"cv-11ywjgh77wp23","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-aq13","label":"Additional Question 13","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eMột depth camera lưu raw depth theo millimeter. Nếu code quên chia \u003ccode\u003edepth_raw\u003c/code\u003e cho \u003ccode\u003e1000\u003c/code\u003e trước khi coi giá trị là mét, hậu quả trực tiếp nào có thể xảy ra?\u003c/p\u003e\n      \n    ","choices":["Tọa độ 3D có thể lớn hơn thực tế khoảng 1000 lần","Tọa độ 3D có thể nhỏ hơn thực tế khoảng 1000 lần","Chỉ màu RGB thay đổi còn geometry không thay đổi","Chỉ principal point thay đổi còn depth giữ nguyên"],"correct":0},{"id":"cv-s1kxy01trkkho","chapter":"5","topic":"Phần 5 — Stereo, RGB-D và point cloud","source":{"id":"cv-p05-aq14","label":"Additional Question 14","batch":"cv-p05"},"html":"\n      \n      \u003cp\u003eTrong quá 003e. Hai điểm nào dưới đây nằm trong cùng một voxel?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (0.21, 0.39, 0.41)\nP2 = (0.35, 0.22, 0.59)\nP3 = (0.41, 0.39, 0.41)\nP4 = (0.39, 0.41, 0.41)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eP1\u003c/code\u003e và \u003ccode\u003eP2\u003c/code\u003e","\u003ccode\u003eP1\u003c/code\u003e và \u003ccode\u003eP3\u003c/code\u003e","\u003ccode\u003eP2\u003c/code\u003e và \u003ccode\u003eP4\u003c/code\u003e","\u003ccode\u003eP3\u003c/code\u003e và \u003ccode\u003eP4\u003c/code\u003e"],"correct":0},{"id":"cv-l301a4mr6rm0","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q03","label":"Câu 3","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eDùng \u003ccode\u003evoxel_size=1.0 m\u003c/code\u003e và \u003ccode\u003ekey=floor(p/voxel_size)\u003c/code\u003e. Có bao nhiêu voxel khác nhau chứa các điểm sau?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (0.1, 0.2, 0.3)\nP2 = (0.9, 0.8, 0.7)\nP3 = (1.0, 0.2, 0.3)\nP4 = (1.8, 0.9, 0.9)\nP5 = (2.1, 0.1, 0.1)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e3\u003c/code\u003e","\u003ccode\u003e4\u003c/code\u003e","\u003ccode\u003e5\u003c/code\u003e"],"correct":1},{"id":"cv-z7qhvs1egou56","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q04","label":"Câu 4","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eDùng \u003ccode\u003evoxel_size=0.5 m\u003c/code\u003e và \u003ccode\u003ekey=floor(p/voxel_size)\u003c/code\u003e. Voxel key của điểm \u003ccode\u003ep=(-0.1,0.6,-0.7) m\u003c/code\u003e là gì? Lưu ý \u003ccode\u003efloor(-0.2)=-1\u003c/code\u003e và \u003ccode\u003efloor(-1.4)=-2\u003c/code\u003e.\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0,1,-1)\u003c/code\u003e","\u003ccode\u003e(-1,1,-2)\u003c/code\u003e","\u003ccode\u003e(-1,2,-1)\u003c/code\u003e","\u003ccode\u003e(0,1,-2)\u003c/code\u003e"],"correct":1},{"id":"cv-cz5en9iwgwcx","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q05","label":"Câu 5","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eMột radius-outlier rule được định nghĩa như sau: với mỗi điểm, đếm \u003cstrong\u003ecác điểm khác\u003c/strong\u003e có khoảng cách Euclidean \u003ccode\u003e\u0026lt;= 1.1 m\u003c/code\u003e. Giữ điểm nếu có ít nhất \u003ccode\u003e2\u003c/code\u003e neighbors. Cho point cloud 1D nằm trên trục x:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (0,0,0)\nP2 = (1,0,0)\nP3 = (2,0,0)\nP4 = (10,0,0)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNhững điểm nào được giữ?\u003c/p\u003e\n      \n    ","choices":["Chỉ \u003ccode\u003eP1\u003c/code\u003e và \u003ccode\u003eP2\u003c/code\u003e","Chỉ \u003ccode\u003eP2\u003c/code\u003e","\u003ccode\u003eP1\u003c/code\u003e, \u003ccode\u003eP2\u003c/code\u003e và \u003ccode\u003eP3\u003c/code\u003e","Cả bốn điểm"],"correct":1},{"id":"cv-1j4lcuq1vjg7zg","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q06","label":"Câu 6","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eMột radius-outlier filter đếm \u003cstrong\u003ecác điểm khác\u003c/strong\u003e trong bán kính \u003ccode\u003er=0.5 m\u003c/code\u003e với điều kiện khoảng cách \u003ccode\u003e\u0026lt;= r\u003c/code\u003e. Điểm được giữ nếu có ít nhất \u003ccode\u003e2\u003c/code\u003e neighbors. Cho:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = (0.0,0,0)\nB = (0.3,0,0)\nC = (0.4,0,0)\nD = (2.0,0,0)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNhững điểm nào được giữ?\u003c/p\u003e\n      \n    ","choices":["Chỉ \u003ccode\u003eA\u003c/code\u003e","\u003ccode\u003eA\u003c/code\u003e, \u003ccode\u003eB\u003c/code\u003e, \u003ccode\u003eC\u003c/code\u003e","\u003ccode\u003eB\u003c/code\u003e, \u003ccode\u003eC\u003c/code\u003e, \u003ccode\u003eD\u003c/code\u003e","Cả bốn điểm"],"correct":1},{"id":"cv-i95zwy1pr402q","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q07","label":"Câu 7","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eMột point cloud có một cụm dày đặc quanh gốc tọa độ và một điểm nằm rất xa cụm. Radius outlier removal với bán kính nhỏ và yêu cầu nhiều neighbors thường xử lý điểm xa như thế nào?\u003c/p\u003e\n      \n    ","choices":["Giữ lại vì điểm xa có norm lớn","Loại bỏ vì có quá ít neighbors lân cận","Di chuyển điểm về centroid của cụm","Đưa điểm vào voxel của cụm gần nhất"],"correct":1},{"id":"cv-1gi9cp98yx2d9","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q08","label":"Câu 8","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eMặt phẳng có phương trình \u003ccode\u003e2x - y + 2z - 3 = 0\u003c/code\u003e. Khoảng cách Euclidean từ điểm \u003ccode\u003eP=(1,1,1) m\u003c/code\u003e đến mặt phẳng được tính bằng \u003ccode\u003e|ax+by+cz+d| / sqrt(a²+b²+c²)\u003c/code\u003e. Khoảng cách bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0 m\u003c/code\u003e","\u003ccode\u003e1/3 m\u003c/code\u003e","\u003ccode\u003e2/3 m\u003c/code\u003e","\u003ccode\u003e1 m\u003c/code\u003e"],"correct":0},{"id":"cv-5xqvqf8m0yph","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q09","label":"Câu 9","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eMặt phẳng được cho bởi \u003ccode\u003ez=1.5 m\u003c/code\u003e. Khoảng cách point-to-plane của điểm \u003ccode\u003eP=(2,-1,2.1) m\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.4 m\u003c/code\u003e","\u003ccode\u003e0.6 m\u003c/code\u003e","\u003ccode\u003e1.5 m\u003c/code\u003e","\u003ccode\u003e2.1 m\u003c/code\u003e"],"correct":1},{"id":"cv-1ma0kgg81s3go","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q10","label":"Câu 10","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eMặt phẳng có phương trình \u003ccode\u003ex + 2y + 2z - 9 = 0\u003c/code\u003e. Điểm \u003ccode\u003eP=(1,1,2) m\u003c/code\u003e. Khoảng cách từ điểm đến mặt phẳng là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e1/3 m\u003c/code\u003e","\u003ccode\u003e2/3 m\u003c/code\u003e","\u003ccode\u003e1 m\u003c/code\u003e","\u003ccode\u003e2 m\u003c/code\u003e"],"correct":1},{"id":"cv-po723txukt7x","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q11","label":"Câu 11","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eDBSCAN được áp dụng cho các điểm 1D dưới đây. Khoảng cách là Euclidean, \u003ccode\u003eeps=1.1 m\u003c/code\u003e. Trong câu này, \u003ccode\u003emin_points=2\u003c/code\u003e tính \u003cstrong\u003ecả chính điểm đang xét\u003c/strong\u003e. Hai điểm thuộc cùng cụm nếu có thể nối bằng chuỗi các điểm core trong bán kính \u003ccode\u003eeps\u003c/code\u003e.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (0,0,0)\nP2 = (1,0,0)\nP3 = (5,0,0)\nP4 = (6,0,0)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eKết quả có bao nhiêu cluster và bao nhiêu noise point?\u003c/p\u003e\n      \n    ","choices":["1 cluster, 0 noise","2 clusters, 0 noise","2 clusters, 2 noise","4 clusters, 0 noise"],"correct":1},{"id":"cv-1fd6h3i1iwp1qi","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q12","label":"Câu 12","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eDBSCAN dùng \u003ccode\u003eeps=0.6 m\u003c/code\u003e, \u003ccode\u003emin_points=2\u003c/code\u003e và tính cả chính điểm đang xét. Cho các điểm nằm trên trục x:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = 0.0\nB = 0.5\nC = 1.0\nD = 4.0\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eKết quả nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eA,B,C\u003c/code\u003e tạo một cluster và \u003ccode\u003eD\u003c/code\u003e là noise","\u003ccode\u003eA,B\u003c/code\u003e tạo một cluster, \u003ccode\u003eC,D\u003c/code\u003e là noise","\u003ccode\u003eA,B,C,D\u003c/code\u003e tạo một cluster duy nhất","Cả bốn điểm đều được xem là noise"],"correct":0},{"id":"cv-obfdl2saxs6a","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q13","label":"Câu 13","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eDBSCAN dùng \u003ccode\u003eeps=0.25 m\u003c/code\u003e, \u003ccode\u003emin_points=3\u003c/code\u003e, tính cả chính điểm đang xét. Cho:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = (0.0,0,0)\nB = (0.1,0,0)\nC = (0.2,0,0)\nD = (2.0,0,0)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eKết quả nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eA,B,C\u003c/code\u003e tạo một cluster và \u003ccode\u003eD\u003c/code\u003e là noise","\u003ccode\u003eA,B\u003c/code\u003e tạo một cluster, \u003ccode\u003eC,D\u003c/code\u003e là noise","Cả bốn điểm tạo một cluster duy nhất","Cả bốn điểm đều là noise"],"correct":0},{"id":"cv-rnt7sk1gpijl6","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q14","label":"Câu 14","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eCho cluster gồm bốn điểm trong cùng coordinate frame, đơn vị mét:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (0,0,0)\nP2 = (2,0,0)\nP3 = (0,2,0)\nP4 = (2,2,4)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCentroid được tính bằng trung bình từng tọa độ. Centroid là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(1,1,1) m\u003c/code\u003e","\u003ccode\u003e(1,1,2) m\u003c/code\u003e","\u003ccode\u003e(2,2,1) m\u003c/code\u003e","\u003ccode\u003e(0.5,0.5,1) m\u003c/code\u003e"],"correct":0},{"id":"cv-sq6mc3ze9vq3","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q15","label":"Câu 15","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eCho cluster:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (-1, 2, 0)\nP2 = ( 3, 1, 5)\nP3 = ( 2,-2, 4)\nP4 = ( 0, 3, 1)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eAABB được biểu diễn bởi \u003ccode\u003emin_bound\u003c/code\u003e và \u003ccode\u003emax_bound\u003c/code\u003e. Cặp nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003emin=(-1,-2,0)\u003c/code\u003e, \u003ccode\u003emax=(3,3,5)\u003c/code\u003e","\u003ccode\u003emin=(0,-2,1)\u003c/code\u003e, \u003ccode\u003emax=(3,2,5)\u003c/code\u003e","\u003ccode\u003emin=(-1,1,0)\u003c/code\u003e, \u003ccode\u003emax=(2,3,4)\u003c/code\u003e","\u003ccode\u003emin=(-2,-1,0)\u003c/code\u003e, \u003ccode\u003emax=(3,3,5)\u003c/code\u003e"],"correct":0},{"id":"cv-1q0et0utadm8","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q16","label":"Câu 16","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eMột cluster có AABB:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emin_bound = (-1, 2, 0)\nmax_bound = ( 3, 6, 8)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCenter của AABB là trung điểm của \u003ccode\u003emin_bound\u003c/code\u003e và \u003ccode\u003emax_bound\u003c/code\u003e. Center bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(1,4,4) m\u003c/code\u003e","\u003ccode\u003e(2,4,4) m\u003c/code\u003e","\u003ccode\u003e(1,8,8) m\u003c/code\u003e","\u003ccode\u003e(4,4,8) m\u003c/code\u003e"],"correct":0},{"id":"cv-1eentbk40x836","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q17","label":"Câu 17","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eMột cluster có \u003ccode\u003emin_bound=(1,-2,3) m\u003c/code\u003e và \u003ccode\u003emax_bound=(5,4,10) m\u003c/code\u003e. Extent của AABB được tính bằng \u003ccode\u003emax_bound-min_bound\u003c/code\u003e. Extent là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(4,2,7) m\u003c/code\u003e","\u003ccode\u003e(4,6,7) m\u003c/code\u003e","\u003ccode\u003e(6,4,13) m\u003c/code\u003e","\u003ccode\u003e(5,4,10) m\u003c/code\u003e"],"correct":1},{"id":"cv-1rb2exu1l79z3k","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q18","label":"Câu 18","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003ePoint cloud có các điểm:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (0.10,0.10,0.10)\nP2 = (0.20,0.30,0.40)\nP3 = (1.10,0.10,0.20)\nP4 = (1.20,0.40,0.30)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng \u003ccode\u003evoxel_size=1.0 m\u003c/code\u003e, \u003ccode\u003ekey=floor(p/voxel_size)\u003c/code\u003e. Mỗi voxel được thay bằng centroid của các điểm trong voxel đó. Point cloud sau downsampling gồm những điểm nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0.15,0.20,0.25)\u003c/code\u003e và \u003ccode\u003e(1.15,0.25,0.25)\u003c/code\u003e","\u003ccode\u003e(0.10,0.10,0.10)\u003c/code\u003e và \u003ccode\u003e(1.10,0.10,0.20)\u003c/code\u003e","\u003ccode\u003e(0.30,0.40,0.50)\u003c/code\u003e và \u003ccode\u003e(2.30,0.50,0.50)\u003c/code\u003e","\u003ccode\u003e(0.15,0.25,0.20)\u003c/code\u003e và \u003ccode\u003e(1.15,0.25,0.35)\u003c/code\u003e"],"correct":0},{"id":"cv-4av4td1a74eev","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-q19","label":"Câu 19","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eCho cluster gồm:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (1,2,3)\nP2 = (3,4,5)\nP3 = (5,0,4)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCặp \u003cstrong\u003ecentroid và AABB\u003c/strong\u003e nào đúng?\u003c/p\u003e\n      \n    ","choices":["Centroid \u003ccode\u003e(3,2,4)\u003c/code\u003e; AABB \u003ccode\u003emin=(1,0,3)\u003c/code\u003e, \u003ccode\u003emax=(5,4,5)\u003c/code\u003e","Centroid \u003ccode\u003e(3,3,4)\u003c/code\u003e; AABB \u003ccode\u003emin=(1,2,3)\u003c/code\u003e, \u003ccode\u003emax=(5,4,5)\u003c/code\u003e","Centroid \u003ccode\u003e(2,3,4)\u003c/code\u003e; AABB \u003ccode\u003emin=(0,1,3)\u003c/code\u003e, \u003ccode\u003emax=(4,5,5)\u003c/code\u003e","Centroid \u003ccode\u003e(3,2, xu hướng nào có thể xảy ra?\u003c/p\u003e\n      \n    ","choices":["Các nhóm điểm gần nhau có thể bị nối thành cluster lớn hơn","Các cluster chắc chắn bị chia thành nhiều cluster nhỏ hơn","Mọi điểm chắc chắn trở thành noise bất kể mật độ","Tọa độ các điểm bị chia cho giá trị \u003ccode\u003eeps\u003c/code\u003e"],"correct":0},{"id":"cv-eyguyvgukb1h","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-aq13","label":"Additional Question 13","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eTrong Open3D, \u003ccode\u003epcd.get_axis_aligned_bounding_box()\u003c/code\u003e tạo loại bounding box nào?\u003c/p\u003e\n      \n    ","choices":["Box có các cạnh song song với các trục của coordinate frame","Box luôn xoay theo principal direction của point cloud","Box 2D được xác định trong pixel coordinate system","Box hình cầu có bán kính bằng khoảng cách cực đại"],"correct":0},{"id":"cv-1y5l5u3srt4n7","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-aq14","label":"Additional Question 14","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eVới một AABB, phương thức \u003ccode\u003eget_extent()\u003c/code\u003e tương ứng với đại lượng nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003emax_bound - min_bound\u003c/code\u003e theo từng trục","\u003ccode\u003emax_bound + min_bound\u003c/code\u003e theo từng trục","Trung bình tọa độ của toàn bộ point cloud","Khoảng cách từ centroid đến gốc tọa độ"],"correct":0},{"id":"cv-k1uvi4195b3yc","chapter":"6","topic":"Phần 6 — Lọc và nhóm point cloud","source":{"id":"cv-p06-aq15","label":"Additional Question 15","batch":"cv-p06"},"html":"\n      \n      \u003cp\u003eKhi tính point-to-plane distance cho mặt phẳng \u003ccode\u003eax+by+cz+d=0\u003c/code\u003e, tại sao mẫu số chứa \u003ccode\u003esqrt(a²+b²+c²)\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["Để chuẩn hóa độ dài normal vector của mặt phẳng","Để chuyển tọa độ point từ mét sang pixel","Để tính centroid của tất cả plane inliers","Để xác định voxel chứa điểm đang được xét"],"correct":0},{"id":"cv-1vdcjv4xp5gyo","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q01","label":"Câu 1","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eMột ảnh đã được undistort. Camera có \u003ccode\u003efx=500 px\u003c/code\u003e, \u003ccode\u003efy=500 px\u003c/code\u003e, \u003ccode\u003ecx=320 px\u003c/code\u003e, \u003ccode\u003ecy=240 px\u003c/code\u003e. Pixel \u003ccode\u003e(u,v)=(420,290) px\u003c/code\u003e có depth \u003ccode\u003eZ=2 m\u003c/code\u003e. Dùng:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX = (u-cx) * Z / fx\nY = (v-cy) * Z / fy\n\nu2 = fx * X / Z + cx\nv2 = fy * Y / Z + cy\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eSau round trip pixel → 3D → pixel với cùng intrinsics, kết quả nào đúng?\u003c/p\u003e\n      \n    ","choices":["Điểm 3D \u003ccode\u003e(0.2,0.1,2)\u003c/code\u003e, pixel cuối \u003ccode\u003e(420,290)\u003c/code\u003e","Điểm 3D \u003ccode\u003e(0.4,0.2,2)\u003c/code\u003e, pixel cuối \u003ccode\u003e(420,290)\u003c/code\u003e","Điểm 3D \u003ccode\u003e(0.2,0.1,2)\u003c/code\u003e, pixel cuối \u003ccode\u003e(370,265)\u003c/code\u003e","Điểm 3D \u003ccode\u003e(0.4,0.2,2)\u003c/code\u003e, pixel cuối \u003ccode\u003e(520,340)\u003c/code\u003e"],"correct":0},{"id":"cv-iemv0svb3xj6","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q02","label":"Câu 2","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eCamera không distortion có \u003ccode\u003efx=400 px\u003c/code\u003e, \u003ccode\u003efy=600 px\u003c/code\u003e, \u003ccode\u003ecx=300 px\u003c/code\u003e, \u003ccode\u003ecy=200 px\u003c/code\u003e. Pixel \u003ccode\u003e(u,v)=(200,350) px\u003c/code\u003e có depth \u003ccode\u003eZ=4 m\u003c/code\u003e. Sau back-project rồi project lại bằng cùng camera model, kết quả nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eP=(-1,1,4) m\u003c/code\u003e, pixel cuối \u003ccode\u003e(200,350) px\u003c/code\u003e","\u003ccode\u003eP=(-1,1,4) m\u003c/code\u003e, pixel cuối \u003ccode\u003e(400,50) px\u003c/code\u003e","\u003ccode\u003eP=(-0.5,1,4) m\u003c/code\u003e, pixel cuối \u003ccode\u003e(250,350) px\u003c/code\u003e","\u003ccode\u003eP=(1,-1,4) m\u003c/code\u003e, pixel cuối \u003ccode\u003e(400,50) px\u003c/code\u003e"],"correct":0},{"id":"cv-iwiw3poyez1b","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q03","label":"Câu 3","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eMột pixel đã undistort có \u003ccode\u003e(u,v)=(320,240) px\u003c/code\u003e, đúng tại principal point. Depth là \u003ccode\u003eZ=3 m\u003c/code\u003e. Camera có \u003ccode\u003ecx=320 px\u003c/code\u003e, \u003ccode\u003ecy=240 px\u003c/code\u003e, \u003ccode\u003efx\u0026gt;0\u003c/code\u003e, \u003ccode\u003efy\u0026gt;0\u003c/code\u003e. Round trip pixel → 3D → pixel cho kết quả nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eP=(0,0,3) m\u003c/code\u003e, pixel cuối \u003ccode\u003e(320,240)\u003c/code\u003e","\u003ccode\u003eP=(3,0,0) m\u003c/code\u003e, pixel cuối \u003ccode\u003e(320,240)\u003c/code\u003e","\u003ccode\u003eP=(0,3,0) m\u003c/code\u003e, pixel cuối \u003ccode\u003e(240,320)\u003c/code\u003e","\u003ccode\u003eP=(320,240,3) m\u003c/code\u003e, pixel cuối \u003ccode\u003e(0,0)\u003c/code\u003e"],"correct":0},{"id":"cv-1e3wzjqe2yews","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q04","label":"Câu 4","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eMột pixel \u003ccode\u003e(u,v)=(500,300) px\u003c/code\u003e có depth \u003ccode\u003eZ=2 m\u003c/code\u003e. Back-projection dùng đúng intrinsics \u003ccode\u003efx=600\u003c/code\u003e, \u003ccode\u003efy=600\u003c/code\u003e, \u003ccode\u003ecx=320\u003c/code\u003e, \u003ccode\u003ecy=240\u003c/code\u003e. Tuy nhiên khi project lại, lập trình viên dùng nhầm \u003ccode\u003ecx=300\u003c/code\u003e nhưng các tham số khác giữ nguyên. Pixel cuối là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(480,300) px\u003c/code\u003e","\u003ccode\u003e(500,280) px\u003c/code\u003e","\u003ccode\u003e(500,300) px\u003c/code\u003e","\u003ccode\u003e(520,300) px\u003c/code\u003e"],"correct":0},{"id":"cv-1wey3dtb25zb7","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q05","label":"Câu 5","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eBa điểm trong cùng frame, đơn vị mét, là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = (0,0,1)\nB = (1,0,1)\nC = (0,1,1)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng \u003ccode\u003en=(B-A)×(C-A)\u003c/code\u003e và biểu diễn plane là \u003ccode\u003eax+by+cz+d=0\u003c/code\u003e. Phương trình nào đúng với hướng normal do đúng thứ tự cross product trên tạo ra?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003ez - 1 = 0\u003c/code\u003e","\u003ccode\u003ex - 1 = 0\u003c/code\u003e","\u003ccode\u003ey - 1 = 0\u003c/code\u003e","\u003ccode\u003ex + y - 1 = 0\u003c/code\u003e"],"correct":0},{"id":"cv-1jevl1q17q3r20","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q06","label":"Câu 6","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eCho ba điểm:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = (0,0,0)\nB = (2,0,0)\nC = (0,3,0)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng \u003ccode\u003en=(B-A)×(C-A)\u003c/code\u003e. Normal chưa chuẩn hóa thu được là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0,0,6)\u003c/code\u003e","\u003ccode\u003e(0,6,0)\u003c/code\u003e","\u003ccode\u003e(6,0,0)\u003c/code\u003e","\u003ccode\u003e(0,0,-6)\u003c/code\u003e"],"correct":0},{"id":"cv-lzrofnyfkyl3","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q07","label":"Câu 7","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eBa điểm là \u003ccode\u003eA=(1,0,0)\u003c/code\u003e, \u003ccode\u003eB=(1,1,0)\u003c/code\u003e, \u003ccode\u003eC=(1,0,2)\u003c/code\u003e. Dùng \u003ccode\u003en=(B-A)×(C-A)\u003c/code\u003e. Phương trình plane nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003ex - 1 = 0\u003c/code\u003e","\u003ccode\u003ey - 1 = 0\u003c/code\u003e","\u003ccode\u003ez - 1 = 0\u003c/code\u003e","\u003ccode\u003ex + y + z - 1 = 0\u003c/code\u003e"],"correct":0},{"id":"cv-1evkl5oxg3qu0","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q08","label":"Câu 8","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eBa điểm \u003ccode\u003eA=(0,0,0)\u003c/code\u003e, \u003ccode\u003eB=(1,1,1)\u003c/code\u003e, \u003ccode\u003eC=(2,2,2)\u003c/code\u003e được dùng để xác định một mặt phẳng. Kết luận nào đúng?\u003c/p\u003e\n      \n    ","choices":["Không xác định được plane duy nhất vì ba điểm thẳng hàng","Plane duy nhất là \u003ccode\u003ex+y+z=0\u003c/code\u003e","Plane duy nhất là \u003ccode\u003ex-y=0\u003c/code\u003e","Plane duy nhất là \u003ccode\u003ez=2\u003c/code\u003e"],"correct":0},{"id":"cv-tel4318yqfwt","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q09","label":"Câu 9","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eMột plane ứng viên là \u003ccode\u003ez=1.0 m\u003c/code\u003e. Một điểm được tính là inlier khi khoảng cách point-to-plane \u003ccode\u003e\u0026lt;= 0.05 m\u003c/code\u003e. Cho các điểm có tọa độ z lần lượt:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e0.94, 0.96, 1.00, 1.04, 1.06\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCó bao nhiêu inlier?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e3\u003c/code\u003e","\u003ccode\u003e4\u003c/code\u003e","\u003ccode\u003e5\u003c/code\u003e"],"correct":1},{"id":"cv-u0lqejypm04f","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q10","label":"Câu 10","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eHai plane ứng viên được đánh giá trên cùng point cloud với cùng threshold. Kết quả đã được tính sẵn:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ePlane A: 82 inliers, mean inlier distance = 0.018 m\nPlane B: 82 inliers, mean inlier distance = 0.011 m\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eQuy tắc chọn là: ưu tiên số inlier lớn hơn; nếu hòa thì chọn mean inlier distance nhỏ hơn. Plane nào được chọn?\u003c/p\u003e\n      \n    ","choices":["Plane A vì mean distance lớn hơn","Plane B vì mean distance nhỏ hơn","Plane A vì hai plane có cùng số inlier","Không thể chọn vì hai plane có cùng số inlier"],"correct":1},{"id":"cv-6x8ackf8hj4y","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q11","label":"Câu 11","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eBa plane ứng viên có thống kê:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA: 95 inliers, mean distance = 0.020 m\nB: 90 inliers, mean distance = 0.010 m\nC: 92 inliers, mean distance = 0.015 m\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eQuy tắc là chọn plane có số inlier lớn nhất trước, chỉ dùng mean distance để phá hòa. Plane nào được chọn?\u003c/p\u003e\n      \n    ","choices":["Plane A","Plane B","Plane C","Không plane nào đủ điều kiện"],"correct":0},{"id":"cv-18focvy1ouivhg","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q12","label":"Câu 12","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003ePlane ứng viên là \u003ccode\u003ex+2y+2z-9=0\u003c/code\u003e. Một điểm được xem là inlier nếu khoảng cách Euclidean đến plane \u003ccode\u003e\u0026lt;= 0.35 m\u003c/code\u003e. Điểm \u003ccode\u003eP=(1,1,2) m\u003c/code\u003e có phải inlier không?\u003c/p\u003e\n      \n    ","choices":["Có, vì khoảng cách bằng \u003ccode\u003e2/3 m\u003c/code\u003e","Có, vì khoảng cách bằng \u003ccode\u003e1/3 m\u003c/code\u003e","Không, vì khoảng cách bằng \u003ccode\u003e1/3 m\u003c/code\u003e","Không, vì khoảng cách bằng \u003ccode\u003e1 m\u003c/code\u003e"],"correct":2},{"id":"cv-1t0yuc7pjy56z","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q13","label":"Câu 13","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eMặt bàn được biểu diễn bởi plane \u003ccode\u003ez=0.75 m\u003c/code\u003e. Quy ước normal hướng lên là \u003ccode\u003en=(0,0,1)\u003c/code\u003e, vì vậy phía “trên bàn” là phía có \u003ccode\u003ez\u0026gt;0.75\u003c/code\u003e. Điểm nào nằm trên bàn?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0.2,0.1,0.60)\u003c/code\u003e","\u003ccode\u003e(0.0,0.5,0.75)\u003c/code\u003e","\u003ccode\u003e(0.4,-0.2,0.90)\u003c/code\u003e","\u003ccode\u003e(-0.3,0.2,0.70)\u003c/code\u003e"],"correct":2},{"id":"cv-16fnm96u9j0uu","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q14","label":"Câu 14","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eMặt bàn có phương trình \u003ccode\u003ez=1.0 m\u003c/code\u003e, normal \u003ccode\u003en=(0,0,1)\u003c/code\u003e. Chỉ giữ các điểm vật thể có signed height thỏa \u003ccode\u003e0.02 \u0026lt; z-1.0 \u0026lt;= 0.50 m\u003c/code\u003e. Điểm nào được giữ?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eP=(0,0,1.01)\u003c/code\u003e","\u003ccode\u003eP=(0,0,1.02)\u003c/code\u003e","\u003ccode\u003eP=(0,0,1.30)\u003c/code\u003e","\u003ccode\u003eP=(0,0,1.60)\u003c/code\u003e"],"correct":2},{"id":"cv-1tk9iiyow0r8y","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q15","label":"Câu 15","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eMặt bàn được viết ở dạng normalized \u003ccode\u003en·p+d=0\u003c/code\u003e với \u003ccode\u003en=(0,0,1)\u003c/code\u003e, \u003ccode\u003ed=-0.8\u003c/code\u003e. Quy ước signed distance dương là phía trên bàn. Signed distance của \u003ccode\u003eP=(0.2,-0.1,1.1) m\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e-0.3 m\u003c/code\u003e","\u003ccode\u003e0.0 m\u003c/code\u003e","\u003ccode\u003e0.3 m\u003c/code\u003e","\u003ccode\u003e1.9 m\u003c/code\u003e"],"correct":2},{"id":"cv-1h2ny6pccnk13","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q16","label":"Câu 16","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003ePlane của mặt bàn có normal đã chuẩn hóa \u003ccode\u003en=(0,0,-1)\u003c/code\u003e và phương trình \u003ccode\u003e-z+1=0\u003c/code\u003e. Trong câu này, phía “trên bàn” được định nghĩa theo hướng vật lý \u003ccode\u003e+z\u003c/code\u003e, không phải theo phía signed distance dương của normal hiện tại. Điểm nào nằm trên bàn?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0,0,0.8)\u003c/code\u003e","\u003ccode\u003e(0,0,0.9)\u003c/code\u003e","\u003ccode\u003e(0,0,1.0)\u003c/code\u003e","\u003ccode\u003e(0,0,1.2)\u003c/code\u003e"],"correct":3},{"id":"cv-1mva4lshzbwge","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q17","label":"Câu 17","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eSau khi loại mặt bàn, DBSCAN tạo ra bốn cluster có số điểm:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eCluster 0: 120 points\nCluster 1: 18 points\nCluster 2: 45 points\nCluster 3: 9 points\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003ePipeline chỉ giữ cluster có \u003ccode\u003esize \u0026gt;= 20\u003c/code\u003e. Cluster nào được giữ?\u003c/p\u003e\n      \n    ","choices":["Cluster 0 và Cluster 2","Cluster 0, Cluster 1 và Cluster 2","Cluster 1 và Cluster 3","Cả bốn cluster"],"correct":0},{"id":"cv-u47xkp6j6rmb","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q18","label":"Câu 18","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eBa cluster vật thể có số điểm lần lượt là \u003ccode\u003e30\u003c/code\u003e, \u003ccode\u003e50\u003c/code\u003e, \u003ccode\u003e80\u003c/code\u003e. Điều kiện lọc là \u003ccode\u003emin_cluster_size=50\u003c/code\u003e và cluster được giữ nếu \u003ccode\u003esize \u0026gt;= min_cluster_size\u003c/code\u003e. Kết quả nào đúng?\u003c/p\u003e\n      \n    ","choices":["Chỉ cluster 80 điểm được giữ","Cluster 50 và 80 điểm được giữ","Cluster 30 và 50 điểm được giữ","Cả ba cluster đều được giữ"],"correct":1},{"id":"cv-qmqfmp1acag7n","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q19","label":"Câu 19","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eMặt bàn là \u003ccode\u003ez=1.0 m\u003c/code\u003e với hướng “trên” là \u003ccode\u003e+z\u003c/code\u003e. Pipeline giữ điểm có \u003ccode\u003ez-1.0 \u0026gt; 0.03 m\u003c/code\u003e. Sau đó DBSCAN cho ba cluster:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eC0: 25 points\nC1: 8 points\nC2: 40 points\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003ePipeline chỉ giữ cluster có ít nhất \u003ccode\u003e20\u003c/code\u003e điểm. Sau cả hai bước, giả sử các cluster trên đều chỉ chứa những điểm đã vượt qua điều kiện chiều cao, cluster nào được xem là vật thể hợp lệ?\u003c/p\u003e\n      \n    ","choices":["Chỉ \u003ccode\u003eC0\u003c/code\u003e","\u003ccode\u003eC0\u003c/code\u003e và \u003ccode\u003eC2\u003c/code\u003e","\u003ccode\u003eC1\u003c/code\u003e và \u003ccode\u003eC2\u003c/code\u003e","Cả \u003ccode\u003eC0\u003c/code\u003e, \u003ccode\u003eC1\u003c/code\u003e, \u003ccode\u003eC2\u003c/code\u003e"],"correct":1},{"id":"cv-1elb7a61s6osk6","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-q20","label":"Câu 20","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eMột pipeline tabletop có dữ liệu sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eTable plane: z = 0.80 m\nHướng \"trên\": +z\nGiữ điểm nếu: 0.03 \u0026lt; z - 0.80 \u0026lt;= 0.40 m\nGiữ cluster nếu: size \u0026gt;= 3\n\nP1 = (0.0,0.0,0.82)\nP2 = (0.1,0.0,0.90)\nP3 = (0.1,0.1,1.00)\nP4 = (0.0,0.1,1.10)\nP5 = (1.0,1.0,0.95)\nP6 = (1.1,1.0,0.96)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eSau bước lọc chiều cao, giả sử DBSCAN nhóm \u003ccode\u003eP2,P3,P4\u003c/code\u003e thành cluster A và \u003ccode\u003eP5,P6\u003c/code\u003e thành cluster B. Kết quả cuối cùng là gì?\u003c/p\u003e\n      \n    ","choices":["Giữ cluster A; loại P1 và cluster B","Giữ cluster B; loại P1 và cluster A","Giữ cả cluster A và cluster B","Loại cả hai cluster vì tất cả điểm đều quá cao"],"correct":0},{"id":"cv-1um3m0dl0owxf","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq01","label":"Additional Question 1","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eTrong Open3D, lời gọi \u003ccode\u003epcd.segment_plane(distance_threshold, ransac_n, num_iterations)\u003c/code\u003e sử dụng \u003ccode\u003edistance_threshold\u003c/code\u003e để điều khiển yếu tố nào?\u003c/p\u003e\n      \n    ","choices":["Khoảng cách tối đa từ điểm đến plane để có thể được xem là inlier","Số điểm tối đa được phép xuất hiện trong point cloud đầu vào","Số cluster tối đa được tạo sau khi loại bỏ mặt phẳng","Khoảng cách tối thiểu giữa hai centroid của các vật thể"],"correct":0},{"id":"cv-q0c5s2fk5082","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq02","label":"Additional Question 2","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003epcd.segment_plane(distance_threshold, ransac_n, num_iterations)\u003c/code\u003e, tham số \u003ccode\u003eransac_n\u003c/code\u003e biểu diễn điều gì?\u003c/p\u003e\n      \n    ","choices":["Số điểm được lấy để ước lượng một plane candidate trong mỗi lần thử","Số plane chắc chắn phải được trả về sau khi thuật toán kết thúc","Số inlier tối thiểu mà plane cuối cùng bắt buộc phải chứa","Số cluster được tạo từ các điểm không thuộc mặt phẳng"],"correct":0},{"id":"cv-1sf17wrw4juix","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq03","label":"Additional Question 3","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eTrong \u003ccode\u003esegment_plane(..., num_iterations)\u003c/code\u003e, \u003ccode\u003enum_iterations\u003c/code\u003e liên quan trực tiếp nhất đến yếu tố nào?\u003c/p\u003e\n      \n    ","choices":["Số lần thử lấy mẫu và đánh giá các plane candidate","Số tọa độ cần có trong mỗi point của point cloud","Số lượng normal vector được lưu cho mỗi point","Số bước biến đổi từ camera frame sang base frame"],"correct":0},{"id":"cv-14vaf8j1o8l37","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq04","label":"Additional Question 4","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eGiữ dữ liệu và các tham số khác cố định. Nếu tăng \u003ccode\u003edistance_threshold\u003c/code\u003e trong plane segmentation, xu hướng nào có thể xảy ra?\u003c/p\u003e\n      \n    ","choices":["Nhiều điểm ở xa plane hơn có thể được chấp nhận là inlier","Số inlier chắc chắn giảm vì điều kiện trở nên nghiêm ngặt hơn","Mọi normal vector của point cloud tự động đổi dấu","Point cloud tự động được voxel downsample trước segmentation"],"correct":0},{"id":"cv-1bwy9iah5k3mm","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq05","label":"Additional Question 5","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eGiữ dữ liệu và các tham số khác cố định. Nếu giảm \u003ccode\u003edistance_threshold\u003c/code\u003e đáng kể trong plane segmentation, điều gì thường xảy ra?\u003c/p\u003e\n      \n    ","choices":["Điều kiện inlier trở nên nghiêm ngặt hơn","Điều kiện inlier trở nên dễ thỏa hơn","Mỗi plane candidate dùng nhiều điểm hơn để fit","Normal của plane luôn chuyển sang hướng \u003ccode\u003e+z\u003c/code\u003e"],"correct":0},{"id":"cv-15w0t8sobs88m","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq06","label":"Additional Question 6","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eOpen3D trả về \u003ccode\u003eplane_model\u003c/code\u003e từ \u003ccode\u003esegment_plane()\u003c/code\u003e dưới dạng bốn hệ số \u003ccode\u003e[a,b,c,d]\u003c/code\u003e. Các hệ số này mô tả phương trình nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eax + by + cz + d = 0\u003c/code\u003e","\u003ccode\u003eax² + by² + cz² = d\u003c/code\u003e","\u003ccode\u003ex/a + y/b + z/c = d²\u003c/code\u003e","\u003ccode\u003eaX + bY = cZ / d\u003c/code\u003e"],"correct":0},{"id":"cv-1dic4x919rgnnv","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq07","label":"Additional Question 7","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eTrong kết quả \u003ccode\u003eplane_model=[a,b,c,d]\u003c/code\u003e, vector nào là normal chưa chuẩn hóa của mặt phẳng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(a,b,c)\u003c/code\u003e","\u003ccode\u003e(b,c,d)\u003c/code\u003e","\u003ccode\u003e(a,c,d)\u003c/code\u003e","\u003ccode\u003e(a,b,d)\u003c/code\u003e"],"correct":0},{"id":"cv-waknzl1w3s1qh","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq08","label":"Additional Question 8","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eNếu nhân toàn bộ hệ số của plane \u003ccode\u003e[a,b,c,d]\u003c/code\u003e với cùng một hằng số khác 0, điều gì xảy ra về mặt hình học?\u003c/p\u003e\n      \n    ","choices":["Vẫn biểu diễn cùng một mặt phẳng hình học","Mặt phẳng luôn dịch chuyển theo hướng normal","Mặt phẳng luôn quay 90° quanh trục z","Plane biến thành một đường thẳng trong không gian 3D"],"correct":0},{"id":"cv-1dyytfx2me3i7","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq09","label":"Additional Question 9","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eCho plane \u003ccode\u003eax+by+cz+d=0\u003c/code\u003e. Công thức nào tính khoảng cách Euclidean không dấu từ \u003ccode\u003eP=(x,y,z)\u003c/code\u003e đến plane?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e|ax+by+cz+d| / sqrt(a²+b²+c²)\u003c/code\u003e","\u003ccode\u003e|ax+by+cz+d| * sqrt(a²+b²+c²)\u003c/code\u003e","\u003ccode\u003e(x²+y²+z²) / (a²+b²+c²)\u003c/code\u003e","\u003ccode\u003e|x-a| + |y-b| + |z-c| + d\u003c/code\u003e"],"correct":0},{"id":"cv-6rwm96weew8c","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq10","label":"Additional Question 10","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eKhi dùng signed distance để quyết định điểm nằm “trên” hay “dưới” mặt bàn, yếu tố nào đặc biệt quan trọng?\u003c/p\u003e\n      \n    ","choices":["Phải biết và thống nhất hướng của normal vector","Phải đổi mọi tọa độ point sang đơn vị pixel","Phải đặt principal point tại tâm point cloud","Phải bảo đảm point cloud có đúng ba cluster"],"correct":0},{"id":"cv-kk9aus16j07ai","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq11","label":"Additional Question 11","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eNếu plane \u003ccode\u003e[a,b,c,d]\u003c/code\u003e được đổi thành \u003ccode\u003e[-a,-b,-c,-d]\u003c/code\u003e, điều gì xảy ra?\u003c/p\u003e\n      \n    ","choices":["Plane hình học không đổi nhưng dấu signed distance bị đảo","Plane dịch chuyển một khoảng đúng bằng \u003ccode\u003e|d|\u003c/code\u003e","Plane quay 180° và nằm ở một vị trí hình học khác","Khoảng cách không dấu đến plane tăng gấp đôi"],"correct":0},{"id":"cv-1dv44l21g5bchu","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq12","label":"Additional Question 12","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eTrong Open3D, sau khi \u003ccode\u003esegment_plane()\u003c/code\u003e trả về danh sách \u003ccode\u003einliers\u003c/code\u003e, lời gọi \u003ccode\u003epcd.select_by_index(inliers)\u003c/code\u003e thường dùng để lấy gì?\u003c/p\u003e\n      \n    ","choices":["Point cloud chứa các điểm có index nằm trong danh sách inliers","Point cloud chỉ chứa các điểm nằm ngoài danh sách inliers","Danh sách normal vector của toàn bộ point cloud","Danh sách centroid của các cluster còn lại"],"correct":0},{"id":"cv-9vq9ud1vcuqs1","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq13","label":"Additional Question 13","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eTrong Open3D, nếu dùng \u003ccode\u003epcd.select_by_index(inliers, invert=True)\u003c/code\u003e sau khi segment mặt bàn, kết quả thường được hiểu là gì?\u003c/p\u003e\n      \n    ","choices":["Các điểm không thuộc tập plane inliers đã chọn","Chỉ các điểm thuộc tập plane inliers đã chọn","Các điểm có tọa độ âm trong point cloud","Chỉ các điểm có normal ngược hướng camera"],"correct":0},{"id":"cv-1fjg35n1fr1x2j","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq14","label":"Additional Question 14","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eTrong pipeline tabletop, tham số \u003ccode\u003emin_cluster_size\u003c/code\u003e được dùng với quy tắc \u003ccode\u003esize \u0026gt;= min_cluster_size\u003c/code\u003e. Tăng tham số này thường có tác động nào?\u003c/p\u003e\n      \n    ","choices":["Nhiều cluster nhỏ hơn có thể bị loại khỏi danh sách vật thể","Nhiều cluster nhỏ hơn chắc chắn được giữ lại hơn trước","Plane segmentation tự động tạo thêm nhiều inlier hơn","Depth của mọi điểm trong cluster được tăng theo tham số"],"correct":0},{"id":"cv-tdqryff0s6e9","chapter":"7","topic":"Phần 7 — Round trip, mặt phẳng và vật thể","source":{"id":"cv-p07-aq15","label":"Additional Question 15","batch":"cv-p07"},"html":"\n      \n      \u003cp\u003eMột pipeline dùng điều kiện \u003ccode\u003eheight \u0026gt; min_height\u003c/code\u003e để loại các điểm quá sát mặt bàn. Nếu đổi thành \u003ccode\u003eheight \u0026gt;= min_height\u003c/code\u003e, trường hợp nào thay đổi trạng thái?\u003c/p\u003e\n      \n    ","choices":["Điểm có \u003ccode\u003eheight = min_height\u003c/code\u003e","Điểm có \u003ccode\u003eheight \u0026gt; min_height\u003c/code\u003e","Điểm có \u003ccode\u003eheight \u0026lt; min_height\u003c/code\u003e","Mọi điểm bất kể giá trị height"],"correct":0},{"id":"cv-1oijhzo1c9h22a","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q01","label":"Câu 1","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eQuy ước \u003ccode\u003eT_base_from_cam\u003c/code\u003e biến đổi tọa độ từ camera frame sang base frame. Cho:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eR = [[1,0,0],\n     [0,1,0],\n     [0,0,1]]\n\nt = (1.0, -0.5, 0.2) m\nP_cam = (0.3, 0.4, 2.0) m\n\nP_base = R * P_cam + t\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003e\u003ccode\u003eP_base\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(1.3,-0.1,2.2) m\u003c/code\u003e","\u003ccode\u003e(0.7,0.9,1.8) m\u003c/code\u003e","\u003ccode\u003e(1.3,0.9,2.2) m\u003c/code\u003e","\u003ccode\u003e(0.3,0.4,2.0) m\u003c/code\u003e"],"correct":0},{"id":"cv-1p0dijb1q110v7","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q02","label":"Câu 2","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eT_base_from_cam\u003c/code\u003e với phép quay 90° quanh trục z:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eR = [[ 0,-1,0],\n     [ 1, 0,0],\n     [ 0, 0,1]]\n\nt = (1,2,0) m\nP_cam = (2,1,3) m\n\nP_base = R * P_cam + t\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTọa độ của điểm trong base frame là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0,4,3) m\u003c/code\u003e","\u003ccode\u003e(2,3,3) m\u003c/code\u003e","\u003ccode\u003e(3,3,3) m\u003c/code\u003e","\u003ccode\u003e(2,0,3) m\u003c/code\u003e"],"correct":0},{"id":"cv-13pzs741tryi2w","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q03","label":"Câu 3","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột cluster trong camera frame gồm:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (0,0,1)\nP2 = (1,0,1)\nP3 = (0,2,2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng \u003ccode\u003eT_base_from_cam\u003c/code\u003e với \u003ccode\u003eR=I\u003c/code\u003e và \u003ccode\u003et=(2,-1,0.5) m\u003c/code\u003e. Sau khi transform \u003cstrong\u003etoàn bộ ba điểm\u003c/strong\u003e sang base frame, AABB nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003emin=(2,-1,1.5)\u003c/code\u003e, \u003ccode\u003emax=(3,1,2.5)\u003c/code\u003e","\u003ccode\u003emin=(0,0,1)\u003c/code\u003e, \u003ccode\u003emax=(1,2,2)\u003c/code\u003e","\u003ccode\u003emin=(2,0,1.5)\u003c/code\u003e, \u003ccode\u003emax=(3,2,2.5)\u003c/code\u003e","\u003ccode\u003emin=(-2,1,0.5)\u003c/code\u003e, \u003ccode\u003emax=(-1,3,1.5)\u003c/code\u003e"],"correct":0},{"id":"cv-1hkkrwk18rbovw","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q04","label":"Câu 4","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột cluster trong camera frame có bốn điểm:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (0,0,1)\nP2 = (2,0,1)\nP3 = (0,1,1)\nP4 = (2,1,1)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng phép quay 90° quanh z, không translation:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eR = [[ 0,-1,0],\n     [ 1, 0,0],\n     [ 0, 0,1]]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eAABB của cluster trong base frame có extent bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(1,2,0) m\u003c/code\u003e","\u003ccode\u003e(2,1,0) m\u003c/code\u003e","\u003ccode\u003e(1,1,2) m\u003c/code\u003e","\u003ccode\u003e(2,2,1) m\u003c/code\u003e"],"correct":0},{"id":"cv-x7v17yeoagy4","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q05","label":"Câu 5","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột cluster có AABB trong camera frame:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emin_cam = (0,0,1)\nmax_cam = (2,1,1)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCluster được quay 90° quanh trục z sang base frame. Cách nào đúng để tìm AABB trong base frame?\u003c/p\u003e\n      \n    ","choices":["Transform các điểm/corner cần thiết sang base rồi tính min/max lại","Giữ nguyên min/max vì rigid transform không đổi kích thước AABB","Chỉ transform \u003ccode\u003emin_cam\u003c/code\u003e rồi cộng extent cũ vào ba trục","Chỉ transform centroid rồi dùng nguyên min/max của camera frame"],"correct":0},{"id":"cv-o6xwxdtkwx77","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q06","label":"Câu 6","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột cluster trong camera frame gồm:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (1,0,2)\nP2 = (2,0,2)\nP3 = (1,1,2)\nP4 = (2,1,2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCamera intrinsics là \u003ccode\u003efx=100 px\u003c/code\u003e, \u003ccode\u003efy=100 px\u003c/code\u003e, \u003ccode\u003ecx=50 px\u003c/code\u003e, \u003ccode\u003ecy=40 px\u003c/code\u003e. Với \u003ccode\u003eu=fxX/Z+cx\u003c/code\u003e, \u003ccode\u003ev=fyY/Z+cy\u003c/code\u003e, pixel box nhỏ nhất chứa bốn projected points là gì? Box được ghi \u003ccode\u003e[u_min,v_min,u_max,v_max]\u003c/code\u003e.\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[100,40,150,90]\u003c/code\u003e","\u003ccode\u003e[50,40,100,90]\u003c/code\u003e","\u003ccode\u003e[100,50,150,100]\u003c/code\u003e","\u003ccode\u003e[50,100,90,150]\u003c/code\u003e"],"correct":0},{"id":"cv-47w4c1j5e6u1","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q07","label":"Câu 7","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột cluster có các projected pixels:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e(120.2, 80.7)\n(200.8, 75.1)\n(180.4, 160.6)\n(130.9, 150.2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eĐể tạo integer pixel box chứa toàn bộ điểm, quy ước là \u003ccode\u003efloor\u003c/code\u003e cho min và \u003ccode\u003eceil\u003c/code\u003e cho max. Box nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[120,75,201,161]\u003c/code\u003e","\u003ccode\u003e[121,76,200,160]\u003c/code\u003e","\u003ccode\u003e[120,76,201,160]\u003c/code\u003e","\u003ccode\u003e[121,75,200,161]\u003c/code\u003e"],"correct":0},{"id":"cv-1yabjui16datwu","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q08","label":"Câu 8","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eẢnh có kích thước \u003ccode\u003eW=640\u003c/code\u003e, \u003ccode\u003eH=480\u003c/code\u003e. Một cluster sau projection có floating box \u003ccode\u003e[-20.4,100.2,670.8,500.1]\u003c/code\u003e. Quy ước integer box dùng \u003ccode\u003efloor\u003c/code\u003e cho min, \u003ccode\u003eceil\u003c/code\u003e cho max rồi clip về miền \u003ccode\u003e0 \u0026lt;= u \u0026lt;= W-1\u003c/code\u003e, \u003ccode\u003e0 \u0026lt;= v \u0026lt;= H-1\u003c/code\u003e. Box cuối là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[0,100,639,479]\u003c/code\u003e","\u003ccode\u003e[0,101,640,480]\u003c/code\u003e","\u003ccode\u003e[-20,100,671,501]\u003c/code\u003e","\u003ccode\u003e[0,100,640,480]\u003c/code\u003e"],"correct":0},{"id":"cv-w605xk1pi7hko","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q09","label":"Câu 9","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eCamera có \u003ccode\u003efx=400 px\u003c/code\u003e, \u003ccode\u003efy=400 px\u003c/code\u003e, \u003ccode\u003ecx=320 px\u003c/code\u003e, \u003ccode\u003ecy=240 px\u003c/code\u003e. Một cluster gồm:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (-0.5,-0.5,2.0) m\nP2 = ( 0.5,-0.5,2.0) m\nP3 = (-0.5, 0.5,2.0) m\nP4 = ( 0.5, 0.5,2.0) m\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003ePixel box của cluster là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[220,140,420,340]\u003c/code\u003e","\u003ccode\u003e[120,40,520,440]\u003c/code\u003e","\u003ccode\u003e[220,40,420,240]\u003c/code\u003e","\u003ccode\u003e[140,220,340,420]\u003c/code\u003e"],"correct":0},{"id":"cv-xkv6gojc8m18","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q10","label":"Câu 10","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eGround-truth centroid và predicted centroid đều ở base frame:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eC_gt   = (0.4, -0.2, 1.0) m\nC_pred = (0.5, -0.1, 1.2) m\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eLỗi centroid 3D được định nghĩa là Euclidean distance \u003ccode\u003e||C_pred-C_gt||₂\u003c/code\u003e. Giá trị gần nhất là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.245 m\u003c/code\u003e","\u003ccode\u003e0.300 m\u003c/code\u003e","\u003ccode\u003e0.141 m\u003c/code\u003e","\u003ccode\u003e0.200 m\u003c/code\u003e"],"correct":0},{"id":"cv-1bfdl3h117a23d","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q11","label":"Câu 11","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eCho:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eC_gt   = (1.0,2.0,3.0) m\nC_pred = (0.7,2.4,3.0) m\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eLỗi centroid Euclidean bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.5 m\u003c/code\u003e","\u003ccode\u003e0.7 m\u003c/code\u003e","\u003ccode\u003e0.1 m\u003c/code\u003e","\u003ccode\u003e0.25 m\u003c/code\u003e"],"correct":0},{"id":"cv-9h3pae5x6roc","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q12","label":"Câu 12","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột hệ thống báo:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eC_pred_cam  = (0.1,0.2,1.0) m\nC_gt_base   = (1.1,0.2,1.0) m\nT_base_from_cam: R=I, t=(1,0,0) m\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eMuốn tính lỗi centroid 3D đúng, thao tác nào cần thực hiện trước?\u003c/p\u003e\n      \n    ","choices":["Transform \u003ccode\u003eC_pred_cam\u003c/code\u003e sang base frame rồi mới so sánh","Trừ trực tiếp hai centroid vì cả hai đều dùng đơn vị mét","Project cả hai centroid sang pixel rồi lấy sai số depth","Đổi \u003ccode\u003eC_gt_base\u003c/code\u003e từ mét sang pixel rồi mới trừ"],"correct":0},{"id":"cv-9rxlap91z34b","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q13","label":"Câu 13","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột cặp RGB-D được yêu cầu phải aligned và có cùng kích thước. Dữ liệu nhận được:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eRGB shape   = (480,640,3)\nDepth shape = (480,640)\naligned     = True\ndepth_scale = 1000 depth_units/m\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eKết luận nào phù hợp nhất với kiểm tra metadata cơ bản trước khi back-project?\u003c/p\u003e\n      \n    ","choices":["Cặp dữ liệu vượt qua kiểm tra shape/alignment cơ bản","Cặp dữ liệu sai vì RGB phải có shape \u003ccode\u003e(640,480,3)\u003c/code\u003e","Cặp dữ liệu sai vì depth bắt buộc phải có ba channel","Cặp dữ liệu sai vì aligned RGB-D phải dùng cùng dtype"],"correct":0},{"id":"cv-1091t0nml2iif","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q14","label":"Câu 14","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003ePipeline yêu cầu RGB và depth đã aligned pixel-to-pixel. Metadata là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eRGB shape   = (480,640,3)\nDepth shape = (480,640)\naligned     = False\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eHành động nào đúng nhất trước khi lấy màu RGB cho point sinh từ depth pixel?\u003c/p\u003e\n      \n    ","choices":["Thực hiện registration/alignment thích hợp trước khi ghép theo pixel","Dùng ngay cùng chỉ số \u003ccode\u003e[v,u]\u003c/code\u003e vì hai ảnh có cùng shape","Đổi RGB từ \u003ccode\u003euint8\u003c/code\u003e sang \u003ccode\u003efloat32\u003c/code\u003e là đủ","Chỉ cần resize depth về cùng kích thước thêm một lần nữa"],"correct":0},{"id":"cv-1no32r911lfoz3","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q15","label":"Câu 15","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eDepth image lưu bằng millimeter và \u003ccode\u003e0\u003c/code\u003e biểu diễn invalid depth. Tại một pixel, raw depth là \u003ccode\u003e1500\u003c/code\u003e. Với \u003ccode\u003edepth_scale=1000 depth_units/m\u003c/code\u003e, depth metric dùng để back-project là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e1.5 m\u003c/code\u003e","\u003ccode\u003e1500 m\u003c/code\u003e","\u003ccode\u003e0.0015 m\u003c/code\u003e","\u003ccode\u003e15 m\u003c/code\u003e"],"correct":0},{"id":"cv-x1e2c71ooyhm9","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q16","label":"Câu 16","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eDepth map đã aligned với RGB. Quy tắc valid depth là \u003ccode\u003e0.2 \u0026lt;= Z \u0026lt;= 4.0 m\u003c/code\u003e. Bốn pixel có depth metric:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1: 0.0 m\nP2: 0.2 m\nP3: 2.5 m\nP4: 4.2 m\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003ePixel nào hợp lệ để tạo point 3D?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eP2\u003c/code\u003e và \u003ccode\u003eP3\u003c/code\u003e","\u003ccode\u003eP1\u003c/code\u003e và \u003ccode\u003eP2\u003c/code\u003e","\u003ccode\u003eP3\u003c/code\u003e và \u003ccode\u003eP4\u003c/code\u003e","\u003ccode\u003eP1\u003c/code\u003e, \u003ccode\u003eP2\u003c/code\u003e, \u003ccode\u003eP3\u003c/code\u003e"],"correct":0},{"id":"cv-1v14o6d5vb5bh","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q17","label":"Câu 17","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột pipeline tabletop đã cho sẵn các giá trị trung gian:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eDepth pixels hợp lệ: 1000\nSau voxel downsample: 600 points\nPlane inliers: 400 points\nCác điểm phía trên bàn sau lọc chiều cao: 150 points\nDBSCAN:\n  C0 = 80 points\n  C1 = 50 points\n  noise = 20 points\n\nmin_cluster_size = 60\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCluster vật thể nào được giữ?\u003c/p\u003e\n      \n    ","choices":["Chỉ \u003ccode\u003eC0\u003c/code\u003e","Chỉ \u003ccode\u003eC1\u003c/code\u003e","\u003ccode\u003eC0\u003c/code\u003e và \u003ccode\u003eC1\u003c/code\u003e","Không cluster nào"],"correct":0},{"id":"cv-1ml7ai61k3bl92","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q18","label":"Câu 18","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột pipeline xử lý RGB-D aligned theo thứ tự:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e1. Lọc valid depth\n2. Back-project thành point cloud trong camera frame\n3. Loại table plane\n4. Cluster các điểm vật thể\n5. Transform mỗi cluster sang base frame\n6. Tính centroid/AABB trong base frame\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTại sao bước 5 phải xảy ra trước bước tính AABB nếu yêu cầu output AABB trong base frame?\u003c/p\u003e\n      \n    ","choices":["Vì AABB phụ thuộc coordinate frame và orientation của các trục","Vì rigid transform luôn làm thay đổi số lượng point trong cluster","Vì AABB chỉ có thể được tính khi tọa độ point đều dương","Vì camera intrinsics chỉ được định nghĩa trong base frame"],"correct":0},{"id":"cv-fcls6sm4snha","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q19","label":"Câu 19","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột cluster sau khi transform sang base frame có:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eP1 = (1,1,1)\nP2 = (3,1,1)\nP3 = (1,5,2)\nP4 = (3,5,2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCentroid và AABB extent trong base frame là gì?\u003c/p\u003e\n      \n    ","choices":["Centroid \u003ccode\u003e(2,3,1.5)\u003c/code\u003e, extent \u003ccode\u003e(2,4,1)\u003c/code\u003e","Centroid \u003ccode\u003e(2,2,1.5)\u003c/code\u003e, extent \u003ccode\u003e(2,5,2)\u003c/code\u003e","Centroid \u003ccode\u003e(1,3,2)\u003c/code\u003e, extent \u003ccode\u003e(3,4,1)\u003c/code\u003e","Centroid \u003ccode\u003e(2,3,2)\u003c/code\u003e, extent \u003ccode\u003e(2,4,2)\u003c/code\u003e"],"correct":0},{"id":"cv-otwc08ux50g","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-q20","label":"Câu 20","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột pipeline tabletop nhận RGB-D aligned. Các giá trị trung gian đã được xác định:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eIntrinsics:\nfx = fy = 100 px\ncx = cy = 0 px\n\nDepth hợp lệ tại:\npixel A = (u=10,v=0), Z=1.0 m\npixel B = (u=20,v=0), Z=1.0 m\npixel C = (u=10,v=10), Z=1.0 m\npixel D = (u=20,v=10), Z=1.0 m\n\nBack-project:\nX = u*Z/fx\nY = v*Z/fy\n\nT_base_from_cam:\nR = I\nt = (1,2,0) m\n\nBốn điểm tạo thành một cluster duy nhất.\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCentroid của cluster trong base frame là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(1.15,2.05,1.0) m\u003c/code\u003e","\u003ccode\u003e(0.15,0.05,1.0) m\u003c/code\u003e","\u003ccode\u003e(1.05,2.15,1.0) m\u003c/code\u003e","\u003ccode\u003e(1.15,2.10,0.5) m\u003c/code\u003e"],"correct":0},{"id":"cv-11flq6abdkhfa","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq01","label":"Additional Question 1","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eTrong quy ước \u003ccode\u003eT_a_from_b\u003c/code\u003e, ý nghĩa chính xác của ký hiệu này là gì?\u003c/p\u003e\n      \n    ","choices":["Biến đổi tọa độ biểu diễn trong frame b sang frame a","Biến đổi tọa độ biểu diễn trong frame a sang frame b","Chỉ chứa translation từ gốc a đến gốc b","Chỉ chứa rotation từ trục a sang trục b"],"correct":0},{"id":"cv-1bhibqc1qo6foc","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq02","label":"Additional Question 2","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eMột rigid transform 4×4 ở dạng homogeneous thường có cấu trúc nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[[R,t],[0,0,0,1]]\u003c/code\u003e","\u003ccode\u003e[[K,t],[0,0,0,0]]\u003c/code\u003e","\u003ccode\u003e[[R,0],[t,1]]\u003c/code\u003e","\u003ccode\u003e[[K,R],[t,0]]\u003c/code\u003e"],"correct":0},{"id":"cv-r2zwr66ghhpu","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq03","label":"Additional Question 3","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eVới rigid transform \u003ccode\u003eP_a = R P_b + t\u003c/code\u003e, inverse transform dùng để đưa \u003ccode\u003eP_a\u003c/code\u003e trở lại frame b là công thức nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eP_b = Rᵀ(P_a - t)\u003c/code\u003e","\u003ccode\u003eP_b = R(P_a + t)\u003c/code\u003e","\u003ccode\u003eP_b = RᵀP_a + t\u003c/code\u003e","\u003ccode\u003eP_b = R(P_a - t)\u003c/code\u003e"],"correct":0},{"id":"cv-swnuj41i89yfg","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq04","label":"Additional Question 4","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eTrong Open3D, phương thức \u003ccode\u003epcd.transform(T)\u003c/code\u003e được dùng để làm gì?\u003c/p\u003e\n      \n    ","choices":["Áp dụng homogeneous transformation lên geometry của point cloud","Thay đổi camera intrinsics dùng để tạo point cloud","Tính DBSCAN labels cho toàn bộ point cloud","Chuyển depth image từ millimeter thành meter"],"correct":0},{"id":"cv-1nl3uq9jbfnw5","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq05","label":"Additional Question 5","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eKhi truyền ma trận \u003ccode\u003eT\u003c/code\u003e cho \u003ccode\u003epcd.transform(T)\u003c/code\u003e, kích thước thường dùng của homogeneous transform 3D là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e4×4\u003c/code\u003e","\u003ccode\u003e3×3\u003c/code\u003e","\u003ccode\u003e3×4\u003c/code\u003e","\u003ccode\u003e2×3\u003c/code\u003e"],"correct":0},{"id":"cv-14t49uqmfdiv0","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq06","label":"Additional Question 6","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eTrong Open3D, \u003ccode\u003ePointCloud.create_from_rgbd_image(image, intrinsic, extrinsic)\u003c/code\u003e nhận tham số \u003ccode\u003eintrinsic\u003c/code\u003e chủ yếu để cung cấp thông tin nào?\u003c/p\u003e\n      \n    ","choices":["Thông số camera dùng để back-project pixel thành điểm 3D","Ngưỡng khoảng cách dùng để loại radius outlier","Tham số DBSCAN dùng để nhóm point cloud","Ngưỡng RANSAC dùng để segment mặt bàn"],"correct":0},{"id":"cv-1531bng8zqhaw","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq07","label":"Additional Question 7","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eTrong quá trình tạo point cloud từ RGB-D, nếu \u003ccode\u003edepth_scale=1000\u003c/code\u003e và raw depth bằng \u003ccode\u003e2500\u003c/code\u003e, depth metric tương ứng là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e2.5 m\u003c/code\u003e","\u003ccode\u003e2500 m\u003c/code\u003e","\u003ccode\u003e0.0025 m\u003c/code\u003e","\u003ccode\u003e25 m\u003c/code\u003e"],"correct":0},{"id":"cv-pblp971vs0hfl","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq08","label":"Additional Question 8","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eTrong quá trình tạo RGB-D image, tham số \u003ccode\u003edepth_trunc\u003c/code\u003e thường được dùng với mục đích nào?\u003c/p\u003e\n      \n    ","choices":["Loại hoặc truncate depth vượt quá khoảng cách được cấu hình","Đặt số cluster tối đa cho point cloud đầu ra","Đặt số channel tối đa của RGB image","Đặt kích thước voxel dùng để giảm số point"],"correct":0},{"id":"cv-cocm2h124wvlh","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq09","label":"Additional Question 9","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eNếu \u003ccode\u003edepth_trunc=3.0 m\u003c/code\u003e, một pixel có depth metric \u003ccode\u003e5.0 m\u003c/code\u003e nằm ngoài phạm vi depth được giữ theo ngưỡng này. Ý nghĩa phù hợp nhất là gì?\u003c/p\u003e\n      \n    ","choices":["Pixel đó không nên tạo một point 3D hợp lệ ở depth 5 m","Pixel đó được tự động đổi thành point ở depth 3 m","Pixel đó được giữ nguyên vì depth_trunc chỉ tác động RGB","Pixel đó được đổi từ 5 m thành 5000 m trước back-project"],"correct":0},{"id":"cv-1t5krfz1gq8mbj","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq10","label":"Additional Question 10","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eKhi tạo \u003ccode\u003eRGBDImage\u003c/code\u003e, tham số liên quan đến việc có chuyển ảnh màu thành intensity hay giữ thông tin màu cần được kiểm tra vì lý do nào?\u003c/p\u003e\n      \n    ","choices":["Nó ảnh hưởng dữ liệu color được lưu trong RGB-D representation","Nó thay đổi trực tiếp camera extrinsics của point cloud","Nó quyết định số cluster được tạo bởi DBSCAN","Nó thay đổi trực tiếp kích thước voxel của point cloud"],"correct":0},{"id":"cv-hx4ff3feasuf","chapter":"8","topic":"Phần 8 — Đổi frame và pipeline tabletop","source":{"id":"cv-p08-aq11","label":"Additional Question 11","batch":"cv-p08"},"html":"\n      \n      \u003cp\u003eKhi project một điểm camera \u003ccode\u003e(X,Y,Z)\u003c/code\u003e bằng pinhole model, điều kiện nào cần
