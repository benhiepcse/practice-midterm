003e trả toàn bộ dataset.","\u003ccode\u003e__len__()\u003c/code\u003e trả số mẫu; \u003ccode\u003e__getitem__()\u003c/code\u003e trả mẫu tại chỉ số được yêu cầu.","\u003ccode\u003e__len__()\u003c/code\u003e trả batch size; \u003ccode\u003e__getitem__()\u003c/code\u003e tự xáo trộn các mẫu.","\u003ccode\u003e__len__()\u003c/code\u003e trả số feature; \u003ccode\u003e__getitem__()\u003c/code\u003e tạo optimizer cho một mẫu."],"correct":1},{"id":"dl-10tca6ymug96y","chapter":"6","topic":"Phần 6 — Dataset và mini-batch","source":{"id":"dl-p06-q03","label":"Câu 3","batch":"dl-p06"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eTensorDataset\u003c/code\u003e dưới đây. Giá trị của \u003ccode\u003elen(dataset)\u003c/code\u003e và cặp tensor tại \u003ccode\u003edataset[3]\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\nfrom torch.utils.data import TensorDataset\n\nX = torch.tensor(\n    [[10., 11.],\n     [20., 21.],\n     [30., 31.],\n     [40., 41.],\n     [50., 51.]],\n    dtype=torch.float32\n)\n\ny = torch.tensor(\n    [0, 1, 0, 2, 1],\n    dtype=torch.long\n)\n\ndataset = TensorDataset(X, y)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e5\u003c/code\u003e và \u003ccode\u003e([30.,31.], 0)\u003c/code\u003e","\u003ccode\u003e5\u003c/code\u003e và \u003ccode\u003e([40.,41.], 2)\u003c/code\u003e","\u003ccode\u003e10\u003c/code\u003e và \u003ccode\u003e([40.,41.], 2)\u003c/code\u003e","\u003ccode\u003e10\u003c/code\u003e và \u003ccode\u003e([50.,51.], 1)\u003c/code\u003e"],"correct":1},{"id":"dl-1ht6esu23qffs","chapter":"6","topic":"Phần 6 — Dataset và mini-batch","source":{"id":"dl-p06-q04","label":"Câu 4","batch":"dl-p06"},"html":"\n      \n      \u003cp\u003eDataset có 10 mẫu. \u003ccode\u003eDataLoader\u003c/code\u003e dùng \u003ccode\u003ebatch_size=4\u003c/code\u003e, \u003ccode\u003eshuffle=False\u003c/code\u003e và \u003ccode\u003edrop_last=False\u003c/code\u003e. Có bao nhiêu mini-batch và kích thước từng batch là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\nfrom torch.utils.data import TensorDataset, DataLoader\n\nX = torch.arange(\n    20,\n    dtype=torch.float32\n).reshape(10, 2)\n\ny = torch.arange(\n    10,\n    dtype=torch.long\n)\n\ndataset = TensorDataset(X, y)\n\nloader = DataLoader(\n    dataset,\n    batch_size=4,\n    shuffle=False,\n    drop_last=False\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["2 batch với kích thước \u003ccode\u003e4, 4\u003c/code\u003e","3 batch với kích thước \u003ccode\u003e4, 4, 2\u003c/code\u003e","3 batch với kích thước \u003ccode\u003e4, 3, 3\u003c/code\u003e","4 batch với kích thước \u003ccode\u003e4, 2, 2, 2\u003c/code\u003e"],"correct":1},{"id":"dl-14f1l4m1pshb10","chapter":"6","topic":"Phần 6 — Dataset và mini-batch","source":{"id":"dl-p06-q05","label":"Câu 5","batch":"dl-p06"},"html":"\n      \n      \u003cp\u003eDataset có 17 mẫu. \u003ccode\u003eDataLoader\u003c/code\u003e dùng \u003ccode\u003ebatch_size=5\u003c/code\u003e, \u003ccode\u003eshuffle=False\u003c/code\u003e và \u003ccode\u003edrop_last=False\u003c/code\u003e. Giá trị của \u003ccode\u003elen(loader)\u003c/code\u003e và batch size cuối cùng là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom torch.utils.data import DataLoader\n\nloader = DataLoader(\n    dataset,\n    batch_size=5,\n    shuffle=False,\n    drop_last=False\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003elen(loader)=3\u003c/code\u003e, batch cuối có \u003ccode\u003e2\u003c/code\u003e mẫu","\u003ccode\u003elen(loader)=4\u003c/code\u003e, batch cuối có \u003ccode\u003e2\u003c/code\u003e mẫu","\u003ccode\u003elen(loader)=4\u003c/code\u003e, batch cuối có \u003ccode\u003e5\u003c/code\u003e mẫu","\u003ccode\u003elen(loader)=5\u003c/code\u003e, batch cuối có \u003ccode\u003e2\u003c/code\u003e mẫu"],"correct":1},{"id":"dl-s0pm0712mky3v","chapter":"6","topic":"Phần 6 — Dataset và mini-batch","source":{"id":"dl-p06-q06","label":"Câu 6","batch":"dl-p06"},"html":"\n      \n      \u003cp\u003eDataset có 17 mẫu. \u003ccode\u003eDataLoader\u003c/code\u003e dùng \u003ccode\u003ebatch_size=5\u003c/code\u003e, \u003ccode\u003eshuffle=False\u003c/code\u003e và \u003ccode\u003edrop_last=True\u003c/code\u003e. Có bao nhiêu batch được trả về và tổng cộng bao nhiêu mẫu được sử dụng trong một lượt duyệt loader?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom torch.utils.data import DataLoader\n\nloader = DataLoader(\n    dataset,\n    batch_size=5,\n    shuffle=False,\n    drop_last=True\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["3 batch và 15 mẫu","3 batch và 17 mẫu","4 batch và 15 mẫu","4 batch và 17 mẫu"],"correct":0},{"id":"dl-1jo55y41cufa9c","chapter":"6","topic":"Phần 6 — Dataset và mini-batch","source":{"id":"dl-p06-q07","label":"Câu 7","batch":"dl-p06"},"html":"\n      \n      \u003cp\u003eCho dataset gồm 8 mẫu, mỗi feature có shape \u003ccode\u003e(3, 4)\u003c/code\u003e. \u003ccode\u003eDataLoader\u003c/code\u003e dùng \u003ccode\u003ebatch_size=3\u003c/code\u003e, \u003ccode\u003eshuffle=False\u003c/code\u003e và \u003ccode\u003edrop_last=False\u003c/code\u003e. Shape của feature và label trong batch đầu tiên là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\nfrom torch.utils.data import TensorDataset, DataLoader\n\nX = torch.zeros(\n    (8, 3, 4),\n    dtype=torch.float32\n)\n\ny = torch.arange(\n    8,\n    dtype=torch.long\n)\n\ndataset = TensorDataset(X, y)\n\nloader = DataLoader(\n    dataset,\n    batch_size=3,\n    shuffle=False,\n    drop_last=False\n)\n\nxb, yb = next(iter(loader))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003exb: (3,3,4)\u003c/code\u003e, \u003ccode\u003eyb: (3,)\u003c/code\u003e","\u003ccode\u003exb: (8,3,4)\u003c/code\u003e, \u003ccode\u003eyb: (8,)\u003c/code\u003e","\u003ccode\u003exb: (3,4)\u003c/code\u003e, \u003ccode\u003eyb: (3,1)\u003c/code\u003e","\u003ccode\u003exb: (3,8,4)\u003c/code\u003e, \u003ccode\u003eyb: (3,)\u003c/code\u003e"],"correct":0},{"id":"dl-12ysn31lhtq87","chapter":"6","topic":"Phần 6 — Dataset và mini-batch","source":{"id":"dl-p06-q08","label":"Câu 8","batch":"dl-p06"},"html":"\n      \n      \u003cp\u003eCho dataset và loader dưới đây với \u003ccode\u003eshuffle=False\u003c/code\u003e. Giá trị của \u003ccode\u003eyb\u003c/code\u003e trong batch thứ hai là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\nfrom torch.utils.data import TensorDataset, DataLoader\n\nX = torch.tensor(\n    [[10.], [20.], [30.],\n     [40.], [50.], [60.],\n     [70.]],\n    dtype=torch.float32\n)\n\ny = torch.tensor(\n    [0, 1, 2, 3, 4, 5, 6],\n    dtype=torch.long\n)\n\ndataset = TensorDataset(X, y)\n\nloader = DataLoader(\n    dataset,\n    batch_size=3,\n    shuffle=False\n)\n\nit = iter(loader)\nfirst_x, first_y = next(it)\nsecond_x, second_y = next(it)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0, 1, 2]\u003c/code\u003e","\u003ccode\u003e[2, 3, 4]\u003c/code\u003e","\u003ccode\u003e[3, 4, 5]\u003c/code\u003e","\u003ccode\u003e[4, 5, 6]\u003c/code\u003e"],"correct":2},{"id":"dl-180xfquiyvny0","chapter":"6","topic":"Phần 6 — Dataset và mini-batch","source":{"id":"dl-p06-q09","label":"Câu 9","batch":"dl-p06"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eDataLoader\u003c/code\u003e dưới đây với \u003ccode\u003eshuffle=True\u003c/code\u003e và không cố định generator hoặc sampler. Phát biểu nào đúng về batch đầu tiên?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom torch.utils.data import DataLoader\n\nloader = DataLoader(\n    dataset,\n    batch_size=4,\n    shuffle=True\n)\n\nxb, yb = next(iter(loader))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Batch đầu luôn chứa bốn mẫu có index \u003ccode\u003e0,1,2,3\u003c/code\u003e.","Batch đầu luôn chứa bốn mẫu có index lớn nhất trong dataset.","Không thể suy ra chính xác thứ tự mẫu của batch chỉ từ đoạn code này.","\u003ccode\u003eshuffle=True\u003c/code\u003e chỉ đổi thứ tự feature nhưng giữ nguyên thứ tự label."],"correct":2},{"id":"dl-fb5yfz4dgq5d","chapter":"6","topic":"Phần 6 — Dataset và mini-batch","source":{"id":"dl-p06-q10","label":"Câu 10","batch":"dl-p06"},"html":"\n      \n      \u003cp\u003eCustom \u003ccode\u003eDataset\u003c/code\u003e dưới đây có bao nhiêu mẫu, và \u003ccode\u003edataset[1]\u003c/code\u003e trả về gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\nfrom torch.utils.data import Dataset\n\nclass PairDataset(Dataset):\n    def __init__(self):\n        self.features = torch.tensor(\n            [[2., 4.],\n             [6., 8.],\n             [10., 12.]],\n            dtype=torch.float32\n        )\n        self.labels = torch.tensor(\n            [1, 0, 2],\n            dtype=torch.long\n        )\n\n    def __len__(self):\n        return self.features.shape[0]\n\n    def __getitem__(self, idx):\n        return {\n            \"x\": self.features[idx],\n            \"y\": self.labels[idx]\n        }\n\ndataset = PairDataset()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["3 mẫu; \u003ccode\u003e{\"x\": [6.,8.], \"y\": 0}\u003c/code\u003e","3 mẫu; \u003ccode\u003e{\"x\": [2.,4.], \"y\": 1}\u003c/code\u003e","2 mẫu; \u003ccode\u003e{\"x\": [6.,8.], \"y\": 0}\u003c/code\u003e","2 mẫu; \u003ccode\u003e{\"x\": [10.,12.], \"y\": 2}\u003c/code\u003e"],"correct":0},{"id":"dl-1rziiw2g9d3vg","chapter":"6","topic":"Phần 6 — Dataset và mini-batch","source":{"id":"dl-p06-q11","label":"Câu 11","batch":"dl-p06"},"html":"\n      \n      \u003cp\u003eDataset có 13 mẫu. Với \u003ccode\u003ebatch_size=4\u003c/code\u003e, \u003ccode\u003eshuffle=False\u003c/code\u003e và \u003ccode\u003edrop_last=False\u003c/code\u003e, batch cuối cùng chứa bao nhiêu mẫu? Nếu mỗi feature có shape \u003ccode\u003e(5,)\u003c/code\u003e, shape feature của batch cuối là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\nfrom torch.utils.data import TensorDataset, DataLoader\n\nX = torch.zeros(\n    (13, 5),\n    dtype=torch.float32\n)\n\ny = torch.zeros(\n    (13,),\n    dtype=torch.long\n)\n\ndataset = TensorDataset(X, y)\n\nloader = DataLoader(\n    dataset,\n    batch_size=4,\n    shuffle=False,\n    drop_last=False\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["1 mẫu, shape \u003ccode\u003e(1,5)\u003c/code\u003e","1 mẫu, shape \u003ccode\u003e(5,)\u003c/code\u003e","4 mẫu, shape \u003ccode\u003e(4,5)\u003c/code\u003e","5 mẫu, shape \u003ccode\u003e(1,5)\u003c/code\u003e"],"correct":0},{"id":"dl-16mwqhbkqrvsv","chapter":"6","topic":"Phần 6 — Dataset và mini-batch","source":{"id":"dl-p06-q12","label":"Câu 12","batch":"dl-p06"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eX\u003c/code\u003e có 9 mẫu và \u003ccode\u003ey\u003c/code\u003e có 9 nhãn. Muốn tạo các mini-batch tối đa 4 mẫu, giữ nguyên thứ tự dataset và vẫn giữ batch cuối chưa đủ kích thước, đoạn code nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eDataLoader(TensorDataset(X, y), batch_size=4, shuffle=False, drop_last=False)\u003c/code\u003e","\u003ccode\u003eDataLoader(TensorDataset(X, y), batch_size=4, shuffle=True, drop_last=False)\u003c/code\u003e","\u003ccode\u003eDataLoader(TensorDataset(X, y), batch_size=4, shuffle=False, drop_last=True)\u003c/code\u003e","\u003ccode\u003eDataLoader(TensorDataset(X, y), batch_size=9, shuffle=False, drop_last=False)\u003c/code\u003e"],"correct":0},{"id":"dl-xacu151fg5m95","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q01","label":"Câu 1","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eTrong một train step thông thường, thứ tự nào dưới đây đúng khi muốn xóa gradient cũ trước khi tính gradient của mini-batch hiện tại?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003ezero_grad → forward → loss → backward → step\u003c/code\u003e","\u003ccode\u003eforward → zero_grad → loss → step → backward\u003c/code\u003e","\u003ccode\u003ezero_grad → backward → forward → loss → step\u003c/code\u003e","\u003ccode\u003eforward → loss → step → zero_grad → backward\u003c/code\u003e"],"correct":0},{"id":"dl-1rw1j0vczb5eh","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q02","label":"Câu 2","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eĐoạn code nào thực hiện đúng một train step với \u003ccode\u003eoptimizer\u003c/code\u003e đã được tạo từ \u003ccode\u003emodel.parameters()\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003eoptimizer.zero_grad()\npred = model(X)\nloss = loss_fn(pred, y)\nloss.backward()\noptimizer.step()\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eoptimizer.zero_grad()\npred = model(X)\nloss = loss_fn(pred, y)\noptimizer.step()\nloss.backward()\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003epred = model(X)\noptimizer.step()\nloss = loss_fn(pred, y)\noptimizer.zero_grad()\nloss.backward()\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eloss = loss_fn(model(X), y)\noptimizer.zero_grad()\noptimizer.step()\nloss.backward()\u003c/code\u003e\u003c/pre\u003e"],"correct":0},{"id":"dl-c6jnlx13k4p0v","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q03","label":"Câu 3","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eXét tham số scalar \u003ccode\u003ew\u003c/code\u003e. Trước train step, \u003ccode\u003ew=2\u003c/code\u003e. Với input \u003ccode\u003ex=3\u003c/code\u003e, target \u003ccode\u003ey=0\u003c/code\u003e, loss là \u003ccode\u003e(wx-y)²\u003c/code\u003e và SGD có \u003ccode\u003elr=0.1\u003c/code\u003e. Giá trị của \u003ccode\u003ew\u003c/code\u003e sau một train step là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\n\nw = torch.tensor(\n    2.0,\n    dtype=torch.float32,\n    requires_grad=True\n)\n\noptimizer = torch.optim.SGD(\n    [w],\n    lr=0.1\n)\n\nx = torch.tensor(3.0)\ny = torch.tensor(0.0)\n\noptimizer.zero_grad()\npred = w * x\nloss = (pred - y) ** 2\nloss.backward()\noptimizer.step()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-1.6\u003c/code\u003e","\u003ccode\u003e0.2\u003c/code\u003e","\u003ccode\u003e1.4\u003c/code\u003e","\u003ccode\u003e5.6\u003c/code\u003e"],"correct":0},{"id":"dl-10lv57n1rga1wl","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q04","label":"Câu 4","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eTrong đoạn code sau, trước khi gọi \u003ccode\u003eloss.backward()\u003c/code\u003e, \u003ccode\u003ew.grad\u003c/code\u003e đang chứa gradient cũ bằng \u003ccode\u003e5\u003c/code\u003e. Gradient mới của mini-batch hiện tại là \u003ccode\u003e3\u003c/code\u003e. Nếu bỏ \u003ccode\u003eoptimizer.zero_grad()\u003c/code\u003e, giá trị trong \u003ccode\u003ew.grad\u003c/code\u003e sau \u003ccode\u003ebackward()\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew.grad = torch.tensor(5.0)\n\n# Gradient của loss hiện tại theo w là 3.0\nloss.backward()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e3.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e8.0\u003c/code\u003e"],"correct":3},{"id":"dl-108dtrnw97maj","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q05","label":"Câu 5","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eMột epoch có ba mini-batch với batch size lần lượt là \u003ccode\u003e4, 4, 2\u003c/code\u003e. Loss của từng batch là mean loss trên các mẫu trong batch và lần lượt bằng \u003ccode\u003e0.5, 1.0, 2.0\u003c/code\u003e. Mean loss đúng trên toàn bộ 10 mẫu là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebatch_sizes = [4, 4, 2]\nbatch_mean_losses = [0.5, 1.0, 2.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.875\u003c/code\u003e","\u003ccode\u003e1.000\u003c/code\u003e","\u003ccode\u003e1.125\u003c/code\u003e","\u003ccode\u003e1.167\u003c/code\u003e"],"correct":1},{"id":"dl-1d5zzuh1nzcfg9","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q06","label":"Câu 6","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eMột epoch có ba batch với kích thước \u003ccode\u003e8, 8, 4\u003c/code\u003e. Mean loss của từng batch lần lượt là \u003ccode\u003e0.2, 0.4, 1.0\u003c/code\u003e. Biểu thức nào tính đúng mean loss trên toàn bộ dataset?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0.2 + 0.4 + 1.0) / 3\u003c/code\u003e","\u003ccode\u003e(0.2*8 + 0.4*8 + 1.0*4) / 20\u003c/code\u003e","\u003ccode\u003e(0.2*8 + 0.4*8 + 1.0*4) / 3\u003c/code\u003e","\u003ccode\u003e(0.2 + 0.4 + 1.0) / 20\u003c/code\u003e"],"correct":1},{"id":"dl-yznvpbqqjzj5","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q07","label":"Câu 7","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eĐoạn code sau tính epoch loss. Mỗi \u003ccode\u003eloss\u003c/code\u003e là mean loss của mini-batch hiện tại. Dataset có thể có batch cuối nhỏ hơn các batch khác. Thay dòng \u003ccode\u003e???\u003c/code\u003e bằng lựa chọn nào để tính đúng mean loss trên từng mẫu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etotal_loss = 0.0\ntotal_samples = 0\n\nfor X, y in loader:\n    pred = model(X)\n    loss = loss_fn(pred, y)\n\n    ???\n    total_samples += X.size(0)\n\nepoch_loss = total_loss / total_samples\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003etotal_loss += loss.item()\u003c/code\u003e","\u003ccode\u003etotal_loss += loss.item() * X.size(0)\u003c/code\u003e","\u003ccode\u003etotal_loss += loss.item() / X.size(0)\u003c/code\u003e","\u003ccode\u003etotal_loss = loss.item() * total_samples\u003c/code\u003e"],"correct":1},{"id":"dl-ofw47r7579kj","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q08","label":"Câu 8","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eMột dataset có 9 mẫu, chia thành các batch kích thước \u003ccode\u003e4, 4, 1\u003c/code\u003e. Mean loss của ba batch là \u003ccode\u003e0.25, 0.50, 2.00\u003c/code\u003e. Nếu tính sai bằng trung bình không trọng số của ba batch loss, kết quả là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.5556\u003c/code\u003e","\u003ccode\u003e0.7500\u003c/code\u003e","\u003ccode\u003e0.9167\u003c/code\u003e","\u003ccode\u003e1.2500\u003c/code\u003e"],"correct":2},{"id":"dl-13uniqnye5vpd","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q09","label":"Câu 9","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eVới dữ kiện dưới đây, mean loss đúng trên toàn bộ 9 mẫu là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebatch_sizes = [4, 4, 1]\nbatch_mean_losses = [0.25, 0.50, 2.00]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.5000\u003c/code\u003e","\u003ccode\u003e0.5556\u003c/code\u003e","\u003ccode\u003e0.7500\u003c/code\u003e","\u003ccode\u003e0.9167\u003c/code\u003e"],"correct":1},{"id":"dl-9ozo7o3jlmfu","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q10","label":"Câu 10","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eĐoạn code nào phù hợp nhất cho validation khi chỉ cần forward pass và tính loss, không cập nhật tham số?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003emodel.train()\nfor X, y in val_loader:\n    optimizer.zero_grad()\n    pred = model(X)\n    loss = loss_fn(pred, y)\n    loss.backward()\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003emodel.eval()\nwith torch.no_grad():\n    for X, y in val_loader:\n        pred = model(X)\n        loss = loss_fn(pred, y)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003emodel.eval()\nfor X, y in val_loader:\n    pred = model(X)\n    loss = loss_fn(pred, y)\n    loss.backward()\n    optimizer.step()\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003emodel.train()\nwith torch.no_grad():\n    for X, y in val_loader:\n        pred = model(X)\n        loss = loss_fn(pred, y)\n        optimizer.step()\u003c/code\u003e\u003c/pre\u003e"],"correct":1},{"id":"dl-1cqikie1c7wph8","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q11","label":"Câu 11","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003ePhát biểu nào mô tả đúng sự khác nhau giữa \u003ccode\u003emodel.eval()\u003c/code\u003e và \u003ccode\u003etorch.no_grad()\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eeval()\u003c/code\u003e đổi hành vi của một số layer; \u003ccode\u003eno_grad()\u003c/code\u003e tắt ghi graph gradient trong block.","\u003ccode\u003eeval()\u003c/code\u003e tắt Autograd hoàn toàn; \u003ccode\u003eno_grad()\u003c/code\u003e chuyển Dropout sang evaluation mode.","\u003ccode\u003eeval()\u003c/code\u003e xóa gradient hiện có; \u003ccode\u003eno_grad()\u003c/code\u003e đặt toàn bộ parameter thành hằng số vĩnh viễn.","\u003ccode\u003eeval()\u003c/code\u003e và \u003ccode\u003eno_grad()\u003c/code\u003e luôn có cùng tác dụng và có thể thay thế hoàn toàn cho nhau."],"correct":0},{"id":"dl-97ent58ea0rh","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q12","label":"Câu 12","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eModel có Dropout hoặc BatchNorm. Đoạn code chỉ gọi \u003ccode\u003etorch.no_grad()\u003c/code\u003e nhưng không gọi \u003ccode\u003emodel.eval()\u003c/code\u003e. Nếu model trước đó vẫn ở training mode, phát biểu nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ewith torch.no_grad():\n    pred = model(X)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Model tự động chuyển sang evaluation mode khi vào \u003ccode\u003eno_grad()\u003c/code\u003e.","Không tạo graph gradient, nhưng model vẫn giữ training mode hiện tại.","Autograd vẫn tạo graph, nhưng Dropout và BatchNorm chuyển sang evaluation mode.","Toàn bộ parameter bị đặt \u003ccode\u003erequires_grad=False\u003c/code\u003e sau khi rời block."],"correct":1},{"id":"dl-107xpbh7dyjg3","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q13","label":"Câu 13","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eModel đang ở evaluation mode. Đoạn code sau được chạy mà không dùng \u003ccode\u003etorch.no_grad()\u003c/code\u003e. Parameter vẫn có \u003ccode\u003erequires_grad=True\u003c/code\u003e. Phát biểu nào đúng về \u003ccode\u003eloss\u003c/code\u003e?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emodel.eval()\n\npred = model(X)\nloss = loss_fn(pred, y)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eloss\u003c/code\u003e không thể có graph vì \u003ccode\u003eeval()\u003c/code\u003e tắt Autograd.","\u003ccode\u003eloss\u003c/code\u003e vẫn có thể theo dõi graph vì \u003ccode\u003eeval()\u003c/code\u003e không tắt Autograd.","\u003ccode\u003eeval()\u003c/code\u003e tự động gọi \u003ccode\u003edetach()\u003c/code\u003e trên mọi output của model.","\u003ccode\u003eeval()\u003c/code\u003e tự động đặt \u003ccode\u003erequires_grad=False\u003c/code\u003e cho mọi parameter."],"correct":1},{"id":"dl-1rj1e1h12jn0pl","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q14","label":"Câu 14","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eValidation loop dưới đây không gọi \u003ccode\u003ebackward()\u003c/code\u003e và không gọi \u003ccode\u003eoptimizer.step()\u003c/code\u003e. Giá trị parameter \u003ccode\u003ew\u003c/code\u003e trước validation là \u003ccode\u003e2.5\u003c/code\u003e. Bỏ qua mọi thay đổi buffer không phải parameter. Giá trị \u003ccode\u003ew\u003c/code\u003e sau validation là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emodel.eval()\n\nwith torch.no_grad():\n    for X, y in val_loader:\n        pred = model(X)\n        loss = loss_fn(pred, y)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e","Không xác định vì validation luôn cập nhật parameter."],"correct":2},{"id":"dl-t901o51snevbj","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q15","label":"Câu 15","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eCho validation gồm hai batch. Batch thứ nhất có 3 mẫu với mean loss \u003ccode\u003e0.4\u003c/code\u003e; batch thứ hai có 1 mẫu với mean loss \u003ccode\u003e1.6\u003c/code\u003e. Mean validation loss đúng trên toàn bộ 4 mẫu là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebatch_sizes = [3, 1]\nbatch_mean_losses = [0.4, 1.6]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.4\u003c/code\u003e","\u003ccode\u003e0.7\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e1.6\u003c/code\u003e"],"correct":1},{"id":"dl-1oa5udk1m99jig","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q16","label":"Câu 16","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eTrong validation loop dưới đây, \u003ccode\u003eloss_fn\u003c/code\u003e trả mean loss của từng batch. Lựa chọn nào thay cho \u003ccode\u003e???\u003c/code\u003e để cuối cùng \u003ccode\u003eval_loss\u003c/code\u003e là mean loss trên từng mẫu của toàn validation set?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emodel.eval()\n\ntotal_loss = 0.0\ntotal_samples = 0\n\nwith torch.no_grad():\n    for X, y in val_loader:\n        pred = model(X)\n        loss = loss_fn(pred, y)\n\n        total_loss += loss.item() * X.size(0)\n        total_samples += X.size(0)\n\nval_loss = ???\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003etotal_loss / len(val_loader)\u003c/code\u003e","\u003ccode\u003etotal_loss / total_samples\u003c/code\u003e","\u003ccode\u003etotal_loss * total_samples\u003c/code\u003e","\u003ccode\u003etotal_loss / X.size(0)\u003c/code\u003e"],"correct":1},{"id":"dl-hq9h4p1323tup","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q17","label":"Câu 17","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eXét hai mini-batch liên tiếp. Gradient của \u003ccode\u003ew\u003c/code\u003e ở batch 1 là \u003ccode\u003e2\u003c/code\u003e, gradient ở batch 2 là \u003ccode\u003e3\u003c/code\u003e. Giả sử SGD có \u003ccode\u003elr=0.1\u003c/code\u003e và \u003ccode\u003ew\u003c/code\u003e ban đầu bằng \u003ccode\u003e1.0\u003c/code\u003e. Mỗi batch đều gọi \u003ccode\u003eoptimizer.zero_grad()\u003c/code\u003e trước forward. Bỏ qua mọi yếu tố khác. Giá trị \u003ccode\u003ew\u003c/code\u003e sau hai batch là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e# Batch 1\noptimizer.zero_grad()\n# gradient hiện tại: 2\noptimizer.step()\n\n# Batch 2\noptimizer.zero_grad()\n# gradient hiện tại: 3\noptimizer.step()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.2\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e0.7\u003c/code\u003e","\u003ccode\u003e1.5\u003c/code\u003e"],"correct":1},{"id":"dl-8yizuo1y6zmt6","chapter":"7","topic":"Phần 7 — Train step, epoch loss và evaluation","source":{"id":"dl-p07-q18","label":"Câu 18","batch":"dl-p07"},"html":"\n      \n      \u003cp\u003eMột epoch train có ba batch với batch size \u003ccode\u003e4, 4, 2\u003c/code\u003e và mean loss tương ứng \u003ccode\u003e0.8, 0.5, 1.1\u003c/code\u003e. Validation có hai batch với batch size \u003ccode\u003e3, 2\u003c/code\u003e và mean loss tương ứng \u003ccode\u003e0.6, 0.9\u003c/code\u003e. Cặp \u003ccode\u003e(train_loss, val_loss)\u003c/code\u003e tính theo từng mẫu là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrain_sizes = [4, 4, 2]\ntrain_losses = [0.8, 0.5, 1.1]\n\nval_sizes = [3, 2]\nval_losses = [0.6, 0.9]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(0.700, 0.720)\u003c/code\u003e","\u003ccode\u003e(0.740, 0.750)\u003c/code\u003e","\u003ccode\u003e(0.800, 0.720)\u003c/code\u003e","\u003ccode\u003e(0.800, 0.750)\u003c/code\u003e"],"correct":1},{"id":"dl-4f7lbw1nirqmq","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q01","label":"Câu 1","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eCho SGD không momentum với công thức \u003ccode\u003ew_new = w_old - lr * g\u003c/code\u003e. Với \u003ccode\u003ew=3.0\u003c/code\u003e, gradient \u003ccode\u003eg=2.0\u003c/code\u003e và \u003ccode\u003elr=0.1\u003c/code\u003e, giá trị mới của \u003ccode\u003ew\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = 3.0\ng = 2.0\nlr = 0.1\n\nw_new = w - lr * g\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2.8\u003c/code\u003e","\u003ccode\u003e2.9\u003c/code\u003e","\u003ccode\u003e3.1\u003c/code\u003e","\u003ccode\u003e3.2\u003c/code\u003e"],"correct":0},{"id":"dl-1h9ryibpiih6v","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q02","label":"Câu 2","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eCho SGD không momentum với \u003ccode\u003ew=-1.0\u003c/code\u003e, gradient \u003ccode\u003eg=-4.0\u003c/code\u003e và \u003ccode\u003elr=0.05\u003c/code\u003e. Theo công thức \u003ccode\u003ew_new = w - lr * g\u003c/code\u003e, giá trị mới của \u003ccode\u003ew\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = -1.0\ng = -4.0\nlr = 0.05\n\nw_new = w - lr * g\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-1.20\u003c/code\u003e","\u003ccode\u003e-1.05\u003c/code\u003e","\u003ccode\u003e-0.80\u003c/code\u003e","\u003ccode\u003e-0.60\u003c/code\u003e"],"correct":2},{"id":"dl-m7ads61twhtqc","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q03","label":"Câu 3","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eCho vector parameter và gradient dưới đây. SGD không momentum dùng \u003ccode\u003elr=0.2\u003c/code\u003e. Vector parameter sau một bước cập nhật là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\n\nw = torch.tensor(\n    [2.0, -1.0, 3.0],\n    dtype=torch.float32\n)\n\ng = torch.tensor(\n    [0.5, -2.0, 1.0],\n    dtype=torch.float32\n)\n\nlr = 0.2\n\nw_new = w - lr * g\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1.9, -1.4, 2.8]\u003c/code\u003e","\u003ccode\u003e[2.1, -0.6, 3.2]\u003c/code\u003e","\u003ccode\u003e[1.5, 1.0, 2.0]\u003c/code\u003e","\u003ccode\u003e[1.9, -0.6, 2.8]\u003c/code\u003e"],"correct":3},{"id":"dl-1ow0o20yqunu6","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q04","label":"Câu 4","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eSGD không momentum dùng công thức \u003ccode\u003ew_new = w - lr * g\u003c/code\u003e. Nếu gradient \u003ccode\u003eg\u003c/code\u003e là số dương và \u003ccode\u003elr \u0026gt; 0\u003c/code\u003e, điều gì xảy ra với parameter \u003ccode\u003ew\u003c/code\u003e sau một bước cập nhật?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003ew\u003c/code\u003e tăng vì optimizer đi cùng chiều gradient.","\u003ccode\u003ew\u003c/code\u003e giảm vì optimizer đi ngược chiều gradient.","\u003ccode\u003ew\u003c/code\u003e luôn trở thành \u003ccode\u003e0\u003c/code\u003e sau một bước.","\u003ccode\u003ew\u003c/code\u003e không đổi vì gradient dương bị bỏ qua."],"correct":1},{"id":"dl-qtmmclmph4qn","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q05","label":"Câu 5","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eXét quy ước momentum sau: \u003ccode\u003ev_t = μv_(t-1) + g_t\u003c/code\u003e và \u003ccode\u003ew_t = w_(t-1) - lr*v_t\u003c/code\u003e. Cho \u003ccode\u003ew_0=5.0\u003c/code\u003e, \u003ccode\u003ev_0=0\u003c/code\u003e, \u003ccode\u003eμ=0.9\u003c/code\u003e, \u003ccode\u003elr=0.1\u003c/code\u003e và gradient bước đầu \u003ccode\u003eg_1=2.0\u003c/code\u003e. Cặp \u003ccode\u003e(v_1, w_1)\u003c/code\u003e là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0.2, 4.98)\u003c/code\u003e","\u003ccode\u003e(1.8, 4.82)\u003c/code\u003e","\u003ccode\u003e(2.0, 4.80)\u003c/code\u003e","\u003ccode\u003e(2.9, 4.71)\u003c/code\u003e"],"correct":2},{"id":"dl-1qn0tpx1cm3c7p","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q06","label":"Câu 6","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eDùng đúng quy ước \u003ccode\u003ev_t = μv_(t-1) + g_t\u003c/code\u003e, \u003ccode\u003ew_t = w_(t-1) - lr*v_t\u003c/code\u003e. Cho \u003ccode\u003ew_0=4.0\u003c/code\u003e, \u003ccode\u003ev_0=0\u003c/code\u003e, \u003ccode\u003eμ=0.5\u003c/code\u003e, \u003ccode\u003elr=0.1\u003c/code\u003e, \u003ccode\u003eg_1=2.0\u003c/code\u003e và \u003ccode\u003eg_2=2.0\u003c/code\u003e. Giá trị \u003ccode\u003ew_2\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e# Bước 1\nv1 = 0.5 * 0.0 + 2.0\nw1 = 4.0 - 0.1 * v1\n\n# Bước 2\nv2 = 0.5 * v1 + 2.0\nw2 = w1 - 0.1 * v2\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e3.40\u003c/code\u003e","\u003ccode\u003e3.50\u003c/code\u003e","\u003ccode\u003e3.60\u003c/code\u003e","\u003ccode\u003e3.70\u003c/code\u003e"],"correct":1},{"id":"dl-10zkq9t2zdozr","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q07","label":"Câu 7","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eDùng công thức momentum \u003ccode\u003ev_t = μv_(t-1) + g_t\u003c/code\u003e và \u003ccode\u003ew_t = w_(t-1) - lr*v_t\u003c/code\u003e. Cho \u003ccode\u003ew_0=2.0\u003c/code\u003e, \u003ccode\u003ev_0=0\u003c/code\u003e, \u003ccode\u003eμ=0.9\u003c/code\u003e, \u003ccode\u003elr=0.1\u003c/code\u003e, \u003ccode\u003eg_1=1.0\u003c/code\u003e, \u003ccode\u003eg_2=-1.0\u003c/code\u003e. Cặp \u003ccode\u003e(v_2, w_2)\u003c/code\u003e là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(-1.90, 2.09)\u003c/code\u003e","\u003ccode\u003e(-0.10, 1.91)\u003c/code\u003e","\u003ccode\u003e(0.10, 1.89)\u003c/code\u003e","\u003ccode\u003e(0.90, 1.81)\u003c/code\u003e"],"correct":1},{"id":"dl-753b9917go4ef","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q08","label":"Câu 8","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eCho SGD không momentum với \u003ccode\u003elr=0.25\u003c/code\u003e. Parameter ban đầu \u003ccode\u003ew=1.5\u003c/code\u003e và gradient hiện tại \u003ccode\u003eg=-0.8\u003c/code\u003e. Giá trị parameter sau \u003ccode\u003eoptimizer.step()\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\n\nw = torch.tensor(\n    1.5,\n    dtype=torch.float32,\n    requires_grad=True\n)\n\noptimizer = torch.optim.SGD(\n    [w],\n    lr=0.25,\n    momentum=0.0\n)\n\nw.grad = torch.tensor(\n    -0.8,\n    dtype=torch.float32\n)\n\noptimizer.step()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.30\u003c/code\u003e","\u003ccode\u003e1.50\u003c/code\u003e","\u003ccode\u003e1.70\u003c/code\u003e","\u003ccode\u003e2.30\u003c/code\u003e"],"correct":2},{"id":"dl-gq4i2wlft5ts","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q09","label":"Câu 9","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eXét quy ước momentum được cho rõ trong câu: \u003ccode\u003ev_t = μv_(t-1) + g_t\u003c/code\u003e, \u003ccode\u003ew_t = w_(t-1) - lr*v_t\u003c/code\u003e. Cho \u003ccode\u003ew_0=10\u003c/code\u003e, \u003ccode\u003ev_0=0\u003c/code\u003e, \u003ccode\u003eμ=0.8\u003c/code\u003e, \u003ccode\u003elr=0.5\u003c/code\u003e, \u003ccode\u003eg_1=1\u003c/code\u003e, \u003ccode\u003eg_2=3\u003c/code\u003e. Bộ \u003ccode\u003e(v_1, w_1, v_2, w_2)\u003c/code\u003e nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(1.0, 9.5, 3.8, 7.6)\u003c/code\u003e","\u003ccode\u003e(0.8, 9.6, 3.0, 8.1)\u003c/code\u003e","\u003ccode\u003e(1.0, 9.5, 3.0, 8.0)\u003c/code\u003e","\u003ccode\u003e(1.0, 10.5, 3.8, 12.4)\u003c/code\u003e"],"correct":0},{"id":"dl-9ifgu71cueo4b","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q10","label":"Câu 10","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eHai lần cập nhật độc lập đều bắt đầu từ \u003ccode\u003ew=2.0\u003c/code\u003e với cùng gradient \u003ccode\u003eg=4.0\u003c/code\u003e, dùng SGD không momentum. Trường hợp A dùng \u003ccode\u003elr=0.01\u003c/code\u003e; trường hợp B dùng \u003ccode\u003elr=0.1\u003c/code\u003e. Cặp parameter sau cập nhật \u003ccode\u003e(w_A, w_B)\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = 2.0\ng = 4.0\n\nw_A = w - 0.01 * g\nw_B = w - 0.10 * g\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(1.60, 1.96)\u003c/code\u003e","\u003ccode\u003e(1.96, 1.60)\u003c/code\u003e","\u003ccode\u003e(2.04, 2.40)\u003c/code\u003e","\u003ccode\u003e(2.40, 2.04)\u003c/code\u003e"],"correct":1},{"id":"dl-bulsw81iiqn2","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q11","label":"Câu 11","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eCho vector parameter \u003ccode\u003ew=[1,-2]\u003c/code\u003e và gradient \u003ccode\u003eg=[-3,4]\u003c/code\u003e. SGD không momentum dùng \u003ccode\u003elr=0.1\u003c/code\u003e. Vector parameter mới là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport torch\n\nw = torch.tensor(\n    [1.0, -2.0],\n    dtype=torch.float32\n)\n\ng = torch.tensor(\n    [-3.0, 4.0],\n    dtype=torch.float32\n)\n\nw_new = w - 0.1 * g\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.7, -1.6]\u003c/code\u003e","\u003ccode\u003e[0.7, -2.4]\u003c/code\u003e","\u003ccode\u003e[1.3, -1.6]\u003c/code\u003e","\u003ccode\u003e[1.3, -2.4]\u003c/code\u003e"],"correct":3},{"id":"dl-17fk8lveaufef","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q12","label":"Câu 12","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eDùng công thức \u003ccode\u003ev_t = μv_(t-1) + g_t\u003c/code\u003e, \u003ccode\u003ew_t = w_(t-1) - lr*v_t\u003c/code\u003e. Trước bước hiện tại, \u003ccode\u003ew=3.0\u003c/code\u003e, velocity \u003ccode\u003ev=2.0\u003c/code\u003e. Với \u003ccode\u003eμ=0.5\u003c/code\u003e, \u003ccode\u003elr=0.2\u003c/code\u003e và gradient hiện tại \u003ccode\u003eg=-3.0\u003c/code\u003e, cặp velocity và parameter mới là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ev_new = 0.5 * 2.0 + (-3.0)\nw_new = 3.0 - 0.2 * v_new\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003ev_new=-2.0\u003c/code\u003e, \u003ccode\u003ew_new=3.4\u003c/code\u003e","\u003ccode\u003ev_new=-2.0\u003c/code\u003e, \u003ccode\u003ew_new=2.6\u003c/code\u003e","\u003ccode\u003ev_new=-1.0\u003c/code\u003e, \u003ccode\u003ew_new=3.2\u003c/code\u003e","\u003ccode\u003ev_new=4.0\u003c/code\u003e, \u003ccode\u003ew_new=2.2\u003c/code\u003e"],"correct":0},{"id":"dl-149e1fc1cily44","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q13","label":"Câu 13","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eXét hai bước momentum với công thức \u003ccode\u003ev_t = μv_(t-1) + g_t\u003c/code\u003e và \u003ccode\u003ew_t = w_(t-1) - lr*v_t\u003c/code\u003e. Cho \u003ccode\u003ew_0=1.0\u003c/code\u003e, \u003ccode\u003ev_0=0\u003c/code\u003e, \u003ccode\u003eμ=0.5\u003c/code\u003e, \u003ccode\u003elr=0.2\u003c/code\u003e, \u003ccode\u003eg_1=-2.0\u003c/code\u003e, \u003ccode\u003eg_2=-1.0\u003c/code\u003e. Giá trị \u003ccode\u003ew_2\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ev1 = 0.5 * 0.0 - 2.0\nw1 = 1.0 - 0.2 * v1\n\nv2 = 0.5 * v1 - 1.0\nw2 = w1 - 0.2 * v2\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.6\u003c/code\u003e","\u003ccode\u003e1.4\u003c/code\u003e","\u003ccode\u003e1.6\u003c/code\u003e","\u003ccode\u003e1.8\u003c/code\u003e"],"correct":3},{"id":"dl-1agyk925d0ida","chapter":"8","topic":"Phần 8 — SGD và momentum","source":{"id":"dl-p08-q14","label":"Câu 14","batch":"dl-p08"},"html":"\n      \n      \u003cp\u003eCho SGD không momentum với \u003ccode\u003ew=4.0\u003c/code\u003e và \u003ccode\u003elr=0.1\u003c/code\u003e. Sau một bước cập nhật, quan sát được \u003ccode\u003ew_new=3.7\u003c/code\u003e. Theo công thức \u003ccode\u003ew_new = w - lr*g\u003c/code\u003e, gradient \u003ccode\u003eg\u003c/code\u003e đã được sử dụng là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = 4.0\nlr = 0.1\nw_new = 3.7\n\n# w_new = w - lr * g\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-3.0\u003c/code\u003e","\u003ccode\u003e-0.3\u003c/code\u003e","\u003ccode\u003e0.3\u003c/code\u003e","\u003ccode\u003e3.0\u003c/code\u003e"],"correct":3},{"id":"dl-1jpav241j85gzw","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q01","label":"Câu 1","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eMột mô hình được train trong 4 epoch. Mean training loss theo từng epoch lần lượt là \u003ccode\u003e[1.20, 0.90, 0.70, 0.55]\u003c/code\u003e. Phát biểu nào mô tả đúng dãy training loss này?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrain_losses = [1.20, 0.90, 0.70, 0.55]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Training loss tăng ở mọi epoch.","Training loss giảm ở mọi epoch.","Training loss nhỏ nhất tại epoch 1.","Training loss không thay đổi qua các epoch."],"correct":1},{"id":"dl-1praqe5a4snej","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q02","label":"Câu 2","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eValidation loss của 5 epoch được cho dưới đây. Quy ước epoch bắt đầu từ 1 và validation loss càng nhỏ càng tốt. Epoch nào có validation loss tốt nhất?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eval_losses = [0.82, 0.65, 0.58, 0.61, 0.64]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Epoch 2","Epoch 3","Epoch 4","Epoch 5"],"correct":1},{"id":"dl-1vkysj616br8fa","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q03","label":"Câu 3","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eĐoạn code dưới đây lưu checkpoint khi validation loss giảm nghiêm ngặt. Với dãy validation loss đã cho, checkpoint cuối cùng được lưu ở epoch nào? Quy ước epoch bắt đầu từ 1.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eval_losses = [0.70, 0.55, 0.48, 0.50, 0.49]\n\nbest_val_loss = float(\"inf\")\nbest_epoch = None\n\nfor epoch, val_loss in enumerate(val_losses, start=1):\n    if val_loss \u0026lt; best_val_loss:\n        best_val_loss = val_loss\n        best_epoch = epoch\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Epoch 2","Epoch 3","Epoch 4","Epoch 5"],"correct":1},{"id":"dl-vnjysd8clwqh","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q04","label":"Câu 4","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eEarly stopping dùng \u003ccode\u003epatience=2\u003c/code\u003e. Một epoch được xem là cải thiện chỉ khi \u003ccode\u003eval_loss \u0026lt; best_val_loss\u003c/code\u003e. Sau mỗi epoch không cải thiện, \u003ccode\u003ebad_epochs\u003c/code\u003e tăng 1; dừng ngay khi \u003ccode\u003ebad_epochs \u0026gt;= patience\u003c/code\u003e. Với dãy dưới đây, quá trình dừng sau epoch nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eval_losses = [0.80, 0.60, 0.50, 0.52, 0.54, 0.49]\npatience = 2\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Epoch 3","Epoch 4","Epoch 5","Epoch 6"],"correct":2},{"id":"dl-11gfuek4hty1s","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q05","label":"Câu 5","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eEarly stopping dùng \u003ccode\u003epatience=3\u003c/code\u003e. Cải thiện được định nghĩa là \u003ccode\u003eval_loss \u0026lt; best_val_loss\u003c/code\u003e. Khi cải thiện, counter được đặt lại về 0; nếu không, counter tăng 1. Dừng khi counter đạt 3. Với dãy validation loss dưới đây, counter sau epoch 5 bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eval_losses = [0.90, 0.70, 0.72, 0.68, 0.69]\npatience = 3\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0\u003c/code\u003e","\u003ccode\u003e1\u003c/code\u003e","\u003ccode\u003e2\u003c/code\u003e","\u003ccode\u003e3\u003c/code\u003e"],"correct":1},{"id":"dl-bzdbfoql4yyu","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q06","label":"Câu 6","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eQuy tắc checkpoint là chỉ lưu khi \u003ccode\u003eval_loss \u0026lt; best_val_loss\u003c/code\u003e. Nếu validation loss bằng đúng best loss hiện tại thì không ghi đè checkpoint. Với dãy dưới đây, checkpoint cuối cùng tương ứng với epoch nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eval_losses = [0.60, 0.45, 0.45, 0.47, 0.45]\n\nbest_val_loss = float(\"inf\")\nbest_epoch = None\n\nfor epoch, val_loss in enumerate(val_losses, start=1):\n    if val_loss \u0026lt; best_val_loss:\n        best_val_loss = val_loss\n        best_epoch = epoch\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Epoch 1","Epoch 2","Epoch 3","Epoch 5"],"correct":1},{"id":"dl-1ujko2xa2mred","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q07","label":"Câu 7","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eXét early stopping dưới đây. Cải thiện chỉ xảy ra khi \u003ccode\u003eval_loss \u0026lt; best_val_loss\u003c/code\u003e. \u003ccode\u003epatience=2\u003c/code\u003e và dừng khi \u003ccode\u003ebad_epochs \u0026gt;= 2\u003c/code\u003e. Hai giá trị bằng nhau không được xem là cải thiện. Quá trình dừng ở epoch nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eval_losses = [0.70, 0.50, 0.50, 0.51, 0.49]\npatience = 2\n\nbest_val_loss = float(\"inf\")\nbad_epochs = 0\n\nfor epoch, val_loss in enumerate(val_losses, start=1):\n    if val_loss \u0026lt; best_val_loss:\n        best_val_loss = val_loss\n        bad_epochs = 0\n    else:\n        bad_epochs += 1\n\n    if bad_epochs \u0026gt;= patience:\n        break\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Epoch 2","Epoch 3","Epoch 4","Epoch 5"],"correct":2},{"id":"dl-qlkwnaae925y","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q08","label":"Câu 8","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eMột mô hình có validation loss tốt nhất tại epoch 4. Sau đó validation loss tăng và early stopping dừng training tại epoch 7. Nếu mục tiêu là sử dụng mô hình có validation loss tốt nhất, state nào nên được dùng sau khi training kết thúc?\u003c/p\u003e\n      \n    ","choices":["State ngay trước khi bắt đầu epoch 1.","State cuối epoch 4 đã được lưu làm best checkpoint.","State cuối epoch 6 vì nằm ngay trước thời điểm dừng.","State cuối epoch 7 vì đó luôn là mô hình tốt nhất."],"correct":1},{"id":"dl-1hluz1b1uyjksr","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q09","label":"Câu 9","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eĐoạn code dưới đây theo dõi best checkpoint trong nhiều epoch. Lựa chọn nào phải thay cho \u003ccode\u003e???\u003c/code\u003e để chỉ lưu model khi validation loss được cải thiện?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebest_val_loss = float(\"inf\")\n\nfor epoch in range(num_epochs):\n    train_one_epoch()\n\n    val_loss = evaluate()\n\n    if ???:\n        best_val_loss = val_loss\n        torch.save(\n            model.state_dict(),\n            \"best_model.pt\"\n        )\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eval_loss \u0026gt; best_val_loss\u003c/code\u003e","\u003ccode\u003eval_loss == best_val_loss\u003c/code\u003e","\u003ccode\u003eval_loss \u0026lt; best_val_loss\u003c/code\u003e","\u003ccode\u003eepoch \u0026gt; best_val_loss\u003c/code\u003e"],"correct":2},{"id":"dl-kiuqwn1mtenfd","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q10","label":"Câu 10","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eEarly stopping dùng quy tắc: cải thiện khi \u003ccode\u003eval_loss \u0026lt; best_val_loss\u003c/code\u003e; nếu cải thiện thì đặt \u003ccode\u003ebad_epochs=0\u003c/code\u003e, ngược lại tăng 1; dừng khi \u003ccode\u003ebad_epochs \u0026gt;= 3\u003c/code\u003e. Với dãy dưới đây, cặp \u003ccode\u003e(best_val_loss, bad_epochs)\u003c/code\u003e ngay sau epoch 6 là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eval_losses = [\n    0.80,\n    0.65,\n    0.67,\n    0.60,\n    0.62,\n    0.64\n]\n\npatience = 3\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(0.60, 0)\u003c/code\u003e","\u003ccode\u003e(0.60, 1)\u003c/code\u003e","\u003ccode\u003e(0.60, 2)\u003c/code\u003e","\u003ccode\u003e(0.64, 2)\u003c/code\u003e"],"correct":2},{"id":"dl-wmdi2k1nfpxyk","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q11","label":"Câu 11","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eMột training loop lưu checkpoint bằng đoạn code dưới đây. File \u003ccode\u003ebest_model.pt\u003c/code\u003e chứa thành phần nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etorch.save(\n    model.state_dict(),\n    \"best_model.pt\"\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Chỉ số epoch và toàn bộ lịch sử validation loss.","State dictionary chứa các parameter và persistent buffer của model.","Toàn bộ optimizer state nhưng không có model parameters.","Chỉ source code của class định nghĩa model."],"correct":1},{"id":"dl-17dt9j6sfw2am","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q12","label":"Câu 12","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eCheckpoint dưới đây được lưu tại epoch tốt nhất để có thể tiếp tục training sau này. Thành phần nào được lưu ngoài \u003ccode\u003emodel_state_dict\u003c/code\u003e?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etorch.save({\n    \"epoch\": epoch,\n    \"model_state_dict\": model.state_dict(),\n    \"optimizer_state_dict\": optimizer.state_dict(),\n    \"best_val_loss\": best_val_loss\n}, \"checkpoint.pt\")\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Chỉ batch size hiện tại.","Chỉ learning rate dưới dạng một scalar độc lập.","Epoch, optimizer state và best validation loss.","Chỉ output dự đoán của validation set."],"correct":2},{"id":"dl-6ojvt4ncx0g6","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q13","label":"Câu 13","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eCho checkpoint đã được tạo bằng \u003ccode\u003emodel.state_dict()\u003c/code\u003e. Đoạn code nào nạp các parameter đã lưu vào một model đã được khởi tạo với cùng kiến trúc?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003estate = torch.load(\"best_model.pt\")\nmodel.load_state_dict(state)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003estate = torch.load(\"best_model.pt\")\nmodel.backward(state)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003estate = torch.load(\"best_model.pt\")\noptimizer.load_state_dict(state)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003estate = torch.load(\"best_model.pt\")\nmodel.parameters(state)\u003c/code\u003e\u003c/pre\u003e"],"correct":0},{"id":"dl-nfjvau45vsuq","chapter":"9","topic":"Phần 9 — Nhiều epoch và early stopping","source":{"id":"dl-p09-q14","label":"Câu 14","batch":"dl-p09"},"html":"\n      \n      \u003cp\u003eEarly stopping dùng \u003ccode\u003epatience=2\u003c/code\u003e. Cải thiện chỉ khi validation loss giảm nghiêm ngặt. Khi không cải thiện, \u003ccode\u003ebad_epochs\u003c/code\u003e tăng 1; khi cải thiện, counter về 0. Dừng ngay khi \u003ccode\u003ebad_epochs \u0026gt;= 2\u003c/code\u003e. Đồng thời, checkpoint chỉ được lưu khi có cải thiện. Với dãy dưới đây, cặp \u003ccode\u003e(best_epoch, stop_epoch)\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eval_losses = [\n    0.90,\n    0.72,\n    0.68,\n    0.70,\n    0.65,\n    0.66,\n    0.67,\n    0.64\n]\n\npatience = 2\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(3, 4)\u003c/code\u003e","\u003ccode\u003e(3, 5)\u003c/code\u003e","\u003ccode\u003e(5, 7)\u003c/code\u003e","\u003ccode\u003e(8, 8)\u003c/code\u003e"],"correct":2},{"id":"dl-18zyhb31kzct3f","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q01","label":"Câu 1","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eXét Adam với công thức \u003ccode\u003em_t = β1*m_(t-1) + (1-β1)*g_t\u003c/code\u003e. Cho \u003ccode\u003eβ1=0.9\u003c/code\u003e, \u003ccode\u003em_0=0\u003c/code\u003e và gradient bước đầu \u003ccode\u003eg_1=4\u003c/code\u003e. Giá trị \u003ccode\u003em_1\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebeta1 = 0.9\nm0 = 0.0\ng1 = 4.0\n\nm1 = beta1 * m0 + (1 - beta1) * g1\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.4\u003c/code\u003e","\u003ccode\u003e0.9\u003c/code\u003e","\u003ccode\u003e3.6\u003c/code\u003e","\u003ccode\u003e4.0\u003c/code\u003e"],"correct":0},{"id":"dl-er6kiup01hnc","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q02","label":"Câu 2","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eXét Adam với \u003ccode\u003ev_t = β2*v_(t-1) + (1-β2)*g_t²\u003c/code\u003e. Cho \u003ccode\u003eβ2=0.99\u003c/code\u003e, \u003ccode\u003ev_0=0\u003c/code\u003e và \u003ccode\u003eg_1=2\u003c/code\u003e. Giá trị \u003ccode\u003ev_1\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebeta2 = 0.99\nv0 = 0.0\ng1 = 2.0\n\nv1 = beta2 * v0 + (1 - beta2) * g1**2\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.02\u003c/code\u003e","\u003ccode\u003e0.04\u003c/code\u003e","\u003ccode\u003e0.20\u003c/code\u003e","\u003ccode\u003e0.40\u003c/code\u003e"],"correct":1},{"id":"dl-bizot31xlo52x","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q03","label":"Câu 3","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eAdam dùng bias correction \u003ccode\u003em_hat = m_t / (1-β1^t)\u003c/code\u003e. Tại bước \u003ccode\u003et=1\u003c/code\u003e, cho \u003ccode\u003eβ1=0.9\u003c/code\u003e và \u003ccode\u003em_1=0.3\u003c/code\u003e. Giá trị \u003ccode\u003em_hat\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebeta1 = 0.9\nt = 1\nm1 = 0.3\n\nm_hat = m1 / (1 - beta1**t)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.03\u003c/code\u003e","\u003ccode\u003e0.27\u003c/code\u003e","\u003ccode\u003e3.00\u003c/code\u003e","\u003ccode\u003e3.33\u003c/code\u003e"],"correct":2},{"id":"dl-3q9qot48wu4p","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q04","label":"Câu 4","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eAdam dùng bias correction \u003ccode\u003ev_hat = v_t / (1-β2^t)\u003c/code\u003e. Tại \u003ccode\u003et=1\u003c/code\u003e, cho \u003ccode\u003eβ2=0.99\u003c/code\u003e và \u003ccode\u003ev_1=0.09\u003c/code\u003e. Giá trị \u003ccode\u003ev_hat\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebeta2 = 0.99\nt = 1\nv1 = 0.09\n\nv_hat = v1 / (1 - beta2**t)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0009\u003c/code\u003e","\u003ccode\u003e0.0900\u003c/code\u003e","\u003ccode\u003e0.9000\u003c/code\u003e","\u003ccode\u003e9.0000\u003c/code\u003e"],"correct":3},{"id":"dl-sgyk5q19zj2qo","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q05","label":"Câu 5","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eXét một bước Adam với các công thức dưới đây. Cho \u003ccode\u003ew_0=5\u003c/code\u003e, \u003ccode\u003eg_1=2\u003c/code\u003e, \u003ccode\u003eβ1=0.9\u003c/code\u003e, \u003ccode\u003eβ2=0.99\u003c/code\u003e, \u003ccode\u003elr=0.1\u003c/code\u003e, \u003ccode\u003eeps=0\u003c/code\u003e, \u003ccode\u003em_0=v_0=0\u003c/code\u003e. Giá trị \u003ccode\u003ew_1\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003em1 = 0.9 * 0 + 0.1 * 2\nv1 = 0.99 * 0 + 0.01 * (2 ** 2)\n\nm_hat = m1 / (1 - 0.9)\nv_hat = v1 / (1 - 0.99)\n\nw1 = 5 - 0.1 * m_hat / (v_hat ** 0.5)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e4.8\u003c/code\u003e","\u003ccode\u003e4.9\u003c/code\u003e","\u003ccode\u003e5.1\u003c/code\u003e","\u003ccode\u003e5.2\u003c/code\u003e"],"correct":1},{"id":"dl-102l2b2dl2e4g","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q06","label":"Câu 6","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eXét một bước Adam với \u003ccode\u003ew_0=-2\u003c/code\u003e, \u003ccode\u003eg_1=-3\u003c/code\u003e, \u003ccode\u003eβ1=0.9\u003c/code\u003e, \u003ccode\u003eβ2=0.99\u003c/code\u003e, \u003ccode\u003elr=0.2\u003c/code\u003e, \u003ccode\u003eeps=0\u003c/code\u003e và \u003ccode\u003em_0=v_0=0\u003c/code\u003e. Dùng bias correction. Giá trị \u003ccode\u003ew_1\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e-2.2\u003c/code\u003e","\u003ccode\u003e-2.0\u003c/code\u003e","\u003ccode\u003e-1.8\u003c/code\u003e","\u003ccode\u003e-1.4\u003c/code\u003e"],"correct":2},{"id":"dl-wr3ru2m80eju","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q07","label":"Câu 7","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eCho Adam tại bước \u003ccode\u003et=2\u003c/code\u003e với \u003ccode\u003eβ1=0.5\u003c/code\u003e, \u003ccode\u003em_1=1\u003c/code\u003e và gradient mới \u003ccode\u003eg_2=3\u003c/code\u003e. Theo \u003ccode\u003em_2 = β1*m_1 + (1-β1)*g_2\u003c/code\u003e, cặp \u003ccode\u003e(m_2, m_hat_2)\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebeta1 = 0.5\nm1 = 1.0\ng2 = 3.0\nt = 2\n\nm2 = beta1 * m1 + (1 - beta1) * g2\nm_hat2 = m2 / (1 - beta1**t)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(1.5, 2.0)\u003c/code\u003e","\u003ccode\u003e(2.0, 2.0)\u003c/code\u003e","\u003ccode\u003e(2.0, 2.6667)\u003c/code\u003e","\u003ccode\u003e(2.5, 3.3333)\u003c/code\u003e"],"correct":2},{"id":"dl-1548nia17tk5ew","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q08","label":"Câu 8","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eCho Adam tại bước \u003ccode\u003et=2\u003c/code\u003e với \u003ccode\u003eβ2=0.5\u003c/code\u003e, \u003ccode\u003ev_1=2\u003c/code\u003e và gradient mới \u003ccode\u003eg_2=2\u003c/code\u003e. Theo công thức chuẩn cho second moment, cặp \u003ccode\u003e(v_2, v_hat_2)\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebeta2 = 0.5\nv1 = 2.0\ng2 = 2.0\nt = 2\n\nv2 = beta2 * v1 + (1 - beta2) * g2**2\nv_hat2 = v2 / (1 - beta2**t)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(2.0, 2.6667)\u003c/code\u003e","\u003ccode\u003e(3.0, 3.0000)\u003c/code\u003e","\u003ccode\u003e(3.0, 4.0000)\u003c/code\u003e","\u003ccode\u003e(4.0, 5.3333)\u003c/code\u003e"],"correct":2},{"id":"dl-n5mc8rviz7mt","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q09","label":"Câu 9","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003em_hat=2\u003c/code\u003e, \u003ccode\u003ev_hat=4\u003c/code\u003e, \u003ccode\u003elr=0.1\u003c/code\u003e, \u003ccode\u003eeps=0\u003c/code\u003e và parameter hiện tại \u003ccode\u003ew=3\u003c/code\u003e. Theo bước cập nhật Adam \u003ccode\u003ew_new = w - lr*m_hat/(sqrt(v_hat)+eps)\u003c/code\u003e, giá trị mới là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = 3.0\nm_hat = 2.0\nv_hat = 4.0\nlr = 0.1\neps = 0.0\n\nw_new = w - lr * m_hat / (v_hat**0.5 + eps)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2.8\u003c/code\u003e","\u003ccode\u003e2.9\u003c/code\u003e","\u003ccode\u003e3.1\u003c/code\u003e","\u003ccode\u003e3.2\u003c/code\u003e"],"correct":1},{"id":"dl-jtin0q1tsw7yu","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q10","label":"Câu 10","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eTại bước đầu tiên của Adam, cho \u003ccode\u003eg_1=4\u003c/code\u003e, \u003ccode\u003eβ1=0.9\u003c/code\u003e, \u003ccode\u003eβ2=0.99\u003c/code\u003e, \u003ccode\u003em_0=v_0=0\u003c/code\u003e. Cặp moment chưa bias-correct \u003ccode\u003e(m_1, v_1)\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eg1 = 4.0\nbeta1 = 0.9\nbeta2 = 0.99\n\nm1 = beta1 * 0 + (1 - beta1) * g1\nv1 = beta2 * 0 + (1 - beta2) * g1**2\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(0.4, 0.16)\u003c/code\u003e","\u003ccode\u003e(0.4, 1.60)\u003c/code\u003e","\u003ccode\u003e(3.6, 0.16)\u003c/code\u003e","\u003ccode\u003e(4.0, 16.0)\u003c/code\u003e"],"correct":0},{"id":"dl-18pme2j2ymxin","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q11","label":"Câu 11","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eHai optimizer độc lập bắt đầu từ cùng parameter \u003ccode\u003ew=5\u003c/code\u003e và cùng gradient \u003ccode\u003eg=2\u003c/code\u003e. SGD dùng \u003ccode\u003elr=0.1\u003c/code\u003e. Adam cũng dùng \u003ccode\u003elr=0.1\u003c/code\u003e, \u003ccode\u003eβ1=0.9\u003c/code\u003e, \u003ccode\u003eβ2=0.99\u003c/code\u003e, \u003ccode\u003eeps=0\u003c/code\u003e, \u003ccode\u003em_0=v_0=0\u003c/code\u003e và bias correction tại \u003ccode\u003et=1\u003c/code\u003e. Cặp parameter sau một bước \u003ccode\u003e(w_SGD, w_Adam)\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e# SGD\nw_sgd = 5.0 - 0.1 * 2.0\n\n# Adam\nm1 = 0.1 * 2.0\nv1 = 0.01 * (2.0 ** 2)\nm_hat = m1 / 0.1\nv_hat = v1 / 0.01\nw_adam = 5.0 - 0.1 * m_hat / (v_hat ** 0.5)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(4.8, 4.8)\u003c/code\u003e","\u003ccode\u003e(4.8, 4.9)\u003c/code\u003e","\u003ccode\u003e(4.9, 4.8)\u003c/code\u003e","\u003ccode\u003e(4.9, 4.9)\u003c/code\u003e"],"correct":1},{"id":"dl-11e9nqb1vq73zn","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q12","label":"Câu 12","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eHai optimizer độc lập bắt đầu từ \u003ccode\u003ew=1\u003c/code\u003e với gradient \u003ccode\u003eg=-5\u003c/code\u003e. SGD dùng \u003ccode\u003elr=0.1\u003c/code\u003e. Adam dùng \u003ccode\u003elr=0.1\u003c/code\u003e, \u003ccode\u003eβ1=0.9\u003c/code\u003e, \u003ccode\u003eβ2=0.99\u003c/code\u003e, \u003ccode\u003eeps=0\u003c/code\u003e, \u003ccode\u003em_0=v_0=0\u003c/code\u003e và bias correction ở bước đầu. Cặp \u003ccode\u003e(w_SGD, w_Adam)\u003c/code\u003e là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(0.5, 0.9)\u003c/code\u003e","\u003ccode\u003e(0.5, 1.1)\u003c/code\u003e","\u003ccode\u003e(1.5, 0.9)\u003c/code\u003e","\u003ccode\u003e(1.5, 1.1)\u003c/code\u003e"],"correct":3},{"id":"dl-1oac3kvi3tvjr","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q13","label":"Câu 13","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eCho hai parameter độc lập \u003ccode\u003ew1\u003c/code\u003e và \u003ccode\u003ew2\u003c/code\u003e đều bắt đầu bằng \u003ccode\u003e0\u003c/code\u003e. Gradient bước đầu lần lượt là \u003ccode\u003eg1=2\u003c/code\u003e và \u003ccode\u003eg2=10\u003c/code\u003e. Adam dùng cùng \u003ccode\u003elr=0.1\u003c/code\u003e, \u003ccode\u003eβ1=0.9\u003c/code\u003e, \u003ccode\u003eβ2=0.99\u003c/code\u003e, \u003ccode\u003eeps=0\u003c/code\u003e, state ban đầu bằng 0 và bias correction tại \u003ccode\u003et=1\u003c/code\u003e. Cặp parameter mới là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e# Với mỗi parameter ở t = 1:\n# m_hat = g\n# v_hat = g**2\n# w_new = w - 0.1 * m_hat / sqrt(v_hat)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(-0.1, -0.1)\u003c/code\u003e","\u003ccode\u003e(-0.2, -1.0)\u003c/code\u003e","\u003ccode\u003e(0.1, 0.1)\u003c/code\u003e","\u003ccode\u003e(-0.1, -0.5)\u003c/code\u003e"],"correct":0},{"id":"dl-213rxx1fbcfaf","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q14","label":"Câu 14","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eTrong Adam, mục đích trực tiếp của bias correction đối với \u003ccode\u003em_t\u003c/code\u003e và \u003ccode\u003ev_t\u003c/code\u003e là gì?\u003c/p\u003e\n      \n    ","choices":["Bù độ lệch về 0 do các moment được khởi tạo bằng 0, đặc biệt ở các bước đầu.","Ép mọi gradient về khoảng từ \u003ccode\u003e-1\u003c/code\u003e đến \u003ccode\u003e1\u003c/code\u003e trước khi cập nhật.","Thay thế hoàn toàn learning rate bằng giá trị của first moment.","Đặt second moment về 0 mỗi khi dấu của gradient thay đổi."],"correct":0},{"id":"dl-2kuk22mness4","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q15","label":"Câu 15","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eĐoạn code tạo hai optimizer để so sánh từ cùng trạng thái ban đầu. Giả sử \u003ccode\u003emodel_sgd\u003c/code\u003e và \u003ccode\u003emodel_adam\u003c/code\u003e có cùng kiến trúc. Thao tác nào đảm bảo hai model bắt đầu với cùng parameter trước khi huấn luyện?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emodel_sgd = Net()\nmodel_adam = Net()\n\ninitial_state = model_sgd.state_dict()\n\n# ???\n      \nopt_sgd = torch.optim.SGD(\n    model_sgd.parameters(),\n    lr=0.01\n)\n\nopt_adam = torch.optim.Adam(\n    model_adam.parameters(),\n    lr=0.01\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003emodel_adam.load_state_dict(initial_state)\u003c/code\u003e","\u003ccode\u003emodel_adam.eval()\u003c/code\u003e","\u003ccode\u003eopt_adam.zero_grad()\u003c/code\u003e","\u003ccode\u003emodel_adam.parameters() == initial_state\u003c/code\u003e"],"correct":0},{"id":"dl-3bwd2f1hqq179","chapter":"10","topic":"Phần 10 — Adam và so sánh optimizer","source":{"id":"dl-p10-q16","label":"Câu 16","batch":"dl-p10"},"html":"\n      \n      \u003cp\u003eMuốn so sánh SGD và Adam công bằng trên cùng bài toán. Hai model đã được nạp cùng initial weights và nhận đúng cùng các mini-batch theo cùng thứ tự. Phát biểu nào đúng nhất?\u003c/p\u003e\n      \n    ","choices":["Cần dùng chung một optimizer object cho cả hai model để state giống nhau.","Mỗi optimizer cần state riêng; SGD và Adam cập nhật độc lập từ cùng initial model state.","Adam phải chạy trước một epoch để tạo moment rồi mới bắt đầu so sánh với SGD.","SGD phải dùng parameter cuối của Adam làm trạng thái khởi tạo để kết quả có thể so sánh."],"correct":1},{"id":"dl-1ekgpff1hxulnv","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q01","label":"Câu 1","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eMột mô hình có hai gradient scalar lần lượt là \u003ccode\u003e3\u003c/code\u003e và \u003ccode\u003e4\u003c/code\u003e. Dùng chuẩn L2 toàn cục \u003ccode\u003e||g||₂ = sqrt(g1² + g2²)\u003c/code\u003e. Giá trị chuẩn L2 là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eg1 = 3.0\ng2 = 4.0\n\nnorm = (g1**2 + g2**2) ** 0.5\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e3.5\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e7.0\u003c/code\u003e","\u003ccode\u003e25.0\u003c/code\u003e"],"correct":1},{"id":"dl-20u8h51fzvp0j","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q02","label":"Câu 2","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eGradient vector là \u003ccode\u003e[3, 4]\u003c/code\u003e, có chuẩn L2 bằng \u003ccode\u003e5\u003c/code\u003e. Gradient clipping đặt \u003ccode\u003emax_norm=2\u003c/code\u003e. Dùng quy tắc: nếu \u003ccode\u003e||g||₂ \u0026gt; max_norm\u003c/code\u003e thì nhân toàn bộ gradient với \u003ccode\u003emax_norm / ||g||₂\u003c/code\u003e. Gradient sau clipping là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eg = [3.0, 4.0]\nnorm = 5.0\nmax_norm = 2.0\n\nscale = max_norm / norm\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.6, 0.8]\u003c/code\u003e","\u003ccode\u003e[1.0, 1.0]\u003c/code\u003e","\u003ccode\u003e[1.2, 1.6]\u003c/code\u003e","\u003ccode\u003e[2.0, 2.0]\u003c/code\u003e"],"correct":2},{"id":"dl-1k8ystb17i09rh","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q03","label":"Câu 3","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eHai parameter có gradient \u003ccode\u003eg1=[1,2]\u003c/code\u003e và \u003ccode\u003eg2=[2,4]\u003c/code\u003e. Dùng chuẩn L2 toàn cục trên tất cả phần tử gradient. Giá trị chuẩn L2 là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eg1 = [1.0, 2.0]\ng2 = [2.0, 4.0]\n\nnorm = (\n    1.0**2 +\n    2.0**2 +\n    2.0**2 +\n    4.0**2\n) ** 0.5\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e3.0\u003c/code\u003e","\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e25.0\u003c/code\u003e"],"correct":2},{"id":"dl-fkgmwo1jrmbgq","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q04","label":"Câu 4","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eGradient toàn cục có chuẩn L2 bằng \u003ccode\u003e10\u003c/code\u003e. Dùng \u003ccode\u003emax_norm=2.5\u003c/code\u003e và quy tắc scale bằng \u003ccode\u003emax_norm / norm\u003c/code\u003e khi cần clipping. Hệ số nhân vào mỗi gradient là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.20\u003c/code\u003e","\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e2.50\u003c/code\u003e","\u003ccode\u003e4.00\u003c/code\u003e"],"correct":1},{"id":"dl-866pyb53tij5","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q05","label":"Câu 5","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eGradient vector là \u003ccode\u003e[1, 2, 2]\u003c/code\u003e và \u003ccode\u003emax_norm=5\u003c/code\u003e. Dùng clipping theo chuẩn L2. Gradient sau clipping là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eg = [1.0, 2.0, 2.0]\nmax_norm = 5.0\n\n# ||g||₂ = 3\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1, 2, 2]\u003c/code\u003e","\u003ccode\u003e[5/3, 10/3, 10/3]\u003c/code\u003e","\u003ccode\u003e[1/3, 2/3, 2/3]\u003c/code\u003e","\u003ccode\u003e[5, 5, 5]\u003c/code\u003e"],"correct":0},{"id":"dl-15gp4q41dzuzu2","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q06","label":"Câu 6","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eĐoạn code nào clip chuẩn L2 toàn cục của gradient các parameter trong \u003ccode\u003emodel\u003c/code\u003e về tối đa \u003ccode\u003e1.0\u003c/code\u003e sau \u003ccode\u003ebackward()\u003c/code\u003e và trước \u003ccode\u003eoptimizer.step()\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003eloss.backward()\noptimizer.step()\ntorch.nn.utils.clip_grad_norm_(\n    model.parameters(), 1.0\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eloss.backward()\ntorch.nn.utils.clip_grad_norm_(\n    model.parameters(), 1.0\n)\noptimizer.step()\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003etorch.nn.utils.clip_grad_norm_(\n    model.parameters(), 1.0\n)\noptimizer.zero_grad()\nloss.backward()\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eoptimizer.step()\nloss.backward()\noptimizer.zero_grad()\u003c/code\u003e\u003c/pre\u003e"],"correct":1},{"id":"dl-s1hjaaid2ylu","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q07","label":"Câu 7","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eMột layer fully connected có \u003ccode\u003ein_features=100\u003c/code\u003e và \u003ccode\u003eout_features=40\u003c/code\u003e. Với weight shape của PyTorch là \u003ccode\u003e(out_features, in_features)\u003c/code\u003e, giá trị \u003ccode\u003efan_in\u003c/code\u003e của weight là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elayer = torch.nn.Linear(\n    in_features=100,\n    out_features=40\n)\n\n# layer.weight.shape == (40, 100)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e40\u003c/code\u003e","\u003ccode\u003e60\u003c/code\u003e","\u003ccode\u003e100\u003c/code\u003e","\u003ccode\u003e4000\u003c/code\u003e"],"correct":2},{"id":"dl-m5djm91ps5oub","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q08","label":"Câu 8","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eTrong câu này, He initialization cho activation ReLU dùng độ lệch chuẩn lý thuyết \u003ccode\u003estd = sqrt(2 / fan_in)\u003c/code\u003e. Nếu \u003ccode\u003efan_in=50\u003c/code\u003e, giá trị \u003ccode\u003estd\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efan_in = 50\nstd = (2.0 / fan_in) ** 0.5\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.02\u003c/code\u003e","\u003ccode\u003e0.04\u003c/code\u003e","\u003ccode\u003e0.20\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e"],"correct":2},{"id":"dl-lfeydh1szv591","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q09","label":"Câu 9","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eMột layer dùng He initialization với công thức \u003ccode\u003estd = sqrt(2 / fan_in)\u003c/code\u003e. Nếu \u003ccode\u003efan_in=200\u003c/code\u003e, độ lệch chuẩn lý thuyết của weight là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efan_in = 200\nstd = (2.0 / fan_in) ** 0.5\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.01\u003c/code\u003e","\u003ccode\u003e0.10\u003c/code\u003e","\u003ccode\u003e0.20\u003c/code\u003e","\u003ccode\u003e1.00\u003c/code\u003e"],"correct":1},{"id":"dl-1tio9x51qpw9ev","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q10","label":"Câu 10","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eHai layer dùng cùng công thức He \u003ccode\u003estd = sqrt(2/fan_in)\u003c/code\u003e. Layer A có \u003ccode\u003efan_in=32\u003c/code\u003e, layer B có \u003ccode\u003efan_in=128\u003c/code\u003e. Cặp độ lệch chuẩn \u003ccode\u003e(std_A, std_B)\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003estd_A = (2.0 / 32) ** 0.5\nstd_B = (2.0 / 128) ** 0.5\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(0.125, 0.250)\u003c/code\u003e","\u003ccode\u003e(0.250, 0.125)\u003c/code\u003e","\u003ccode\u003e(0.250, 0.500)\u003c/code\u003e","\u003ccode\u003e(0.500, 0.250)\u003c/code\u003e"],"correct":1},{"id":"dl-dfwoyu1bumg78","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q11","label":"Câu 11","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eMuốn áp dụng Kaiming/He normal initialization cho weight của một \u003ccode\u003enn.Linear\u003c/code\u003e dùng ReLU. Đoạn code nào phù hợp?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003etorch.nn.init.zeros_(\n    layer.weight\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003etorch.nn.init.ones_(\n    layer.weight\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003etorch.nn.init.kaiming_normal_(\n    layer.weight,\n    mode=\"fan_in\",\n    nonlinearity=\"relu\"\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003etorch.nn.init.constant_(\n    layer.weight,\n    2.0\n)\u003c/code\u003e\u003c/pre\u003e"],"correct":2},{"id":"dl-1te2c0c6vcglu","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q12","label":"Câu 12","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eTrong câu này, SGD có L2 weight decay dùng gradient hiệu dụng \u003ccode\u003eg_eff = g + λw\u003c/code\u003e, sau đó cập nhật \u003ccode\u003ew_new = w - lr*g_eff\u003c/code\u003e. Cho \u003ccode\u003ew=2\u003c/code\u003e, \u003ccode\u003eg=3\u003c/code\u003e, \u003ccode\u003eλ=0.1\u003c/code\u003e và \u003ccode\u003elr=0.5\u003c/code\u003e. Giá trị \u003ccode\u003ew_new\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = 2.0\ng = 3.0\nweight_decay = 0.1\nlr = 0.5\n\ng_eff = g + weight_decay * w\nw_new = w - lr * g_eff\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.4\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e0.6\u003c/code\u003e","\u003ccode\u003e1.6\u003c/code\u003e"],"correct":0},{"id":"dl-1p9bdtlqsqacr","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q13","label":"Câu 13","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eDùng SGD không momentum với công thức \u003ccode\u003eg_eff = g + λw\u003c/code\u003e và \u003ccode\u003ew_new = w - lr*g_eff\u003c/code\u003e. Cho \u003ccode\u003ew=-4\u003c/code\u003e, gradient từ loss \u003ccode\u003eg=1\u003c/code\u003e, \u003ccode\u003eλ=0.25\u003c/code\u003e và \u003ccode\u003elr=0.1\u003c/code\u003e. Giá trị mới của \u003ccode\u003ew\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = -4.0\ng = 1.0\nweight_decay = 0.25\nlr = 0.1\n\ng_eff = g + weight_decay * w\nw_new = w - lr * g_eff\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-4.1\u003c/code\u003e","\u003ccode\u003e-4.0\u003c/code\u003e","\u003ccode\u003e-3.9\u003c/code\u003e","\u003ccode\u003e-3.6\u003c/code\u003e"],"correct":1},{"id":"dl-als6vr1renetz","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q14","label":"Câu 14","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eCho SGD không momentum với \u003ccode\u003eweight_decay=0.2\u003c/code\u003e. Trong câu này dùng \u003ccode\u003eg_eff = g + λw\u003c/code\u003e. Parameter \u003ccode\u003ew=5\u003c/code\u003e, gradient từ loss bằng \u003ccode\u003e0\u003c/code\u003e và \u003ccode\u003elr=0.1\u003c/code\u003e. Giá trị \u003ccode\u003ew\u003c/code\u003e sau một bước là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = 5.0\ng = 0.0\nweight_decay = 0.2\nlr = 0.1\n\ng_eff = g + weight_decay * w\nw_new = w - lr * g_eff\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e4.9\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e5.1\u003c/code\u003e"],"correct":1},{"id":"dl-8lkrxuruh1ja","chapter":"11","topic":"Phần 11 — Gradient clipping, He initialization và L2","source":{"id":"dl-p11-q15","label":"Câu 15","batch":"dl-p11"},"html":"\n      \n      \u003cp\u003eCho vector parameter \u003ccode\u003ew=[2,-1]\u003c/code\u003e và gradient từ loss \u003ccode\u003eg=[3,4]\u003c/code\u003e. SGD không momentum dùng \u0
