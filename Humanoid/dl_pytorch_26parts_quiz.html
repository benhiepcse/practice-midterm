en6c3ojrrrsc","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q02","label":"Câu 2","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eCho batch shape \u003ccode\u003e(3,2)\u003c/code\u003e. BatchNorm1d ở train mode sẽ tính mean riêng cho từng feature. Mean của hai feature là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor([\n    [1.0, 4.0],\n    [3.0, 8.0],\n    [5.0, 6.0]\n])\n\n# shape = (3, 2)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[3.0, 6.0]\u003c/code\u003e","\u003ccode\u003e[2.5, 6.5]\u003c/code\u003e","\u003ccode\u003e[3.0, 5.0]\u003c/code\u003e","\u003ccode\u003e[9.0, 18.0]\u003c/code\u003e"],"correct":0},{"id":"dl-1fr62301by4fme","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q03","label":"Câu 3","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eCho một feature trong batch có các giá trị \u003ccode\u003e[1,3,5]\u003c/code\u003e. Trong câu này variance của batch được định nghĩa là population variance \u003ccode\u003eΣ(xᵢ−μ)²/N\u003c/code\u003e. Giá trị variance bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = [1.0, 3.0, 5.0]\n\nmean = 3.0\nvariance = (\n    (1.0 - 3.0) ** 2\n    + (3.0 - 3.0) ** 2\n    + (5.0 - 3.0) ** 2\n) / 3\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e8 / 3\u003c/code\u003e","\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e8.0\u003c/code\u003e"],"correct":1},{"id":"dl-k22zdsizqkk8","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q04","label":"Câu 4","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eBatchNorm đang ở train mode với \u003ccode\u003eaffine=False\u003c/code\u003e, \u003ccode\u003eeps=0\u003c/code\u003e. Một feature có batch \u003ccode\u003e[2,4,6,8]\u003c/code\u003e. Dùng population variance. Giá trị chuẩn hóa của phần tử \u003ccode\u003e8\u003c/code\u003e gần nhất với phương án nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003evalues = [2.0, 4.0, 6.0, 8.0]\n\nmean = 5.0\nvariance = 5.0\n\ny = (8.0 - mean) / sqrt(variance)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.4472\u003c/code\u003e","\u003ccode\u003e0.8944\u003c/code\u003e","\u003ccode\u003e1.3416\u003c/code\u003e","\u003ccode\u003e2.2361\u003c/code\u003e"],"correct":2},{"id":"dl-rko1561ig0g7i","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q05","label":"Câu 5","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eBatchNorm1d đang ở train mode, \u003ccode\u003eaffine=True\u003c/code\u003e, \u003ccode\u003eeps=0\u003c/code\u003e. Với một feature, mean batch là \u003ccode\u003e3\u003c/code\u003e, variance là \u003ccode\u003e4\u003c/code\u003e, \u003ccode\u003eγ=2\u003c/code\u003e, \u003ccode\u003eβ=1\u003c/code\u003e. Output ứng với input \u003ccode\u003ex=5\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 5.0\nmean = 3.0\nvariance = 4.0\n\ngamma = 2.0\nbeta = 1.0\n\nnormalized = (x - mean) / sqrt(variance)\ny = gamma * normalized + beta\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e3.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e"],"correct":2},{"id":"dl-e1ctho12dn6oq","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q06","label":"Câu 6","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eMột \u003ccode\u003eBatchNorm1d(3)\u003c/code\u003e dùng \u003ccode\u003eaffine=True\u003c/code\u003e. Các tham số affine học được có shape nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebn = torch.nn.BatchNorm1d(\n    num_features=3,\n    affine=True\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eweight.shape == (3,)\u003c/code\u003e và \u003ccode\u003ebias.shape == (3,)\u003c/code\u003e","\u003ccode\u003eweight.shape == (1,)\u003c/code\u003e và \u003ccode\u003ebias.shape == (1,)\u003c/code\u003e","\u003ccode\u003eweight.shape == (3,3)\u003c/code\u003e và \u003ccode\u003ebias.shape == (3,)\u003c/code\u003e","\u003ccode\u003eweight.shape == (N,3)\u003c/code\u003e và \u003ccode\u003ebias.shape == (N,3)\u003c/code\u003e"],"correct":0},{"id":"dl-1d46ha31wx8ttt","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q07","label":"Câu 7","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eBatchNorm1d có \u003ccode\u003etrack_running_stats=True\u003c/code\u003e. Khi module đang ở \u003ccode\u003eeval()\u003c/code\u003e, thống kê nào được dùng để chuẩn hóa input?\u003c/p\u003e\n      \n    ","choices":["Mean và variance của riêng mẫu đầu tiên trong batch hiện tại.","Mean và variance tính lại từ batch hiện tại như khi train.","\u003ccode\u003erunning_mean\u003c/code\u003e và \u003ccode\u003erunning_var\u003c/code\u003e đã tích lũy khi train.","Mean bằng 0 và variance bằng 1 bất kể trạng thái đã học."],"correct":2},{"id":"dl-1twieoy12wcoa0","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q08","label":"Câu 8","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eBatchNorm1d đang ở eval mode với \u003ccode\u003eaffine=False\u003c/code\u003e, \u003ccode\u003erunning_mean=4\u003c/code\u003e, \u003ccode\u003erunning_var=4\u003c/code\u003e và \u003ccode\u003eeps=0\u003c/code\u003e. Output của input \u003ccode\u003ex=8\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erunning_mean = 4.0\nrunning_var = 4.0\neps = 0.0\n\nx = 8.0\n\ny = (x - running_mean) / sqrt(\n    running_var + eps\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e8.0\u003c/code\u003e"],"correct":1},{"id":"dl-duc0en1vnvtd3","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q09","label":"Câu 9","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eCho module BatchNorm với \u003ccode\u003etrack_running_stats=True\u003c/code\u003e. Đoạn code nào chuyển module sang chế độ dùng running statistics khi inference?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003ebn.train()\ny = bn(x)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003ebn.eval()\ny = bn(x)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003ebn.zero_grad()\ny = bn(x)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003ebn.requires_grad_(False)\nbn.train()\ny = bn(x)\u003c/code\u003e\u003c/pre\u003e"],"correct":1},{"id":"dl-p3ehrhtg4skp","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q10","label":"Câu 10","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eCho tensor shape \u003ccode\u003e(2,3)\u003c/code\u003e. \u003ccode\u003eLayerNorm(3)\u003c/code\u003e chuẩn hóa độc lập ba feature của từng hàng. Với \u003ccode\u003eaffine=False\u003c/code\u003e và \u003ccode\u003eeps=0\u003c/code\u003e, hàng đầu tiên \u003ccode\u003e[1,2,3]\u003c/code\u003e có mean và population variance nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor([\n    [1.0, 2.0, 3.0],\n    [4.0, 8.0, 12.0]\n])\n\nln = torch.nn.LayerNorm(\n    3,\n    eps=0.0,\n    elementwise_affine=False\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Mean \u003ccode\u003e2\u003c/code\u003e, variance \u003ccode\u003e2/3\u003c/code\u003e.","Mean \u003ccode\u003e2\u003c/code\u003e, variance \u003ccode\u003e1\u003c/code\u003e.","Mean \u003ccode\u003e3\u003c/code\u003e, variance \u003ccode\u003e2/3\u003c/code\u003e.","Mean \u003ccode\u003e5/2\u003c/code\u003e, variance \u003ccode\u003e1/2\u003c/code\u003e."],"correct":0},{"id":"dl-1q9plag147l73y","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q11","label":"Câu 11","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003e\u003ccode\u003eLayerNorm(3)\u003c/code\u003e được áp dụng lên một hàng \u003ccode\u003e[1,2,3]\u003c/code\u003e, với \u003ccode\u003eelementwise_affine=False\u003c/code\u003e và \u003ccode\u003eeps=0\u003c/code\u003e. Dùng population variance. Output gần đúng là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = [1.0, 2.0, 3.0]\n\nmean = 2.0\nvariance = 2.0 / 3.0\n\ny = (x - mean) / sqrt(variance)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[-1.000, 0.000, 1.000]\u003c/code\u003e","\u003ccode\u003e[-1.225, 0.000, 1.225]\u003c/code\u003e","\u003ccode\u003e[-0.816, 0.000, 0.816]\u003c/code\u003e","\u003ccode\u003e[0.000, 1.225, 2.449]\u003c/code\u003e"],"correct":1},{"id":"dl-10kjvol501nt3","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q12","label":"Câu 12","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eCho batch shape \u003ccode\u003e(2,2)\u003c/code\u003e dưới đây. BatchNorm chuẩn hóa theo feature qua batch, còn LayerNorm chuẩn hóa theo hai feature trong từng mẫu. Cặp mean nào mô tả đúng mean mà hai phép chuẩn hóa dùng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = [\n    [1.0, 3.0],\n    [5.0, 7.0]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["BatchNorm: \u003ccode\u003e[2,6]\u003c/code\u003e; LayerNorm: \u003ccode\u003e[3,5]\u003c/code\u003e.","BatchNorm: \u003ccode\u003e[3,5]\u003c/code\u003e; LayerNorm: \u003ccode\u003e[2,6]\u003c/code\u003e.","BatchNorm: \u003ccode\u003e[4,4]\u003c/code\u003e; LayerNorm: \u003ccode\u003e[4,4]\u003c/code\u003e.","BatchNorm: \u003ccode\u003e[1,7]\u003c/code\u003e; LayerNorm: \u003ccode\u003e[3,5]\u003c/code\u003e."],"correct":1},{"id":"dl-145ijwc1h0scau","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q13","label":"Câu 13","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003e\u003ccode\u003eLayerNorm\u003c/code\u003e được áp dụng lên tensor shape \u003ccode\u003e(4,5,8)\u003c/code\u003e với \u003ccode\u003enormalized_shape=8\u003c/code\u003e. Trục nào được chuẩn hóa trong cấu hình này?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex.shape == (4, 5, 8)\n\nln = torch.nn.LayerNorm(\n    normalized_shape=8\n)\n\ny = ln(x)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Chỉ chiều batch có kích thước 4.","Chỉ chiều cuối có kích thước 8.","Hai chiều cuối có kích thước 5 và 8.","Toàn bộ ba chiều 4, 5 và 8 cùng lúc."],"correct":1},{"id":"dl-12fcqkvil8hv7","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q14","label":"Câu 14","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eCho tensor shape \u003ccode\u003e(2,3,4)\u003c/code\u003e. Muốn \u003ccode\u003eLayerNorm\u003c/code\u003e chuẩn hóa đồng thời trên hai chiều cuối \u003ccode\u003e(3,4)\u003c/code\u003e của từng mẫu. Cách khai báo nào phù hợp?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex.shape == (2, 3, 4)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003enn.LayerNorm(2)\u003c/code\u003e","\u003ccode\u003enn.LayerNorm(3)\u003c/code\u003e","\u003ccode\u003enn.LayerNorm(4)\u003c/code\u003e","\u003ccode\u003enn.LayerNorm((3, 4))\u003c/code\u003e"],"correct":3},{"id":"dl-9yprjxer25x","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q15","label":"Câu 15","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eHai mẫu dưới đây được đưa riêng qua \u003ccode\u003eLayerNorm(2)\u003c/code\u003e, với \u003ccode\u003eelementwise_affine=False\u003c/code\u003e và \u003ccode\u003eeps=0\u003c/code\u003e. Dùng population variance. Output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = [\n    [2.0, 4.0],\n    [10.0, 14.0]\n]\n\n# LayerNorm chuẩn hóa từng hàng\n# độc lập trên 2 feature.\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003e[\n    [-1.0,  1.0],\n    [-1.0,  1.0]\n]\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003e[\n    [-2.0, 2.0],\n    [-2.0, 2.0]\n]\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003e[\n    [0.0, 1.0],\n    [0.0, 1.0]\n]\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003e[\n    [-1.0, -1.0],\n    [ 1.0,  1.0]\n]\u003c/code\u003e\u003c/pre\u003e"],"correct":0},{"id":"dl-1v4bx7gj2v71q","chapter":"17","topic":"Phần 17 — BatchNorm và LayerNorm","source":{"id":"dl-p17-q16","label":"Câu 16","batch":"dl-p17"},"html":"\n      \n      \u003cp\u003eMột model chứa cả BatchNorm và LayerNorm. Phát biểu nào mô tả đúng sự khác biệt được dùng trong các bài toán ở phần này?\u003c/p\u003e\n      \n    ","choices":["BatchNorm và LayerNorm đều luôn chuẩn hóa toàn bộ batch bằng một mean duy nhất.","BatchNorm chuẩn hóa từng mẫu theo feature, còn LayerNorm luôn chuẩn hóa qua batch.","BatchNorm không thay đổi hành vi giữa train và eval, còn LayerNorm chỉ hoạt động khi train.","BatchNorm thường dùng thống kê theo feature qua batch khi train, còn LayerNorm dùng thống kê trên các chiều được chuẩn hóa của từng mẫu."],"correct":3},{"id":"dl-1uogqks1h4r90m","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q01","label":"Câu 1","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eMột residual block được định nghĩa bởi \u003ccode\u003ey = x + F(x)\u003c/code\u003e. Với tensor dưới đây và \u003ccode\u003eF(x) = 2x\u003c/code\u003e, giá trị của \u003ccode\u003ey\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor([1.0, -2.0, 3.0])\n\ndef F(x):\n    return 2 * x\n\ny = x + F(x)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2.0, -4.0, 6.0]\u003c/code\u003e","\u003ccode\u003e[3.0, -6.0, 9.0]\u003c/code\u003e","\u003ccode\u003e[3.0, 0.0, 5.0]\u003c/code\u003e","\u003ccode\u003e[1.0, -2.0, 3.0]\u003c/code\u003e"],"correct":1},{"id":"dl-rs7ngc12zibtg","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q02","label":"Câu 2","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eCho residual block vô hướng với \u003ccode\u003eF(x) = x²\u003c/code\u003e. Với \u003ccode\u003ex=2\u003c/code\u003e, output \u003ccode\u003ey = x + F(x)\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 2.0\n\ndef F(x):\n    return x ** 2\n\ny = x + F(x)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e6.0\u003c/code\u003e","\u003ccode\u003e8.0\u003c/code\u003e","\u003ccode\u003e16.0\u003c/code\u003e"],"correct":1},{"id":"dl-1aispt11umt5pd","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q03","label":"Câu 3","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003ey = x + F(x)\u003c/code\u003e với \u003ccode\u003eF(x)=x²\u003c/code\u003e và loss chính là \u003ccode\u003eL=y\u003c/code\u003e. Tại \u003ccode\u003ex=2\u003c/code\u003e, gradient \u003ccode\u003edL/dx\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor(\n    2.0,\n    requires_grad=True\n)\n\ny = x + x ** 2\nloss = y\n\nloss.backward()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e6.0\u003c/code\u003e"],"correct":2},{"id":"dl-11z8lea8d37ls","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q04","label":"Câu 4","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eVới residual block \u003ccode\u003ey = x + F(x)\u003c/code\u003e, nếu \u003ccode\u003eF\u003c/code\u003e khả vi theo \u003ccode\u003ex\u003c/code\u003e, biểu thức nào đúng cho đạo hàm \u003ccode\u003edy/dx\u003c/code\u003e trong trường hợp vô hướng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003edy/dx = dF/dx\u003c/code\u003e","\u003ccode\u003edy/dx = 1 + dF/dx\u003c/code\u003e","\u003ccode\u003edy/dx = x + dF/dx\u003c/code\u003e","\u003ccode\u003edy/dx = 1 - dF/dx\u003c/code\u003e"],"correct":1},{"id":"dl-wh1a7wd0v1dc","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q05","label":"Câu 5","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eF(x)=2x\u003c/code\u003e, \u003ccode\u003ey=x+F(x)\u003c/code\u003e và \u003ccode\u003eL=y²\u003c/code\u003e. Tại \u003ccode\u003ex=3\u003c/code\u003e, giá trị của \u003ccode\u003edL/dx\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor(\n    3.0,\n    requires_grad=True\n)\n\ny = x + 2 * x\nloss = y ** 2\n\nloss.backward()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e18.0\u003c/code\u003e","\u003ccode\u003e27.0\u003c/code\u003e","\u003ccode\u003e36.0\u003c/code\u003e","\u003ccode\u003e54.0\u003c/code\u003e"],"correct":3},{"id":"dl-1s1c50y9z7cpu","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q06","label":"Câu 6","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eCho residual block \u003ccode\u003ey = x + wx\u003c/code\u003e, với \u003ccode\u003ex=2\u003c/code\u003e, \u003ccode\u003ew=3\u003c/code\u003e và \u003ccode\u003eL=y²\u003c/code\u003e. Gradient \u003ccode\u003edL/dw\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor(\n    2.0,\n    requires_grad=True\n)\n\nw = torch.tensor(\n    3.0,\n    requires_grad=True\n)\n\ny = x + w * x\nloss = y ** 2\n\nloss.backward()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e16.0\u003c/code\u003e","\u003ccode\u003e24.0\u003c/code\u003e","\u003ccode\u003e32.0\u003c/code\u003e","\u003ccode\u003e64.0\u003c/code\u003e"],"correct":2},{"id":"dl-gjcauh1szl963","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q07","label":"Câu 7","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eVẫn với \u003ccode\u003ey = x + wx\u003c/code\u003e, \u003ccode\u003ex=2\u003c/code\u003e, \u003ccode\u003ew=3\u003c/code\u003e và \u003ccode\u003eL=y²\u003c/code\u003e, gradient \u003ccode\u003edL/dx\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor(\n    2.0,\n    requires_grad=True\n)\n\nw = torch.tensor(\n    3.0,\n    requires_grad=True\n)\n\ny = x + w * x\nloss = y ** 2\n\nloss.backward()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e16.0\u003c/code\u003e","\u003ccode\u003e32.0\u003c/code\u003e","\u003ccode\u003e48.0\u003c/code\u003e","\u003ccode\u003e64.0\u003c/code\u003e"],"correct":3},{"id":"dl-m892kh18qovpz","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q08","label":"Câu 8","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eCho vector \u003ccode\u003ex\u003c/code\u003e, residual block \u003ccode\u003ey=x+2x\u003c/code\u003e và loss bằng tổng các phần tử của \u003ccode\u003ey\u003c/code\u003e. Sau \u003ccode\u003ebackward()\u003c/code\u003e, \u003ccode\u003ex.grad\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor(\n    [1.0, -2.0],\n    requires_grad=True\n)\n\ny = x + 2 * x\nloss = y.sum()\n\nloss.backward()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1.0, 1.0]\u003c/code\u003e","\u003ccode\u003e[2.0, 2.0]\u003c/code\u003e","\u003ccode\u003e[3.0, 3.0]\u003c/code\u003e","\u003ccode\u003e[3.0, -3.0]\u003c/code\u003e"],"correct":2},{"id":"dl-z7dp5u1j9reda","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q09","label":"Câu 9","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eMột residual block thực hiện phép cộng \u003ccode\u003eout + x\u003c/code\u003e. \u003ccode\u003eout\u003c/code\u003e có shape \u003ccode\u003e(8,64,16,16)\u003c/code\u003e, còn \u003ccode\u003ex\u003c/code\u003e có shape \u003ccode\u003e(8,32,32,32)\u003c/code\u003e. Vì sao phép cộng trực tiếp này không phù hợp?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eout.shape == (8, 64, 16, 16)\nx.shape   == (8, 32, 32, 32)\n\ny = out + x\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Hai nhánh không có shape tương thích để cộng từng phần tử.","Residual connection chỉ cho phép batch size bằng 1.","Skip connection bắt buộc phải dùng phép nhân thay vì phép cộng.","Tensor của nhánh chính không được phép có nhiều hơn 32 channel."],"correct":0},{"id":"dl-1oz2cmf10zc6vd","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q10","label":"Câu 10","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eMột \u003ccode\u003enn.Linear\u003c/code\u003e có \u003ccode\u003ein_features=64\u003c/code\u003e và \u003ccode\u003eout_features=32\u003c/code\u003e. Theo quy ước weight của PyTorch có shape \u003ccode\u003e(out_features, in_features)\u003c/code\u003e. Giá trị \u003ccode\u003efan_in\u003c/code\u003e và \u003ccode\u003efan_out\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elayer = torch.nn.Linear(\n    in_features=64,\n    out_features=32\n)\n\n# layer.weight.shape == (32, 64)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003efan_in=32, fan_out=64\u003c/code\u003e","\u003ccode\u003efan_in=64, fan_out=32\u003c/code\u003e","\u003ccode\u003efan_in=2048, fan_out=32\u003c/code\u003e","\u003ccode\u003efan_in=64, fan_out=2048\u003c/code\u003e"],"correct":1},{"id":"dl-125c6hq5haaku","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q11","label":"Câu 11","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eTrong câu này dùng Xavier uniform với \u003ccode\u003egain=1\u003c/code\u003e và công thức \u003ccode\u003ea = sqrt(6 / (fan_in + fan_out))\u003c/code\u003e. Với \u003ccode\u003efan_in=3\u003c/code\u003e và \u003ccode\u003efan_out=3\u003c/code\u003e, biên \u003ccode\u003ea\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efan_in = 3\nfan_out = 3\ngain = 1.0\n\na = gain * sqrt(\n    6.0 / (fan_in + fan_out)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003esqrt(2)\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e"],"correct":1},{"id":"dl-a8w03s101mb98","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q12","label":"Câu 12","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eDùng Xavier uniform với \u003ccode\u003egain=1\u003c/code\u003e. Nếu \u003ccode\u003efan_in=4\u003c/code\u003e và \u003ccode\u003efan_out=2\u003c/code\u003e, các weight được lấy từ khoảng nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efan_in = 4\nfan_out = 2\ngain = 1.0\n\na = sqrt(\n    6.0 / (fan_in + fan_out)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eU(-0.5, 0.5)\u003c/code\u003e","\u003ccode\u003eU(-1.0, 1.0)\u003c/code\u003e","\u003ccode\u003eU(0.0, 1.0)\u003c/code\u003e","\u003ccode\u003eN(0.0, 1.0)\u003c/code\u003e"],"correct":1},{"id":"dl-184fuvo1vfafe4","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q13","label":"Câu 13","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eDùng Xavier uniform với \u003ccode\u003egain=1\u003c/code\u003e. Một layer có \u003ccode\u003efan_in=8\u003c/code\u003e, \u003ccode\u003efan_out=16\u003c/code\u003e. Biên \u003ccode\u003ea\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efan_in = 8\nfan_out = 16\n\na = sqrt(\n    6.0 / (fan_in + fan_out)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003esqrt(0.5)\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e"],"correct":1},{"id":"dl-1uej7uw1fp4a2y","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q14","label":"Câu 14","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eMột weight matrix của \u003ccode\u003enn.Linear(10,20)\u003c/code\u003e có shape \u003ccode\u003e(20,10)\u003c/code\u003e. Nếu gọi \u003ccode\u003enn.init.xavier_uniform_(weight, gain=1.0)\u003c/code\u003e, giá trị \u003ccode\u003efan_in + fan_out\u003c/code\u003e dùng trong công thức bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elayer = torch.nn.Linear(10, 20)\n\n# layer.weight.shape == (20, 10)\n\ntorch.nn.init.xavier_uniform_(\n    layer.weight,\n    gain=1.0\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e10\u003c/code\u003e","\u003ccode\u003e20\u003c/code\u003e","\u003ccode\u003e30\u003c/code\u003e","\u003ccode\u003e200\u003c/code\u003e"],"correct":2},{"id":"dl-yddb241ryohci","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q15","label":"Câu 15","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eHai layer dùng Xavier uniform với cùng \u003ccode\u003egain=1\u003c/code\u003e. Layer A có \u003ccode\u003efan_in + fan_out = 24\u003c/code\u003e; layer B có \u003ccode\u003efan_in + fan_out = 96\u003c/code\u003e. So sánh biên \u003ccode\u003ea\u003c/code\u003e của hai phân phối khởi tạo.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ea = sqrt(\n    6.0 / (fan_in + fan_out)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003ea_A = a_B\u003c/code\u003e","\u003ccode\u003ea_A = 2 * a_B\u003c/code\u003e","\u003ccode\u003ea_A = 4 * a_B\u003c/code\u003e","\u003ccode\u003ea_B = 2 * a_A\u003c/code\u003e"],"correct":1},{"id":"dl-1q53akr168guiz","chapter":"18","topic":"Phần 18 — Residual và Xavier initialization","source":{"id":"dl-p18-q16","label":"Câu 16","batch":"dl-p18"},"html":"\n      \n      \u003cp\u003eĐoạn code nào khởi tạo weight của một \u003ccode\u003enn.Linear\u003c/code\u003e bằng Xavier uniform với \u003ccode\u003egain=1.0\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003etorch.nn.init.zeros_(\n    layer.weight\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003etorch.nn.init.xavier_uniform_(\n    layer.weight,\n    gain=1.0\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003etorch.nn.init.constant_(\n    layer.weight,\n    1.0\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003etorch.nn.init.ones_(\n    layer.weight\n)\u003c/code\u003e\u003c/pre\u003e"],"correct":1},{"id":"dl-12gkxwk1mxwr4u","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q01","label":"Câu 1","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eTrong train mode, xét inverted dropout với xác suất loại bỏ \u003ccode\u003ep=0.5\u003c/code\u003e. Mask đã được cố định như dưới đây, trong đó \u003ccode\u003e1\u003c/code\u003e nghĩa là giữ phần tử. Output bằng \u003ccode\u003ex * mask / (1-p)\u003c/code\u003e. Giá trị output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor([\n    2.0, 4.0, 6.0, 8.0\n])\n\np = 0.5\n\nmask = torch.tensor([\n    1.0, 0.0, 1.0, 0.0\n])\n\ny = x * mask / (1 - p)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2.0, 0.0, 6.0, 0.0]\u003c/code\u003e","\u003ccode\u003e[4.0, 0.0, 12.0, 0.0]\u003c/code\u003e","\u003ccode\u003e[1.0, 0.0, 3.0, 0.0]\u003c/code\u003e","\u003ccode\u003e[4.0, 8.0, 12.0, 16.0]\u003c/code\u003e"],"correct":1},{"id":"dl-1mzcldd1dkj0cl","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q02","label":"Câu 2","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eTrong train mode, inverted dropout có \u003ccode\u003ep=0.25\u003c/code\u003e. Mask cố định là \u003ccode\u003e[1,1,0,1]\u003c/code\u003e. Output được tính bằng \u003ccode\u003ex * mask / (1-p)\u003c/code\u003e. Output nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor([\n    3.0, 6.0, 9.0, 12.0\n])\n\np = 0.25\n\nmask = torch.tensor([\n    1.0, 1.0, 0.0, 1.0\n])\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2.25, 4.50, 0.00, 9.00]\u003c/code\u003e","\u003ccode\u003e[3.00, 6.00, 0.00, 12.00]\u003c/code\u003e","\u003ccode\u003e[4.00, 8.00, 0.00, 16.00]\u003c/code\u003e","\u003ccode\u003e[4.00, 8.00, 12.00, 16.00]\u003c/code\u003e"],"correct":2},{"id":"dl-1cvmpaaerix02","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q03","label":"Câu 3","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eMột layer \u003ccode\u003eDropout(p=0.4)\u003c/code\u003e đang ở evaluation mode. Với input xác định dưới đây, output là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edropout = torch.nn.Dropout(p=0.4)\ndropout.eval()\n\nx = torch.tensor([\n    2.0, -1.0, 5.0, 3.0\n])\n\ny = dropout(x)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1.2, -0.6, 3.0, 1.8]\u003c/code\u003e","\u003ccode\u003e[3.333, -1.667, 8.333, 5.000]\u003c/code\u003e","\u003ccode\u003e[0.0, -1.0, 0.0, 3.0]\u003c/code\u003e","\u003ccode\u003e[2.0, -1.0, 5.0, 3.0]\u003c/code\u003e"],"correct":3},{"id":"dl-1ed3rcf1xd70kd","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q04","label":"Câu 4","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eTrong train mode, inverted dropout dùng \u003ccode\u003ep=0.2\u003c/code\u003e. Một phần tử có giá trị \u003ccode\u003ex=8\u003c/code\u003e và mask cố định tại vị trí đó bằng \u003ccode\u003e1\u003c/code\u003e. Giá trị output tại vị trí này là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 8.0\np = 0.2\nmask = 1.0\n\ny = x * mask / (1 - p)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e6.4\u003c/code\u003e","\u003ccode\u003e8.0\u003c/code\u003e","\u003ccode\u003e10.0\u003c/code\u003e","\u003ccode\u003e12.5\u003c/code\u003e"],"correct":2},{"id":"dl-740rsn1y6w6k7","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q05","label":"Câu 5","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eMột model chứa Dropout. Đoạn code nào chuyển toàn bộ model sang evaluation mode để Dropout không còn loại ngẫu nhiên activation?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003emodel.eval()\noutput = model(x)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003emodel.zero_grad()\noutput = model(x)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003emodel.train()\noutput = model(x)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eoptimizer.zero_grad()\noutput = model(x)\u003c/code\u003e\u003c/pre\u003e"],"correct":0},{"id":"dl-h5nm961rju224","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q06","label":"Câu 6","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eHai parameter có gradient như dưới đây. Global L2 norm được tính bằng căn bậc hai của tổng bình phương tất cả phần tử gradient. Global gradient norm bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ep1.grad = torch.tensor([\n    3.0, 4.0\n])\n\np2.grad = torch.tensor([\n    0.0, 12.0\n])\n\nglobal_norm = sqrt(\n    3.0**2 + 4.0**2\n    + 0.0**2 + 12.0**2\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e12.0\u003c/code\u003e","\u003ccode\u003e13.0\u003c/code\u003e","\u003ccode\u003e17.0\u003c/code\u003e","\u003ccode\u003e25.0\u003c/code\u003e"],"correct":1},{"id":"dl-1clsixk7yggo0","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q07","label":"Câu 7","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eGlobal L2 norm của toàn bộ gradient là \u003ccode\u003e10\u003c/code\u003e và \u003ccode\u003emax_norm=5\u003c/code\u003e. Bỏ qua \u003ccode\u003eeps\u003c/code\u003e trong phép tính tay. Khi clipping được kích hoạt, hệ số chung nhân vào mọi gradient là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eglobal_norm = 10.0\nmax_norm = 5.0\n\nscale = max_norm / global_norm\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e1.00\u003c/code\u003e","\u003ccode\u003e2.00\u003c/code\u003e"],"correct":1},{"id":"dl-17tlv3h10amldv","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q08","label":"Câu 8","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eHai parameter có gradient \u003ccode\u003e[3,4]\u003c/code\u003e và \u003ccode\u003e[0,12]\u003c/code\u003e. Global L2 norm ban đầu là \u003ccode\u003e13\u003c/code\u003e. Dùng \u003ccode\u003emax_norm=6.5\u003c/code\u003e và bỏ qua \u003ccode\u003eeps\u003c/code\u003e. Gradient sau clipping là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eg1 = torch.tensor([3.0, 4.0])\ng2 = torch.tensor([0.0, 12.0])\n\nglobal_norm = 13.0\nmax_norm = 6.5\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eg1=[3.0,4.0], g2=[0.0,6.5]\u003c/code\u003e","\u003ccode\u003eg1=[1.5,2.0], g2=[0.0,6.0]\u003c/code\u003e","\u003ccode\u003eg1=[1.5,2.0], g2=[0.0,12.0]\u003c/code\u003e","\u003ccode\u003eg1=[3.0,4.0], g2=[0.0,12.0]\u003c/code\u003e"],"correct":1},{"id":"dl-17jumkvd8ak1j","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q09","label":"Câu 9","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eGlobal L2 norm của gradient là \u003ccode\u003e4\u003c/code\u003e và \u003ccode\u003emax_norm=10\u003c/code\u003e. Theo cơ chế gradient clipping theo norm, điều gì xảy ra?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eglobal_norm = 4.0\nmax_norm = 10.0\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Gradient được nhân với \u003ccode\u003e0.4\u003c/code\u003e.","Gradient được nhân với \u003ccode\u003e2.5\u003c/code\u003e.","Gradient được giữ nguyên vì norm chưa vượt ngưỡng.","Gradient được đặt toàn bộ thành \u003ccode\u003e0\u003c/code\u003e."],"correct":2},{"id":"dl-15jb4wnieoxqh","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q10","label":"Câu 10","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eBa parameter có các gradient vô hướng lần lượt là \u003ccode\u003e2\u003c/code\u003e, \u003ccode\u003e-3\u003c/code\u003e và \u003ccode\u003e6\u003c/code\u003e. Global L2 norm của ba gradient bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eg1 = 2.0\ng2 = -3.0\ng3 = 6.0\n\nglobal_norm = sqrt(\n    g1**2 + g2**2 + g3**2\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e7.0\u003c/code\u003e","\u003ccode\u003e9.0\u003c/code\u003e","\u003ccode\u003e11.0\u003c/code\u003e","\u003ccode\u003e49.0\u003c/code\u003e"],"correct":0},{"id":"dl-u6v5du1ieuyh2","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q11","label":"Câu 11","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eGradient của hai parameter là \u003ccode\u003e[6,8]\u003c/code\u003e và \u003ccode\u003e[0,0]\u003c/code\u003e. Dùng global L2 clipping với \u003ccode\u003emax_norm=2\u003c/code\u003e và bỏ qua \u003ccode\u003eeps\u003c/code\u003e. Gradient đầu tiên sau clipping là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eg1 = torch.tensor([\n    6.0, 8.0\n])\n\ng2 = torch.tensor([\n    0.0, 0.0\n])\n\nmax_norm = 2.0\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[6.0, 8.0]\u003c/code\u003e","\u003ccode\u003e[3.0, 4.0]\u003c/code\u003e","\u003ccode\u003e[1.2, 1.6]\u003c/code\u003e","\u003ccode\u003e[0.6, 0.8]\u003c/code\u003e"],"correct":2},{"id":"dl-12zubln11rdk4z","chapter":"19","topic":"Phần 19 — Dropout và global gradient clipping","source":{"id":"dl-p19-q12","label":"Câu 12","batch":"dl-p19"},"html":"\n      \n      \u003cp\u003eTrong một train step, muốn clip global gradient norm trước khi optimizer cập nhật parameter. Đoạn code nào có thứ tự phù hợp?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003eoptimizer.zero_grad()\nloss = loss_fn(model(x), y)\nloss.backward()\n\ntorch.nn.utils.clip_grad_norm_(\n    model.parameters(),\n    max_norm=1.0\n)\n\noptimizer.step()\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eoptimizer.zero_grad()\n\ntorch.nn.utils.clip_grad_norm_(\n    model.parameters(),\n    max_norm=1.0\n)\n\nloss = loss_fn(model(x), y)\nloss.backward()\noptimizer.step()\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eoptimizer.zero_grad()\nloss = loss_fn(model(x), y)\n\noptimizer.step()\nloss.backward()\n\ntorch.nn.utils.clip_grad_norm_(\n    model.parameters(),\n    max_norm=1.0\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eoptimizer.zero_grad()\nloss = loss_fn(model(x), y)\nloss.backward()\n\noptimizer.step()\n\ntorch.nn.utils.clip_grad_norm_(\n    model.parameters(),\n    max_norm=1.0\n)\u003c/code\u003e\u003c/pre\u003e"],"correct":0},{"id":"dl-1mcsbol15nslf","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q01","label":"Câu 1","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eMột bài toán multi-label có 4 nhãn độc lập. Batch size bằng 3. Model trả về một logit cho mỗi nhãn của mỗi mẫu. Shape phù hợp của \u003ccode\u003elogits\u003c/code\u003e và \u003ccode\u003etargets\u003c/code\u003e khi dùng \u003ccode\u003eBCEWithLogitsLoss\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebatch_size = 3\nnum_labels = 4\n\nloss_fn = torch.nn.BCEWithLogitsLoss()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Cả hai đều có shape \u003ccode\u003e(3, 4)\u003c/code\u003e.","\u003ccode\u003elogits\u003c/code\u003e là \u003ccode\u003e(3,4)\u003c/code\u003e, \u003ccode\u003etargets\u003c/code\u003e là \u003ccode\u003e(3,)\u003c/code\u003e.","\u003ccode\u003elogits\u003c/code\u003e là \u003ccode\u003e(3,)\u003c/code\u003e, \u003ccode\u003etargets\u003c/code\u003e là \u003ccode\u003e(3,4)\u003c/code\u003e.","Cả hai đều có shape \u003ccode\u003e(4, 3, 1)\u003c/code\u003e."],"correct":0},{"id":"dl-1iqnlhm10vvi1o","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q02","label":"Câu 2","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eMột mẫu có thể đồng thời thuộc các nhãn 0 và 2 trong tổng số 4 nhãn. Target nào phù hợp cho bài toán multi-label với \u003ccode\u003eBCEWithLogitsLoss\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003etarget = 2\u003c/code\u003e","\u003ccode\u003etarget = [0, 2]\u003c/code\u003e","\u003ccode\u003etarget = [1.0, 0.0, 1.0, 0.0]\u003c/code\u003e","\u003ccode\u003etarget = [0.0, 0.0, 1.0, 0.0]\u003c/code\u003e"],"correct":2},{"id":"dl-1l1cuht17x7uu7","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q03","label":"Câu 3","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eCho hai logits đều bằng \u003ccode\u003e0\u003c/code\u003e và targets là \u003ccode\u003e[1,0]\u003c/code\u003e. Dùng \u003ccode\u003eBCEWithLogitsLoss(reduction=\"none\")\u003c/code\u003e. Biết \u003ccode\u003esigmoid(0)=0.5\u003c/code\u003e và \u003ccode\u003e-ln(0.5)≈0.6931\u003c/code\u003e. Loss từng phần tử là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elogits = torch.tensor([\n    0.0, 0.0\n])\n\ntargets = torch.tensor([\n    1.0, 0.0\n])\n\nloss_fn = torch.nn.BCEWithLogitsLoss(\n    reduction=\"none\"\n)\n\nloss = loss_fn(logits, targets)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.0000, 0.0000]\u003c/code\u003e","\u003ccode\u003e[0.5000, 0.5000]\u003c/code\u003e","\u003ccode\u003e[0.6931, 0.6931]\u003c/code\u003e","\u003ccode\u003e[1.0000, 1.0000]\u003c/code\u003e"],"correct":2},{"id":"dl-1iu4i7i121edbu","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q04","label":"Câu 4","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eVới cùng dữ liệu dưới đây, dùng \u003ccode\u003eBCEWithLogitsLoss(reduction=\"mean\")\u003c/code\u003e. Loss xấp xỉ bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elogits = torch.tensor([\n    0.0, 0.0\n])\n\ntargets = torch.tensor([\n    1.0, 0.0\n])\n\nloss_fn = torch.nn.BCEWithLogitsLoss(\n    reduction=\"mean\"\n)\n\nloss = loss_fn(logits, targets)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.3466\u003c/code\u003e","\u003ccode\u003e0.6931\u003c/code\u003e","\u003ccode\u003e1.0000\u003c/code\u003e","\u003ccode\u003e1.3862\u003c/code\u003e"],"correct":1},{"id":"dl-1uvb79l1swdi5f","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q05","label":"Câu 5","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eModel trả về raw logits cho bài toán multi-label. Đoạn code nào dùng \u003ccode\u003eBCEWithLogitsLoss\u003c/code\u003e đúng cách mà không áp dụng sigmoid dư thừa trước loss?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003elogits = model(x)\nloss = loss_fn(\n    torch.sigmoid(logits),\n    targets\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003elogits = model(x)\nloss = loss_fn(\n    logits,\n    targets\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003elogits = model(x)\nloss = loss_fn(\n    torch.softmax(logits, dim=1),\n    targets\n)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003elogits = model(x)\nlabels = torch.argmax(logits, dim=1)\nloss = loss_fn(\n    labels.float(),\n    targets\n)\u003c/code\u003e\u003c/pre\u003e"],"correct":1},{"id":"dl-f08c1hbghqkd","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q06","label":"Câu 6","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eMột model multi-label tạo logits \u003ccode\u003e[2.0, -1.0, 0.4]\u003c/code\u003e. Khi inference, quy tắc là dự đoán nhãn dương nếu \u003ccode\u003esigmoid(logit) \u0026gt; 0.5\u003c/code\u003e. Không có logit nào bằng 0. Vector dự đoán là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elogits = torch.tensor([\n    2.0, -1.0, 0.4\n])\n\nprobs = torch.sigmoid(logits)\npred = (probs \u0026gt; 0.5)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1, 0, 1]\u003c/code\u003e","\u003ccode\u003e[1, 0, 0]\u003c/code\u003e","\u003ccode\u003e[0, 1, 0]\u003c/code\u003e","\u003ccode\u003e[0, 1, 1]\u003c/code\u003e"],"correct":0},{"id":"dl-t19j162xa8wm","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q07","label":"Câu 7","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eCho bài toán multiclass sequence classification với 3 lớp. Target \u003ccode\u003e-100\u003c/code\u003e biểu diễn padding và \u003ccode\u003eCrossEntropyLoss(ignore_index=-100)\u003c/code\u003e được sử dụng. Có bao nhiêu vị trí hợp lệ tham gia tính loss?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etargets = torch.tensor([\n    [   0,    2, -100, -100],\n    [   1,    0,    2, -100]\n])\n\nloss_fn = torch.nn.CrossEntropyLoss(\n    ignore_index=-100,\n    reduction=\"mean\"\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e3\u003c/code\u003e vị trí","\u003ccode\u003e4\u003c/code\u003e vị trí","\u003ccode\u003e5\u003c/code\u003e vị trí","\u003ccode\u003e8\u003c/code\u003e vị trí"],"correct":2},{"id":"dl-ammdegfkz9ks","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q08","label":"Câu 8","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eCho 3 vị trí sequence với 3 lớp. Logits tại mọi vị trí đều bằng 0 nên cross entropy tại mỗi vị trí hợp lệ bằng \u003ccode\u003eln(3)≈1.0986\u003c/code\u003e. Vị trí thứ hai là padding. Với \u003ccode\u003eignore_index=-100\u003c/code\u003e và \u003ccode\u003ereduction=\"mean\"\u003c/code\u003e, loss bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elogits = torch.zeros(\n    1, 3, 3\n)\n\ntargets = torch.tensor([\n    [0, -100, 2]\n])\n\nloss_fn = torch.nn.CrossEntropyLoss(\n    ignore_index=-100,\n    reduction=\"mean\"\n)\n\nloss = loss_fn(\n    logits.transpose(1, 2),\n    targets\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.7324\u003c/code\u003e","\u003ccode\u003e1.0986\u003c/code\u003e","\u003ccode\u003e2.1972\u003c/code\u003e","\u003ccode\u003e3.2958\u003c/code\u003e"],"correct":1},{"id":"dl-5ey0r1tujomp","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q09","label":"Câu 9","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eVẫn dùng dữ liệu dưới đây nhưng đổi sang \u003ccode\u003ereduction=\"none\"\u003c/code\u003e. Loss tại vị trí padding được bỏ qua có giá trị nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elogits = torch.zeros(\n    1, 3, 3\n)\n\ntargets = torch.tensor([\n    [0, -100, 2]\n])\n\nloss_fn = torch.nn.CrossEntropyLoss(\n    ignore_index=-100,\n    reduction=\"none\"\n)\n\nloss = loss_fn(\n    logits.transpose(1, 2),\n    targets\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-100.0000\u003c/code\u003e","\u003ccode\u003e0.0000\u003c/code\u003e","\u003ccode\u003e0.6931\u003c/code\u003e","\u003ccode\u003e1.0986\u003c/code\u003e"],"correct":1},{"id":"dl-173eidm1x7j8e6","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q10","label":"Câu 10","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eBốn token có loss trước khi áp dụng padding mask lần lượt là \u003ccode\u003e[0.2,0.8,1.4,5.0]\u003c/code\u003e. Token cuối là padding và bị \u003ccode\u003eignore_index\u003c/code\u003e loại khỏi loss. Với \u003ccode\u003ereduction=\"mean\"\u003c/code\u003e và các token hợp lệ có trọng số như nhau, loss cuối là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003evalid_losses = [\n    0.2,\n    0.8,\n    1.4\n]\n\n# 5.0 thuộc vị trí padding,\n# không tham gia mean.\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.60\u003c/code\u003e","\u003ccode\u003e0.80\u003c/code\u003e","\u003ccode\u003e1.85\u003c/code\u003e","\u003ccode\u003e2.40\u003c/code\u003e"],"correct":1},{"id":"dl-hh7zbkuz1m5i","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q11","label":"Câu 11","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eMột batch sequence có target như dưới đây. Với \u003ccode\u003eignore_index=-1\u003c/code\u003e, bao nhiêu target hợp lệ được dùng khi tính \u003ccode\u003eCrossEntropyLoss\u003c/code\u003e?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etargets = torch.tensor([\n    [ 2,  0, -1, -1, -1],\n    [ 1,  2,  0,  1, -1],\n    [ 0,  2,  1, -1, -1]\n])\n\nignore_index = -1\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e7\u003c/code\u003e","\u003ccode\u003e8\u003c/code\u003e","\u003ccode\u003e9\u003c/code\u003e","\u003ccode\u003e15\u003c/code\u003e"],"correct":1},{"id":"dl-o87e0n1ygojt9","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q12","label":"Câu 12","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eMột bài toán có 5 nhãn và mỗi ảnh có thể đồng thời chứa nhiều thuộc tính độc lập. Lựa chọn nào phù hợp nhất cho output và loss?\u003c/p\u003e\n      \n    ","choices":["Model xuất 5 logits; target là vector 5 giá trị 0/1; dùng \u003ccode\u003eBCEWithLogitsLoss\u003c/code\u003e.","Model xuất 5 logits; target là một class index duy nhất; dùng \u003ccode\u003eBCEWithLogitsLoss\u003c/code\u003e.","Model xuất 1 logit; target là vector 5 class index; dùng \u003ccode\u003eCrossEntropyLoss\u003c/code\u003e.","Model xuất 5 xác suất softmax tổng bằng 1; mỗi mẫu bắt buộc chọn nhiều class cùng lúc."],"correct":0},{"id":"dl-1pp3tttkudrxp","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q13","label":"Câu 13","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eĐoạn code dưới đây dùng \u003ccode\u003eCrossEntropyLoss\u003c/code\u003e cho sequence labeling. \u003ccode\u003elogits\u003c/code\u003e ban đầu có shape \u003ccode\u003e(N,L,C)=(2,4,3)\u003c/code\u003e. Sau \u003ccode\u003epermute\u003c/code\u003e, shape nào được truyền vào loss để chiều class nằm ở vị trí thứ hai?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elogits.shape == (2, 4, 3)\ntargets.shape == (2, 4)\n\nloss_fn = torch.nn.CrossEntropyLoss(\n    ignore_index=-100\n)\n\nlogits_for_loss = logits.permute(\n    0, 2, 1\n)\n\nloss = loss_fn(\n    logits_for_loss,\n    targets\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(2, 4, 3)\u003c/code\u003e","\u003ccode\u003e(4, 2, 3)\u003c/code\u003e","\u003ccode\u003e(2, 3, 4)\u003c/code\u003e","\u003ccode\u003e(3, 4, 2)\u003c/code\u003e"],"correct":2},{"id":"dl-1c96i4b3rgx69","chapter":"20","topic":"Phần 20 — Multi-label BCE và padding loss","source":{"id":"dl-p20-q14","label":"Câu 14","batch":"dl-p20"},"html":"\n      \n      \u003cp\u003eMột batch có 6 vị trí hợp lệ sau khi bỏ padding. Loss tại các vị trí hợp lệ là \u003ccode\u003e[0.3,0.9,0.6,1.2,0.4,0.8]\u003c/code\u003e. Với \u003ccode\u003ereduction=\"mean\"\u003c/code\u003e và không dùng class weight, loss cuối cùng bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003evalid_losses = torch.tensor([\n    0.3, 0.9, 0.6,\n    1.2, 0.4, 0.8\n])\n\nloss = valid_losses.mean()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.60\u003c/code\u003e","\u003ccode\u003e0.65\u003c/code\u003e","\u003ccode\u003e0.70\u003c/code\u003e","\u003ccode\u003e0.75\u003c/code\u003e"],"correct":2},{"id":"dl-jjwxfo22i1ys","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q01","label":"Câu 1","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eMột autoencoder nhận vector input có 6 feature, encoder nén xuống latent có 2 feature, decoder tái tạo lại vector ban đầu. Cặp layer nào có shape phù hợp?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eencoder = ?\ndecoder = ?\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003enn.Linear(6, 2)\u003c/code\u003e và \u003ccode\u003enn.Linear(2, 6)\u003c/code\u003e","\u003ccode\u003enn.Linear(2, 6)\u003c/code\u003e và \u003ccode\u003enn.Linear(6, 2)\u003c/code\u003e","\u003ccode\u003enn.Linear(6, 6)\u003c/code\u003e và \u003ccode\u003enn.Linear(2, 2)\u003c/code\u003e","\u003ccode\u003enn.Linear(6, 2)\u003c/code\u003e và \u003ccode\u003enn.Linear(6, 2)\u003c/code\u003e"],"correct":0},{"id":"dl-cs8gj4pwvudc","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q02","label":"Câu 2","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eInput batch có shape \u003ccode\u003e(8,4)\u003c/code\u003e. Encoder là \u003ccode\u003enn.Linear(4,2)\u003c/code\u003e và decoder là \u003ccode\u003enn.Linear(2,4)\u003c/code\u003e. Shape của latent \u003ccode\u003ez\u003c/code\u003e và reconstruction \u003ccode\u003ex_hat\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex.shape == (8, 4)\n\nencoder = nn.Linear(4, 2)\ndecoder = nn.Linear(2, 4)\n\nz = encoder(x)\nx_hat = decoder(z)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003ez: (4,2)\u003c/code\u003e, \u003ccode\u003ex_hat: (4,4)\u003c/code\u003e","\u003ccode\u003ez: (8,4)\u003c/code\u003e, \u003ccode\u003ex_hat: (8,2)\u003c/code\u003e","\u003ccode\u003ez: (8,2)\u003c/code\u003e, \u003ccode\u003ex_hat: (8,4)\u003c/code\u003e","\u003ccode\u003ez: (2,8)\u003c/code\u003e, \u003ccode\u003ex_hat: (4,8)\u003c/code\u003e"],"correct":2},{"id":"dl-wylnvr1aeoa4h","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q03","label":"Câu 3","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eMột autoencoder tuyến tính vô hướng có encoder \u003ccode\u003ez = 2x + 1\u003c/code\u003e và decoder \u003ccode\u003ex_hat = 3z - 2\u003c/code\u003e. Với \u003ccode\u003ex=2\u003c/code\u003e, reconstruction bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 2.0\n\nz = 2.0 * x + 1.0\nx_hat = 3.0 * z - 2.0\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e10.0\u003c/code\u003e","\u003ccode\u003e13.0\u003c/code\u003e","\u003ccode\u003e15.0\u003c/code\u003e"],"correct":2},{"id":"dl-1imiz0sqdsslu","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q04","label":"Câu 4","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eCho reconstruction và target dưới đây. Dùng \u003ccode\u003eMSELoss(reduction=\"mean\")\u003c/code\u003e. Loss bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex_hat = torch.tensor([\n    1.0, 3.0\n])\n\nx = torch.tensor([\n    2.0, 1.0\n])\n\nloss_fn = nn.MSELoss(\n    reduction=\"mean\"\n)\n\nloss = loss_fn(x_hat, x)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.5\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e"],"correct":2},{"id":"dl-107ekpk1cpqvoi","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q05","label":"Câu 5","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eVới cùng reconstruction và target dưới đây, dùng \u003ccode\u003eMSELoss(reduction=\"sum\")\u003c/code\u003e. Loss bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex_hat = torch.tensor([\n    1.0, 3.0\n])\n\nx = torch.tensor([\n    2.0, 1.0\n])\n\nloss_fn = nn.MSELoss(\n    reduction=\"sum\"\n)\n\nloss = loss_fn(x_hat, x)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e","\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e"],"correct":3},{"id":"dl-1wwtcqkmh6fbw","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q06","label":"Câu 6","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eAutoencoder vô hướng không có bias được định nghĩa như dưới đây. Với \u003ccode\u003ex=2\u003c/code\u003e, \u003ccode\u003ew_e=3\u003c/code\u003e, \u003ccode\u003ew_d=0.5\u003c/code\u003e, reconstruction \u003ccode\u003ex_hat\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 2.0\nw_e = 3.0\nw_d = 0.5\n\nz = w_e * x\nx_hat = w_d * z\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e3.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e6.0\u003c/code\u003e"],"correct":1},{"id":"dl-avo5j71yw8jz3","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q07","label":"Câu 7","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eCho autoencoder vô hướng không bias. Loss là \u003ccode\u003eL=(x_hat-x)²\u003c/code\u003e. Với các giá trị dưới đây, gradient \u003ccode\u003edL/dw_d\u003c/code\u003e của decoder weight bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 2.0\nw_e = 1.0\nw_d = 3.0\n\nz = w_e * x\nx_hat = w_d * z\nloss = (x_hat - x) ** 2\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e8.0\u003c/code\u003e","\u003ccode\u003e12.0\u003c/code\u003e","\u003ccode\u003e16.0\u003c/code\u003e","\u003ccode\u003e24.0\u003c/code\u003e"],"correct":2},{"id":"dl-b2dd5r144ewnh","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q08","label":"Câu 8","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eCho autoencoder vô hướng không bias. Loss là \u003ccode\u003eL=(x_hat-x)²\u003c/code\u003e. Với các giá trị dưới đây, gradient \u003ccode\u003edL/dw_e\u003c/code\u003e của encoder weight bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 2.0\nw_e = 1.0\nw_d = 3.0\n\nz = w_e * x\nx_hat = w_d * z\nloss = (x_hat - x) ** 2\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e16.0\u003c/code\u003e","\u003ccode\u003e24.0\u003c/code\u003e","\u003ccode\u003e32.0\u003c/code\u003e","\u003ccode\u003e48.0\u003c/code\u003e"],"correct":3},{"id":"dl-o50aqf1tdz771","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q09","label":"Câu 9","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eEncoder và decoder đều có parameter với \u003ccode\u003erequires_grad=True\u003c/code\u003e. Reconstruction loss được tính từ output decoder và gọi \u003ccode\u003eloss.backward()\u003c/code\u003e. Nếu không có \u003ccode\u003edetach()\u003c/code\u003e và mọi phép toán đều khả vi, parameter nào nhận gradient?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ez = encoder(x)\nx_hat = decoder(z)\n\nloss = loss_fn(x_hat, x)\nloss.backward()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Chỉ parameter của encoder.","Chỉ parameter của decoder.","Cả parameter của encoder và decoder.","Không parameter nào nhận gradient."],"correct":2},{"id":"dl-1kj5y9v41noq1","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q10","label":"Câu 10","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eTrong đoạn code dưới đây, latent bị \u003ccode\u003edetach()\u003c/code\u003e trước khi truyền vào decoder. Reconstruction loss chỉ phụ thuộc vào \u003ccode\u003ex_hat\u003c/code\u003e. Điều nào đúng sau \u003ccode\u003eloss.backward()\u003c/code\u003e?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ez = encoder(x)\nz_detached = z.detach()\n\nx_hat = decoder(z_detached)\nloss = loss_fn(x_hat, x)\n\nloss.backward()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Gradient từ loss vẫn truyền qua \u003ccode\u003ez_detached\u003c/code\u003e vào encoder.","Decoder có thể nhận gradient, nhưng gradient từ loss không truyền ngược qua \u003ccode\u003edetach()\u003c/code\u003e vào encoder.","Encoder nhận gradient nhưng decoder không nhận gradient.","\u003ccode\u003edetach()\u003c/code\u003e làm thay đổi giá trị số của latent thành 0."],"correct":1},{"id":"dl-1ro6e5cxbnpu","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q11","label":"Câu 11","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eAutoencoder vô hướng có \u003ccode\u003ex=2\u003c/code\u003e, \u003ccode\u003ew_e=1\u003c/code\u003e, \u003ccode\u003ew_d=3\u003c/code\u003e, loss \u003ccode\u003eL=(x_hat-x)²\u003c/code\u003e. Biết \u003ccode\u003edL/dw_d=16\u003c/code\u003e. Thực hiện một bước SGD chỉ cho decoder với learning rate \u003ccode\u003e0.1\u003c/code\u003e. Giá trị mới của \u003ccode\u003ew_d\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew_d = 3.0\ngrad_w_d = 16.0\nlr = 0.1\n\nw_d_new = w_d - lr * grad_w_d\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.4\u003c/code\u003e","\u003ccode\u003e1.6\u003c/code\u003e","\u003ccode\u003e3.1\u003c/code\u003e","\u003ccode\u003e4.6\u003c/code\u003e"],"correct":0},{"id":"dl-wj2dn51b2ueih","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q12","label":"Câu 12","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eAutoencoder vô hướng có \u003ccode\u003ex=2\u003c/code\u003e, \u003ccode\u003ew_e=1\u003c/code\u003e, \u003ccode\u003ew_d=3\u003c/code\u003e, loss \u003ccode\u003eL=(x_hat-x)²\u003c/code\u003e. Biết \u003ccode\u003edL/dw_e=48\u003c/code\u003e. Thực hiện một bước SGD cho encoder với learning rate \u003ccode\u003e0.05\u003c/code\u003e. Giá trị mới của \u003ccode\u003ew_e\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew_e = 1.0\ngrad_w_e = 48.0\nlr = 0.05\n\nw_e_new = w_e - lr * grad_w_e\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-2.4\u003c/code\u003e","\u003ccode\u003e-1.4\u003c/code\u003e","\u003ccode\u003e1.4\u003c/code\u003e","\u003ccode\u003e3.4\u003c/code\u003e"],"correct":1},{"id":"dl-vwgdec115xw5i","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q13","label":"Câu 13","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eMột batch có reconstruction và target như dưới đây. Dùng \u003ccode\u003eMSELoss(reduction=\"mean\")\u003c/code\u003e, tức lấy trung bình trên cả 4 phần tử. Loss bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex_hat = torch.tensor([\n    [1.0, 2.0],\n    [5.0, 4.0]\n])\n\nx = torch.tensor([\n    [0.0, 2.0],\n    [3.0, 6.0]\n])\n\nloss_fn = nn.MSELoss(\n    reduction=\"mean\"\n)\n\nloss = loss_fn(x_hat, x)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.25\u003c/code\u003e","\u003ccode\u003e2.00\u003c/code\u003e","\u003ccode\u003e2.25\u003c/code\u003e","\u003ccode\u003e3.00\u003c/code\u003e"],"correct":2},{"id":"dl-vgju1n12ya483","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q14","label":"Câu 14","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eMột autoencoder có encoder \u003ccode\u003e4→2\u003c/code\u003e và decoder \u003ccode\u003e2→4\u003c/code\u003e. Với batch size 10, đoạn code nào thực hiện đúng luồng encoder → latent → decoder → reconstruction loss?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003ez = encoder(x)\nx_hat = decoder(z)\nloss = loss_fn(x_hat, x)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003ex_hat = encoder(x)\nz = decoder(x_hat)\nloss = loss_fn(z, x)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003ez = decoder(x)\nx_hat = encoder(z)\nloss = loss_fn(x_hat, z)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003ez = encoder(x)\nloss = loss_fn(z, x)\nx_hat = decoder(x)\u003c/code\u003e\u003c/pre\u003e"],"correct":0},{"id":"dl-u5421w1vcgces","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q15","label":"Câu 15","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eAutoencoder vô hướng không bias dùng \u003ccode\u003ex=1\u003c/code\u003e, \u003ccode\u003ew_e=2\u003c/code\u003e, \u003ccode\u003ew_d=2\u003c/code\u003e và \u003ccode\u003eL=(x_hat-x)²\u003c/code\u003e. Giá trị của loss là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 1.0\nw_e = 2.0\nw_d = 2.0\n\nz = w_e * x\nx_hat = w_d * z\nloss = (x_hat - x) ** 2\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e3.0\u003c/code\u003e","\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e8.0\u003c/code\u003e","\u003ccode\u003e9.0\u003c/code\u003e"],"correct":3},{"id":"dl-1t7u1l01uk2g56","chapter":"21","topic":"Phần 21 — Autoencoder","source":{"id":"dl-p21-q16","label":"Câu 16","batch":"dl-p21"},"html":"\n      \n      \u003cp\u003eMột autoencoder tuyến tính vô hướng có \u003ccode\u003ex=1\u003c/code\u003e, encoder weight \u003ccode\u003ew_e=2\u003c/code\u003e, decoder weight \u003ccode\u003ew_d=1\u003c/code\u003e, không bias. Loss là \u003ccode\u003eL=(x_hat-x)²\u003c/code\u003e. Biết gradient tại trạng thái hiện tại là \u003ccode\u003edL/dw_e=2\u003c/code\u003e và \u003ccode\u003edL/dw_d=4\u003c/code\u003e. Nếu SGD dùng \u003ccode\u003elr=0.1\u003c/code\u003e và cập nhật đồng thời từ các giá trị weight cũ, cặp weight mới là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew_e = 2.0\nw_d = 1.0\n\ngrad_w_e = 2.0\ngrad_w_d = 4.0\n\nlr = 0.1\n\nw_e_new = w_e - lr * grad_w_e\nw_d_new = w_d - lr * grad_w_d\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003ew_e=1.8, w_d=0.6\u003c/code\u003e","\u003ccode\u003ew_e=2.2, w_d=1.4\u003c/code\u003e","\u003ccode\u003ew_e=1.6, w_d=0.8\u003c/code\u003e","\u003ccode\u003ew_e=2.0, w_d=0.6\u003c/code\u003e"],"correct":0},{"id":"dl-pykd1d1i4bwpv","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q01","label":"Câu 1","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eTrong VAE, encoder trả về \u003ccode\u003emu\u003c/code\u003e và \u003ccode\u003elogvar\u003c/code\u003e, trong đó \u003ccode\u003elogvar = log(σ²)\u003c/code\u003e. Đoạn code nào tính đúng standard deviation \u003ccode\u003estd = σ\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003estd = torch.exp(logvar)\u003c/code\u003e","\u003ccode\u003estd = torch.exp(0.5 * logvar)\u003c/code\u003e","\u003ccode\u003estd = 0.5 * torch.exp(logvar)\u003c/code\u003e","\u003ccode\u003estd = torch.sqrt(logvar)\u003c/code\u003e"],"correct":1},{"id":"dl-1trw0ze1sa2pa","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q02","label":"Câu 2","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003emu=2\u003c/code\u003e, \u003ccode\u003elogvar=0\u003c/code\u003e và giá trị nhiễu được cung cấp cố định \u003ccode\u003eepsilon=-0.5\u003c/code\u003e. Dùng reparameterization \u003ccode\u003ez = mu + std * epsilon\u003c/code\u003e với \u003ccode\u003estd = exp(0.5 * logvar)\u003c/code\u003e. Giá trị \u003ccode\u003ez\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emu = 2.0\nlogvar = 0.0\nepsilon = -0.5\n\nstd = exp(0.5 * logvar)\nz = mu + std * epsilon\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e1.5\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e"],"correct":2},{"id":"dl-r950c716rqwr3","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q03","label":"Câu 3","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003elogvar = log(4)\u003c/code\u003e. Variance và standard deviation tương ứng là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elogvar = log(4.0)\n\nvariance = exp(logvar)\nstd = exp(0.5 * logvar)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003evariance=2, std=4\u003c/code\u003e","\u003ccode\u003evariance=4, std=2\u003c/code\u003e","\u003ccode\u003evariance=4, std=4\u003c/code\u003e","\u003ccode\u003evariance=2, std=2\u003c/code\u003e"],"correct":1},{"id":"dl-1u7qmad11v24nv","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q04","label":"Câu 4","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003emu=[1, -1]\u003c/code\u003e, \u003ccode\u003elogvar=[0,0]\u003c/code\u003e và \u003ccode\u003eepsilon=[2, -0.5]\u003c/code\u003e. Dùng \u003ccode\u003ez = mu + exp(0.5*logvar) * epsilon\u003c/code\u003e. Giá trị \u003ccode\u003ez\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emu = torch.tensor([\n     1.0, -1.0\n])\n\nlogvar = torch.tensor([\n    0.0, 0.0\n])\n\nepsilon = torch.tensor([\n     2.0, -0.5\n])\n\nstd = torch.exp(0.5 * logvar)\nz = mu + std * epsilon\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2.0, -0.5]\u003c/code\u003e","\u003ccode\u003e[3.0, -1.5]\u003c/code\u003e","\u003ccode\u003e[3.0, -0.5]\u003c/code\u003e","\u003ccode\u003e[1.0, -1.0]\u003c/code\u003e"],"correct":1},{"id":"dl-2y4qspb1oyyr","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q05","label":"Câu 5","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eTrong câu này, KL divergence giữa \u003ccode\u003eq(z|x)=N(mu, diag(σ²))\u003c/code\u003e và prior \u003ccode\u003eN(0,I)\u003c/code\u003e được tính theo công thức \u003ccode\u003eKLD = -0.5 * Σ(1 + logvar - mu² - exp(logvar))\u003c/code\u003e. Với \u003ccode\u003emu=0\u003c/code\u003e và \u003ccode\u003elogvar=0\u003c/code\u003e, KLD bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emu = torch.tensor([0.0])\nlogvar = torch.tensor([0.0])\n\nKLD = -0.5 * torch.sum(\n    1 + logvar\n    - mu.pow(2)\n    - logvar.exp()\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e"],"correct":0},{"id":"dl-1g6hpjgff43ny","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q06","label":"Câu 6","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eDùng công thức \u003ccode\u003eKLD = -0.5 * Σ(1 + logvar - mu² - exp(logvar))\u003c/code\u003e. Với latent một chiều có \u003ccode\u003emu=1\u003c/code\u003e và \u003ccode\u003elogvar=0\u003c/code\u003e, KLD bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emu = torch.tensor([1.0])\nlogvar = torch.tensor([0.0])\n\nKLD = -0.5 * torch.sum(\n    1 + logvar\n    - mu.pow(2)\n    - logvar.exp()\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e"],"correct":2},{"id":"dl-mdps981fo867u","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q07","label":"Câu 7","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eDùng cùng công thức KL. Với \u003ccode\u003emu=[1,2]\u003c/code\u003e và \u003ccode\u003elogvar=[0,0]\u003c/code\u003e, tổng KLD trên hai chiều latent bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emu = torch.tensor([\n    1.0, 2.0\n])\n\nlogvar = torch.tensor([\n    0.0, 0.0\n])\n\nKLD = -0.5 * torch.sum(\n    1 + logvar\n    - mu.pow(2)\n    - logvar.exp()\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e"],"correct":2},{"id":"dl-jdsnfp1uqrb49","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q08","label":"Câu 8","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003emu=0\u003c/code\u003e và \u003ccode\u003elogvar=log(4)\u003c/code\u003e. Dùng công thức KL trong câu hỏi. Biết \u003ccode\u003eexp(log(4))=4\u003c/code\u003e. KLD một chiều bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emu = 0.0\nlogvar = log(4.0)\n\nKLD = -0.5 * (\n    1\n    + logvar\n    - mu**2\n    - exp(logvar)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.5 * (3 - log(4))\u003c/code\u003e","\u003ccode\u003e0.5 * (3 + log(4))\u003c/code\u003e","\u003ccode\u003e0.5 * (4 - log(4))\u003c/code\u003e","\u003ccode\u003e3 - log(4)\u003c/code\u003e"],"correct":0},{"id":"dl-1f1fkv81kxh6pm","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q09","label":"Câu 9","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eEncoder nhận batch 8 mẫu và latent dimension bằng 3. Encoder trả về \u003ccode\u003emu\u003c/code\u003e và \u003ccode\u003elogvar\u003c/code\u003e, sau đó reparameterization tạo \u003ccode\u003ez\u003c/code\u003e. Shape nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ebatch_size = 8\nlatent_dim = 3\n\nmu.shape == (8, 3)\nlogvar.shape == (8, 3)\n\nstd = torch.exp(0.5 * logvar)\nepsilon = torch.randn_like(std)\nz = mu + epsilon * std\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003estd: (8,3), epsilon: (8,3), z: (8,3)\u003c/code\u003e","\u003ccode\u003estd: (3,), epsilon: (8,3), z: (3,)\u003c/code\u003e","\u003ccode\u003estd: (8,), epsilon: (3,), z: (8,3)\u003c/code\u003e","\u003ccode\u003estd: (3,8), epsilon: (3,8), z: (3,8)\u003c/code\u003e"],"correct":0},{"id":"dl-nerp2oapv13i","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q10","label":"Câu 10","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eĐoạn code nào thực hiện đúng reparameterization khi encoder cung cấp \u003ccode\u003emu\u003c/code\u003e và \u003ccode\u003elogvar = log(variance)\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003estd = torch.exp(logvar)\neps = torch.randn_like(std)\nz = mu + eps + std\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003estd = torch.exp(0.5 * logvar)\neps = torch.randn_like(std)\nz = mu + eps * std\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003estd = torch.exp(0.5 * mu)\neps = torch.randn_like(std)\nz = logvar + eps * std\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003estd = logvar ** 2\neps = torch.randn_like(std)\nz = mu * eps * std\u003c/code\u003e\u003c/pre\u003e"],"correct":1},{"id":"dl-1u0ibwa17kbvgo","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q11","label":"Câu 11","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003emu=3\u003c/code\u003e, \u003ccode\u003elogvar=log(9)\u003c/code\u003e và giá trị \u003ccode\u003eepsilon=-2\u003c/code\u003e đã được cố định. Giá trị latent sample \u003ccode\u003ez\u003c/code\u003e là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emu = 3.0\nlogvar = log(9.0)\nepsilon = -2.0\n\nstd = exp(0.5 * logvar)\nz = mu + std * epsilon\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-6.0\u003c/code\u003e","\u003ccode\u003e-3.0\u003c/code\u003e","\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e9.0\u003c/code\u003e"],"correct":1},{"id":"dl-1xt23pk1fiepzk","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q12","label":"Câu 12","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003emu=[0,1]\u003c/code\u003e và \u003ccode\u003elogvar=[0,0]\u003c/code\u003e. Dùng \u003ccode\u003eKLD = -0.5 * Σ(1 + logvar - mu² - exp(logvar))\u003c/code\u003e. Tổng KLD bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emu = torch.tensor([\n    0.0, 1.0\n])\n\nlogvar = torch.tensor([\n    0.0, 0.0\n])\n\nKLD = -0.5 * torch.sum(\n    1 + logvar\n    - mu.pow(2)\n    - logvar.exp()\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e1.5\u003c/code\u003e"],"correct":1},{"id":"dl-r530ld1pf8xnh","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q13","label":"Câu 13","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eTrong VAE, vì sao biểu diễn \u003ccode\u003ez = mu + std * epsilon\u003c/code\u003e với \u003ccode\u003eepsilon\u003c/code\u003e được lấy từ một phân phối cố định lại hữu ích khi huấn luyện?\u003c/p\u003e\n      \n    ","choices":["Nó tách nguồn ngẫu nhiên khỏi \u003ccode\u003emu\u003c/code\u003e và \u003ccode\u003estd\u003c/code\u003e, cho phép gradient truyền qua phép biến đổi khả vi tới encoder.","Nó làm cho mọi latent sample luôn bằng chính xác \u003ccode\u003emu\u003c/code\u003e, nên không còn yếu tố ngẫu nhiên.","Nó buộc \u003ccode\u003evariance\u003c/code\u003e của mọi latent dimension luôn bằng 1 trong suốt quá trình train.","Nó loại bỏ decoder khỏi computation graph và chỉ cập nhật các parameter của encoder."],"correct":0},{"id":"dl-1sd9mjl1mpdrdb","chapter":"22","topic":"Phần 22 — VAE: KL và reparameterization","source":{"id":"dl-p22-q14","label":"Câu 14","batch":"dl-p22"},"html":"\n      \n      \u003cp\u003eEncoder tạo \u003ccode\u003emu\u003c/code\u003e và \u003ccode\u003elogvar\u003c/code\u003e. Đoạn code nào ghép đúng các bước từ variance đến standard deviation rồi tạo latent sample khi \u003ccode\u003eepsilon\u003c/code\u003e đã được cung cấp?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emu = torch.tensor([1.0, -1.0])\nlogvar = torch.tensor([\n    log(4.0),\n    log(9.0)\n])\n\nepsilon = torch.tensor([\n    0.5, -1.0\n])\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003evariance = torch.exp(logvar)\nstd = torch.sqrt(variance)\nz = mu + std * epsilon\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003evariance = logvar\nstd = variance ** 2\nz = mu + std + epsilon\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003evariance = torch.exp(0.5 * logvar)\nstd = variance ** 2\nz = mu * std * epsilon\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003evariance = torch.exp(logvar)\nstd = variance\nz = mu + std * epsilon\u003c/code\u003e\u003c/pre\u003e"],"correct":0},{"id":"dl-izxjjs1nwfc8o","chapter":"23","topic":"Phần 23 — Cosine similarity và contrastive loss","source":{"id":"dl-p23-q01","label":"Câu 1","batch":"dl-p23"},"html":"\n      \n      \u003cp\u003eCho hai vector \u003ccode\u003ea\u003c/code\u003e và \u003ccode\u003eb\u003c/code\u003e. Dot product \u003ccode\u003ea · b\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ea = torch.tensor([1.0, 2.0])\nb = torch.tensor([3.0, 4.0])\n\ndot = (a * b).sum()\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e7.0\u003c/code\u003e","\u003ccode\u003e10.0\u003c/code\u003e","\u003ccode\u003e11.0\u003c/code\u003e","\u003ccode\u003e14.0\u003c/code\u003e"],"correct":2},{"id":"dl-1hiadaw1a45bl0","chapter":"23","topic":"Phần 23 — Cosine similarity và contrastive loss","source":{"id":"dl-p23-q02","label":"Câu 2","batch":"dl-p23"},"html":"\n      \n      \u003cp\u003eCho vector \u003ccode\u003ex=[3,4]\u003c/code\u003e. L2 norm của \u003ccode\u003ex\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = torch.tensor([3.0, 4.0])\n\nnorm = torch.sqrt(\n    (x ** 2).sum()\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e7.0\u003c/code\u003e","\u003ccode\u003e25.0\u003c/code\u003e"],"correct":1},{"id":"dl-1x8aloa21a75u","chapter":"23","topic":"Phần 23 — Cosine similarity và contrastive loss","source":{"id":"dl-p23-q03","label":"Câu 3","batch":"dl-p23"},"html":"\n      \n      \u003cp\u003eCosine similarity được tính bằng \u003ccode\u003e(a · b) / (||a||₂ ||b||₂)\u003c/code\u003e. Với hai vector dưới đây, cosine similarity bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ea = torch.tensor([1.0, 0.0])\nb = torch.tensor([0.0, 1.0])\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-1.0\u003c/code\u003e","\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e"],"correct":1},{"id":"dl-1v47hcv1rz5it","chapter":"23","topic":"Phần 23 — Cosine similarity và contrastive loss","source":{"id":"dl-p23-q04","label":"Câu 4","batch":"dl-p23"},"html":"\n      \n      \u003cp\u003eVới hai vector dưới đây, cosine similarity bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ea = torch.tensor([1.0, 2.0])\nb = torch.tensor([2.0, 4.0])\n\n# cosine =\n# (a · b) / (||a||₂ * ||b||₂)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003esqrt(2) / 2\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e"],"correct":3},{"id":"dl-bbyhtoyyohjw","chapter":"23","topic":"Phần 23 — Cosine similarity và contrastive loss","source":{"id":"dl-p23-q05","label":"Câu 5","batch":"dl-p23"},"html":"\n      \n      \u003cp\u003eCho hai vector \u003ccode\u003ea=[1,1]\u003c/code\u003e và \u003ccode\u003eb=[1,-1]\u003c/code\u003e. Giá trị dot product, L2 norm của mỗi vector và cosine similarity lần lượt là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ea = torch.tensor([1.0, 1.0])\nb = torch.tensor([1.0, -1.0])\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003edot=0, ||a||=sqrt(2), ||b||=sqrt(2), cosine=0\u003c/code\u003e","\u003ccode\u003edot=2, ||a||=sqrt(2), ||b||=sqrt(2), cosine=1\u003c/code\u003e","\u003ccode\u003edot=0, ||a||=2, ||b||=2, cosine=1\u003c/code\u003e","\u003ccode\u003edot=-1, ||a||=sqrt(2), ||b||=sqrt(2), cosine=-1\u003c/code\u003e"],"correct":0},{"id":"d
