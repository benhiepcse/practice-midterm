l-p09-b01-q03","label":"Câu 3","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Một mô hình có \u003ccode\u003eprecision=0.75\u003c/code\u003e và \u003ccode\u003erecall=0.60\u003c/code\u003e. Dùng công thức \u003ccode\u003eF1 = 2*precision*recall/(precision+recall)\u003c/code\u003e. F1 gần bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.450\u003c/code\u003e","\u003ccode\u003e0.600\u003c/code\u003e","\u003ccode\u003e0.675\u003c/code\u003e","\u003ccode\u003e0.667\u003c/code\u003e"],"correct":3},{"id":"ml-n9ay3z1o5eojh","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q04","label":"Câu 4","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Với dữ liệu dưới đây, bộ \u003ccode\u003e(precision, recall)\u003c/code\u003e nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_true = [1, 0, 1, 1, 0, 0]\ny_pred = [1, 1, 1, 0, 0, 0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e(2/3, 2/3)\u003c/code\u003e","\u003ccode\u003e(1/2, 2/3)\u003c/code\u003e","\u003ccode\u003e(2/3, 1/2)\u003c/code\u003e","\u003ccode\u003e(3/4, 2/3)\u003c/code\u003e"],"correct":0},{"id":"ml-176one1q2zd84","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q05","label":"Câu 5","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Confusion matrix theo thứ tự \u003ccode\u003e[[TN, FP], [FN, TP]]\u003c/code\u003e được cho dưới đây. Precision bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ecm = [\n    [12, 3],\n    [ 2, 8]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e8/10\u003c/code\u003e","\u003ccode\u003e8/11\u003c/code\u003e","\u003ccode\u003e12/15\u003c/code\u003e","\u003ccode\u003e8/13\u003c/code\u003e"],"correct":1},{"id":"ml-j9soe3asbaed","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q06","label":"Câu 6","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Confusion matrix theo thứ tự \u003ccode\u003e[[TN, FP], [FN, TP]]\u003c/code\u003e là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ecm = [\n    [20, 5],\n    [ 4, 6]\n]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eRecall bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e6/11\u003c/code\u003e","\u003ccode\u003e6/10\u003c/code\u003e","\u003ccode\u003e20/25\u003c/code\u003e","\u003ccode\u003e6/15\u003c/code\u003e"],"correct":1},{"id":"ml-1pvbsgq1epc6u","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q07","label":"Câu 7","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Cho \u003ccode\u003eTP=9\u003c/code\u003e, \u003ccode\u003eFP=3\u003c/code\u003e, \u003ccode\u003eFN=3\u003c/code\u003e. Precision, recall và F1 lần lượt bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.75, 0.75, 0.75\u003c/code\u003e","\u003ccode\u003e0.75, 0.60, 0.67\u003c/code\u003e","\u003ccode\u003e0.60, 0.75, 0.67\u003c/code\u003e","\u003ccode\u003e0.75, 0.75, 0.50\u003c/code\u003e"],"correct":0},{"id":"ml-ph0pbo1g8dpm4","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q08","label":"Câu 8","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Đoạn code sau in ra giá trị nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etp = 4\nfp = 1\nfn = 2\n\nprecision = tp / (tp + fp)\nrecall = tp / (tp + fn)\n\nf1 = (\n    2 * precision * recall\n    / (precision + recall)\n)\n\nprint(\n    round(precision, 2),\n    round(recall, 2),\n    round(f1, 2)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.67 0.80 0.73\u003c/code\u003e","\u003ccode\u003e0.80 0.67 0.73\u003c/code\u003e","\u003ccode\u003e0.80 0.67 0.67\u003c/code\u003e","\u003ccode\u003e0.80 0.80 0.80\u003c/code\u003e"],"correct":1},{"id":"ml-1cdtpi310zavqd","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q09","label":"Câu 9","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Hai mô hình có cùng \u003ccode\u003eTP=10\u003c/code\u003e và \u003ccode\u003eFN=2\u003c/code\u003e. Mô hình A có \u003ccode\u003eFP=5\u003c/code\u003e, còn mô hình B có \u003ccode\u003eFP=2\u003c/code\u003e. Phát biểu nào đúng?\u003c/p\u003e\n      \n    ","choices":["B có precision cao hơn, recall bằng A","B có recall cao hơn, precision bằng A","B có precision và recall đều cao hơn A","B có precision bằng A nhưng recall thấp hơn"],"correct":0},{"id":"ml-204kvud08456","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q10","label":"Câu 10","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Hai mô hình có cùng \u003ccode\u003eTP=8\u003c/code\u003e và \u003ccode\u003eFP=2\u003c/code\u003e. Mô hình A có \u003ccode\u003eFN=6\u003c/code\u003e, mô hình B có \u003ccode\u003eFN=2\u003c/code\u003e. Phát biểu nào đúng?\u003c/p\u003e\n      \n    ","choices":["B có precision thấp hơn và recall bằng A","B có precision cao hơn và recall thấp hơn A","B có precision bằng A và recall cao hơn A","B có precision và recall đều bằng A"],"correct":2},{"id":"ml-ynyuw74fu5wf","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q11","label":"Câu 11","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Trong câu này, nếu \u003ccode\u003eTP+FP=0\u003c/code\u003e thì quy ước \u003ccode\u003eprecision=0\u003c/code\u003e. Nếu \u003ccode\u003eTP+FN=0\u003c/code\u003e thì quy ước \u003ccode\u003erecall=0\u003c/code\u003e. Với \u003ccode\u003eTP=0\u003c/code\u003e, \u003ccode\u003eFP=0\u003c/code\u003e, \u003ccode\u003eFN=5\u003c/code\u003e, precision và recall bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eprecision=1, recall=0\u003c/code\u003e","\u003ccode\u003eprecision=0, recall=1\u003c/code\u003e","\u003ccode\u003eprecision=1, recall=1\u003c/code\u003e","\u003ccode\u003eprecision=0, recall=0\u003c/code\u003e"],"correct":3},{"id":"ml-1mf5ucm1jchmjg","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q12","label":"Câu 12","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Trong câu này, nếu mẫu số của precision hoặc recall bằng \u003ccode\u003e0\u003c/code\u003e thì metric đó được quy ước bằng \u003ccode\u003e0\u003c/code\u003e. Nếu \u003ccode\u003eprecision+recall=0\u003c/code\u003e thì \u003ccode\u003eF1=0\u003c/code\u003e. Đoạn code sau in ra gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etp = 0\nfp = 0\nfn = 0\n\nprecision = (\n    tp / (tp + fp)\n    if tp + fp != 0\n    else 0.0\n)\n\nrecall = (\n    tp / (tp + fn)\n    if tp + fn != 0\n    else 0.0\n)\n\nf1 = (\n    2 * precision * recall\n    / (precision + recall)\n    if precision + recall != 0\n    else 0.0\n)\n\nprint(precision, recall, f1)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0 0.0 0.0\u003c/code\u003e","\u003ccode\u003e1.0 0.0 0.0\u003c/code\u003e","\u003ccode\u003e0.0 1.0 0.0\u003c/code\u003e","\u003ccode\u003e1.0 1.0 1.0\u003c/code\u003e"],"correct":0},{"id":"ml-1y57ziyxkxh8e","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q13","label":"Câu 13","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Đoạn code dưới đây tự tính confusion counts rồi tính precision, recall và F1. Kết quả nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_true = [1, 1, 0, 1, 0, 0, 1]\ny_pred = [1, 0, 1, 1, 0, 0, 1]\n\ntp = sum(\n    y == 1 and pred == 1\n    for y, pred in zip(y_true, y_pred)\n)\n\nfp = sum(\n    y == 0 and pred == 1\n    for y, pred in zip(y_true, y_pred)\n)\n\nfn = sum(\n    y == 1 and pred == 0\n    for y, pred in zip(y_true, y_pred)\n)\n\nprecision = tp / (tp + fp)\nrecall = tp / (tp + fn)\nf1 = 2 * precision * recall / (precision + recall)\n\nprint(\n    tp, fp, fn,\n    round(precision, 2),\n    round(recall, 2),\n    round(f1, 2)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e3 1 1 0.75 0.75 0.75\u003c/code\u003e","\u003ccode\u003e3 1 2 0.75 0.60 0.67\u003c/code\u003e","\u003ccode\u003e2 1 1 0.67 0.67 0.67\u003c/code\u003e","\u003ccode\u003e3 2 1 0.60 0.75 0.67\u003c/code\u003e"],"correct":0},{"id":"ml-1jnbp9h6t2r95","chapter":"9","topic":"Phần 9 — Đợt 1: Precision, recall và F1","source":{"id":"ml-p09-b01-q14","label":"Câu 14","batch":"ml-p09-b01"},"html":"\n      \n      \u003cp\u003eLớp dương là \u003ccode\u003e1\u003c/code\u003e. Với cùng dữ liệu, hai threshold tạo ra confusion counts như sau. Kết quả nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eThreshold A:\nTP = 9\nFP = 6\nFN = 1\n\nThreshold B:\nTP = 8\nFP = 2\nFN = 2\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["A có precision cao hơn, B có recall cao hơn","A có precision và recall đều cao hơn B","B có precision cao hơn, A có recall cao hơn","B có precision và recall đều cao hơn A"],"correct":2},{"id":"ml-6y57yi187fxgy","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q01","label":"Câu 1","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột node chứa \u003ccode\u003e8\u003c/code\u003e mẫu lớp \u003ccode\u003e0\u003c/code\u003e và \u003ccode\u003e2\u003c/code\u003e mẫu lớp \u003ccode\u003e1\u003c/code\u003e. Dùng công thức \u003ccode\u003eGini = 1 - p0^2 - p1^2\u003c/code\u003e. Gini impurity của node bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.16\u003c/code\u003e","\u003ccode\u003e0.32\u003c/code\u003e","\u003ccode\u003e0.64\u003c/code\u003e","\u003ccode\u003e0.80\u003c/code\u003e"],"correct":1},{"id":"ml-1lyvc60h7bbyg","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q02","label":"Câu 2","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột node có nhãn:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey = [1, 1, 1, 1]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng \u003ccode\u003eGini = 1 - sum(p_k^2)\u003c/code\u003e. Gini impurity của node bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.00\u003c/code\u003e","\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e1.00\u003c/code\u003e"],"correct":0},{"id":"ml-14xgvd3eam4pv","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q03","label":"Câu 3","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột node nhị phân có \u003ccode\u003e5\u003c/code\u003e mẫu lớp \u003ccode\u003e0\u003c/code\u003e và \u003ccode\u003e5\u003c/code\u003e mẫu lớp \u003ccode\u003e1\u003c/code\u003e. Gini impurity bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e1.00\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e0.00\u003c/code\u003e"],"correct":2},{"id":"ml-1uiwd2eo4jvlo","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q04","label":"Câu 4","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột node cha có \u003ccode\u003e10\u003c/code\u003e mẫu. Sau khi split:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eLeft:\n    4 mẫu\n    Gini = 0.0\n\nRight:\n    6 mẫu\n    Gini = 0.5\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eWeighted Gini impurity sau split bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.20\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e0.40\u003c/code\u003e","\u003ccode\u003e0.30\u003c/code\u003e"],"correct":3},{"id":"ml-1mgqxgji7j7vh","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q05","label":"Câu 5","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột node cha có \u003ccode\u003eGini = 0.48\u003c/code\u003e. Một split tạo ra weighted child impurity bằng \u003ccode\u003e0.30\u003c/code\u003e. Trong câu này, impurity gain được định nghĩa:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003egain = parent_gini - weighted_child_gini\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eGain bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.18\u003c/code\u003e","\u003ccode\u003e0.30\u003c/code\u003e","\u003ccode\u003e0.48\u003c/code\u003e","\u003ccode\u003e0.78\u003c/code\u003e"],"correct":0},{"id":"ml-jpfe9t1lix5yr","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q06","label":"Câu 6","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột node cha có \u003ccode\u003eGini = 0.50\u003c/code\u003e. Hai split ứng viên có kết quả:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eSplit A:\n    weighted child Gini = 0.32\n\nSplit B:\n    weighted child Gini = 0.18\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNếu chọn split có impurity gain lớn hơn, kết luận nào đúng?\u003c/p\u003e\n      \n    ","choices":["Chọn A vì gain của A là \u003ccode\u003e0.32\u003c/code\u003e","Chọn B vì gain của B là \u003ccode\u003e0.32\u003c/code\u003e","Chọn A vì weighted Gini lớn hơn","Hai split có impurity gain bằng nhau"],"correct":1},{"id":"ml-1ului8emiwij0","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q07","label":"Câu 7","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột node chứa \u003ccode\u003e12\u003c/code\u003e mẫu và được chia thành:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eLeft:\n    6 mẫu\n    class 0: 6\n    class 1: 0\n\nRight:\n    6 mẫu\n    class 0: 3\n    class 1: 3\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eWeighted Gini impurity sau split bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e0.125\u003c/code\u003e","\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.75\u003c/code\u003e"],"correct":2},{"id":"ml-xcbp626d09s","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q08","label":"Câu 8","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột cây một tầng dùng quy tắc:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eif x[0] \u0026lt;= 2.5:\n    predict 0\nelse:\n    predict 1\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eVới các mẫu sau, vector dự đoán là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX_test = [\n    [1.0],\n    [2.5],\n    [3.0],\n    [5.0]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0, 1, 1, 1]\u003c/code\u003e","\u003ccode\u003e[0, 0, 1, 1]\u003c/code\u003e","\u003ccode\u003e[1, 1, 0, 0]\u003c/code\u003e","\u003ccode\u003e[0, 0, 0, 1]\u003c/code\u003e"],"correct":1},{"id":"ml-m8gj0k1gbhfhy","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q09","label":"Câu 9","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột cây một tầng sử dụng feature thứ hai:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eif x[1] \u0026lt;= 4.0:\n    predict 1\nelse:\n    predict 0\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eĐoạn code tương đương nào tạo đúng dự đoán cho một mẫu \u003ccode\u003ex\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003epred = 1 if x[0] \u0026lt;= 4.0 else 0\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003epred = 0 if x[1] \u0026lt;= 4.0 else 1\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003epred = 1 if x[1] \u0026gt; 4.0 else 0\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003epred = 1 if x[1] \u0026lt;= 4.0 else 0\u003c/code\u003e\u003c/pre\u003e"],"correct":3},{"id":"ml-ww7zn11el1zzj","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q10","label":"Câu 10","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột leaf của \u003ccode\u003eDecisionTreeClassifier\u003c/code\u003e chứa \u003ccode\u003e8\u003c/code\u003e training samples:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eclass 0: 2 samples\nclass 1: 6 samples\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eKhông có sample weight. Xác suất lớp \u003ccode\u003e1\u003c/code\u003e mà leaf này dự đoán là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e0.75\u003c/code\u003e","\u003ccode\u003e1.00\u003c/code\u003e"],"correct":2},{"id":"ml-dn62951l2pnx7","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q11","label":"Câu 11","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code dưới đây huấn luyện một cây phân loại một tầng. Dữ liệu có thể được tách hoàn hảo tại khoảng giữa \u003ccode\u003e1\u003c/code\u003e và \u003ccode\u003e2\u003c/code\u003e. Kết quả \u003ccode\u003epred.tolist()\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.tree import DecisionTreeClassifier\n\nX = [[0], [1], [2], [3]]\ny = [0, 0, 1, 1]\n\nmodel = DecisionTreeClassifier(\n    max_depth=1,\n    random_state=0\n)\n\nmodel.fit(X, y)\n\npred = model.predict([[0.5], [2.5]])\n\nprint(pred.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0, 1]\u003c/code\u003e","\u003ccode\u003e[1, 0]\u003c/code\u003e","\u003ccode\u003e[0, 0]\u003c/code\u003e","\u003ccode\u003e[1, 1]\u003c/code\u003e"],"correct":0},{"id":"ml-1aex0qv14a7vkx","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q12","label":"Câu 12","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột \u003ccode\u003eDecisionTreeClassifier\u003c/code\u003e đã được fit. Một test sample đi tới leaf chứa:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eclass 0: 1 sample\nclass 1: 3 samples\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eGiả sử \u003ccode\u003emodel.classes_ = [0, 1]\u003c/code\u003e. Giá trị \u003ccode\u003epredict_proba\u003c/code\u003e cho sample đó là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[0.75, 0.25]\u003c/code\u003e","\u003ccode\u003e[0.50, 0.50]\u003c/code\u003e","\u003ccode\u003e[0.00, 1.00]\u003c/code\u003e","\u003ccode\u003e[0.25, 0.75]\u003c/code\u003e"],"correct":3},{"id":"ml-1qv7ci91v7n5a1","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q13","label":"Câu 13","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột Random Forest có ba cây. Với cùng một test sample, xác suất lớp \u003ccode\u003e1\u003c/code\u003e do từng cây dự đoán là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eTree 1: 0.90\nTree 2: 0.60\nTree 3: 0.30\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTrong câu này, xác suất của forest là trung bình xác suất từ các cây. Xác suất lớp \u003ccode\u003e1\u003c/code\u003e của forest bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.30\u003c/code\u003e","\u003ccode\u003e0.60\u003c/code\u003e","\u003ccode\u003e0.90\u003c/code\u003e","\u003ccode\u003e1.80\u003c/code\u003e"],"correct":1},{"id":"ml-1o8xywygngnd6","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q14","label":"Câu 14","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột Random Forest có bốn cây. Mỗi cây trả về xác suất theo thứ tự \u003ccode\u003e[P(class 0), P(class 1)]\u003c/code\u003e:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eTree 1: [0.2, 0.8]\nTree 2: [0.4, 0.6]\nTree 3: [0.7, 0.3]\nTree 4: [0.3, 0.7]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eVector xác suất trung bình của forest là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[0.40, 0.60]\u003c/code\u003e","\u003ccode\u003e[0.35, 0.65]\u003c/code\u003e","\u003ccode\u003e[0.60, 0.40]\u003c/code\u003e","\u003ccode\u003e[0.50, 0.50]\u003c/code\u003e"],"correct":0},{"id":"ml-1l6h1gz1h3ja73","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q15","label":"Câu 15","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột Random Forest có ba cây. Xác suất lớp \u003ccode\u003e1\u003c/code\u003e của một test sample là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eTree 1: 0.20\nTree 2: 0.80\nTree 3: 0.70\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eXác suất forest là trung bình xác suất của các cây. Nếu dự đoán lớp có xác suất trung bình lớn nhất, forest dự đoán lớp nào?\u003c/p\u003e\n      \n    ","choices":["Lớp \u003ccode\u003e0\u003c/code\u003e, vì một cây cho \u003ccode\u003eP(1)=0.20\u003c/code\u003e","Lớp \u003ccode\u003e0\u003c/code\u003e, vì trung bình \u003ccode\u003eP(1)\u0026lt;0.50\u003c/code\u003e","Lớp \u003ccode\u003e1\u003c/code\u003e, vì trung bình \u003ccode\u003eP(1)\u0026gt;0.50\u003c/code\u003e","Không thể xác định từ các xác suất đã cho"],"correct":2},{"id":"ml-1kynl11ctfra7","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q16","label":"Câu 16","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau mô phỏng cách gộp xác suất của bốn cây trong một forest. Kết quả được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etree_probs = [\n    [0.1, 0.9],\n    [0.4, 0.6],\n    [0.6, 0.4],\n    [0.3, 0.7]\n]\n\np0 = sum(p[0] for p in tree_probs) / len(tree_probs)\np1 = sum(p[1] for p in tree_probs) / len(tree_probs)\n\npred = 0 if p0 \u0026gt; p1 else 1\n\nprint(round(p0, 2), round(p1, 2), pred)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.65 0.35 0\u003c/code\u003e","\u003ccode\u003e0.35 0.65 1\u003c/code\u003e","\u003ccode\u003e0.35 0.65 0\u003c/code\u003e","\u003ccode\u003e0.65 0.35 1\u003c/code\u003e"],"correct":1},{"id":"ml-115e2ve1mjsnsc","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q17","label":"Câu 17","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột node cha có \u003ccode\u003e20\u003c/code\u003e mẫu và \u003ccode\u003eGini = 0.48\u003c/code\u003e. Hai split ứng viên cho kết quả:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eSplit A:\n    Left:  10 samples, Gini = 0.18\n    Right: 10 samples, Gini = 0.32\n\nSplit B:\n    Left:   5 samples, Gini = 0.00\n    Right: 15 samples, Gini = 0.32\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng weighted child Gini và \u003ccode\u003egain = parent_gini - weighted_child_gini\u003c/code\u003e. Split nào có gain lớn hơn và gain đó bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["Split A, gain \u003ccode\u003e0.23\u003c/code\u003e","Split B, gain \u003ccode\u003e0.16\u003c/code\u003e","Split A, gain \u003ccode\u003e0.25\u003c/code\u003e","Split B, gain \u003ccode\u003e0.24\u003c/code\u003e"],"correct":3},{"id":"ml-fldk1f1fck3x","chapter":"10","topic":"Phần 10 — Đợt 1: Decision tree và forest","source":{"id":"ml-p10-b01-q18","label":"Câu 18","batch":"ml-p10-b01"},"html":"\n      \n      \u003cp\u003eMột Random Forest có năm cây. Với một test sample, mỗi cây đi tới một leaf khác nhau. Số mẫu \u003ccode\u003e[class 0, class 1]\u003c/code\u003e trong các leaf là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eTree 1: [1, 3]\nTree 2: [2, 2]\nTree 3: [0, 4]\nTree 4: [3, 1]\nTree 5: [1, 3]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eKhông có sample weight. Mỗi cây tính xác suất từ tỷ lệ lớp trong leaf, sau đó forest lấy trung bình xác suất của năm cây. Xác suất lớp \u003ccode\u003e1\u003c/code\u003e và lớp dự đoán cuối cùng là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eP(1)=0.45\u003c/code\u003e, dự đoán lớp \u003ccode\u003e0\u003c/code\u003e","\u003ccode\u003eP(1)=0.55\u003c/code\u003e, dự đoán lớp \u003ccode\u003e1\u003c/code\u003e","\u003ccode\u003eP(1)=0.65\u003c/code\u003e, dự đoán lớp \u003ccode\u003e1\u003c/code\u003e","\u003ccode\u003eP(1)=0.75\u003c/code\u003e, dự đoán lớp \u003ccode\u003e1\u003c/code\u003e"],"correct":0},{"id":"ml-7vftiq1hzwue","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q01","label":"Câu 1","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eBa mô hình được đánh giá bằng accuracy trên train và validation:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eModel A: train = 0.71, validation = 0.69\nModel B: train = 0.88, validation = 0.84\nModel C: train = 0.99, validation = 0.76\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNếu chọn mô hình chỉ dựa trên validation accuracy, mô hình nào được chọn?\u003c/p\u003e\n      \n    ","choices":["Model A","Model B","Model C","Không mô hình nào"],"correct":1},{"id":"ml-1aob0ue765um6","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q02","label":"Câu 2","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, generalization gap được định nghĩa là \u003ccode\u003etrain_accuracy - validation_accuracy\u003c/code\u003e. Với kết quả sau, gap bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrain_accuracy      = 0.96\nvalidation_accuracy = 0.81\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.15\u003c/code\u003e","\u003ccode\u003e0.17\u003c/code\u003e","\u003ccode\u003e0.81\u003c/code\u003e","\u003ccode\u003e1.77\u003c/code\u003e"],"correct":0},{"id":"ml-1896nwkkhjutu","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q03","label":"Câu 3","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eBa cấu hình có kết quả:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eConfig A: train = 0.63, validation = 0.61\nConfig B: train = 0.86, validation = 0.83\nConfig C: train = 1.00, validation = 0.70\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCấu hình nào thể hiện dấu hiệu overfitting rõ nhất?\u003c/p\u003e\n      \n    ","choices":["Config A","Config B","Cả Config A và Config B như nhau","Config C"],"correct":3,"originalChoices":["Config A","Config B","Cả A và B như nhau","Config C"]},{"id":"ml-1v6j3n2qd1i9c","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q04","label":"Câu 4","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eMột bài toán phân loại có kết quả:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrain_accuracy      = 0.58\nvalidation_accuracy = 0.56\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTrong khi các mô hình phù hợp hơn trên cùng dữ liệu đạt validation accuracy khoảng \u003ccode\u003e0.85\u003c/code\u003e. Nhận định nào phù hợp nhất?\u003c/p\u003e\n      \n    ","choices":["Mô hình chắc chắn bị data leakage","Mô hình chắc chắn đang overfit mạnh","Mô hình có dấu hiệu underfitting","Mô hình đã tổng quát hóa tối ưu"],"correct":2},{"id":"ml-173979jeyaubb","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q05","label":"Câu 5","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eMột Decision Tree được thử với nhiều giá trị \u003ccode\u003emax_depth\u003c/code\u003e:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emax_depth   train_acc   val_acc\n    1          0.68       0.66\n    3          0.86       0.82\n    5          0.94       0.87\n    9          1.00       0.79\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNếu mục tiêu là chọn cấu hình bằng validation accuracy, giá trị nào được chọn?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003emax_depth = 5\u003c/code\u003e","\u003ccode\u003emax_depth = 9\u003c/code\u003e","\u003ccode\u003emax_depth = 3\u003c/code\u003e","\u003ccode\u003emax_depth = 1\u003c/code\u003e"],"correct":0},{"id":"ml-apgo7n1xagqs3","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q06","label":"Câu 6","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code lưu accuracy của bốn cấu hình. Cấu hình được chọn là cấu hình có validation accuracy lớn nhất. Kết quả được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003emodels = [\n    {\"name\": \"A\", \"train\": 0.70, \"val\": 0.68},\n    {\"name\": \"B\", \"train\": 0.89, \"val\": 0.84},\n    {\"name\": \"C\", \"train\": 0.97, \"val\": 0.81},\n    {\"name\": \"D\", \"train\": 1.00, \"val\": 0.75}\n]\n\nbest = max(models, key=lambda m: m[\"val\"])\n\nprint(best[\"name\"], best[\"val\"])\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eC 0.81\u003c/code\u003e","\u003ccode\u003eB 0.84\u003c/code\u003e","\u003ccode\u003eD 0.75\u003c/code\u003e","\u003ccode\u003eA 0.68\u003c/code\u003e"],"correct":1},{"id":"ml-19fsqhdnxr8cz","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q07","label":"Câu 7","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, gap được tính bằng \u003ccode\u003etrain_acc - val_acc\u003c/code\u003e. Đoạn code sau in ra gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eresults = [\n    (\"A\", 0.82, 0.79),\n    (\"B\", 0.95, 0.80),\n    (\"C\", 0.88, 0.84)\n]\n\nfor name, train_acc, val_acc in results:\n    gap = train_acc - val_acc\n    print(name, round(gap, 2))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eA 0.03\nB 0.15\nC 0.04\u003c/code\u003e","\u003ccode\u003eA 0.03\nB 0.04\nC 0.15\u003c/code\u003e","\u003ccode\u003eA 0.79\nB 0.80\nC 0.84\u003c/code\u003e","\u003ccode\u003eA 0.01\nB 0.15\nC 0.02\u003c/code\u003e"],"correct":0},{"id":"ml-pve9j511bgdq7","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q08","label":"Câu 8","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eMột sinh viên thử bốn hyperparameter và thu được:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eConfig A: validation = 0.82, test = 0.85\nConfig B: validation = 0.86, test = 0.81\nConfig C: validation = 0.84, test = 0.88\nConfig D: validation = 0.80, test = 0.91\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNếu test set chỉ được dùng cho đánh giá cuối cùng, quy trình chọn mô hình đúng là gì?\u003c/p\u003e\n      \n    ","choices":["Chọn D vì test score cao nhất","Chọn C vì test cao hơn B","Chọn A vì validation và test khá gần nhau","Chọn B bằng validation, rồi dùng test để báo cáo cuối"],"correct":3},{"id":"ml-11anhlb1e5v8sj","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q09","label":"Câu 9","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eMột Decision Tree được tăng dần độ phức tạp. Kết quả là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edepth   train_acc   val_acc\n  1        0.64       0.62\n  2        0.76       0.73\n  4        0.91       0.85\n  8        0.99       0.78\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eMô tả nào phù hợp nhất với xu hướng từ \u003ccode\u003edepth=1\u003c/code\u003e đến \u003ccode\u003edepth=8\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["Train và validation cùng giảm liên tục","Train tăng; validation tăng rồi giảm","Train giảm; validation tăng liên tục","Train giữ nguyên; validation giảm liên tục"],"correct":1},{"id":"ml-1bkgwue90hsda","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q10","label":"Câu 10","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eMột mô hình có learning curve theo số lượng training samples:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003esamples   train_acc   val_acc\n  100        0.99       0.71\n  300        0.95       0.77\n  600        0.92       0.81\n 1000        0.90       0.84\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eĐiều gì xảy ra với gap \u003ccode\u003etrain_acc - val_acc\u003c/code\u003e khi số mẫu tăng từ \u003ccode\u003e100\u003c/code\u003e lên \u003ccode\u003e1000\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["Gap tăng từ \u003ccode\u003e0.28\u003c/code\u003e lên \u003ccode\u003e0.74\u003c/code\u003e","Gap giữ nguyên ở khoảng \u003ccode\u003e0.28\u003c/code\u003e","Gap giảm từ \u003ccode\u003e0.28\u003c/code\u003e xuống \u003ccode\u003e0.06\u003c/code\u003e","Gap đổi từ \u003ccode\u003e-0.28\u003c/code\u003e thành \u003ccode\u003e-0.06\u003c/code\u003e"],"correct":2},{"id":"ml-6gt97fpm8a1x","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q11","label":"Câu 11","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eMột bài toán có ba mô hình:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eModel A:\ntrain = 0.65\nvalidation = 0.63\n\nModel B:\ntrain = 0.90\nvalidation = 0.86\n\nModel C:\ntrain = 0.99\nvalidation = 0.72\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCặp mô tả nào phù hợp nhất?\u003c/p\u003e\n      \n    ","choices":["A overfit mạnh; C underfit","A và C đều underfit","A và C đều overfit mạnh","A có dấu hiệu underfit; C có dấu hiệu overfit"],"correct":3},{"id":"ml-mibzkxa2osg7","chapter":"11","topic":"Phần 11 — Đợt 1: Underfit, overfit và chọn mô hình","source":{"id":"ml-p11-b01-q12","label":"Câu 12","batch":"ml-p11-b01"},"html":"\n      \n      \u003cp\u003eMột nhóm thử ba cấu hình trên validation set:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eConfig A:\ntrain F1 = 0.88\nvalidation F1 = 0.82\n\nConfig B:\ntrain F1 = 0.93\nvalidation F1 = 0.86\n\nConfig C:\ntrain F1 = 0.99\nvalidation F1 = 0.79\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eSau đó họ chạy test set và nhận được:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA: test F1 = 0.84\nB: test F1 = 0.83\nC: test F1 = 0.91\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNếu quy trình yêu cầu chọn hyperparameter hoàn toàn bằng validation set trước khi xem test, cấu hình nào phải được chọn để đánh giá cuối?\u003c/p\u003e\n      \n    ","choices":["Config C","Config B","Config A","Chọn lại giữa B và C bằng test F1"],"correct":1},{"id":"ml-xgkhq0jqc9n4","chapter":"12","topic":"Phần 12 — Đợt 1: Regularization L2","source":{"id":"ml-p12-b01-q01","label":"Câu 1","batch":"ml-p12-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, L2 penalty được định nghĩa là \u003ccode\u003elambda * sum(w_j^2)\u003c/code\u003e và bias \u003ccode\u003eb\u003c/code\u003e không bị regularize. Với:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = [2.0, -3.0]\nlambda = 0.5\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eGiá trị L2 penalty bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e6.5\u003c/code\u003e","\u003ccode\u003e13.0\u003c/code\u003e","\u003ccode\u003e18.0\u003c/code\u003e"],"correct":1},{"id":"ml-1mxtbab193ehmn","chapter":"12","topic":"Phần 12 — Đợt 1: Regularization L2","source":{"id":"ml-p12-b01-q02","label":"Câu 2","batch":"ml-p12-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, objective được định nghĩa:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eJ(w) = data_loss + lambda * sum(w_j^2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eBias không bị regularize. Cho:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edata_loss = 0.40\nw = [1.0, -2.0]\nlambda = 0.10\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eGiá trị \u003ccode\u003eJ(w)\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e0.80\u003c/code\u003e","\u003ccode\u003e0.90\u003c/code\u003e","\u003ccode\u003e1.40\u003c/code\u003e"],"correct":2},{"id":"ml-fsn0eapvktra","chapter":"12","topic":"Phần 12 — Đợt 1: Regularization L2","source":{"id":"ml-p12-b01-q03","label":"Câu 3","batch":"ml-p12-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, L2 penalty là \u003ccode\u003elambda * sum(w_j^2)\u003c/code\u003e. Gradient của phần penalty theo \u003ccode\u003ew_j\u003c/code\u003e là \u003ccode\u003e2 * lambda * w_j\u003c/code\u003e. Với \u003ccode\u003elambda = 0.2\u003c/code\u003e và \u003ccode\u003ew_j = -3\u003c/code\u003e, gradient của riêng phần L2 bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e-0.6\u003c/code\u003e","\u003ccode\u003e1.2\u003c/code\u003e","\u003ccode\u003e0.6\u003c/code\u003e","\u003ccode\u003e-1.2\u003c/code\u003e"],"correct":3},{"id":"ml-11ssxtm1xj1t2i","chapter":"12","topic":"Phần 12 — Đợt 1: Regularization L2","source":{"id":"ml-p12-b01-q04","label":"Câu 4","batch":"ml-p12-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, objective là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eJ(w) = data_loss + lambda * sum(w_j^2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eBias không bị regularize. Tại tham số hiện tại:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003egradient_data = [0.4, -0.6]\nw             = [2.0, -1.0]\nlambda        = 0.1\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eGradient tổng theo \u003ccode\u003ew\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[0.8, -0.8]\u003c/code\u003e","\u003ccode\u003e[0.6, -0.7]\u003c/code\u003e","\u003ccode\u003e[0.8, -0.4]\u003c/code\u003e","\u003ccode\u003e[0.4, -0.6]\u003c/code\u003e"],"correct":0},{"id":"ml-4n7u0injzr0o","chapter":"12","topic":"Phần 12 — Đợt 1: Regularization L2","source":{"id":"ml-p12-b01-q05","label":"Câu 5","batch":"ml-p12-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, gradient tổng được định nghĩa:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003egradient_total = gradient_data + 2 * lambda * w\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCho một weight:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = 2.0\ngradient_data = -0.5\nlambda = 0.25\nlearning_rate = 0.1\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng \u003ccode\u003ew = w - learning_rate * gradient_total\u003c/code\u003e. Weight mới bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e1.85\u003c/code\u003e","\u003ccode\u003e1.95\u003c/code\u003e","\u003ccode\u003e2.05\u003c/code\u003e","\u003ccode\u003e2.15\u003c/code\u003e"],"correct":1},{"id":"ml-1xzoje61ry6agw","chapter":"12","topic":"Phần 12 — Đợt 1: Regularization L2","source":{"id":"ml-p12-b01-q06","label":"Câu 6","batch":"ml-p12-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, objective được định nghĩa:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eJ(w, b) = data_loss + lambda * sum(w_j^2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eBias \u003ccode\u003eb\u003c/code\u003e không bị regularize. Tại tham số hiện tại:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003egradient_data_w = [0.2, -0.4]\ngradient_data_b = 0.3\n\nw = [1.0, 2.0]\nb = 0.5\nlambda = 0.1\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eBộ gradient tổng \u003ccode\u003e(dw, db)\u003c/code\u003e nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003edw=[0.2, -0.4], db=0.4\u003c/code\u003e","\u003ccode\u003edw=[0.4, 0.0], db=0.3\u003c/code\u003e","\u003ccode\u003edw=[0.3, -0.2], db=0.4\u003c/code\u003e","\u003ccode\u003edw=[0.4, 0.0], db=0.4\u003c/code\u003e"],"correct":1},{"id":"ml-fdxloo12zsery","chapter":"12","topic":"Phần 12 — Đợt 1: Regularization L2","source":{"id":"ml-p12-b01-q07","label":"Câu 7","batch":"ml-p12-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code dưới đây thực hiện một bước gradient descent với L2. Trong câu này, bias không bị regularize. Kết quả được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ew = 3.0\nb = 1.0\n\ndw_data = 0.2\ndb_data = -0.4\n\nlam = 0.1\nlr = 0.5\n\ndw = dw_data + 2 * lam * w\ndb = db_data\n\nw = w - lr * dw\nb = b - lr * db\n\nprint(round(w, 2), round(b, 2))\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2.60 1.20\u003c/code\u003e","\u003ccode\u003e2.90 0.80\u003c/code\u003e","\u003ccode\u003e3.40 0.80\u003c/code\u003e","\u003ccode\u003e2.60 0.80\u003c/code\u003e"],"correct":0},{"id":"ml-15455w27cqkxs","chapter":"12","topic":"Phần 12 — Đợt 1: Regularization L2","source":{"id":"ml-p12-b01-q08","label":"Câu 8","batch":"ml-p12-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, L2 penalty được định nghĩa là \u003ccode\u003e(lambda / 2) * sum(w_j^2)\u003c/code\u003e. Bias không bị regularize. Gradient của phần L2 theo \u003ccode\u003ew_j\u003c/code\u003e là công thức nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e2 * lambda * w_j\u003c/code\u003e","\u003ccode\u003elambda * w_j^2\u003c/code\u003e","\u003ccode\u003elambda * w_j\u003c/code\u003e","\u003ccode\u003e(lambda / 2) * w_j\u003c/code\u003e"],"correct":2},{"id":"ml-1ystnn41xavaz2","chapter":"12","topic":"Phần 12 — Đợt 1: Regularization L2","source":{"id":"ml-p12-b01-q09","label":"Câu 9","batch":"ml-p12-b01"},"html":"\n      \n      \u003cp\u003eHai mô hình dùng cùng dữ liệu và cùng định nghĩa loss. Trong câu này, tăng \u003ccode\u003elambda\u003c/code\u003e nghĩa là tăng trực tiếp hệ số của L2 penalty:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eModel A: lambda = 0.01\nModel B: lambda = 2.00\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNếu các điều kiện khác giống nhau, phát biểu nào mô tả đúng tác động trực tiếp của \u003ccode\u003elambda\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["Model A phạt weight lớn mạnh hơn 2,S4}\u003c/code\u003e","\u003ccode\u003etrain={S1,S3,S4}, val={S2}\u003c/code\u003e","\u003ccode\u003etrain={S2,S3,S4}, val={S1}\u003c/code\u003e"],"correct":2},{"id":"ml-19kiej511kbeo1","chapter":"13","topic":"Phần 13 — Đợt 1: Group cross-validation","source":{"id":"ml-p13-b01-q16","label":"Câu 16","batch":"ml-p13-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau kiểm tra từng split do \u003ccode\u003eGroupKFold\u003c/code\u003e tạo ra:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.model_selection import GroupKFold\n\nX = [[0], [1], [2], [3], [4], [5]]\ngroups = [\"A\", \"A\", \"B\", \"B\", \"C\", \"C\"]\n\ncv = GroupKFold(n_splits=3)\n\nfor train_idx, val_idx in cv.split(X, groups=groups):\n    train_groups = {groups[i] for i in train_idx}\n    val_groups = {groups[i] for i in val_idx}\n\n    print(\n        len(train_groups \u0026amp; val_groups)\n    )\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eBa dòng output là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e1\n1\n1\u003c/code\u003e","\u003ccode\u003e0\n1\n0\u003c/code\u003e","\u003ccode\u003e2\n2\n2\u003c/code\u003e","\u003ccode\u003e0\n0\n0\u003c/code\u003e"],"correct":3},{"id":"ml-1yvsx0x12i1njd","chapter":"14","topic":"Phần 14 — Đợt 1: Pipeline và kiểm tra leakage","source":{"id":"ml-p14-b01-q01","label":"Câu 1","batch":"ml-p14-b01"},"html":"\n      \n      \u003cp\u003eMột bài toán có dữ liệu thiếu và các feature có thang đo khác nhau. Thứ tự nào phù hợp cho pipeline trước khi huấn luyện mô hình?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003emodel → scaler → imputer\u003c/code\u003e","\u003ccode\u003escaler → model → imputer\u003c/code\u003e","\u003ccode\u003eimputer → scaler → model\u003c/code\u003e","\u003ccode\u003emodel → imputer → scaler\u003c/code\u003e"],"correct":2},{"id":"ml-c4svnnt70vl3","chapter":"14","topic":"Phần 14 — Đợt 1: Pipeline và kiểm tra leakage","source":{"id":"ml-p14-b01-q02","label":"Câu 2","batch":"ml-p14-b01"},"html":"\n choices":["\u003ccode\u003e10.0\u003c/code\u003e","\u003ccode\u003e16.0\u003c/code\u003e","\u003ccode\u003e18.0\u003c/code\u003e","\u003ccode\u003e48.0\u003c/code\u003e"],"correct":1},{"id":"ml-ic52b7awomwf","chapter":"16","topic":"Phần 16 — Đợt 1: Khoảng cách và k-NN","source":{"id":"ml-p16-b01-q11","label":"Câu 11","batch":"ml-p16-b01"},"html":"\n      \n      \u003cp\u003eĐiểm truy vấn là \u003ccode\u003eQ=(0,0)\u003c/code\u003e. Training data cho bài regression:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ePoint      Target\n(1, 0)      10\n(0, 2)      20\n(3, 0)      40\n(0, 5)      80\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng k-NN regression với \u003ccode\u003ek=2\u003c/code\u003e và uniform weights. Dự đoán cho Q là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e10\u003c/code\u003e","\u003ccode\u003e20\u003c/code\u003e","\u003ccode\u003e25\u003c/code\u003e","\u003ccode\u003e15\u003c/code\u003e"],"correct":3},{"id":"ml-mlx9oc1fz677s","chapter":"16","topic":"Phần 16 — Đợt 1: Khoảng cách và k-NN","source":{"id":"ml-p16-b01-q12","label":"Câu 12","batch":"ml-p16-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code tự cài k-NN regression sau in ra gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eneighbors = [\n    (0.5, 12.0),\n    (1.0, 18.0),\n    (2.0, 30.0),\n    (3.0, 50.0)\n]\n\nk = 3\n\nnearest = sorted(\n    neighbors,\n    key=lambda x: x[0]\n)[:k]\n\nprediction = sum(\n    target for _, target in nearest\n) / k\n\nprint(prediction)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e20.0\u003c/code\u003e","\u003ccode\u003e30.0\u003c/code\u003e","\u003ccode\u003e27.5\u003c/code\u003e","\u003ccode\u003e15.0\u003c/code\u003e"],"correct":0},{"id":"ml-1phkkhk11zpy78","chapter":"16","topic":"Phần 16 — Đợt 1: Khoảng cách và k-NN","source":{"id":"ml-p16-b01-q13","label":"Câu 13","batch":"ml-p16-b01"},"html":"\n      \n      \u003cp\u003eCho training set một chiều:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX_train = [[0], [2], [5], [9]]\ny_train = [0, 0, 1, 1]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eĐiểm truy vấn là \u003ccode\u003ex=4\u003c/code\u003e. Dùng \u003ccode\u003ek=3\u003c/code\u003e. Ba hàng xóm gần nhất có nhãn nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[0, 0, 1]\u003c/code\u003e","\u003ccode\u003e[1, 1, 0]\u003c/code\u003e","\u003ccode\u003e[1, 0, 0]\u003c/code\u003e","\u003ccode\u003e[0, 1, 1]\u003c/code\u003e"],"correct":2},{"id":"ml-1gp925m1a6ypqs","chapter":"16","topic":"Phần 16 — Đợt 1: Khoảng cách và k-NN","source":{"id":"ml-p16-b01-q14","label":"Câu 14","batch":"ml-p16-b01"},"html":"\n      \n      \u003cp\u003eCho dữ liệu:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX_train = [[0], [2], [5], [9]]\ny_train = [0, 0, 1, 1]\n\nquery = [[4]]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng \u003ccode\u003eKNeighborsClassifier(n_neighbors=3)\u003c/code\u003e với mặc định \u003ccode\u003eweights=\"uniform\"\u003c/code\u003e. Kết quả dự đoán cho \u003ccode\u003equery\u003c/code\u003e là gì?\u003c/p\u003e\n      \n    ","choices":["Lớp \u003ccode\u003e1\u003c/code\u003e","Lớp \u003ccode\u003e0\u003c/code\u003e","Hòa phiếu \u003ccode\u003e1-1\u003c/code\u003e","Không thể fit vì dữ liệu một chiều"],"correct":1},{"id":"ml-sdmwgidedcok","chapter":"16","topic":"Phần 16 — Đợt 1: Khoảng cách và k-NN","source":{"id":"ml-p16-b01-q15","label":"Câu 15","batch":"ml-p16-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau in ra gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.neighbors import KNeighborsClassifier\n\nX = [[0], [1], [4], [5]]\ny = [0, 0, 1, 1]\n\nmodel = KNeighborsClassifier(\n    n_neighbors=1\n)\n\nmodel.fit(X, y)\n\npred = model.predict([\n    [0.2],\n    [4.8]\n])\n\nprint(pred.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1, 0]\u003c/code\u003e","\u003ccode\u003e[0, 0]\u003c/code\u003e","\u003ccode\u003e[0, 1]\u003c/code\u003e","\u003ccode\u003e[1, 1]\u003c/code\u003e"],"correct":2},{"id":"ml-2hjjgd1fzjo9t","chapter":"16","topic":"Phần 16 — Đợt 1: Khoảng cách và k-NN","source":{"id":"ml-p16-b01-q16","label":"Câu 16","batch":"ml-p16-b01"},"html":"\n      \n      \u003cp\u003eMột bài classification tự cài có bốn hàng xóm gần nhất:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eNeighbor   Distance   Label\n   A          1.0       2\n   B          1.0       1\n   C          2.0       1\n   D          2.0       2\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng \u003ccode\u003ek=4\u003c/code\u003e. Quy ước hòa phiếu: chọn lớp có hàng xóm gần nhất; nếu khoảng cách gần nhất của các lớp cũng bằng nhau, chọn nhãn số nhỏ hơn. Lớp dự đoán là gì?\u003c/p\u003e\n      \n    ","choices":["Lớp \u003ccode\u003e2\u003c/code\u003e","Không có dự đoán","Chọn ngẫu nhiên","Lớp \u003ccode\u003e1\u003c/code\u003e"],"correct":3},{"id":"ml-11bzywikcxv7e","chapter":"16","topic":"Phần 16 — Đợt 1: Khoảng cách và k-NN","source":{"id":"ml-p16-b01-q17","label":"Câu 17","batch":"ml-p16-b01"},"html":"\n      \n      \u003cp\u003eĐiểm truy vấn là \u003ccode\u003eQ=(2,2)\u003c/code\u003e. Ba training points có target:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = (2, 3), target = 5\nB = (4, 2), target = 11\nC = (2, 5), target = 20\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng k-NN regression với \u003ccode\u003ek=2\u003c/code\u003e và uniform weights. Dự đoán cho Q bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e8.0\u003c/code\u003e","\u003ccode\u003e12.5\u003c/code\u003e","\u003ccode\u003e15.5\u003c/code\u003e","\u003ccode\u003e16.0\u003c/code\u003e"],"correct":0},{"id":"ml-gpd3vujmzav8","chapter":"16","topic":"Phần 16 — Đợt 1: Khoảng cách và k-NN","source":{"id":"ml-p16-b01-q18","label":"Câu 18","batch":"ml-p16-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code tự cài dưới đây tính khoảng cách rồi chọn \u003ccode\u003ek=3\u003c/code\u003e hàng xóm. Nếu khoảng cách bằng nhau, Python giữ thứ tự index ban đầu. Kết quả được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport math\n\nX = [\n    (1, 0),\n    (0, 1),\n    (2, 0),\n    (0, 3)\n]\n\ny = [1, 0, 0, 1]\nq = (0, 0)\n\nitems = []\n\nfor i, p in enumerate(X):\n    d = math.sqrt(\n        (p[0] - q[0]) ** 2\n        + (p[1] - q[1]) ** 2\n    )\n    items.append((d, i, y[i]))\n\nnearest = sorted(\n    items,\n    key=lambda item: (item[0], item[1])\n)[:3]\n\nprint([\n    (d, label)\n    for d, _, label in nearest\n])\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[(1.0, 0), (1.0, 1), (2.0, 0)]\u003c/code\u003e","\u003ccode\u003e[(1.0, 1), (1.0, 0), (2.0, 0)]\u003c/code\u003e","\u003ccode\u003e[(1.0, 1), (2.0, 0), (3.0, 1)]\u003c/code\u003e","\u003ccode\u003e[(1.0, 1), (1.0, 0), (3.0, 1)]\u003c/code\u003e"],"correct":1},{"id":"ml-r15jmv81aost","chapter":"17","topic":"Phần 17 — Đợt 1: Scaling và k-NN","source":{"id":"ml-p17-b01-q01","label":"Câu 1","batch":"ml-p17-b01"},"html":"\n      \n      \u003cp\u003eCho điểm truy vấn Q = (0, 0) và hai điểm huấn luyện A = (3, 4), B = (5, 1). Dùng khoảng cách Euclidean trên dữ liệu gốc. Điểm nào gần Q hơn?\u003c/p\u003e\n      \n    ","choices":["A, vì khoảng cách từ Q đến A bằng 4.","A, vì khoảng cách từ Q đến A bằng 5.","B, vì khoảng cách từ Q đến B bằng 5.","B, vì khoảng cách từ Q đến B bằng 6."],"correct":1},{"id":"ml-1ojob7w1eaya30","chapter":"17","topic":"Phần 17 — Đợt 1: Scaling và k-NN","source":{"id":"ml-p17-b01-q02","label":"Câu 2","batch":"ml-p17-b01"},"html":"\n      \n      \u003cp\u003eCho Q = (0, 0), A = (3, 40), B = (5, 10). Theo yêu cầu của bài, hãy scale feature thứ hai bằng cách chia nó cho 10 ở tất cả các điểm. Sau scaling, A và B lần lượt trở thành điểm nào?\u003c/p\u003e\n      \n    ","choices":["A' = (0.3, 40), B' = (0.5, 10).","A' = (3, 4), B' = (5, 1).","A' = (30, 4), B' = (50, 1).","A' = (3, 400), B' = (5, 100)."],"correct":1},{"id":"ml-19d86yk1576u1g","chapter":"17","topic":"Phần 17 — Đợt 1: Scaling và k-NN","source":{"id":"ml-p17-b01-q03","label":"Câu 3","batch":"ml-p17-b01"},"html":"\n      \n      \u003cp\u003eCho Q = (0, 0), A = (1, 10), B = (4, 2). Trước scaling, dùng khoảng cách Euclidean. Sau đó chia feature thứ hai của mọi điểm cho 10. Hàng xóm gần Q nhất thay đổi như thế nào?\u003c/p\u003e\n      \n    ","choices":["Trước scaling là A, sau scaling vẫn là A.","Trước scaling là A, sau scaling chuyển thành B.","Trước scaling là B, sau scaling chuyển thành A.","Trước scaling là B, sau scaling vẫn là B."],"correct":2},{"id":"ml-yfftug15trxou","chapter":"17","topic":"Phần 17 — Đợt 1: Scaling và k-NN","source":{"id":"ml-p17-b01-q04","label":"Câu 4","batch":"ml-p17-b01"},"html":"\n      \n      \u003cp\u003eCho Q = (0, 0), A = (2, 30), B = (5, 10). Feature thứ hai được chia cho 10 trước khi tính khoảng cách Euclidean. Khoảng cách sau scaling từ Q đến A và B xấp xỉ bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["d(Q,A) = 3.61 và d(Q,B) = 5.10.","d(Q,A) = 5.10 và d(Q,B) = 3.61.","d(Q,A) = 30.07 và d(Q,B) = 11.18.","d(Q,A) = 32.00 và d(Q,B) = 15.00."],"correct":0},{"id":"ml-7rt7fhpzzn77","chapter":"17","topic":"Phần 17 — Đợt 1: Scaling và k-NN","source":{"id":"ml-p17-b01-q05","label":"Câu 5","batch":"ml-p17-b01"},"html":"\n      \n      \u003cp\u003eCho Q = (0, 0) và ba điểm huấn luyện:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = (1, 20)\nB = (4, 5)\nC = (6, 0)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eChia feature thứ hai của mọi điểm cho 10 rồi dùng khoảng cách Euclidean. Thứ tự các điểm từ gần Q nhất đến xa nhất là gì?\u003c/p\u003e\n      \n    ","choices":["A, B, C.","B, A, C.","C, B, A.","A, C, B."],"correct":0},{"id":"ml-1o208741mkjm8o","chapter":"17","topic":"Phần 17 — Đợt 1: Scaling và k-NN","source":{"id":"ml-p17-b01-q06","label":"Câu 6","batch":"ml-p17-b01"},"html":"\n      \n      \u003cp\u003eCho dữ liệu train một chiều cho một feature:\u003c/p\u003e\n      \
