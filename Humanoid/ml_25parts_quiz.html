ws\n    for f in [\"f1\", \"f2\"]\n)\n\nprint(n_rows, n_class_0, n_class_1, n_missing)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e6 3 3 4\u003c/code\u003e","\u003ccode\u003e6 3 3 6\u003c/code\u003e","\u003ccode\u003e6 2 4 4\u003c/code\u003e","\u003ccode\u003e3 3 6 4\u003c/code\u003e"],"correct":0},{"id":"ml-6r0om2p140m0","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-q12","label":"Câu 12","batch":"ml-p01-b01"},"html":"\n      \n      \u003cp\u003eMỗi phần tử của \u003ccode\u003erows\u003c/code\u003e là một mẫu. \u003ccode\u003edistance_m\u003c/code\u003e và \u003ccode\u003epayload_kg\u003c/code\u003e là feature; \u003ccode\u003esuccess\u003c/code\u003e là label. Chỉ \u003ccode\u003eNone\u003c/code\u003e được xem là missing. Đoạn chương trình nào tạo đúng cả ba thống kê \u003ccode\u003en_rows\u003c/code\u003e, \u003ccode\u003eclass_counts\u003c/code\u003e và \u003ccode\u003emissing_counts\u003c/code\u003e?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erows = [\n    {\"distance_m\": 2.0,  \"payload_kg\": None, \"success\": 1},\n    {\"distance_m\": None, \"payload_kg\": 3.0,  \"success\": 0},\n    {\"distance_m\": 0.0,  \"payload_kg\": 1.0,  \"success\": 0}\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003en_rows = len(rows)\nclass_counts = {\n    0: sum(r[\"success\"] == 0 for r in rows),\n    1: sum(r[\"success\"] == 1 for r in rows)\n}\nmissing_counts = {\n    f: sum(r[f] is None for r in rows)\n    for f in [\"distance_m\", \"payload_kg\"]\n}\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003en_rows = len(rows[0])\nclass_counts = {\n    0: sum(r[\"distance_m\"] == 0 for r in rows),\n    1: sum(r[\"distance_m\"] == 1 for r in rows)\n}\nmissing_counts = {\n    \"success\": sum(r[\"success\"] == 0 for r in rows)\n}\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003en_rows = len(rows)\nclass_counts = {\n    0: sum(r[\"success\"] is None for r in rows),\n    1: sum(r[\"success\"] is not None for r in rows)\n}\nmissing_counts = {\n    f: sum(r[f] == 0 for r in rows)\n    for f in [\"distance_m\", \"payload_kg\"]\n}\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003en_rows = len(rows[0])\nclass_counts = {\n    0: sum(r[\"success\"] == 0 for r in rows),\n    1: sum(r[\"success\"] == 1 for r in rows)\n}\nmissing_counts = {\n    f: sum(r[f] is None for r in rows)\n    for f in [\"distance_m\", \"payload_kg\", \"success\"]\n}\u003c/code\u003e\u003c/pre\u003e"],"correct":0},{"id":"ml-e7bkolbcolwd","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-a01","label":"Câu bổ sung A01","batch":"ml-p01-b01"},"html":"\n      \n      \u003cp\u003eMột bộ dữ liệu có các feature \u003ccode\u003eheight_cm\u003c/code\u003e và \u003ccode\u003eweight_kg\u003c/code\u003e. Label \u003ccode\u003especies\u003c/code\u003e nhận một trong ba giá trị \u003ccode\u003e\"A\"\u003c/code\u003e, \u003ccode\u003e\"B\"\u003c/code\u003e, \u003ccode\u003e\"C\"\u003c/code\u003e. Mục tiêu là dự đoán \u003ccode\u003especies\u003c/code\u003e. Đây là loại bài toán nào?\u003c/p\u003e\n      \n    ","choices":["Hồi quy vì có hai feature dạng số","Phân loại vì giá trị cần dự đoán thuộc các lớp rời rạc","Hồi quy vì label không dùng số 0 và 1","Không phải học có giám sát vì có nhiều hơn hai lớp"],"correct":1},{"id":"ml-1ox9py71fulbcl","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-a02","label":"Câu bổ sung A02","batch":"ml-p01-b01"},"html":"\n      \n      \u003cp\u003eMỗi phần tử của \u003ccode\u003erows\u003c/code\u003e là một mẫu. \u003ccode\u003epressure\u003c/code\u003e và \u003ccode\u003espeed\u003c/code\u003e là feature; \u003ccode\u003efailure\u003c/code\u003e là label. Chỉ \u003ccode\u003eNone\u003c/code\u003e được xem là missing. Đoạn code sau in ra gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erows = [\n    {\"pressure\": 0,    \"speed\": None, \"failure\": 0},\n    {\"pressure\": None, \"speed\": 0,    \"failure\": 1},\n    {\"pressure\": None, \"speed\": None, \"failure\": 0},\n    {\"pressure\": 5,    \"speed\": 10,   \"failure\": 0}\n]\n\nfeatures = [\"pressure\", \"speed\"]\n\nresult = {\n    f: sum(row[f] is None for row in rows)\n    for f in features\n}\n\nprint(result)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e{'pressure': 3, 'speed': 3}\u003c/code\u003e","\u003ccode\u003e{'pressure': 2, 'speed': 2}\u003c/code\u003e","\u003ccode\u003e{'pressure': 2, 'speed': 3}\u003c/code\u003e","\u003ccode\u003e{'pressure': 1, 'speed': 2}\u003c/code\u003e"],"correct":1},{"id":"ml-23ann413rnoxy","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-a03","label":"Câu bổ sung A03","batch":"ml-p01-b01"},"html":"\n      \n      \u003cp\u003eMỗi phần tử của \u003ccode\u003erows\u003c/code\u003e là một mẫu. \u003ccode\u003ef1\u003c/code\u003e và \u003ccode\u003ef2\u003c/code\u003e là feature; \u003ccode\u003elabel\u003c/code\u003e là nhãn. Chỉ \u003ccode\u003eNone\u003c/code\u003e được xem là missing. Một lập trình viên dùng đoạn code sau để đếm tổng số feature bị thiếu:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erows = [\n    {\"f1\": None, \"f2\": 4,    \"label\": 0},\n    {\"f1\": 2,    \"f2\": None, \"label\": 1},\n    {\"f1\": 0,    \"f2\": 5,    \"label\": 0}\n]\n\nmissing = 0\n\nfor row in rows:\n    for value in row.values():\n        if value is None or value == 0:\n            missing += 1\n\nprint(missing)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eVì sao kết quả của đoạn code không biểu diễn đúng số feature bị thiếu theo yêu cầu?\u003c/p\u003e\n      \n    ","choices":["Vì code không duyệt qua tất cả các mẫu","Vì code xem số 0 là missing và còn duyệt cả cột label","Vì code chỉ kiểm tra \u003ccode\u003ef1\u003c/code\u003e mà bỏ qua \u003ccode\u003ef2\u003c/code\u003e","Vì Python không cho phép dùng \u003ccode\u003eNone\u003c/code\u003e trong dictionary"],"correct":1},{"id":"ml-a42s2vg0kkwb","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-a04","label":"Câu bổ sung A04","batch":"ml-p01-b01"},"html":"\n      \n      \u003cp\u003eMỗi phần tử của \u003ccode\u003erows\u003c/code\u003e là một mẫu. \u003ccode\u003ex\u003c/code\u003e và \u003ccode\u003ey\u003c/code\u003e là feature; \u003ccode\u003elabel\u003c/code\u003e là nhãn. Chỉ \u003ccode\u003eNone\u003c/code\u003e được xem là missing. Đoạn code sau in ra gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erows = []\n\nclass_counts = {\n    0: sum(row[\"label\"] == 0 for row in rows),\n    1: sum(row[\"label\"] == 1 for row in rows)\n}\n\nmissing_counts = {\n    \"x\": sum(row[\"x\"] is None for row in rows),\n    \"y\": sum(row[\"y\"] is None for row in rows)\n}\n\nprint(len(rows), class_counts, missing_counts)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0 {0: 0, 1: 0} {'x': 0, 'y': 0}\u003c/code\u003e","\u003ccode\u003e0 {0: 1, 1: 1} {'x': 0, 'y': 0}\u003c/code\u003e","\u003ccode\u003e0 {0: 0, 1: 0} {'x': None, 'y': None}\u003c/code\u003e","Chương trình phát sinh lỗi vì \u003ccode\u003erows\u003c/code\u003e rỗng"],"correct":0},{"id":"ml-1lee1zx1el185","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q01","label":"Câu 1","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eMỗi phần tử của \u003ccode\u003esession_ids\u003c/code\u003e tương ứng với một mẫu dữ liệu. Các session được gán vào ba tập như sau. Theo thứ tự xuất hiện ban đầu, \u003ccode\u003etrain_indices\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003esession_ids    = [\"S1\", \"S2\", \"S1\", \"S3\", \"S4\", \"S2\"]\ntrain_sessions = [\"S1\", \"S4\"]\nval_sessions   = [\"S2\"]\ntest_sessions  = [\"S3\"]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0, 2, 4]\u003c/code\u003e","\u003ccode\u003e[0, 1, 2, 4]\u003c/code\u003e","\u003ccode\u003e[1, 3, 5]\u003c/code\u003e","\u003ccode\u003e[0, 4]\u003c/code\u003e"],"correct":0},{"id":"ml-11rgb2c1lzg9gu","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q02","label":"Câu 2","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eMỗi vị trí trong \u003ccode\u003esession_ids\u003c/code\u003e là một mẫu. Theo cách chia session dưới đây, bộ ba \u003ccode\u003e(train_indices, val_indices, test_indices)\u003c/code\u003e nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003esession_ids    = [\"A\", \"C\", \"B\", \"A\", \"D\", \"C\", \"E\"]\ntrain_sessions = [\"A\", \"C\"]\nval_sessions   = [\"B\", \"E\"]\ntest_sessions  = [\"D\"]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e([0, 1, 3, 5], [2, 6], [4])\u003c/code\u003e","\u003ccode\u003e([0, 1], [2, 6], [3, 4, 5])\u003c/code\u003e","\u003ccode\u003e([0, 3], [1, 2, 5, 6], [4])\u003c/code\u003e","\u003ccode\u003e([0, 1, 3, 5], [4], [2, 6])\u003c/code\u003e"],"correct":0},{"id":"ml-1jwqlsi1i9rv1o","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q03","label":"Câu 3","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eTheo yêu cầu của ML02, mỗi session phải thuộc đúng một trong ba tập. Điều gì xảy ra với cách gán dưới đây?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003esession_ids    = [\"A\", \"B\", \"C\", \"A\"]\ntrain_sessions = [\"A\", \"B\"]\nval_sessions   = [\"C\"]\ntest_sessions  = [\"A\"]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Hợp lệ vì mỗi mẫu vẫn có thể lấy được một index","Không hợp lệ vì session \u003ccode\u003e\"A\"\u003c/code\u003e được gán vào hai tập","Không hợp lệ vì session \u003ccode\u003e\"A\"\u003c/code\u003e xuất hiện hai lần trong dữ liệu","Hợp lệ vì train được ưu tiên hơn test khi session bị trùng"],"correct":1},{"id":"ml-1cw8a7235x3kc","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q04","label":"Câu 4","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eTheo yêu cầu của ML02, mọi session xuất hiện trong \u003ccode\u003esession_ids\u003c/code\u003e phải được gán vào một tập. Kết luận nào đúng với dữ liệu sau?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003esession_ids    = [\"R1\", \"R2\", \"R3\", \"R4\", \"R2\"]\ntrain_sessions = [\"R1\", \"R2\"]\nval_sessions   = [\"R3\"]\ntest_sessions  = []\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Hợp lệ vì test có thể rỗng và \u003ccode\u003e\"R4\"\u003c/code\u003e tự động thuộc test","Hợp lệ vì chỉ các session xuất hiện nhiều lần mới cần được gán","Không hợp lệ vì \u003ccode\u003e\"R4\"\u003c/code\u003e chưa được gán vào tập nào","Không hợp lệ vì \u003ccode\u003e\"R2\"\u003c/code\u003e xuất hiện nhiều hơn một lần"],"correct":2},{"id":"ml-y0g7pz10x9yxf","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q05","label":"Câu 5","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau tạo index cho train theo session. Kết quả được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003esession_ids = [\"B\", \"A\", \"C\", \"A\", \"B\", \"D\", \"A\"]\ntrain_sessions = {\"A\", \"D\"}\n\ntrain_indices = [\n    i\n    for i, session in enumerate(session_ids)\n    if session in train_sessions\n]\n\nprint(train_indices)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1, 3, 5, 6]\u003c/code\u003e","\u003ccode\u003e[0, 1, 3, 4, 6]\u003c/code\u003e","\u003ccode\u003e[1, 3, 6]\u003c/code\u003e","\u003ccode\u003e[0, 2, 4, 5]\u003c/code\u003e"],"correct":0},{"id":"ml-16ydkkzbw1sh9","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q06","label":"Câu 6","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code kiểm tra session chưa được gán như sau. Giá trị của \u003ccode\u003eunassigned\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003esession_ids    = [\"A\", \"B\", \"C\", \"D\", \"E\", \"C\"]\ntrain_sessions = {\"A\", \"C\"}\nval_sessions   = {\"B\"}\ntest_sessions  = {\"E\"}\n\nassigned = train_sessions | val_sessions | test_sessions\nunassigned = sorted(set(session_ids) - assigned)\n\nprint(unassigned)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[\"C\", \"D\"]\u003c/code\u003e","\u003ccode\u003e[\"D\"]\u003c/code\u003e","\u003ccode\u003e[\"D\", \"E\"]\u003c/code\u003e","\u003ccode\u003e[]\u003c/code\u003e"],"correct":1},{"id":"ml-4ihnpcyw3u2k","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q07","label":"Câu 7","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eBa tập dưới đây chứa các session đã xuất hiện trong train, validation và test. Session nào gây leakage giữa train và validation?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrain_sessions = [\"S1\", \"S2\", \"S3\"]\nval_sessions   = [\"S4\", \"S2\", \"S5\"]\ntest_sessions  = [\"S6\", \"S7\"]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e\"S1\"\u003c/code\u003e","\u003ccode\u003e\"S2\"\u003c/code\u003e","\u003ccode\u003e\"S4\"\u003c/code\u003e","\u003ccode\u003e\"S7\"\u003c/code\u003e"],"correct":1},{"id":"ml-dcm81kn95jcq","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q08","label":"Câu 8","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eCho các session đã xuất hiện trong ba tập. Kết quả kiểm tra leakage theo từng cặp nào đúng? Các danh sách trùng được sắp xếp tăng dần.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrain = [\"A\", \"B\", \"D\", \"F\"]\nval   = [\"C\", \"D\", \"E\", \"F\"]\ntest  = [\"A\", \"E\", \"G\"]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003etrain_val=[\"D\",\"F\"], train_test=[\"A\"], val_test=[\"E\"]\u003c/code\u003e","\u003ccode\u003etrain_val=[\"A\"], train_test=[\"D\",\"F\"], val_test=[\"E\"]\u003c/code\u003e","\u003ccode\u003etrain_val=[\"D\"], train_test=[\"A\",\"F\"], val_test=[\"E\"]\u003c/code\u003e","\u003ccode\u003etrain_val=[\"D\",\"F\"], train_test=[\"E\"], val_test=[\"A\"]\u003c/code\u003e"],"correct":0},{"id":"ml-1wrhv4fp13ndz","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q09","label":"Câu 9","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau kiểm tra giao giữa ba tập session. Kết quả được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrain = {\"P1\", \"P2\", \"P3\", \"P4\"}\nval   = {\"P4\", \"P5\", \"P6\"}\ntest  = {\"P2\", \"P7\"}\n\ntrain_val  = sorted(train \u0026amp; val)\ntrain_test = sorted(train \u0026amp; test)\nval_test   = sorted(val \u0026amp; test)\n\nprint(train_val, train_test, val_test)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[\"P4\"] [\"P2\"] []\u003c/code\u003e","\u003ccode\u003e[\"P2\"] [\"P4\"] []\u003c/code\u003e","\u003ccode\u003e[\"P4\"] [] [\"P2\"]\u003c/code\u003e","\u003ccode\u003e[\"P2\", \"P4\"] [] []\u003c/code\u003e"],"correct":0},{"id":"ml-mct8gv7zj27j","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q10","label":"Câu 10","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau định nghĩa \u003ccode\u003ehas_leakage\u003c/code\u003e là \u003ccode\u003eTrue\u003c/code\u003e nếu có ít nhất một session xuất hiện ở hơn một tập. Kết quả là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrain = {\"A\", \"B\", \"C\"}\nval   = {\"D\", \"E\"}\ntest  = {\"F\", \"G\", \"B\"}\n\ntrain_val  = train \u0026amp; val\ntrain_test = train \u0026amp; test\nval_test   = val \u0026amp; test\n\nhas_leakage = bool(train_val or train_test or val_test)\n\nprint(has_leakage)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eFalse\u003c/code\u003e, vì validation không giao với tập nào","\u003ccode\u003eFalse\u003c/code\u003e, vì chỉ một session bị trùng","\u003ccode\u003eTrue\u003c/code\u003e, vì \u003ccode\u003e\"B\"\u003c/code\u003e nằm trong train và test","\u003ccode\u003eTrue\u003c/code\u003e, vì mọi tập đều phải có cùng số session"],"correct":2},{"id":"ml-103tdmw13plhh0","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q11","label":"Câu 11","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eMột session có thể chứa nhiều mẫu của cùng một đối tượng hoặc cùng một lần thu thập dữ liệu. Cách chia nào dưới đây tuân thủ yêu cầu không để cùng session xuất hiện ở nhiều tập?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003esession_ids = [\"A\", \"A\", \"B\", \"B\", \"C\", \"C\"]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003etrain=[0,2,4], val=[1,3], test=[5]\u003c/code\u003e","\u003ccode\u003etrain=[0,1,2,3], val=[4,5], test=[]\u003c/code\u003e","\u003ccode\u003etrain=[0,2], val=[1,4], test=[3,5]\u003c/code\u003e","\u003ccode\u003etrain=[0,1,4], val=[2,5], test=[3]\u003c/code\u003e"],"correct":1},{"id":"ml-47wzcs1uipgh2","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q12","label":"Câu 12","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003esession_ids\u003c/code\u003e và các session của từng tập. Đoạn code nào tạo đúng \u003ccode\u003eval_indices\u003c/code\u003e theo thứ tự mẫu ban đầu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003esession_ids  = [\"X\", \"Y\", \"Z\", \"Y\", \"W\", \"Z\"]\nval_sessions = {\"Y\", \"W\"}\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[i for i, s in enumerate(session_ids) if s in val_sessions]\u003c/code\u003e","\u003ccode\u003e[s for i, s in enumerate(session_ids) if i in val_sessions]\u003c/code\u003e","\u003ccode\u003e[i for i, s in enumerate(val_sessions) if s in session_ids]\u003c/code\u003e","\u003ccode\u003e[session_ids.index(s) for s in val_sessions]\u003c/code\u003e"],"correct":0},{"id":"ml-1pjnx341oveveg","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q13","label":"Câu 13","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau kiểm tra một session có bị gán vào nhiều tập hay không. Giá trị nào được in ra?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrain = {\"A\", \"B\", \"C\"}\nval   = {\"D\", \"E\", \"C\"}\ntest  = {\"F\", \"B\"}\n\noverlap = sorted(\n    (train \u0026amp; val) |\n    (train \u0026amp; test) |\n    (val \u0026amp; test)\n)\n\nprint(overlap)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[\"B\", \"C\"]\u003c/code\u003e","\u003ccode\u003e[\"C\"]\u003c/code\u003e","\u003ccode\u003e[\"B\"]\u003c/code\u003e","\u003ccode\u003e[\"B\", \"C\", \"E\"]\u003c/code\u003e"],"correct":0},{"id":"ml-v1kief1498s3","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q14","label":"Câu 14","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eMột bộ dữ liệu có nhiều mẫu từ cùng một bệnh nhân, và \u003ccode\u003epatient_id\u003c/code\u003e đóng vai trò group/session. Cách chia nào có nguy cơ leakage theo nhóm?\u003c/p\u003e\n      \n    ","choices":["Toàn bộ mẫu của mỗi bệnh nhân chỉ nằm trong đúng một tập","Một số mẫu của cùng bệnh nhân nằm ở cả train và validation","Train chứa nhiều bệnh nhân hơn validation và test","Các tập chứa số lượng mẫu khác nhau nhưng không trùng bệnh nhân"],"correct":1},{"id":"ml-ilmxfw12vi1rk","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q15","label":"Câu 15","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code dưới đây kiểm tra đồng thời session bị gán nhiều tập và session chưa được gán. Kết quả nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003esession_ids = [\"A\", \"B\", \"C\", \"D\", \"E\", \"F\"]\n\ntrain = {\"A\", \"B\", \"C\"}\nval   = {\"C\", \"D\"}\ntest  = {\"E\"}\n\noverlap = sorted(\n    (train \u0026amp; val) |\n    (train \u0026amp; test) |\n    (val \u0026amp; test)\n)\n\nassigned = train | val | test\nunassigned = sorted(set(session_ids) - assigned)\n\nprint(overlap, unassigned)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[\"C\"] [\"F\"]\u003c/code\u003e","\u003ccode\u003e[\"C\"] [\"E\", \"F\"]\u003c/code\u003e","\u003ccode\u003e[\"B\", \"C\"] [\"F\"]\u003c/code\u003e","\u003ccode\u003e[] [\"C\", \"F\"]\u003c/code\u003e"],"correct":0},{"id":"ml-1ataa0113oi6n7","chapter":"2","topic":"Phần 2 — Đợt 1: Chia tập và leakage theo nhóm","source":{"id":"ml-p02-b01-q16","label":"Câu 16","batch":"ml-p02-b01"},"html":"\n      \n      \u003cp\u003eHàm dưới đây kiểm tra leakage theo từng cặp session. Kết quả của lời gọi hàm là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edef check_leakage(train, val, test):\n    train = set(train)\n    val = set(val)\n    test = set(test)\n\n    result = {\n        \"train_val\": sorted(train \u0026amp; val),\n        \"train_test\": sorted(train \u0026amp; test),\n        \"val_test\": sorted(val \u0026amp; test),\n    }\n\n    result[\"has_leakage\"] = any(\n        len(x) \u0026gt; 0\n        for x in [\n            result[\"train_val\"],\n            result[\"train_test\"],\n            result[\"val_test\"],\n        ]\n    )\n\n    return result\n\nresult = check_leakage(\n    [\"S1\", \"S3\", \"S5\", \"S7\"],\n    [\"S2\", \"S3\", \"S6\"],\n    [\"S4\", \"S5\", \"S6\"]\n)\n\nprint(result)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e{'train_val': ['S3'], 'train_test': ['S5'], 'val_test': ['S6'], 'has_leakage': True}\u003c/code\u003e","\u003ccode\u003e{'train_val': ['S5'], 'train_test': ['S3'], 'val_test': ['S6'], 'has_leakage': True}\u003c/code\u003e","\u003ccode\u003e{'train_val': ['S3'], 'train_test': ['S5'], 'val_test': ['S6'], 'has_leakage': False}\u003c/code\u003e","\u003ccode\u003e{'train_val': ['S3','S5'], 'train_test': ['S6'], 'val_test': [], 'has_leakage': True}\u003c/code\u003e"],"correct":0},{"id":"ml-nuwzld1ivgkfn","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q01","label":"Câu 1","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eMột majority baseline được xác định chỉ từ nhãn của tập train. Với dữ liệu dưới đây, baseline sẽ luôn dự đoán nhãn nào cho các mẫu validation?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_train = [1, 0, 1, 1, 0, 1, 0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0\u003c/code\u003e","\u003ccode\u003e1\u003c/code\u003e","Luân phiên \u003ccode\u003e0\u003c/code\u003e và \u003ccode\u003e1\u003c/code\u003e","Không thể xác định nếu chưa biết feature"],"correct":1},{"id":"ml-2vb0jv17dwdd5","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q02","label":"Câu 2","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eMajority baseline được xác định từ \u003ccode\u003ey_train\u003c/code\u003e rồi dùng để dự đoán toàn bộ validation. Accuracy trên validation bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_train = [0, 1, 1, 1, 0, 1]\ny_val   = [1, 0, 1, 1, 0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.40\u003c/code\u003e","\u003ccode\u003e0.50\u003c/code\u003e","\u003ccode\u003e0.60\u003c/code\u003e","\u003ccode\u003e0.80\u003c/code\u003e"],"correct":2},{"id":"ml-1orexapv7nhs3","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q03","label":"Câu 3","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, nếu hai lớp xuất hiện bằng nhau trong train thì quy ước chọn nhãn có giá trị nhỏ hơn. Majority baseline dự đoán nhãn nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_train = [1, 0, 1, 0, 1, 0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0\u003c/code\u003e","\u003ccode\u003e1\u003c/code\u003e","Không tạo được baseline","Dự đoán ngẫu nhiên giữa \u003ccode\u003e0\u003c/code\u003e và \u003ccode\u003e1\u003c/code\u003e"],"correct":0},{"id":"ml-1rym7mk1tqnguw","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q04","label":"Câu 4","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau tự cài majority baseline. Kết quả được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_train = [0, 1, 1, 0, 1, 1, 1]\ny_val = [0, 1, 0, 1]\n\ncount_0 = y_train.count(0)\ncount_1 = y_train.count(1)\n\nbaseline = 0 if count_0 \u0026gt;= count_1 else 1\ny_pred = [baseline] * len(y_val)\n\naccuracy = sum(\n    pred == true\n    for pred, true in zip(y_pred, y_val)\n) / len(y_val)\n\nprint(baseline, y_pred, accuracy)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1 [1, 1, 1, 1] 0.5\u003c/code\u003e","\u003ccode\u003e0 [0, 0, 0, 0] 0.5\u003c/code\u003e","\u003ccode\u003e1 [0, 1, 0, 1] 1.0\u003c/code\u003e","\u003ccode\u003e0 [1, 1, 1, 1] 0.5\u003c/code\u003e"],"correct":0},{"id":"ml-mv08z84rfzfi","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q05","label":"Câu 5","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code dùng \u003ccode\u003eDummyClassifier(strategy=\"most_frequent\")\u003c/code\u003e. Sau khi \u003ccode\u003efit\u003c/code\u003e, mô hình dự đoán gì cho bốn mẫu validation?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.dummy import DummyClassifier\n\nX_train = [[1], [2], [3], [4], [5]]\ny_train = [0, 1, 1, 1, 0]\n\nX_val = [[10], [20], [30], [40]]\n\nmodel = DummyClassifier(strategy=\"most_frequent\")\nmodel.fit(X_train, y_train)\n\nprint(model.predict(X_val).tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0, 0, 0, 0]\u003c/code\u003e","\u003ccode\u003e[1, 1, 1, 1]\u003c/code\u003e","\u003ccode\u003e[0, 1, 1, 0]\u003c/code\u003e","\u003ccode\u003e[1, 0, 1, 0]\u003c/code\u003e"],"correct":1},{"id":"ml-1tmkc1gmxijy","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q06","label":"Câu 6","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eMột mean baseline cho bài toán hồi quy phải lấy giá trị trung bình từ target của tập train. Giá trị dự đoán cố định của baseline là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_train = [2.0, 4.0, 6.0, 8.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e6.0\u003c/code\u003e","\u003ccode\u003e8.0\u003c/code\u003e"],"correct":1},{"id":"ml-6ony5w4l9tv0","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q07","label":"Câu 7","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eMean baseline được xác định từ train và sau đó dùng để dự đoán mọi mẫu validation. Vector dự đoán nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_train = [1.0, 3.0, 5.0, 7.0]\ny_val   = [2.0, 8.0, 4.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2.0, 8.0, 4.0]\u003c/code\u003e","\u003ccode\u003e[4.0, 4.0, 4.0]\u003c/code\u003e","\u003ccode\u003e[3.0, 3.0, 3.0]\u003c/code\u003e","\u003ccode\u003e[5.0, 5.0, 5.0]\u003c/code\u003e"],"correct":1},{"id":"ml-1so11841md7vms","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q08","label":"Câu 8","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eMột mean baseline được fit trên train. MAE của baseline trên validation bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_train = [2.0, 4.0, 6.0, 8.0]\ny_val   = [3.0, 5.0, 9.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e3.0\u003c/code\u003e","\u003ccode\u003e4.0\u003c/code\u003e"],"correct":1},{"id":"ml-neqcnp1nwsrg9","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q09","label":"Câu 9","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eCho giá trị thật và giá trị dự đoán dưới đây. MAE bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_true = [2.0, 5.0, 8.0, 10.0]\ny_pred = [3.0, 3.0, 9.0, 8.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e1.5\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e"],"correct":1},{"id":"ml-1vcux6a1xc6a8g","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q10","label":"Câu 10","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eCho giá trị thật và giá trị dự đoán dưới đây. MSE bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_true = [1.0, 3.0, 6.0, 8.0]\ny_pred = [2.0, 1.0, 7.0, 6.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.5\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e","\u003ccode\u003e3.0\u003c/code\u003e"],"correct":2},{"id":"ml-x9khtd17nr2ah","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q11","label":"Câu 11","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eVới cùng dữ liệu dưới đây, RMSE bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_true = [2.0, 4.0, 6.0]\ny_pred = [1.0, 4.0, 9.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003esqrt(10 / 3)\u003c/code\u003e","\u003ccode\u003e10 / 3\u003c/code\u003e","\u003ccode\u003e4 / 3\u003c/code\u003e","\u003ccode\u003esqrt(4 / 3)\u003c/code\u003e"],"correct":0},{"id":"ml-3pl4001bkdrbs","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q12","label":"Câu 12","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau tính MAE bằng Python cơ bản. Kết quả được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_true = [4, 7, 9, 12]\ny_pred = [5, 5, 10, 9]\n\nerrors = [\n    abs(true - pred)\n    for true, pred in zip(y_true, y_pred)\n]\n\nmae = sum(errors) / len(errors)\n\nprint(errors, mae)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1, 2, 1, 3] 1.75\u003c/code\u003e","\u003ccode\u003e[1, 2, 1, 3] 7.0\u003c/code\u003e","\u003ccode\u003e[1, 4, 1, 9] 3.75\u003c/code\u003e","\u003ccode\u003e[-1, 2, -1, 3] 0.75\u003c/code\u003e"],"correct":0},{"id":"ml-1s427ka10vdb1w","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q13","label":"Câu 13","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau tính MSE. Kết quả được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_true = [2, 5, 7]\ny_pred = [1, 7, 5]\n\nsquared_errors = [\n    (true - pred) ** 2\n    for true, pred in zip(y_true, y_pred)\n]\n\nmse = sum(squared_errors) / len(squared_errors)\n\nprint(squared_errors, mse)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1, 2, 2] 1.6666666666666667\u003c/code\u003e","\u003ccode\u003e[1, 4, 4] 3.0\u003c/code\u003e","\u003ccode\u003e[1, 4, 4] 9.0\u003c/code\u003e","\u003ccode\u003e[-1, 2, -2] -0.3333333333333333\u003c/code\u003e"],"correct":1},{"id":"ml-okz2xp1938exl","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q14","label":"Câu 14","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code scikit-learn sau in ra kết quả nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.metrics import mean_absolute_error, mean_squared_error\n\ny_true = [1.0, 4.0, 7.0]\ny_pred = [2.0, 2.0, 10.0]\n\nmae = mean_absolute_error(y_true, y_pred)\nmse = mean_squared_error(y_true, y_pred)\n\nprint(mae, mse)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2.0 14.0\u003c/code\u003e","\u003ccode\u003e2.0 4.666666666666667\u003c/code\u003e","\u003ccode\u003e4.666666666666667 2.0\u003c/code\u003e","\u003ccode\u003e6.0 14.0\u003c/code\u003e"],"correct":1},{"id":"ml-pnho3m18oohaq","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q15","label":"Câu 15","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau dùng \u003ccode\u003eDummyRegressor(strategy=\"mean\")\u003c/code\u003e. Giá trị dự đoán trên validation là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.dummy import DummyRegressor\n\nX_train = [[0], [1], [2], [3]]\ny_train = [2.0, 4.0, 8.0, 10.0]\n\nX_val = [[20], [30], [40]]\n\nmodel = DummyRegressor(strategy=\"mean\")\nmodel.fit(X_train, y_train)\n\nprint(model.predict(X_val).tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2.0, 4.0, 8.0]\u003c/code\u003e","\u003ccode\u003e[6.0, 6.0, 6.0]\u003c/code\u003e","\u003ccode\u003e[8.0, 8.0, 8.0]\u003c/code\u003e","\u003ccode\u003e[20.0, 30.0, 40.0]\u003c/code\u003e"],"correct":1},{"id":"ml-1fe2juhhh7pu1","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q16","label":"Câu 16","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eMột mean baseline phải được xác định từ train rồi mới đánh giá trên validation. Đoạn code nào tuân thủ đúng nguyên tắc này?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_train = [2.0, 4.0, 6.0]\ny_val   = [10.0, 12.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003ebaseline = sum(y_train) / len(y_train)\ny_pred = [baseline] * len(y_val)\u003c/code\u003e","\u003ccode\u003ebaseline = sum(y_val) / len(y_val)\ny_pred = [baseline] * len(y_val)\u003c/code\u003e","\u003ccode\u003ebaseline = sum(y_train + y_val) / len(y_train + y_val)\ny_pred = [baseline] * len(y_val)\u003c/code\u003e","\u003ccode\u003ebaseline = y_val[0]\ny_pred = [baseline] * len(y_val)\u003c/code\u003e"],"correct":0},{"id":"ml-1riotsk16741ac","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q17","label":"Câu 17","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eHai mô hình tạo ra các sai số tuyệt đối dưới đây trên cùng một validation set. Nhận định nào đúng về MAE?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eModel A: [1, 1, 1, 5]\nModel B: [2, 2, 2, 2]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["MAE của A nhỏ hơn MAE của B","MAE của B nhỏ hơn MAE của A","Hai mô hình có MAE bằng nhau","Không thể tính MAE nếu thiếu target train"],"correct":2},{"id":"ml-v7zfdxvq39qn","chapter":"3","topic":"Phần 3 — Đợt 1: Baseline và metric hồi quy","source":{"id":"ml-p03-b01-q18","label":"Câu 18","batch":"ml-p03-b01"},"html":"\n      \n      \u003cp\u003eMean baseline được tính từ \u003ccode\u003ey_train\u003c/code\u003e. Sau đó chương trình tính MAE, MSE và RMSE trên validation. Bộ kết quả nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport math\n\ny_train = [1.0, 3.0, 5.0, 7.0]\ny_val   = [2.0, 4.0, 8.0]\n\nbaseline = sum(y_train) / len(y_train)\ny_pred = [baseline] * len(y_val)\n\nabsolute_errors = [\n    abs(true - pred)\n    for true, pred in zip(y_val, y_pred)\n]\n\nsquared_errors = [\n    (true - pred) ** 2\n    for true, pred in zip(y_val, y_pred)\n]\n\nmae = sum(absolute_errors) / len(absolute_errors)\nmse = sum(squared_errors) / len(squared_errors)\nrmse = math.sqrt(mse)\n\nprint(mae, mse, rmse)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e2.0, 4.0, 2.0\u003c/code\u003e","\u003ccode\u003e2.0, 20/3, sqrt(20/3)\u003c/code\u003e","\u003ccode\u003e6.0, 20.0, sqrt(20)\u003c/code\u003e","\u003ccode\u003e4/3, 20/3, 20/3\u003c/code\u003e"],"correct":1},{"id":"ml-17nrf6o1lm3l9g","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q01","label":"Câu 1","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eVới một feature trong tập train dưới đây, chỉ \u003ccode\u003eNone\u003c/code\u003e được xem là missing. Median dùng để điền giá trị thiếu là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex_train = [2.0, None, 8.0, 4.0, 6.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e4.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e6.0\u003c/code\u003e","\u003ccode\u003e8.0\u003c/code\u003e"],"correct":1},{"id":"ml-xutheq9gws3k","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q02","label":"Câu 2","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eMỗi cột là một feature. Median phải được tính riêng cho từng cột từ các giá trị không thiếu của \u003ccode\u003eX_train\u003c/code\u003e. Hai median lần lượt là bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX_train = [\n    [1.0, 10.0],\n    [None, 30.0],\n    [5.0, None],\n    [7.0, 50.0]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[5.0, 30.0]\u003c/code\u003e","\u003ccode\u003e[4.0, 30.0]\u003c/code\u003e","\u003ccode\u003e[5.0, 20.0]\u003c/code\u003e","\u003ccode\u003e[7.0, 50.0]\u003c/code\u003e"],"correct":0},{"id":"ml-uoqhoz17rmx9h","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q03","label":"Câu 3","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eMedian được học chỉ từ \u003ccode\u003eX_train\u003c/code\u003e, sau đó dùng để điền missing cho cả train và validation. Kết quả nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX_train = [\n    [1.0, 10.0],\n    [None, 20.0],\n    [5.0, 30.0]\n]\n\nX_val = [\n    [None, 40.0],\n    [9.0, None]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003emedians=[3,20], X_val=[[3,40],[9,20]]\u003c/code\u003e","\u003ccode\u003emedians=[5,25], X_val=[[5,40],[9,25]]\u003c/code\u003e","\u003ccode\u003emedians=[3,25], X_val=[[3,40],[9,25]]\u003c/code\u003e","\u003ccode\u003emedians=[5,20], X_val=[[5,40],[9,20]]\u003c/code\u003e"],"correct":0},{"id":"ml-90ryar1gst921","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q04","label":"Câu 4","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau dùng \u003ccode\u003eSimpleImputer(strategy=\"median\")\u003c/code\u003e. Kết quả của \u003ccode\u003eX_val_filled\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.impute import SimpleImputer\n\nX_train = [\n    [2.0, 10.0],\n    [4.0, 20.0],\n    [6.0, 30.0]\n]\n\nX_val = [\n    [None, 50.0],\n    [8.0, None]\n]\n\nimputer = SimpleImputer(\n    strategy=\"median\",\n    missing_values=None\n)\n\nimputer.fit(X_train)\nX_val_filled = imputer.transform(X_val)\n\nprint(X_val_filled.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[[4.0, 50.0], [8.0, 20.0]]\u003c/code\u003e","\u003ccode\u003e[[6.0, 50.0], [8.0, 30.0]]\u003c/code\u003e","\u003ccode\u003e[[5.0, 50.0], [8.0, 35.0]]\u003c/code\u003e","\u003ccode\u003e[[4.0, 20.0], [8.0, 20.0]]\u003c/code\u003e"],"correct":0},{"id":"ml-n2lcam1tuexd8","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q05","label":"Câu 5","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code nào áp dụng imputation đúng nguyên tắc: học median từ train và không học lại thống kê từ validation?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003eimputer.fit(X_train)\nX_train_filled = imputer.transform(X_train)\nX_val_filled = imputer.transform(X_val)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eimputer.fit(X_train)\nX_train_filled = imputer.transform(X_train)\nimputer.fit(X_val)\nX_val_filled = imputer.transform(X_val)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eimputer.fit(X_train + X_val)\nX_train_filled = imputer.transform(X_train)\nX_val_filled = imputer.transform(X_val)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003eimputer.fit(X_val)\nX_train_filled = imputer.transform(X_train)\nX_val_filled = imputer.transform(X_val)\u003c/code\u003e\u003c/pre\u003e"],"correct":0},{"id":"ml-1sditv6o88ieu","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q06","label":"Câu 6","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eTheo quy ước của ML06, điều gì phải xảy ra nếu một feature của tập train bị thiếu hoàn toàn như dưới đây?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX_train = [\n    [None, 2.0],\n    [None, 4.0],\n    [None, 6.0]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Dùng median bằng \u003ccode\u003e0\u003c/code\u003e cho cột đầu tiên","Dùng median của validation cho cột đầu tiên","Báo lỗi vì không thể tính median train của cột đó","Xóa toàn bộ các mẫu có feature đầu tiên bị thiếu"],"correct":2},{"id":"ml-1y156ub11khv6d","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q07","label":"Câu 7","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code tự cài imputation sau đây in ra gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003etrain = [1.0, None, 5.0, 9.0]\nval = [None, 7.0]\n\nobserved = sorted(\n    x for x in train\n    if x is not None\n)\n\nmedian = observed[len(observed) // 2]\n\nval_filled = [\n    median if x is None else x\n    for x in val\n]\n\nprint(median, val_filled)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0 [1.0, 7.0]\u003c/code\u003e","\u003ccode\u003e5.0 [5.0, 7.0]\u003c/code\u003e","\u003ccode\u003e7.0 [7.0, 7.0]\u003c/code\u003e","\u003ccode\u003e9.0 [9.0, 7.0]\u003c/code\u003e"],"correct":1},{"id":"ml-1pw0onghtomu","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q08","label":"Câu 8","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eMột lập trình viên tính median bằng cách gộp train và validation trước khi điền missing. Vấn đề chính của cách làm này là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eall_values = X_train + X_val\nimputer.fit(all_values)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Validation ảnh hưởng đến thống kê preprocessing được học","Median không thể được dùng cho dữ liệu dạng số","Imputation chỉ được phép thực hiện trên validation","Mọi feature phải dùng cùng một median duy nhất"],"correct":0},{"id":"ml-8ljttw1edkm5u","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q09","label":"Câu 9","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eVới feature train dưới đây, hãy dùng population standard deviation, tức chia tổng bình phương độ lệch cho \u003ccode\u003eN\u003c/code\u003e. Mean và standard deviation bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex_train = [1.0, 3.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003emean=2.0, std=1.0\u003c/code\u003e","\u003ccode\u003emean=2.0, std=sqrt(2)\u003c/code\u003e","\u003ccode\u003emean=3.0, std=1.0\u003c/code\u003e","\u003ccode\u003emean=2.0, std=2.0\u003c/code\u003e"],"correct":0},{"id":"ml-12zin9o3y53uk","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q10","label":"Câu 10","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eVới \u003ccode\u003ex_train=[1,3]\u003c/code\u003e, mean train là \u003ccode\u003e2\u003c/code\u003e và population standard deviation là \u003ccode\u003e1\u003c/code\u003e. Dùng công thức \u003ccode\u003ez=(x-mean)/std\u003c/code\u003e. Giá trị validation \u003ccode\u003ex=5\u003c/code\u003e được biến đổi thành bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e3.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e"],"correct":2},{"id":"ml-ekp5g1p20rtl","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q11","label":"Câu 11","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau dùng \u003ccode\u003eStandardScaler\u003c/code\u003e. Kết quả của \u003ccode\u003eX_val_scaled\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.preprocessing import StandardScaler\n\nX_train = [[1.0], [3.0]]\nX_val = [[5.0]]\n\nscaler = StandardScaler()\nscaler.fit(X_train)\n\nX_val_scaled = scaler.transform(X_val)\n\nprint(X_val_scaled.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[[1.0]]\u003c/code\u003e","\u003ccode\u003e[[2.0]]\u003c/code\u003e","\u003ccode\u003e[[3.0]]\u003c/code\u003e","\u003ccode\u003e[[5.0]]\u003c/code\u003e"],"correct":2},{"id":"ml-agpix1ogbunj","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q12","label":"Câu 12","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eMỗi cột được chuẩn hóa độc lập bằng mean và population standard deviation của train. Các mean của hai feature là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX_train = [\n    [1.0, 10.0],\n    [3.0, 20.0],\n    [5.0, 30.0]\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2.0, 15.0]\u003c/code\u003e","\u003ccode\u003e[3.0, 20.0]\u003c/code\u003e","\u003ccode\u003e[3.0, 30.0]\u003c/code\u003e","\u003ccode\u003e[5.0, 20.0]\u003c/code\u003e"],"correct":1},{"id":"ml-myyo711jnl0kv","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q13","label":"Câu 13","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eCho một feature train có các giá trị \u003ccode\u003e[2,4,6]\u003c/code\u003e. Dùng population standard deviation. Giá trị của variance và standard deviation lần lượt là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003evariance=8/3, std=sqrt(8/3)\u003c/code\u003e","\u003ccode\u003evariance=4, std=2\u003c/code\u003e","\u003ccode\u003evariance=8, std=sqrt(8)\u003c/code\u003e","\u003ccode\u003evariance=2, std=sqrt(2)\u003c/code\u003e"],"correct":0},{"id":"ml-1n54e096ml3a9","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q14","label":"Câu 14","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code nào chuẩn hóa dữ liệu đúng nguyên tắc train-only?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003escaler.fit(X_train)\ntrain_scaled = scaler.transform(X_train)\nval_scaled = scaler.transform(X_val)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003escaler.fit(X_train)\ntrain_scaled = scaler.transform(X_train)\nscaler.fit(X_val)\nval_scaled = scaler.transform(X_val)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003escaler.fit(X_train + X_val)\ntrain_scaled = scaler.transform(X_train)\nval_scaled = scaler.transform(X_val)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003escaler.fit(X_val)\nval_scaled = scaler.transform(X_val)\ntrain_scaled = scaler.transform(X_train)\u003c/code\u003e\u003c/pre\u003e"],"correct":0},{"id":"ml-l17qs11l223uz","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q15","label":"Câu 15","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eMột feature của train là hằng số. Theo quy ước ML07 tương thích với \u003ccode\u003eStandardScaler\u003c/code\u003e, khi standard deviation của train bằng \u003ccode\u003e0\u003c/code\u003e, dùng scale bằng \u003ccode\u003e1\u003c/code\u003e. Giá trị validation được biến đổi thành bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex_train = [4.0, 4.0]\nx_val   = [7.0]\n\nmean = 4.0\nscale = 1.0\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e3.0\u003c/code\u003e","\u003ccode\u003e7.0\u003c/code\u003e"],"correct":2},{"id":"ml-gvcmfd19kstcp","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q16","label":"Câu 16","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau được fit trên một feature train hằng số. Kết quả nào đúng cho \u003ccode\u003emean_\u003c/code\u003e, \u003ccode\u003escale_\u003c/code\u003e và giá trị validation sau transform?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.preprocessing import StandardScaler\n\nX_train = [[4.0], [4.0]]\nX_val = [[7.0]]\n\nscaler = StandardScaler()\nscaler.fit(X_train)\n\nprint(\n    scaler.mean_.tolist(),\n    scaler.scale_.tolist(),\n    scaler.transform(X_val).tolist()\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[4.0] [0.0] [[0.0]]\u003c/code\u003e","\u003ccode\u003e[4.0] [1.0] [[3.0]]\u003c/code\u003e","\u003ccode\u003e[4.0] [1.0] [[7.0]]\u003c/code\u003e","\u003ccode\u003e[7.0] [1.0] [[0.0]]\u003c/code\u003e"],"correct":1},{"id":"ml-v3r5k9j6e3u","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q17","label":"Câu 17","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code dưới đây có vấn đề gì khi mục tiêu là đánh giá mô hình trên validation mà không để validation ảnh hưởng đến preprocessing?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003escaler = StandardScaler()\n\nX_train_scaled = scaler.fit_transform(X_train)\nX_val_scaled = scaler.fit_transform(X_val)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003eX_val\u003c/code\u003e bị fit riêng nên không dùng thống kê đã học từ train","\u003ccode\u003efit_transform\u003c/code\u003e không bao giờ được phép dùng trên tập train","\u003ccode\u003eStandardScaler\u003c/code\u003e chỉ có thể transform một tập dữ liệu duy nhất","Train và validation bắt buộc phải có cùng số lượng mẫu"],"correct":0},{"id":"ml-1gwlcq8iwz4lc","chapter":"4","topic":"Phần 4 — Đợt 1: Imputation và scaling","source":{"id":"ml-p04-b01-q18","label":"Câu 18","batch":"ml-p04-b01"},"html":"\n      \n      \u003cp\u003eDữ liệu có một feature. Trước tiên điền missing bằng median của train, sau đó fit scaling trên chính train đã được điền. Dùng population standard deviation. Kết quả nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX_train = [[1.0], [None], [5.0]]\nX_val   = [[None], [7.0]]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eSau imputation, median train là \u003ccode\u003e3.0\u003c/code\u003e. Vì vậy train đã điền là \u003ccode\u003e[1,3,5]\u003c/code\u003e. Mean train là \u003ccode\u003e3\u003c/code\u003e và population standard deviation là \u003ccode\u003esqrt(8/3)\u003c/code\u003e.\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eX_val_filled=[3,7]\u003c/code\u003e và \u003ccode\u003eX_val_scaled=[0, 4/sqrt(8/3)]\u003c/code\u003e","\u003ccode\u003eX_val_filled=[5,7]\u003c/code\u003e và \u003ccode\u003eX_val_scaled=[2, 4/sqrt(8/3)]\u003c/code\u003e","\u003ccode\u003eX_val_filled=[3,7]\u003c/code\u003e và \u003ccode\u003eX_val_scaled=[3, 7]\u003c/code\u003e","\u003ccode\u003eX_val_filled=[4,7]\u003c/code\u003e và \u003ccode\u003eX_val_scaled=[0, 3/sqrt(8/3)]\u003c/code\u003e"],"correct":0},{"id":"ml-17u7vxt1yp6qtr","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q01","label":"Câu 1","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eMô hình hồi quy tuyến tính một feature dùng công thức \u003ccode\u003ey_hat = w*x + b\u003c/code\u003e. Với các giá trị dưới đây, dự đoán \u003ccode\u003ey_hat\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 4.0\nw = 2.5\nb = -1.0\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e8.0\u003c/code\u003e","\u003ccode\u003e9.0\u003c/code\u003e","\u003ccode\u003e10.0\u003c/code\u003e","\u003ccode\u003e11.0\u003c/code\u003e"],"correct":1},{"id":"ml-fq5lbom1rh3k","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q02","label":"Câu 2","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eMô hình có hai feature và dùng \u003ccode\u003ey_hat = Xw + b\u003c/code\u003e. Dự đoán cho mẫu dưới đây bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = [2.0, 3.0]\nw = [4.0, -1.0]\nb = 2.0\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e5.0\u003c/code\u003e","\u003ccode\u003e6.0\u003c/code\u003e","\u003ccode\u003e7.0\u003c/code\u003e","\u003ccode\u003e9.0\u003c/code\u003e"],"correct":2},{"id":"ml-nhqmr3xzrrix","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q03","label":"Câu 3","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eCho hai mẫu và mô hình \u003ccode\u003ey_hat = 2*x + 1\u003c/code\u003e. Vector dự đoán nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX = [1.0, 4.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[2.0, 8.0]\u003c/code\u003e","\u003ccode\u003e[3.0, 8.0]\u003c/code\u003e","\u003ccode\u003e[3.0, 9.0]\u003c/code\u003e","\u003ccode\u003e[4.0, 9.0]\u003c/code\u003e"],"correct":2},{"id":"ml-h7ye9c195gf1m","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q04","label":"Câu 4","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code dưới đây thực hiện dự đoán tuyến tính. Kết quả được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX = [\n    [1.0, 2.0],\n    [3.0, 1.0]\n]\n\nw = [2.0, -1.0]\nb = 1.0\n\npredictions = [\n    row[0] * w[0] + row[1] * w[1] + b\n    for row in X\n]\n\nprint(predictions)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.0, 5.0]\u003c/code\u003e","\u003ccode\u003e[1.0, 5.0]\u003c/code\u003e","\u003ccode\u003e[1.0, 6.0]\u003c/code\u003e","\u003ccode\u003e[2.0, 6.0]\u003c/code\u003e"],"correct":1},{"id":"ml-8ea55k1p7r1sw","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q05","label":"Câu 5","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eCho giá trị thật và dự đoán sau. MAE bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_true = [2.0, 5.0, 7.0]\ny_pred = [1.0, 7.0, 6.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e1.0\u003c/code\u003e","\u003ccode\u003e4/3\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e"],"correct":1},{"id":"ml-hnatc4kwr768","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q06","label":"Câu 6","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eVới cùng ba sai số \u003ccode\u003e[-1, 2, -1]\u003c/code\u003e, MSE và RMSE lần lượt bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003eMSE=2, RMSE=sqrt(2)\u003c/code\u003e","\u003ccode\u003eMSE=4/3, RMSE=sqrt(4/3)\u003c/code\u003e","\u003ccode\u003eMSE=2, RMSE=2\u003c/code\u003e","\u003ccode\u003eMSE=6, RMSE=sqrt(6)\u003c/code\u003e"],"correct":0},{"id":"ml-nqw0ih9uup7f","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q07","label":"Câu 7","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, MSE được định nghĩa là \u003ccode\u003e(1/n) * sum((y_hat - y)^2)\u003c/code\u003e. Với mô hình \u003ccode\u003ey_hat = w*x + b\u003c/code\u003e, gradient theo \u003ccode\u003ew\u003c/code\u003e là công thức nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(1/n) * sum((y_hat - y) * x)\u003c/code\u003e","\u003ccode\u003e(2/n) * sum((y_hat - y) * x)\u003c/code\u003e","\u003ccode\u003e(2/n) * sum(abs(y_hat - y) * x)\u003c/code\u003e","\u003ccode\u003e(1/n) * sum((y_hat - y)^2 * x)\u003c/code\u003e"],"correct":1},{"id":"ml-1kkogc71xmbmxf","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q08","label":"Câu 8","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, loss là mean squared error: \u003ccode\u003eL=(1/n)*sum((y_hat-y)^2)\u003c/code\u003e. Gradient theo bias \u003ccode\u003eb\u003c/code\u003e là công thức nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(1/n) * sum(y_hat - y)\u003c/code\u003e","\u003ccode\u003e(2/n) * sum(y_hat - y)\u003c/code\u003e","\u003ccode\u003e(2/n) * sum((y_hat - y)^2)\u003c/code\u003e","\u003ccode\u003e(1/n) * sum(abs(y_hat - y))\u003c/code\u003e"],"correct":1},{"id":"ml-6iczgij6w4gm","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q09","label":"Câu 9","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eChỉ có một mẫu \u003ccode\u003ex=2, y=5\u003c/code\u003e. Mô hình ban đầu có \u003ccode\u003ew=1, b=0\u003c/code\u003e. Dùng MSE và gradient \u003ccode\u003edw = 2*(y_hat-y)*x\u003c/code\u003e. Giá trị \u003ccode\u003edw\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e-12\u003c/code\u003e","\u003ccode\u003e-6\u003c/code\u003e","\u003ccode\u003e6\u003c/code\u003e","\u003ccode\u003e12\u003c/code\u003e"],"correct":0},{"id":"ml-13lrfxvg19a43","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q10","label":"Câu 10","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eChỉ có một mẫu \u003ccode\u003ex=2, y=5\u003c/code\u003e. Ban đầu \u003ccode\u003ew=1, b=0\u003c/code\u003e. Với MSE, gradient theo bias là \u003ccode\u003edb = 2*(y_hat-y)\u003c/code\u003e. Giá trị \u003ccode\u003edb\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e-12\u003c/code\u003e","\u003ccode\u003e-6\u003c/code\u003e","\u003ccode\u003e-3\u003c/code\u003e","\u003ccode\u003e6\u003c/code\u003e"],"correct":1},{"id":"ml-17e8tvthc4lgh","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q11","label":"Câu 11","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eVới một mẫu \u003ccode\u003ex=2, y=5\u003c/code\u003e, ban đầu \u003ccode\u003ew=1, b=0\u003c/code\u003e. Gradient MSE tại tham số hiện tại là \u003ccode\u003edw=-12\u003c/code\u003e, \u003ccode\u003edb=-6\u003c/code\u003e. Dùng learning rate \u003ccode\u003e0.1\u003c/code\u003e và cập nhật \u003ccode\u003ew = w - lr*dw\u003c/code\u003e, \u003ccode\u003eb = b - lr*db\u003c/code\u003e. Tham số mới là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003ew=-0.2, b=-0.6\u003c/code\u003e","\u003ccode\u003ew=1.2, b=0.6\u003c/code\u003e","\u003ccode\u003ew=2.2, b=0.6\u003c/code\u003e","\u003ccode\u003ew=2.2, b=-0.6\u003c/code\u003e"],"correct":2},{"id":"ml-azmn1l1qn73m3","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q12","label":"Câu 12","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eCho hai mẫu, mô hình \u003ccode\u003ey_hat = w*x + b\u003c/code\u003e với \u003ccode\u003ew=0, b=0\u003c/code\u003e. Loss là MSE và gradient được lấy trung bình trên hai mẫu. Gradient \u003ccode\u003edw\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX = [1.0, 2.0]\ny = [2.0, 4.0]\n\ndw = (2/n) * sum((y_hat - y) * x)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-10.0\u003c/code\u003e","\u003ccode\u003e-8.0\u003c/code\u003e","\u003ccode\u003e-5.0\u003c/code\u003e","\u003ccode\u003e5.0\u003c/code\u003e"],"correct":0},{"id":"ml-qgr8333ka0lh","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q13","label":"Câu 13","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eCho hai mẫu, \u003ccode\u003ew=0\u003c/code\u003e, \u003ccode\u003eb=0\u003c/code\u003e. Loss là MSE và gradient được lấy trung bình trên hai mẫu. Gradient \u003ccode\u003edb\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX = [1.0, 2.0]\ny = [2.0, 4.0]\n\ndb = (2/n) * sum(y_hat - y)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-12.0\u003c/code\u003e","\u003ccode\u003e-6.0\u003c/code\u003e","\u003ccode\u003e-3.0\u003c/code\u003e","\u003ccode\u003e6.0\u003c/code\u003e"],"correct":1},{"id":"ml-11ajj6r1km1we5","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q14","label":"Câu 14","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eVới dữ liệu dưới đây, tại \u003ccode\u003ew=0, b=0\u003c/code\u003e ta có \u003ccode\u003edw=-10\u003c/code\u003e, \u003ccode\u003edb=-6\u003c/code\u003e. Dùng learning rate \u003ccode\u003e0.1\u003c/code\u003e. Sau đúng một bước gradient descent, \u003ccode\u003ew\u003c/code\u003e và \u003ccode\u003eb\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eX = [1.0, 2.0]\ny = [2.0, 4.0]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003ew=-1.0, b=-0.6\u003c/code\u003e","\u003ccode\u003ew=0.5, b=0.3\u003c/code\u003e","\u003ccode\u003ew=1.0, b=0.6\u003c/code\u003e","\u003ccode\u003ew=1.0, b=-0.6\u003c/code\u003e"],"correct":2},{"id":"ml-19jhqxurxeu8w","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q15","label":"Câu 15","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code thực hiện một bước gradient descent. Giá trị được in ra là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 1.0\ny = 3.0\n\nw = 0.0\nb = 0.0\nlr = 0.1\n\ny_hat = w * x + b\n\ndw = 2 * (y_hat - y) * x\ndb = 2 * (y_hat - y)\n\nw = w - lr * dw\nb = b - lr * db\n\nprint(w, b)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e-0.6 -0.6\u003c/code\u003e","\u003ccode\u003e0.3 0.3\u003c/code\u003e","\u003ccode\u003e0.6 0.6\u003c/code\u003e","\u003ccode\u003e0.6 -0.6\u003c/code\u003e"],"correct":2},{"id":"ml-vjwrrj131wkb5","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q16","label":"Câu 16","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code chạy hai epoch gradient descent trên đúng một mẫu. \u003cstrong\u003eMỗi giá trị loss được lưu trước khi cập nhật tham số của epoch đó.\u003c/strong\u003e Giá trị của \u003ccode\u003eloss_history\u003c/code\u003e là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 1.0\ny = 2.0\n\nw = 0.0\nb = 0.0\nlr = 0.25\n\nloss_history = []\n\nfor epoch in range(2):\n    y_hat = w * x + b\n    loss = (y_hat - y) ** 2\n    loss_history.append(loss)\n\n    dw = 2 * (y_hat - y) * x\n    db = 2 * (y_hat - y)\n\n    w = w - lr * dw\n    b = b - lr * db\n\nprint(loss_history)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[4.0, 0.0]\u003c/code\u003e","\u003ccode\u003e[4.0, 1.0]\u003c/code\u003e","\u003ccode\u003e[2.0, 0.0]\u003c/code\u003e","\u003ccode\u003e[0.0, 0.0]\u003c/code\u003e"],"correct":0},{"id":"ml-s866bq1it0spe","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q17","label":"Câu 17","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code cũng chạy một epoch trên một mẫu, nhưng lần này \u003cstrong\u003eloss được tính sau khi cập nhật\u003c/strong\u003e. Giá trị \u003ccode\u003eloss_after\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 1.0\ny = 2.0\n\nw = 0.0\nb = 0.0\nlr = 0.1\n\ny_hat = w * x + b\ndw = 2 * (y_hat - y) * x\ndb = 2 * (y_hat - y)\n\nw = w - lr * dw\nb = b - lr * db\n\ny_hat_after = w * x + b\nloss_after = (y_hat_after - y) ** 2\n\nprint(loss_after)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.64\u003c/code\u003e","\u003ccode\u003e1.44\u003c/code\u003e","\u003ccode\u003e2.56\u003c/code\u003e","\u003ccode\u003e4.00\u003c/code\u003e"],"correct":1},{"id":"ml-1jh150c1052b84","chapter":"5","topic":"Phần 5 — Đợt 1: Hồi quy tuyến tính và gradient descent","source":{"id":"ml-p05-b01-q18","label":"Câu 18","batch":"ml-p05-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code chạy hai epoch gradient descent. \u003cstrong\u003eLoss được lưu trước cập nhật ở mỗi epoch.\u003c/strong\u003e Sau hai epoch, kết quả nào đúng cho \u003ccode\u003eloss_history\u003c/code\u003e, \u003ccode\u003ew\u003c/code\u003e và \u003ccode\u003eb\u003c/code\u003e?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = 1.0\ny = 1.0\n\nw = 0.0\nb = 0.0\nlr = 0.1\n\nloss_history = []\n\nfor epoch in range(2):\n    y_hat = w * x + b\n    error = y_hat - y\n    loss = error ** 2\n    loss_history.append(loss)\n\n    dw = 2 * error * x\n    db = 2 * error\n\n    w = w - lr * dw\n    b = b - lr * db\n\nprint(loss_history, w, b)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[1.0, 0.36], 0.32, 0.32\u003c/code\u003e","\u003ccode\u003e[1.0, 0.64], 0.36, 0.36\u003c/code\u003e","\u003ccode\u003e[1.0, 0.36], 0.40, 0.40\u003c/code\u003e","\u003ccode\u003e[0.36, 0.1296], 0.32, 0.32\u003c/code\u003e"],"correct":0},{"id":"ml-jxkik31kb3d5z","chapter":"6","topic":"Phần 6 — Đợt 1: Sigmoid và xác suất","source":{"id":"ml-p06-b01-q01","label":"Câu 1","batch":"ml-p06-b01"},"html":"\n      \n      \u003cp\u003eMột mô hình logistic có \u003ccode\u003ew = [2.0, -1.0]\u003c/code\u003e, \u003ccode\u003eb = 0.5\u003c/code\u003e và mẫu \u003ccode\u003ex = [3.0, 4.0]\u003c/code\u003e. Với \u003ccode\u003ez = w·x + b\u003c/code\u003e, logit \u003ccode\u003ez\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e1.5\u003c/code\u003e","\u003ccode\u003e2.0\u003c/code\u003e","\u003ccode\u003e2.5\u003c/code\u003e","\u003ccode\u003e3.5\u003c/code\u003e"],"correct":2},{"id":"ml-hjcnls1lzrchy","chapter":"6","topic":"Phần 6 — Đợt 1: Sigmoid và xác suất","source":{"id":"ml-p06-b01-q02","label":"Câu 2","batch":"ml-p06-b01"},"html":"\n      \n      \u003cp\u003eSigmoid được định nghĩa bởi \u003ccode\u003esigmoid(z) = 1 / (1 + exp(-z))\u003c/code\u003e. Khi \u003ccode\u003ez = 0\u003c/code\u003e, xác suất đầu ra bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.25\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e"],"correct":2},{"id":"ml-nghtyd8v4c6j","chapter":"6","topic":"Phần 6 — Đợt 1: Sigmoid và xác suất","source":{"id":"ml-p06-b01-q03","label":"Câu 3","batch":"ml-p06-b01"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eexp(-2) ≈ 0.1353\u003c/code\u003e. Với \u003ccode\u003ez = 2\u003c/code\u003e, giá trị \u003ccode\u003esigmoid(z)\u003c/code\u003e gần nhất với đáp án nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.1192\u003c/code\u003e","\u003ccode\u003e0.5000\u003c/code\u003e","\u003ccode\u003e0.7311\u003c/code\u003e","\u003ccode\u003e0.8808\u003c/code\u003e"],"correct":3},{"id":"ml-pf5jbj1i5qy3b","chapter":"6","topic":"Phần 6 — Đợt 1: Sigmoid và xác suất","source":{"id":"ml-p06-b01-q04","label":"Câu 4","batch":"ml-p06-b01"},"html":"\n      \n      \u003cp\u003eKhông cần tính chính xác hàm mũ. Nếu logit của bốn mẫu lần lượt là \u003ccode\u003e[-3.0, 0.0, 1.5, 4.0]\u003c/code\u003e, quan hệ nào giữa các xác suất sigmoid là đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003ep(-3) \u0026gt; p(0) \u0026gt; p(1.5) \u0026gt; p(4)\u003c/code\u003e","\u003ccode\u003ep(-3) \u0026lt; p(0) \u0026lt; p(1.5) \u0026lt; p(4)\u003c/code\u003e","\u003ccode\u003ep(-3) = p(0) \u0026lt; p(1.5) = p(4)\u003c/code\u003e","\u003ccode\u003ep(-3) \u0026lt; p(0) \u0026gt; p(1.5) \u0026lt; p(4)\u003c/code\u003e"],"correct":1},{"id":"ml-10cdtduvzk0n6","chapter":"6","topic":"Phần 6 — Đợt 1: Sigmoid và xác suất","source":{"id":"ml-p06-b01-q05","label":"Câu 5","batch":"ml-p06-b01"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003ez = -2\u003c/code\u003e và biết \u003ccode\u003esigmoid(2) ≈ 0.8808\u003c/code\u003e. Dùng tính chất \u003ccode\u003esigmoid(-z) = 1 - sigmoid(z)\u003c/code\u003e. Giá trị \u003ccode\u003esigmoid(-2)\u003c/code\u003e gần bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.1192\u003c/code\u003e","\u003ccode\u003e0.5000\u003c/code\u003e","\u003ccode\u003e0.7311\u003c/code\u003e","\u003ccode\u003e0.8808\u003c/code\u003e"],"correct":0},{"id":"ml-1cbxminbmcjqd","chapter":"6","topic":"Phần 6 — Đợt 1: Sigmoid và xác suất","source":{"id":"ml-p06-b01-q06","label":"Câu 6","batch":"ml-p06-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau tính sigmoid cho một logit. Giá trị được in ra gần nhất với đáp án nào?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport math\n\nx = [2.0, 1.0]\nw = [1.0, -2.0]\nb = 1.0\n\nz = sum(xi * wi for xi, wi in zip(x, w)) + b\np = 1.0 / (1.0 + math.exp(-z))\n\nprint(z, p)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.0 0.5\u003c/code\u003e","\u003ccode\u003e1.0 0.7311\u003c/code\u003e","\u003ccode\u003e2.0 0.8808\u003c/code\u003e","\u003ccode\u003e-1.0 0.2689\u003c/code\u003e"],"correct":1},{"id":"ml-1yoosxerfymw6","chapter":"6","topic":"Phần 6 — Đợt 1: Sigmoid và xác suất","source":{"id":"ml-p06-b01-q07","label":"Câu 7","batch":"ml-p06-b01"},"html":"\n      \n      \u003cp\u003eMột mô hình logistic tạo logit \u003ccode\u003ez = -1.2\u003c/code\u003e. Phát biểu nào đúng về xác suất \u003ccode\u003ep = sigmoid(z)\u003c/code\u003e?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003ep\u003c/code\u003e chắc chắn bằng \u003ccode\u003e0\u003c/code\u003e","\u003ccode\u003ep\u003c/code\u003e nằm giữa \u003ccode\u003e0\u003c/code\u003e và \u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003ep\u003c/code\u003e luôn đúng bằng \u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003ep\u003c/code\u003e nằm giữa \u003ccode\u003e0.5\u003c/code\u003e và \u003ccode\u003e1\u003c/code\u003e"],"correct":1},{"id":"ml-nxgu27tm1zn3","chapter":"6","topic":"Phần 6 — Đợt 1: Sigmoid và xác suất","source":{"id":"ml-p06-b01-q08","label":"Câu 8","batch":"ml-p06-b01"},"html":"\n      \n      \u003cp\u003eTrong bài toán phân loại nhị phân, \u003ccode\u003ep = sigmoid(z)\u003c/code\u003e được dùng làm xác suất của lớp dương. Khi \u003ccode\u003ez\u003c/code\u003e tăng từ một số âm rất lớn đến một số dương rất lớn, \u003ccode\u003ep\u003c/code\u003e thay đổi như thế nào?\u003c/p\u003e\n      \n    ","choices":["Giảm dần từ gần \u003ccode\u003e1\u003c/code\u003e xuống gần \u003ccode\u003e0\u003c/code\u003e","Tăng dần từ gần \u003ccode\u003e0\u003c/code\u003e lên gần \u003ccode\u003e1\u003c/code\u003e","Luôn giữ nguyên tại đúng \u003ccode\u003e0.5\u003c/code\u003e","Tăng không giới hạn và có thể lớn hơn \u003ccode\u003e1\u003c/code\u003e"],"correct":1},{"id":"ml-e62hbm2raj9i","chapter":"6","topic":"Phần 6 — Đợt 1: Sigmoid và xác suất","source":{"id":"ml-p06-b01-q09","label":"Câu 9","batch":"ml-p06-b01"},"html":"\n      \n      \u003cp\u003eHàm sigmoid trực tiếp \u003ccode\u003e1 / (1 + exp(-z))\u003c/code\u003e có thể gây overflow khi \u003ccode\u003ez\u003c/code\u003e là số âm có độ lớn rất lớn. Đoạn code nào tính sigmoid ổn định hơn?\u003c/p\u003e\n      \n    ","choices":["\u003cpre\u003e\u003ccode\u003edef sigmoid(z):\n    return 1.0 / (1.0 + math.exp(z))\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003edef sigmoid(z):\n    if z \u0026gt;= 0:\n        return 1.0 / (1.0 + math.exp(-z))\n    ez = math.exp(z)\n    return ez / (1.0 + ez)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003edef sigmoid(z):\n    if z \u0026gt;= 0:\n        return math.exp(z)\n    return math.exp(-z)\u003c/code\u003e\u003c/pre\u003e","\u003cpre\u003e\u003ccode\u003edef sigmoid(z):\n    return z / (1.0 + abs(z))\u003c/code\u003e\u003c/pre\u003e"],"correct":1},{"id":"ml-pqf2q7x48k03","chapter":"6","topic":"Phần 6 — Đợt 1: Sigmoid và xác suất","source":{"id":"ml-p06-b01-q10","label":"Câu 10","batch":"ml-p06-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code sau dùng cách tính sigmoid tránh overflow. Với các logit đã cho, kết quả nào mô tả đúng nhất ba xác suất?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport math\n\ndef sigmoid(z):\n    if z \u0026gt;= 0:\n        return 1.0 / (1.0 + math.exp(-z))\n    ez = math.exp(z)\n    return ez / (1.0 + ez)\n\nvalues = [\n    sigmoid(-1000.0),\n    sigmoid(0.0),\n    sigmoid(1000.0)\n]\n\nprint(values)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Gần \u003ccode\u003e[1.0, 0.5, 0.0]\u003c/code\u003e","Gần \u003ccode\u003e[0.5, 0.5, 0.5]\u003c/code\u003e","Gần \u003ccode\u003e[0.0, 0.5, 1.0]\u003c/code\u003e","Chương trình chắc chắn gây overflow tại cả hai đầu"],"correct":2},{"id":"ml-l7kxhmwluwbc","chapter":"7","topic":"Phần 7 — Đợt 1: Log loss và logistic gradient","source":{"id":"ml-p07-b01-q01","label":"Câu 1","batch":"ml-p07-b01"},"html":"\n      \n      \u003cp\u003eVới một mẫu có nhãn \u003ccode\u003ey = 1\u003c/code\u003e và xác suất dự đoán lớp dương \u003ccode\u003ep = 0.8\u003c/code\u003e, binary cross-entropy của mẫu được tính bằng \u003ccode\u003e-[y*ln(p) + (1-y)*ln(1-p)]\u003c/code\u003e. Loss bằng biểu thức nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e-ln(0.2)\u003c/code\u003e","\u003ccode\u003eln(0.8)\u003c/code\u003e","\u003ccode\u003e-ln(0.8)\u003c/code\u003e","\u003ccode\u003eln(0.2)\u003c/code\u003e"],"correct":2},{"id":"ml-r41uzw1snheag","chapter":"7","topic":"Phần 7 — Đợt 1: Log loss và logistic gradient","source":{"id":"ml-p07-b01-q02","label":"Câu 2","batch":"ml-p07-b01"},"html":"\n      \n      \u003cp\u003eVới một mẫu có \u003ccode\u003ey = 0\u003c/code\u003e và \u003ccode\u003ep = 0.2\u003c/code\u003e, binary cross-entropy bằng biểu thức nào?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e-ln(0.8)\u003c/code\u003e","\u003ccode\u003e-ln(0.2)\u003c/code\u003e","\u003ccode\u003eln(0.8)\u003c/code\u003e","\u003ccode\u003eln(0.2)\u003c/code\u003e"],"correct":0},{"id":"ml-1f9h38n1uivhyx","chapter":"7","topic":"Phần 7 — Đợt 1: Log loss và logistic gradient","source":{"id":"ml-p07-b01-q03","label":"Câu 3","batch":"ml-p07-b01"},"html":"\n      \n      \u003cp\u003eCho \u003ccode\u003eln(0.5) ≈ -0.6931\u003c/code\u003e. Với \u003ccode\u003ey = 1\u003c/code\u003e và \u003ccode\u003ep = 0.5\u003c/code\u003e, binary cross-entropy gần bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.0000\u003c/code\u003e","\u003ccode\u003e0.5000\u003c/code\u003e","\u003ccode\u003e1.3862\u003c/code\u003e","\u003ccode\u003e0.6931\u003c/code\u003e"],"correct":3},{"id":"ml-12avvbb16mj2i9","chapter":"7","topic":"Phần 7 — Đợt 1: Log loss và logistic gradient","source":{"id":"ml-p07-b01-q04","label":"Câu 4","batch":"ml-p07-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, log loss của batch là \u003cstrong\u003emean\u003c/strong\u003e loss. Cho hai mẫu \u003ccode\u003ey = [1, 0]\u003c/code\u003e và \u003ccode\u003ep = [0.8, 0.3]\u003c/code\u003e. Biểu thức nào tính đúng loss của batch?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e(-ln(0.8) - ln(0.7)) / 2\u003c/code\u003e","\u003ccode\u003e(-ln(0.2) - ln(0.3)) / 2\u003c/code\u003e","\u003ccode\u003e-ln(0.8) - ln(0.7)\u003c/code\u003e","\u003ccode\u003e(ln(0.8) + ln(0.7)) / 2\u003c/code\u003e"],"correct":0},{"id":"ml-10v90fp7deh0j","chapter":"7","topic":"Phần 7 — Đợt 1: Log loss và logistic gradient","source":{"id":"ml-p07-b01-q05","label":"Câu 5","batch":"ml-p07-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, xác suất được clip vào đoạn \u003ccode\u003e[0.001, 0.999]\u003c/code\u003e trước khi tính log loss. Với \u003ccode\u003ey = 1\u003c/code\u003e và xác suất ban đầu \u003ccode\u003ep = 1.0\u003c/code\u003e, xác suất nào thực sự đ 3e-ln(0.7311) ≈ 0.3133\u003c/code\u003e. Giá trị \u003ccode\u003eloss_after\u003c/code\u003e gần nhất là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport math\n\nx = 1.0\ny = 1.0\n\nw = 0.0\nb = 0.0\nlr = 1.0\n\nz = w * x + b\np = 1.0 / (1.0 + math.exp(-z))\n\ndw = (p - y) * x\ndb = p - y\n\nw = w - lr * dw\nb = b - lr * db\n\nz_after = w * x + b\np_after = 1.0 / (1.0 + math.exp(-z_after))\nloss_after = -math.log(p_after)\n\nprint(loss_after)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e0.3133\u003c/code\u003e","\u003ccode\u003e0.5000\u003c/code\u003e","\u003ccode\u003e0.6931\u003c/code\u003e","\u003ccode\u003e1.0000\u003c/code\u003e"],"correct":0},{"id":"ml-11bifpr24n3b","chapter":"7","topic":"Phần 7 — Đợt 1: Log loss và logistic gradient","source":{"id":"ml-p07-b01-q19","label":"Câu 19","batch":"ml-p07-b01"},"html":"\n      \n      \u003cp\u003eTrong câu này, gradient của batch được định nghĩa bằng \u003cstrong\u003emean\u003c/strong\u003e. Một lập trình viên lại viết đoạn code dưới đây. Nếu batch có \u003ccode\u003en = 4\u003c/code\u003e, gradient mà code tính ra liên hệ thế nào với gradient mean đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003edw = sum(\n    (pi - yi) * xi\n    for xi, yi, pi in zip(x, y, p)\n)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Nhỏ bằng một phần tư gradient mean","Bằng đúng gradient mean","Lớn gấp đôi gradient mean","Lớn gấp bốn lần gradient mean"],"correct":3},{"id":"ml-1yzx9hc1r5ze6i","chapter":"7","topic":"Phần 7 — Đợt 1: Log loss và logistic gradient","source":{"id":"ml-p07-b01-q20","label":"Câu 20","batch":"ml-p07-b01"},"html":"\n      \n      \u003cp\u003eĐoạn code dưới đây thực hiện hai epoch logistic gradient descent trên một mẫu. \u003cstrong\u003eMỗi loss được lưu trước cập nhật.\u003c/strong\u003e Cho \u003ccode\u003esigmoid(0)=0.5\u003c/code\u003e, \u003ccode\u003esigmoid(-1)≈0.2689\u003c/code\u003e, \u003ccode\u003e-ln(0.5)≈0.6931\u003c/code\u003e và \u003ccode\u003e-ln(1-0.2689)≈0.3133\u003c/code\u003e. Kết quả nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport math\n\nx = 2.0\ny = 0.0\n\nw = 0.0\nb = 0.0\nlr = 0.4\n\nloss_history = []\n\nfor epoch in range(2):\n    z = w * x + b\n    p = 1.0 / (1.0 + math.exp(-z))\n\n    loss = -math.log(1.0 - p)\n    loss_history.append(loss)\n\n    dw = (p - y) * x\n    db = p - y\n\n    w = w - lr * dw\n    b = b - lr * db\n\nprint(loss_history, w, b)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0.6931, 0.3133], w≈-0.6151, b≈-0.3076\u003c/code\u003e","\u003ccode\u003e[0.3133, 0.6931], w≈-0.6151, b≈-0.3076\u003c/code\u003e","\u003ccode\u003e[0.6931, 0.3133], w≈-0.4000, b≈-0.2000\u003c/code\u003e","\u003ccode\u003e[0.6931, 1.3133], w≈0.6151, b≈0.3076\u003c/code\u003e"],"correct":0},{"id":"ml-16w90tq1n66jnk","chapter":"8","topic":"Phần 8 — Đợt 1: Threshold và confusion matrix","source":{"id":"ml-p08-b01-q01","label":"Câu 1","batch":"ml-p08-b01"},"html":"\n      \n      \u003cp\u003eQuy tắc dự đoán là \u003ccode\u003ep \u0026gt;= 0.5\u003c/code\u003e thì dự đoán lớp \u003ccode\u003e1\u003c/code\u003e, ngược lại dự đoán lớp \u003ccode\u003e0\u003c/code\u003e. Với các xác suất sau, vector dự đoán là gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ep = [0.20, 0.50, 0.49, 0.91]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e[0, 0, 0, 1]\u003c/code\u003e","\u003ccode\u003e[0, 1, 1, 1]\u003c/code\u003e","\u003ccode\u003e[0, 1, 0, 1]\u003c/code\u003e","\u003ccode\u003e[1, 1, 0, 1]\u003c/code\u003e"],"correct":2},{"id":"ml-iq64yvz0kokz","chapter":"8","topic":"Phần 8 — Đợt 1: Threshold và confusion matrix","source":{"id":"ml-p08-b01-q02","label":"Câu 2","batch":"ml-p08-b01"},"html":"\n      \n      \u003cp\u003eQuy tắc dự đoán là \u003ccode\u003ep \u0026gt;= threshold\u003c/code\u003e. Với \u003ccode\u003ethreshold = 0.7\u003c/code\u003e, đoạn code sau in ra gì?\u003c/p\u003e\n      \u003cpre\u003e\u003cc
