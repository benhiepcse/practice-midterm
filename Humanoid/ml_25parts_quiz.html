nhiêu?\u003c/p\u003e\n      \n    ","choices":["5","20/3","8","10"],"correct":1},{"id":"ml-189a8q119wxqm","chapter":"20","topic":"Phần 20 — Đợt 1: PCA","source":{"id":"ml-p20-b01-q10","label":"Câu 10","batch":"ml-p20-b01"},"html":"\n      \n      \u003cp\u003eSau khi chiếu ba mẫu train lên một principal component, thu được:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003escores = [-2, 0, 2]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eMean bằng 0. Nếu dùng sample variance với mẫu số n - 1, variance bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["8/3","3","4","8"],"correct":2},{"id":"ml-l8yr7xj0l6jd","chapter":"20","topic":"Phần 20 — Đợt 1: PCA","source":{"id":"ml-p20-b01-q11","label":"Câu 11","batch":"ml-p20-b01"},"html":"\n      \n      \u003cp\u003eMột PCA có variance của ba principal components lần lượt là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e[6, 3, 1]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eExplained variance ratio của principal component thứ nhất bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.1","0.3","0.6","0.9"],"correct":2},{"id":"ml-1m4jpcgzhyjde","chapter":"20","topic":"Phần 20 — Đợt 1: PCA","source":{"id":"ml-p20-b01-q12","label":"Câu 12","batch":"ml-p20-b01"},"html":"\n      \n      \u003cp\u003eMột PCA có:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eexplained_variance_ratio_ = [0.50, 0.30, 0.15, 0.05]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNếu giữ hai principal components đầu tiên, tổng tỷ lệ phương sai được giải thích là bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.50","0.65","0.80","0.95"],"correct":2},{"id":"ml-1d60ucg1o6bkvm","chapter":"20","topic":"Phần 20 — Đợt 1: PCA","source":{"id":"ml-p20-b01-q13","label":"Câu 13","batch":"ml-p20-b01"},"html":"\n      \n      \u003cp\u003eCho một principal component đơn vị v = (1/sqrt(2), 1/sqrt(2)). Một cách cài đặt PCA khác trả về v' = (-1/sqrt(2), -1/sqrt(2)). Nhận xét nào đúng?\u003c/p\u003e\n      \n    ","choices":["v và v' biểu diễn cùng một trục PCA nhưng có hướng dấu ngược nhau.","v' không hợp lệ vì principal component không được chứa số âm.","v và v' bắt buộc giải thích lượng phương sai khác nhau.","v' chỉ hợp lệ khi toàn bộ dữ liệu train đều có giá trị âm."],"correct":0},{"id":"ml-klenpx7xeuc3","chapter":"20","topic":"Phần 20 — Đợt 1: PCA","source":{"id":"ml-p20-b01-q14","label":"Câu 14","batch":"ml-p20-b01"},"html":"\n      \n      \u003cp\u003eMột điểm đã center có tọa độ z = (4, 2). Với principal component v = (1, 0), score PCA là 4. Nếu cùng trục đó được biểu diễn bằng v' = (-1, 0), score mới bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["-4","-2","2","4"],"correct":0},{"id":"ml-ureqyqlqbjru","chapter":"20","topic":"Phần 20 — Đợt 1: PCA","source":{"id":"ml-p20-b01-q15","label":"Câu 15","batch":"ml-p20-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.decomposition import PCA\n\npca = PCA(n_components=2)\nX_train_pca = pca.fit_transform(X_train)\nX_val_pca = pca.transform(X_val)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNhận xét nào đúng về quy trình trên?\u003c/p\u003e\n      \n    ","choices":["PCA học mean và các principal components từ train rồi dùng chúng để transform validation.","PCA học lại mean và principal components từ validation khi gọi \u003ccode\u003etransform\u003c/code\u003e.","PCA ghép train với validation trước khi xác định principal components.","PCA chỉ center train, còn validation được chiếu mà không cần centering."],"correct":0},{"id":"ml-xsxxalmm40c5","chapter":"20","topic":"Phần 20 — Đợt 1: PCA","source":{"id":"ml-p20-b01-q16","label":"Câu 16","batch":"ml-p20-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.decomposition import PCA\n\npca = PCA(n_components=2)\n\nX_train_pca = pca.fit_transform(X_train)\nX_val_pca = pca.fit_transform(X_val)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNếu mục tiêu là đánh giá mô hình trên validation bằng PCA đã học từ train, vấn đề chính của đoạn code là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003en_components=2\u003c/code\u003e luôn không hợp lệ đối với dữ liệu validation.","PCA được fit lại trên validation thay vì dùng phép biến đổi đã học từ train.","\u003ccode\u003efit_transform\u003c/code\u003e không được phép sử dụng trên dữ liệu train.","PCA bắt buộc phải được fit trên validation trước rồi mới fit trên train."],"correct":1},{"id":"ml-dwa4g2dxqfmi","chapter":"19","topic":"Phần 19 — Đợt 1: RBF kernel","source":{"id":"ml-p19-b01-q01","label":"Câu 1","batch":"ml-p19-b01"},"html":"\n      \n      \u003cp\u003eCho hai điểm x = (1, 2) và z = (4, 6). Squared Euclidean distance ||x - z||² bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["5","7","25","49"],"correct":2},{"id":"ml-1amt19ovmv9uc","chapter":"19","topic":"Phần 19 — Đợt 1: RBF kernel","source":{"id":"ml-p19-b01-q02","label":"Câu 2","batch":"ml-p19-b01"},"html":"\n      \n      \u003cp\u003eCho x = (2, 3) và z = (5, 7). RBF kernel được định nghĩa:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eK(x, z) = exp(-gamma * ||x - z||^2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eVới gamma = 0.04, giá trị K(x, z) bằng biểu thức nào?\u003c/p\u003e\n      \n    ","choices":["exp(-0.20)","exp(-0.40)","exp(-1.00)","exp(-25.00)"],"correct":2},{"id":"ml-1340e2d17n05vb","chapter":"19","topic":"Phần 19 — Đợt 1: RBF kernel","source":{"id":"ml-p19-b01-q03","label":"Câu 3","batch":"ml-p19-b01"},"html":"\n      \n      \u003cp\u003eHai điểm x và z có squared distance ||x - z||² = 4. Với gamma = 0.5 và công thức K(x,z) = exp(-gamma * ||x-z||²), kernel value xấp xỉ bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.0183","0.1353","0.3679","0.6065"],"correct":1},{"id":"ml-9kyubnorbvt","chapter":"19","topic":"Phần 19 — Đợt 1: RBF kernel","source":{"id":"ml-p19-b01-q04","label":"Câu 4","batch":"ml-p19-b01"},"html":"\n      \n      \u003cp\u003eCho hai điểm giống hệt nhau x = z = (3, -2). Với gamma \u0026gt; 0, RBF kernel K(x,z) = exp(-gamma * ||x-z||²) bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0","1","gamma","exp(-gamma)"],"correct":1},{"id":"ml-xjhvrk1g82mm4","chapter":"19","topic":"Phần 19 — Đợt 1: RBF kernel","source":{"id":"ml-p19-b01-q05","label":"Câu 5","batch":"ml-p19-b01"},"html":"\n      \n      \u003cp\u003eHai điểm có squared distance d² = 2. So sánh hai RBF kernel sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eK1 = exp(-0.1 * d^2)\nK2 = exp(-2.0 * d^2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNhận xét nào đúng?\u003c/p\u003e\n      \n    ","choices":["K1 \u0026lt; K2 vì gamma nhỏ làm kernel giảm nhanh hơn.","K1 \u0026gt; K2 vì gamma lớn làm kernel giảm nhanh hơn theo khoảng cách.","K1 = K2 vì hai kernel dùng cùng squared distance.","K1 và K2 luôn bằng 1 vì squared distance là số dương."],"correct":1},{"id":"ml-14exoiw1229jye","chapter":"19","topic":"Phần 19 — Đợt 1: RBF kernel","source":{"id":"ml-p19-b01-q06","label":"Câu 6","batch":"ml-p19-b01"},"html":"\n      \n      \u003cp\u003eCho điểm truy vấn q = (0, 0) và hai điểm A = (1, 0), B = (3, 0). Với gamma = 1 và K(q,x) = exp(-gamma * ||q-x||²), nhận xét nào đúng?\u003c/p\u003e\n      \n    ","choices":["K(q,A) = exp(-1) và K(q,B) = exp(-3).","K(q,A) = exp(-1) và K(q,B) = exp(-9).","K(q,A) = exp(-2) và K(q,B) = exp(-6).","K(q,A) = exp(1) và K(q,B) = exp(9)."],"correct":1},{"id":"ml-tyxs6152kmg9","chapter":"19","topic":"Phần 19 — Đợt 1: RBF kernel","source":{"id":"ml-p19-b01-q07","label":"Câu 7","batch":"ml-p19-b01"},"html":"\n      \n      \u003cp\u003eVới một cặp điểm cố định có squared distance khác 0, ta tăng gamma từ 0.1 lên 10 trong RBF kernel. Điều gì xảy ra với kernel value?\u003c/p\u003e\n      \n    ","choices":["Kernel value tăng dần về 1.","Kernel value giảm vì số mũ trở nên âm hơn.","Kernel value không đổi vì khoảng cách không đổi.","Kernel value trở thành xác suất của lớp dương."],"correct":1},{"id":"ml-1dvtkq61bx52yi","chapter":"19","topic":"Phần 19 — Đợt 1: RBF kernel","source":{"id":"ml-p19-b01-q08","label":"Câu 8","batch":"ml-p19-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.svm import SVC\n\nmodel = SVC(kernel=\"rbf\", gamma=0.5, C=1.0)\nmodel.fit(X_train, y_train)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTham số \u003ccode\u003egamma=0.5\u003c/code\u003e liên quan trực tiếp đến thành phần nào của RBF kernel?\u003c/p\u003e\n      \n    ","choices":["Hệ số nhân với squared distance trong số mũ âm.","Số lượng support vectors bắt buộc của mỗi lớp.","Xác suất tối thiểu để một mẫu được gán lớp dương.","Số principal components được giữ lại trước khi phân loại."],"correct":0},{"id":"ml-k4hxmvnbss1x","chapter":"19","topic":"Phần 19 — Đợt 1: RBF kernel","source":{"id":"ml-p19-b01-q09","label":"Câu 9","batch":"ml-p19-b01"},"html":"\n      \n      \u003cp\u003eCho x = (0, 0), z = (2, 0), gamma = 0.25 và công thức:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eK(x, z) = exp(-gamma * ||x - z||^2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eGiá trị kernel xấp xỉ bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.1353","0.3679","0.6065","0.7788"],"correct":1},{"id":"ml-jzgh0ke541gc","chapter":"19","topic":"Phần 19 — Đợt 1: RBF kernel","source":{"id":"ml-p19-b01-q10","label":"Câu 10","batch":"ml-p19-b01"},"html":"\n      \n      \u003cp\u003eMột mô hình RBF-SVM tính được K(x,z) = 0.82 cho hai điểm x và z. Phát biểu nào đúng nhất?\u003c/p\u003e\n      \n    ","choices":["0.82 chắc chắn là xác suất x thuộc cùng lớp với z.","0.82 chắc chắn là xác suất mô hình dự đoán lớp dương.","0.82 là giá trị similarity của RBF kernel, không mặc định là xác suất lớp.","0.82 là squared Euclidean distance giữa hai điểm trước khi áp dụng kernel."],"correct":2},{"id":"ml-xcbicf13uai1v","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q01","label":"Câu 1","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eCho điểm x = (2, 1) và hai tâm cụm C0 = (0, 0), C1 = (5, 1). Dùng squared Euclidean distance. Điểm x được gán vào cụm nào?\u003c/p\u003e\n      \n    ","choices":["Cụm 0 vì khoảng cách bình phương đến C0 bằng 5.","Cụm 0 vì khoảng cách bình phương đến C0 bằng 4.","Cụm 1 vì khoảng cách bình phương đến C1 bằng 3.","Cụm 1 vì khoảng cách bình phương đến C1 bằng 9."],"correct":0},{"id":"ml-16s4o0l1h09aid","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q02","label":"Câu 2","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eCho điểm x = (4, 3) và hai tâm C0 = (1, 3), C1 = (5, 5). Squared Euclidean distance từ x đến C0 và C1 lần lượt bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["3 và 3.","5 và 9.","9 và 5.","9 và 9."],"correct":2},{"id":"ml-1c5hh21sgb8hb","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q03","label":"Câu 3","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eCho điểm x = (2, 0), C0 = (0, 0), C1 = (4, 0). Khoảng cách từ x đến hai tâm bằng nhau. Trong bài này quy ước khi hòa khoảng cách thì chọn tâm có index nhỏ hơn. x được gán vào cụm nào?\u003c/p\u003e\n      \n    ","choices":["Cụm 0.","Cụm 1.","Cả cụm 0 và cụm 1.","Không được gán vào cụm nào."],"correct":0},{"id":"ml-emizyj1rmvp3t","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q04","label":"Câu 4","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eSau bước assignment, cụm 0 chứa ba điểm:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e(1, 2)\n(3, 4)\n(5, 6)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTâm mới của cụm 0 sau bước update bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["(2, 3)","(3, 4)","(4, 5)","(9, 12)"],"correct":1},{"id":"ml-luez6dherhbv","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q05","label":"Câu 5","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eSau bước assignment, một cụm chứa bốn điểm một chiều:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003e2, 4, 8, 10\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTâm mới của cụm sau bước update bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["4","5","6","8"],"correct":2},{"id":"ml-1ul3maouiy268","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q06","label":"Câu 6","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eCho dữ liệu một chiều X = [0, 2, 8, 10] với hai tâm ban đầu C0 = 0 và C1 = 10. Sau một bước assignment rồi update theo mean của các điểm trong từng cụm, hai tâm mới là gì?\u003c/p\u003e\n      \n    ","choices":["C0 = 0, C1 = 10.","C0 = 1, C1 = 9.","C0 = 2, C1 = 8.","C0 = 5, C1 = 5."],"correct":1},{"id":"ml-1a3xgsi19pdrf0","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q07","label":"Câu 7","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eCho các điểm X = [0, 2, 4] và hai tâm C0 = 0, C1 = 4. Điểm 2 cách đều hai tâm. Theo quy ước của bài, khi hòa chọn tâm có index nhỏ hơn. Sau bước assignment, kết quả nào đúng?\u003c/p\u003e\n      \n    ","choices":["Cụm 0 chứa [0], cụm 1 chứa [2, 4].","Cụm 0 chứa [0, 2], cụm 1 chứa [4].","Cụm 0 chứa [0, 4], cụm 1 chứa [2].","Cụm 0 chứa [2], cụm 1 chứa [0, 4]."],"correct":1},{"id":"ml-1y8n39nym48mj","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q08","label":"Câu 8","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eCho dữ liệu X = [0, 2, 4] và hai tâm ban đầu C0 = 0, C1 = 4. Khi hòa khoảng cách chọn tâm có index nhỏ hơn. Thực hiện một bước assignment rồi update. Hai tâm mới là gì?\u003c/p\u003e\n      \n    ","choices":["C0 = 0, C1 = 3.","C0 = 1, C1 = 3.","C0 = 1, C1 = 4.","C0 = 2, C1 = 4."],"correct":2},{"id":"ml-togz2v197uvdp","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q09","label":"Câu 9","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eTrong một bài tự cài K-means, sau bước assignment không có điểm nào được gán vào cụm 2. Quy ước của bài là: nếu một cụm rỗng, giữ nguyên tâm cũ của cụm đó. Nếu tâm cũ của cụm 2 là (7, 3), tâm mới của cụm 2 là gì?\u003c/p\u003e\n      \n    ","choices":["(0, 0)","(3, 7)","(5, 5)","(7, 3)"],"correct":3},{"id":"ml-x8hobn13gm89f","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q10","label":"Câu 10","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eCho bốn điểm một chiều X = [0, 2, 8, 10]. Sau khi phân cụm, cụm 0 chứa [0, 2] với tâm 1 và cụm 1 chứa [8, 10] với tâm 9. Inertia được tính là tổng squared distance của mỗi điểm đến tâm cụm của nó. Inertia bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["2","4","8","16"],"correct":1},{"id":"ml-wp2ep81lgwbcy","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q11","label":"Câu 11","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eCho ba điểm hai chiều được gán vào cùng một cụm có tâm C = (2, 2):\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eA = (1, 2)\nB = (2, 4)\nD = (4, 2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003ePhần đóng góp của ba điểm này vào inertia bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["5","7","9","14"],"correct":2},{"id":"ml-1xzs8rsvn5uri","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q12","label":"Câu 12","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eCho dữ liệu một chiều X = [1, 3, 9, 11] và hai tâm ban đầu C0 = 2, C1 = 10. Sau một bước assignment, mỗi điểm được gán cho tâm gần nhất. Tâm mới sau bước update là gì?\u003c/p\u003e\n      \n    ","choices":["C0 = 1, C1 = 9.","C0 = 2, C1 = 10.","C0 = 3, C1 = 9.","C0 = 4, C1 = 8."],"correct":1},{"id":"ml-3flnynjgu0il","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q13","label":"Câu 13","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code tự cài bước assignment sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003epoints = [1, 4, 8]\ncenters = [0, 10]\n\nlabels = []\nfor x in points:\n    d0 = (x - centers[0]) ** 2\n    d1 = (x - centers[1]) ** 2\n    labels.append(0 if d0 \u0026lt;= d1 else 1)\n\nprint(labels)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eOutput là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[0, 0, 1]\u003c/code\u003e","\u003ccode\u003e[0, 1, 1]\u003c/code\u003e","\u003ccode\u003e[1, 0, 1]\u003c/code\u003e","\u003ccode\u003e[1, 1, 0]\u003c/code\u003e"],"correct":0},{"id":"ml-1sflbwxcrojml","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q14","label":"Câu 14","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.cluster import KMeans\n\nmodel = KMeans(\n    n_clusters=3,\n    random_state=42,\n    n_init=10\n)\nmodel.fit(X)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eThuộc tính nào chứa tọa độ các tâm cụm sau khi mô hình đã fit?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003emodel.labels_\u003c/code\u003e","\u003ccode\u003emodel.cluster_centers_\u003c/code\u003e","\u003ccode\u003emodel.inertia_\u003c/code\u003e","\u003ccode\u003emodel.n_clusters\u003c/code\u003e"],"correct":1},{"id":"ml-eajcospvansk","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q15","label":"Câu 15","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eXét mô hình đã được fit:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.cluster import KMeans\n\nmodel = KMeans(\n    n_clusters=2,\n    random_state=7,\n    n_init=10\n)\nmodel.fit(X_train)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTrong scikit-learn, \u003ccode\u003emodel.inertia_\u003c/code\u003e biểu diễn đại lượng nào?\u003c/p\u003e\n      \n    ","choices":["Tổng khoảng cách Euclidean không bình phương giữa mọi cặp điểm.","Tổng squared distance của các mẫu đến tâm cụm gần nhất của chúng.","Trung bình tọa độ của tất cả các tâm cụm sau khi thuật toán hội tụ.","Số mẫu được gán vào cụm có nhiều phần tử nhất trong dữ liệu train."],"correct":1},{"id":"ml-ohjz7a15j09nc","chapter":"21","topic":"Phần 21 — Đợt 1: K-means","source":{"id":"ml-p21-b01-q16","label":"Câu 16","batch":"ml-p21-b01"},"html":"\n      \n      \u003cp\u003eHai kết quả K-means trên cùng dữ liệu có inertia lần lượt là 120 và 85. Nếu chỉ xét đúng mục tiêu tối ưu nội bộ của K-means là giảm tổng squared distance trong cụm, nhận xét nào đúng?\u003c/p\u003e\n      \n    ","choices":["120 tốt hơn vì inertia càng lớn thì các điểm càng gần tâm.","85 tốt hơn theo mục tiêu này vì tổng squared distance nhỏ hơn.","Hai kết quả tương đương vì inertia không phụ thuộc vào tâm cụm.","Không thể so sánh vì inertia luôn nằm trong khoảng từ 0 đến 1."],"correct":1},{"id":"ml-cu39hf1kbbo71","chapter":"22","topic":"Phần 22 — Đợt 1: Silhouette","source":{"id":"ml-p22-b01-q01","label":"Câu 1","batch":"ml-p22-b01"},"html":"\n      \n      \u003cp\u003eVới một mẫu i, khoảng cách trung bình từ i đến các mẫu khác trong cùng cụm là a(i) = 2, và khoảng cách trung bình nhỏ nhất từ i đến một cụm khác là b(i) = 6. Dùng công thức s(i) = (b(i) - a(i)) / max(a(i), b(i)). Silhouette của mẫu i bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["1/3","1/2","2/3","3/4"],"correct":2},{"id":"ml-939j6i2jvvn2","chapter":"22","topic":"Phần 22 — Đợt 1: Silhouette","source":{"id":"ml-p22-b01-q02","label":"Câu 2","batch":"ml-p22-b01"},"html":"\n      \n      \u003cp\u003eMột mẫu có a(i) = 5 và b(i) = 3. Dùng s(i) = (b(i) - a(i)) / max(a(i), b(i)). Silhouette bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["-0.4","-0.2","0.2","0.4"],"correct":0},{"id":"ml-4mnlgx1l5aevf","chapter":"22","topic":"Phần 22 — Đợt 1: Silhouette","source":{"id":"ml-p22-b01-q03","label":"Câu 3","batch":"ml-p22-b01"},"html":"\n      \n      \u003cp\u003eMột mẫu x thuộc cụm A. Khoảng cách từ x đến hai mẫu còn lại trong A lần lượt là 2 và 4. Giá trị a(x) bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["2","3","4","6"],"correct":1},{"id":"ml-uz3wwu1lediy8","chapter":"22","topic":"Phần 22 — Đợt 1: Silhouette","source":{"id":"ml-p22-b01-q04","label":"Câu 4","batch":"ml-p22-b01"},"html":"\n      \n      \u003cp\u003eMột mẫu x thuộc cụm A. Khoảng cách từ x đến các mẫu của hai cụm khác như sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eCụm B: 2, 4, 6\nCụm C: 5, 7\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eGiá trị b(x) bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["2","4","5","6"],"correct":1},{"id":"ml-1rw4kbkzpb3mo","chapter":"22","topic":"Phần 22 — Đợt 1: Silhouette","source":{"id":"ml-p22-b01-q05","label":"Câu 5","batch":"ml-p22-b01"},"html":"\n      \n      \u003cp\u003eMột mẫu x thuộc cụm A. Khoảng cách từ x đến hai mẫu khác trong A là 1 và 3. Khoảng cách từ x đến các mẫu thuộc B là 4 và 6; đến các mẫu thuộc C là 7 và 9. Dùng khoảng cách trung bình để tính a(x) và b(x). Silhouette s(x) bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.40","0.50","0.60","0.75"],"correct":2},{"id":"ml-ut8gl6ld70c0","chapter":"22","topic":"Phần 22 — Đợt 1: Silhouette","source":{"id":"ml-p22-b01-q06","label":"Câu 6","batch":"ml-p22-b01"},"html":"\n      \n      \u003cp\u003eMột mẫu x thuộc cụm A. Khoảng cách trung bình từ x đến các mẫu khác trong A là 6. Khoảng cách trung bình từ x đến cụm B là 3 và đến cụm C là 8. Giá trị b(x) và silhouette s(x) lần lượt là gì?\u003c/p\u003e\n      \n    ","choices":["b(x) = 3 và s(x) = -0.5.","b(x) = 8 và s(x) = 0.25.","b(x) = 3 và s(x) = 0.5.","b(x) = 8 và s(x) = -0.25."],"correct":0},{"id":"ml-nuba5l1pttu87","chapter":"22","topic":"Phần 22 — Đợt 1: Silhouette","source":{"id":"ml-p22-b01-q07","label":"Câu 7","batch":"ml-p22-b01"},"html":"\n      \n      \u003cp\u003eMột mẫu có a(i) = b(i) = 4. Theo công thức s(i) = (b(i) - a(i)) / max(a(i), b(i)), silhouette của mẫu bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["-1","0","0.5","1"],"correct":1},{"id":"ml-pmpg4ukd38bw","chapter":"22","topic":"Phần 22 — Đợt 1: Silhouette","source":{"id":"ml-p22-b01-q08","label":"Câu 8","batch":"ml-p22-b01"},"html":"\n      \n      \u003cp\u003eMột mẫu là phần tử duy nhất trong cụm của nó (singleton cluster). Theo quy ước của \u003ccode\u003esklearn.metrics.silhouette_samples\u003c/code\u003e, silhouette coefficient của mẫu này được đặt bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["-1","0","0.5","1"],"correct":1},{"id":"ml-11c7q8n1feqwod","chapter":"22","topic":"Phần 22 — Đợt 1: Silhouette","source":{"id":"ml-p22-b01-q09","label":"Câu 9","batch":"ml-p22-b01"},"html":"\n      \n      \u003cp\u003eXét dữ liệu gồm 6 mẫu và nhãn cụm:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003elabels = [0, 0, 0, 0, 0, 0]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eĐiều gì xảy ra nếu gọi \u003ccode\u003esilhouette_samples(X, labels)\u003c/code\u003e với các nhãn trên?\u003c/p\u003e\n      \n    ","choices":["Hàm trả về silhouette bằng 0 cho cả 6 mẫu.","Hàm trả về silhouette bằng 1 cho cả 6 mẫu.","Không thể tính silhouette hợp lệ vì dữ liệu chỉ có một nhãn cụm.","Hàm tự động chia dữ liệu thành hai cụm trước khi tính."],"correct":2},{"id":"ml-x8qxnceyymkq","chapter":"22","topic":"Phần 22 — Đợt 1: Silhouette","source":{"id":"ml-p22-b01-q10","label":"Câu 10","batch":"ml-p22-b01"},"html":"\n      \n      \u003cp\u003eMột mẫu có a(i) = 1 và b(i) = 9, trong khi một mẫu khác có a(j) = 7 và b(j) = 2. Nhận xét nào đúng dựa trên silhouette coefficient?\u003c/p\u003e\n      \n    ","choices":["Mẫu i có silhouette âm còn mẫu j có silhouette dương.","Cả hai mẫu đều có silhouette bằng 0 vì a và b khác nhau.","Mẫu i có silhouette dương cao, còn mẫu j có silhouette âm.","Cả hai mẫu đều có silhouette dương vì a và b đều dương."],"correct":2},{"id":"ml-1ajcgdc1fgwcu4","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q01","label":"Câu 1","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003ePhân phối Gaussian 1D có mean μ = 0 và standard deviation σ = 1. Dùng công thức mật độ:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ef(x) = 1 / (sigma * sqrt(2*pi)) * exp(-(x-mu)^2 / (2*sigma^2))\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTại x = 0, giá trị density xấp xỉ bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.1596","0.3989","0.5000","1.0000"],"correct":1},{"id":"ml-um8v0y15n46co","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q02","label":"Câu 2","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eGaussian 1D có μ = 2, σ = 2. Tại x = 2, thành phần số mũ \u003ccode\u003eexp(-(x-mu)^2 / (2*sigma^2))\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0","0.5","1","2"],"correct":2},{"id":"ml-ul8xiqpt8np8","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q03","label":"Câu 3","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eMột Gaussian 1D có variance bằng 9. Standard deviation σ bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["3","4.5","9","81"],"correct":0},{"id":"ml-3jersa1wa5pj8","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q04","label":"Câu 4","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eMột Gaussian 1D có standard deviation σ = 4. Variance bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["2","4","8","16"],"correct":3},{"id":"ml-5iz7kx1qqtenr","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q05","label":"Câu 5","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eGiả sử Gaussian PDF tại x = 1 có giá trị f(1) = 0.42. Nhận xét nào đúng?\u003c/p\u003e\n      \n    ","choices":["0.42 là density tại x = 1, không phải xác suất P(X = 1).","P(X = 1) chắc chắn bằng 0.42 đối với biến ngẫu nhiên liên tục.","0.42 là variance của Gaussian tại điểm x = 1.","0.42 là responsibility của một component GMM."],"correct":0},{"id":"ml-gtw8su64qlwa","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q06","label":"Câu 6","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eTrong GMM có hai component. Tại một điểm x, các trọng số mixture và Gaussian density tương ứng là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003epi_1 = 0.6,  f_1(x) = 0.2\npi_2 = 0.4,  f_2(x) = 0.3\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eGiá trị chưa chuẩn hóa \u003ccode\u003epi_k * f_k(x)\u003c/code\u003e của component 1 và 2 lần lượt bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.12 và 0.12","0.20 và 0.30","0.36 và 0.16","0.60 và 0.40"],"correct":0},{"id":"ml-11gwxj91y0vxnv","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q07","label":"Câu 7","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eVới một điểm x trong GMM hai component:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003epi_1 * f_1(x) = 0.12\npi_2 * f_2(x) = 0.08\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eResponsibility của component 1 đối với x bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.20","0.40","0.60","0.80"],"correct":2},{"id":"ml-1ez8dkg14vud56","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q08","label":"Câu 8","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eVới một điểm x, ba component có giá trị chưa chuẩn hóa:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ecomponent 1: 0.10\ncomponent 2: 0.30\ncomponent 3: 0.60\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eResponsibility của component 2 bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.10","0.30","0.60","0.90"],"correct":1},{"id":"ml-14a8x214nrkhg","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q09","label":"Câu 9","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eMột GMM có hai component. Với một mẫu x, responsibility tính được là r1 = 0.75 và r2 = 0.25. Phát biểu nào đúng?\u003c/p\u003e\n      \n    ","choices":["Hai responsibility phải cộng lại bằng 0.","Mẫu x có mức gán mềm lớn hơn cho component 1.","Mẫu x bắt buộc chỉ thuộc component 1 với xác suất 1.","Hai responsibility chính là mean của hai Gaussian."],"correct":1},{"id":"ml-1cvpryex6nrw2","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q10","label":"Câu 10","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eCho ba mẫu một chiều:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = [0, 2, 4]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eResponsibility của component 1 đối với ba mẫu lần lượt là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003er = [1.0, 0.5, 0.5]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eDùng cập nhật mean \u003ccode\u003emu = sum(r_i*x_i) / sum(r_i)\u003c/code\u003e. Mean mới của component 1 bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["1.0","1.5","2.0","3.0"],"correct":1},{"id":"ml-xpxpcurebn9k","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q11","label":"Câu 11","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eCho bốn mẫu một chiều:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ex = [1, 3, 5, 7]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eResponsibility của component 2 là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003er = [0, 0, 1, 1]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTheo công thức mean có trọng số của M-step, mean mới của component 2 bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["3","4","5","6"],"correct":3},{"id":"ml-exvlznpq3m1h","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q12","label":"Câu 12","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eTrong GMM có N = 5 mẫu. Tổng responsibility của component 1 trên năm mẫu là 2.0. Dùng cập nhật mixture weight \u003ccode\u003epi_1 = sum(r_i1) / N\u003c/code\u003e. Trọng số mới của component 1 bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.2","0.4","0.5","2.5"],"correct":1},{"id":"ml-n0cfmm129z9ec","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q13","label":"Câu 13","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eMột GMM có N = 4 mẫu. Tổng responsibility của ba component lần lượt là:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eN1 = 1.0\nN2 = 2.0\nN3 = 1.0\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eSau bước cập nhật mixture weights, bộ trọng số mới là gì?\u003c/p\u003e\n      \n    ","choices":["(0.25, 0.50, 0.25)","(0.20, 0.40, 0.20)","(1.00, 2.00, 1.00)","(0.50, 1.00, 0.50)"],"correct":0},{"id":"ml-165a9jh6abqub","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q14","label":"Câu 14","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eCho hai component với:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003epi_1 = 0.25, f_1(x) = 0.8\npi_2 = 0.75, f_2(x) = 0.4\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eResponsibility r1 của component 1 đối với x bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.25","0.40","0.50","0.80"],"correct":1},{"id":"ml-1076hm51jq9vl7","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q15","label":"Câu 15","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eCho hai Gaussian 1D có cùng mean μ = 0. Gaussian A có σ = 1, Gaussian B có σ = 3. Nhận xét nào đúng về variance của chúng?\u003c/p\u003e\n      \n    ","choices":["A có variance 1, B có variance 3.","A có variance 1, B có variance 9.","A có variance 2, B có variance 6.","A có variance 1, B có variance sqrt(3)."],"correct":1},{"id":"ml-9di93o1a4nzk8","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q16","label":"Câu 16","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom scipy.stats import norm\n\nvalue = norm.pdf(0, loc=0, scale=2)\nprint(round(value, 4))\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTrong đoạn code này, \u003ccode\u003escale=2\u003c/code\u003e biểu diễn đại lượng nào của Gaussian?\u003c/p\u003e\n      \n    ","choices":["Mean bằng 2.","Variance bằng 2.","Standard deviation bằng 2.","Mixture weight bằng 2."],"correct":2},{"id":"ml-ppdvuf1ihtz39","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q17","label":"Câu 17","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.mixture import GaussianMixture\n\ngmm = GaussianMixture(\n    n_components=3,\n    random_state=42\n)\ngmm.fit(X)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eSau khi fit, thuộc tính nào chứa mixture weights của ba component?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003egmm.means_\u003c/code\u003e","\u003ccode\u003egmm.weights_\u003c/code\u003e","\u003ccode\u003egmm.labels_\u003c/code\u003e","\u003ccode\u003egmm.components_\u003c/code\u003e"],"correct":1},{"id":"ml-16hj1mj1u29fjn","chapter":"23","topic":"Phần 23 — Đợt 1: Gaussian và GMM","source":{"id":"ml-p23-b01-q18","label":"Câu 18","batch":"ml-p23-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.mixture import GaussianMixture\n\ngmm = GaussianMixture(\n    n_components=2,\n    random_state=0\n)\ngmm.fit(X_train)\n\nR = gmm.predict_proba(X_test)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eTrong ngữ cảnh GMM, mỗi hàng của \u003ccode\u003eR\u003c/code\u003e biểu diễn điều gì?\u003c/p\u003e\n      \n    ","choices":["Khoảng cách Euclidean từ mẫu đến từng component mean.","Responsibility của từng component đối với mẫu tương ứng.","Variance của từng feature trong mẫu tương ứng.","Nhãn hard-clustering lặp lại cho từng component."],"correct":1},{"id":"ml-x3h4z01vefryw","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q01","label":"Câu 1","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code sau. Quy ước mẫu có xác suất đúng bằng threshold vẫn được dự đoán là lớp dương.\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ny_prob = np.array([0.20, 0.50, 0.70, 0.90])\nthreshold = 0.50\n\ny_pred = (y_prob \u0026gt;= threshold).astype(int)\nprint(y_pred.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eOutput là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[0, 0, 1, 1]\u003c/code\u003e","\u003ccode\u003e[0, 1, 1, 1]\u003c/code\u003e","\u003ccode\u003e[1, 1, 1, 1]\u003c/code\u003e","\u003ccode\u003e[0, 1, 0, 1]\u003c/code\u003e"],"correct":1},{"id":"ml-13xsnfj1p62avl","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q02","label":"Câu 2","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code sau, trong đó lớp 1 là lớp dương:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ny_true = np.array([1, 0, 1, 0, 1])\ny_prob = np.array([0.90, 0.80, 0.70, 0.40, 0.30])\n\nthreshold = 0.70\ny_pred = (y_prob \u0026gt;= threshold).astype(int)\n\ntp = np.sum((y_true == 1) \u0026amp; (y_pred == 1))\nfp = np.sum((y_true == 0) \u0026amp; (y_pred == 1))\nfn = np.sum((y_true == 1) \u0026amp; (y_pred == 0))\n\nprint(tp, fp, fn)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eOutput là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e1 1 2\u003c/code\u003e","\u003ccode\u003e2 0 1\u003c/code\u003e","\u003ccode\u003e2 1 1\u003c/code\u003e","\u003ccode\u003e3 1 0\u003c/code\u003e"],"correct":2},{"id":"ml-1v98eg51f88x3n","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q03","label":"Câu 3","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code sau, lớp 1 là lớp dương:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ny_true = np.array([1, 0, 1, 0, 1])\ny_prob = np.array([0.90, 0.80, 0.70, 0.40, 0.30])\n\nthreshold = 0.70\ny_pred = (y_prob \u0026gt;= threshold).astype(int)\n\ntp = np.sum((y_true == 1) \u0026amp; (y_pred == 1))\nfp = np.sum((y_true == 0) \u0026amp; (y_pred == 1))\nfn = np.sum((y_true == 1) \u0026amp; (y_pred == 0))\n\nprecision = tp / (tp + fp)\nrecall = tp / (tp + fn)\n\nprint(round(precision, 3), round(recall, 3))\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eOutput là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.500 0.667\u003c/code\u003e","\u003ccode\u003e0.667 0.667\u003c/code\u003e","\u003ccode\u003e0.667 1.000\u003c/code\u003e","\u003ccode\u003e1.000 0.667\u003c/code\u003e"],"correct":1},{"id":"ml-1emxp5o19s3a2","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q04","label":"Câu 4","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ny_true = np.array([1, 0, 1, 0])\ny_prob = np.array([0.85, 0.65, 0.55, 0.20])\n\nthreshold = 0.60\ny_pred = (y_prob \u0026gt;= threshold).astype(int)\n\ntp = np.sum((y_true == 1) \u0026amp; (y_pred == 1))\nfp = np.sum((y_true == 0) \u0026amp; (y_pred == 1))\nfn = np.sum((y_true == 1) \u0026amp; (y_pred == 0))\n\nprint(tp, fp, fn)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eOutput là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e1 0 1\u003c/code\u003e","\u003ccode\u003e1 1 1\u003c/code\u003e","\u003ccode\u003e2 1 0\u003c/code\u003e","\u003ccode\u003e2 0 0\u003c/code\u003e"],"correct":1},{"id":"ml-xl8ascjdsb0w","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q05","label":"Câu 5","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eXét cùng một tập validation nhưng thay đổi threshold:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ny_true = np.array([1, 0, 1, 0])\ny_prob = np.array([0.90, 0.70, 0.60, 0.40])\n\nfor threshold in [0.80, 0.50]:\n    y_pred = (y_prob \u0026gt;= threshold).astype(int)\n    tp = np.sum((y_true == 1) \u0026amp; (y_pred == 1))\n    fp = np.sum((y_true == 0) \u0026amp; (y_pred == 1))\n    fn = np.sum((y_true == 1) \u0026amp; (y_pred == 0))\n    print(threshold, tp, fp, fn)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eHai dòng output đúng là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.8 1 0 1\u003c/code\u003e và \u003ccode\u003e0.5 2 1 0\u003c/code\u003e","\u003ccode\u003e0.8 2 0 0\u003c/code\u003e và \u003ccode\u003e0.5 2 0 0\u003c/code\u003e","\u003ccode\u003e0.8 1 1 1\u003c/code\u003e và \u003ccode\u003e0.5 1 1 1\u003c/code\u003e","\u003ccode\u003e0.8 0 1 2\u003c/code\u003e và \u003ccode\u003e0.5 1 2 1\u003c/code\u003e"],"correct":0},{"id":"ml-1e3ks8ow6a3gq","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q06","label":"Câu 6","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eCho lớp 1 là lớp dương. Tại một threshold, ta có TP = 6, FP = 2, FN = 4. Precision và recall lần lượt bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["Precision = 0.60, recall = 0.75.","Precision = 0.75, recall = 0.60.","Precision = 0.75, recall = 0.40.","Precision = 0.60, recall = 0.40."],"correct":1},{"id":"ml-w34vtq1cjomx2","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q07","label":"Câu 7","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eXét code tính precision khi threshold rất cao:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ny_true = np.array([1, 0, 1])\ny_prob = np.array([0.70, 0.40, 0.60])\n\nthreshold = 0.95\ny_pred = (y_prob \u0026gt;= threshold).astype(int)\n\ntp = np.sum((y_true == 1) \u0026amp; (y_pred == 1))\nfp = np.sum((y_true == 0) \u0026amp; (y_pred == 1))\n\nprecision = 0.0 if (tp + fp) == 0 else tp / (tp + fp)\nprint(precision)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eOutput là gì theo đúng quy ước được viết trong code?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.0\u003c/code\u003e","\u003ccode\u003e0.5\u003c/code\u003e","\u003ccode\u003e1.0\u003c/code\u003e","Phát sinh lỗi chia cho 0."],"correct":0},{"id":"ml-1iczgqr4w851v","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q08","label":"Câu 8","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ny_true = np.array([1, 1, 0, 0])\ny_prob = np.array([0.90, 0.45, 0.80, 0.20])\n\nthreshold = 0.80\ny_pred = (y_prob \u0026gt;= threshold).astype(int)\n\ntp = np.sum((y_true == 1) \u0026amp; (y_pred == 1))\nfp = np.sum((y_true == 0) \u0026amp; (y_pred == 1))\nfn = np.sum((y_true == 1) \u0026amp; (y_pred == 0))\n\nprecision = tp / (tp + fp)\nrecall = tp / (tp + fn)\n\nprint(precision, recall)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eOutput là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.5 0.5\u003c/code\u003e","\u003ccode\u003e0.5 1.0\u003c/code\u003e","\u003ccode\u003e1.0 0.5\u003c/code\u003e","\u003ccode\u003e1.0 1.0\u003c/code\u003e"],"correct":0},{"id":"ml-t9hxr61adlili","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q09","label":"Câu 9","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eXét hai threshold trên cùng tập validation:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eThreshold 0.30: precision = 0.60, recall = 1.00\nThreshold 0.70: precision = 0.90, recall = 0.50\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNhận xét nào mô tả đúng sự thay đổi trong ví dụ này khi tăng threshold từ 0.30 lên 0.70?\u003c/p\u003e\n      \n    ","choices":["Precision tăng từ 0.60 lên 0.90, recall giảm từ 1.00 xuống 0.50.","Precision giảm từ 0.90 xuống 0.60, recall tăng từ 0.50 lên 1.00.","Precision và recall đều tăng vì threshold cao hơn luôn tốt hơn.","Precision và recall không đổi vì dữ liệu validation không thay đổi."],"correct":0},{"id":"ml-1myw8736ruu1l","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q10","label":"Câu 10","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eMột nhóm thử ba threshold trên validation và thu được:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ethreshold = 0.30: precision = 0.55, recall = 0.95\nthreshold = 0.50: precision = 0.72, recall = 0.82\nthreshold = 0.70: precision = 0.88, recall = 0.60\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eYêu cầu triển khai là chọn threshold có precision cao nhất trong các threshold có recall ít nhất 0.80. Threshold nào được chọn?\u003c/p\u003e\n      \n    ","choices":["0.30","0.50","0.70","Không threshold nào thỏa điều kiện."],"correct":1},{"id":"ml-1ruosv1uavg4h","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q11","label":"Câu 11","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eXét code sau:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003efrom sklearn.metrics import precision_recall_curve\n\ny_true = [0, 1, 1, 0]\ny_score = [0.1, 0.8, 0.6, 0.3]\n\nprecision, recall, thresholds = precision_recall_curve(\n    y_true,\n    y_score\n)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eBiến \u003ccode\u003ethresholds\u003c/code\u003e được dùng với mục đích nào trong ngữ cảnh precision–recall?\u003c/p\u003e\n      \n    ","choices":["Chứa các giá trị ngưỡng quyết định được xét để tạo các điểm precision–recall.","Chứa nhãn thật 0/1 sau khi sắp xếp theo xác suất dự đoán.","Chứa confusion matrix tương ứng với từng mẫu trong tập train.","Chứa các trọng số của mô hình sau mỗi vòng huấn luyện."],"correct":0},{"id":"ml-11q58z712ch9en","chapter":"24","topic":"Phần 24 — Đợt 1: Precision–recall theo ngưỡng","source":{"id":"ml-p24-b01-q12","label":"Câu 12","batch":"ml-p24-b01"},"html":"\n      \n      \u003cp\u003eMột mô hình đã được huấn luyện. Nhóm có train, validation và test. Họ muốn chọn threshold dựa trên precision–recall rồi báo cáo kết quả cuối. Quy trình nào phù hợp?\u003c/p\u003e\n      \n    ","choices":["Chọn threshold bằng test, sau đó dùng validation để báo cáo kết quả cuối.","Chọn threshold bằng validation, sau đó đánh giá cuối trên test với threshold đã chọn.","Chọn threshold riêng cho từng mẫu test dựa trên nhãn thật của chính mẫu đó.","Gộp validation và test để chọn threshold rồi báo cáo trên cùng dữ liệu đã gộp."],"correct":1},{"id":"ml-65suxq16damxk","chapter":"25","topic":"Phần 25 — Đợt 1: Brier score và calibration","source":{"id":"ml-p25-b01-q01","label":"Câu 1","batch":"ml-p25-b01"},"html":"\n      \n      \u003cp\u003eVới bài toán phân loại nhị phân, dùng Brier score:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eBrier = mean((p - y)^2)\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCho:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey = [1, 0]\np = [0.8, 0.3]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eBrier score bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.050","0.065","0.130","0.250"],"correct":1},{"id":"ml-ggxo5nvwt22p","chapter":"25","topic":"Phần 25 — Đợt 1: Brier score và calibration","source":{"id":"ml-p25-b01-q02","label":"Câu 2","batch":"ml-p25-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code tính Brier score thủ công:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\ny_true = np.array([1, 0, 1])\ny_prob = np.array([0.9, 0.2, 0.7])\n\nscore = np.mean((y_prob - y_true) ** 2)\nprint(round(score, 4))\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eOutput là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.0467\u003c/code\u003e","\u003ccode\u003e0.1400\u003c/code\u003e","\u003ccode\u003e0.2000\u003c/code\u003e","\u003ccode\u003e0.3000\u003c/code\u003e"],"correct":0},{"id":"ml-tiordj1lqrc2h","chapter":"25","topic":"Phần 25 — Đợt 1: Brier score và calibration","source":{"id":"ml-p25-b01-q03","label":"Câu 3","batch":"ml-p25-b01"},"html":"\n      \n      \u003cp\u003eHai mô hình được đánh giá trên cùng một tập dữ liệu nhị phân và thu được:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eModel A: Brier score = 0.08\nModel B: Brier score = 0.19\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eNếu chỉ xét Brier score, nhận xét nào đúng?\u003c/p\u003e\n      \n    ","choices":["Model A tốt hơn theo Brier score vì giá trị nhỏ hơn.","Model B tốt hơn theo Brier score vì giá trị lớn hơn.","Hai model tương đương vì Brier score chỉ nhận giá trị 0 hoặc 1.","Không thể so sánh vì Brier score không dùng xác suất dự đoán."],"correct":0},{"id":"ml-1wlk0c057xeyc","chapter":"25","topic":"Phần 25 — Đợt 1: Brier score và calibration","source":{"id":"ml-p25-b01-q04","label":"Câu 4","batch":"ml-p25-b01"},"html":"\n      \n      \u003cp\u003eTrong bài này, xác suất được chia thành hai bin:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eBin 0: [0, 0.5)\nBin 1: [0.5, 1]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCho các xác suất:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ep = [0.10, 0.49, 0.50, 0.80, 1.00]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCách phân bin nào đúng?\u003c/p\u003e\n      \n    ","choices":["Bin 0: [0.10, 0.49], Bin 1: [0.50, 0.80, 1.00]","Bin 0: [0.10, 0.49, 0.50], Bin 1: [0.80, 1.00]","Bin 0: [0.10], Bin 1: [0.49, 0.50, 0.80, 1.00]","Bin 0: [0.10, 0.49, 1.00], Bin 1: [0.50, 0.80]"],"correct":0},{"id":"ml-8qh36e1dbma7i","chapter":"25","topic":"Phần 25 — Đợt 1: Brier score và calibration","source":{"id":"ml-p25-b01-q05","label":"Câu 5","batch":"ml-p25-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eimport numpy as np\n\np = np.array([0.20, 0.40, 0.50, 0.90])\n\nbin0 = p[(p \u0026gt;= 0.0) \u0026amp; (p \u0026lt; 0.5)]\nbin1 = p[(p \u0026gt;= 0.5) \u0026amp; (p \u0026lt;= 1.0)]\n\nprint(bin0.tolist())\nprint(bin1.tolist())\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eOutput là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e[0.2, 0.4]\u003c/code\u003e và \u003ccode\u003e[0.5, 0.9]\u003c/code\u003e","\u003ccode\u003e[0.2, 0.4, 0.5]\u003c/code\u003e và \u003ccode\u003e[0.9]\u003c/code\u003e","\u003ccode\u003e[0.2]\u003c/code\u003e và \u003ccode\u003e[0.4, 0.5, 0.9]\u003c/code\u003e","\u003ccode\u003e[0.2, 0.9]\u003c/code\u003e và \u003ccode\u003e[0.4, 0.5]\u003c/code\u003e"],"correct":0},{"id":"ml-1acgpkk16jy01m","chapter":"25","topic":"Phần 25 — Đợt 1: Brier score và calibration","source":{"id":"ml-p25-b01-q06","label":"Câu 6","batch":"ml-p25-b01"},"html":"\n      \n      \u003cp\u003eMột calibration bin chứa ba mẫu:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_prob = [0.6, 0.7, 0.8]\ny_true = [1, 0, 1]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eQuy ước confidence của bin là mean của xác suất dự đoán, còn accuracy của bin là mean của nhãn thật. Confidence và accuracy lần lượt bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.60 và 0.70","0.70 và 0.67","0.67 và 0.70","0.80 và 0.67"],"correct":1},{"id":"ml-l256hw1o5tdx0","chapter":"25","topic":"Phần 25 — Đợt 1: Brier score và calibration","source":{"id":"ml-p25-b01-q07","label":"Câu 7","batch":"ml-p25-b01"},"html":"\n      \n      \u003cp\u003eMột calibration bin chứa bốn mẫu:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003ey_prob = [0.60, 0.70, 0.80, 0.90]\ny_true = [1, 1, 0, 1]\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eVới confidence = mean(y_prob) và accuracy = mean(y_true), calibration gap tuyệt đối \u003ccode\u003e|accuracy - confidence|\u003c/code\u003e bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.00","0.05","0.10","0.25"],"correct":0},{"id":"ml-1pz45ud19hjwp9","chapter":"25","topic":"Phần 25 — Đợt 1: Brier score và calibration","source":{"id":"ml-p25-b01-q08","label":"Câu 8","batch":"ml-p25-b01"},"html":"\n      \n      \u003cp\u003eDùng công thức ECE:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eECE = sum((n_b / N) * abs(acc_b - conf_b))\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eCho N = 10 và hai bin:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eBin 0: n = 4, accuracy = 0.25, confidence = 0.35\nBin 1: n = 6, accuracy = 0.80, confidence = 0.70\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eECE bằng bao nhiêu?\u003c/p\u003e\n      \n    ","choices":["0.04","0.06","0.10","0.20"],"correct":2},{"id":"ml-vtgb2e11d28be","chapter":"25","topic":"Phần 25 — Đợt 1: Brier score và calibration","source":{"id":"ml-p25-b01-q09","label":"Câu 9","batch":"ml-p25-b01"},"html":"\n      \n      \u003cp\u003eXét đoạn code tính ECE cho hai bin:\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003eN = 5\n\nn0, acc0, conf0 = 2, 0.5, 0.4\nn1, acc1, conf1 = 3, 1.0, 0.8\n\nece = (\n    (n0 / N) * abs(acc0 - conf0)\n    + (n1 / N) * abs(acc1 - conf1)\n)\n\nprint(round(ece, 2))\u003c/code\u003e\u003c/pre\u003e\n      \u003cp\u003eOutput là gì?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003e0.10\u003c/code\u003e","\u003ccode\u003e0.16\u003c/code\u003e","\u003ccode\u003e0.20\u003c/code\u003e","\u003ccode\u003e0.30\u003c/code\u003e"],"correct":1},{"id":"ml-dwuy6z1huqnb7","chapter":"25","topic":"Phần 25 — Đợt 1: Brier score và calibration","source":{"id":"ml-p25-b01-q10","label":"Câu 10","batch":"ml-p25-b01"},"html":"\n      \n      \u003cp\u003eMột bài tự cài ECE dùng hai bin \u003ccode\u003e[0, 0.5)\u003c/code\u003e và \u003ccode\u003e[0.5, 1]\u003c/code\u003e. Không có mẫu nào thuộc bin đầu tiên. Quy ước của bài là bỏ qua bin rỗng khi cộng ECE. Cách xử lý nào đúng?\u003c/p\u003e\n      \n    ","choices":["Không thêm bất kỳ contribution nào từ bin rỗng vào ECE.","Đặt accuracy của bin rỗng bằng 1 rồi tiếp tục tính bình thường.","Đặt co function pythonCode(text){return /(?:^|\n)\s*(?:import\s|from\s+\w+\s+import|def\s|class\s|for\s|while\s|with\s|if\s|return\b|print\s*\(|[\w.]+(?:\[[^\n]+?\])?(?:\s*,\s*\w+)*\s*(?:=|\+=|-=)(?!=))/.test(text);}
let timerAttempt=null,runningSince=null,timerTicks=0;
function pauseTimer(){if(timerAttempt&&runningSince!==null){timerAttempt.duration+=Math.max(0,performance.now()-runningSince);try{localStorage.setItem(BANK_ID+'-timer',JSON.stringify({id:timerAttempt.id,duration:timerAttempt.duration}));}catch(e){notice('Không lưu được mốc thời gian dự phòng. Hãy xuất backup trước khi đóng trang.');}}timerAttempt=null;runningSince=null;}
function startTimer(){if(!document.hidden&&!$('work').hidden&&active&&!readonly&&active.status==='active'){timerAttempt=active;runningSince=performance.now();}}
setInterval(()=>{const wasRunning=!!timerAttempt;pauseTimer();startTimer();if(wasRunning&&++timerTicks%5===0)save();},1000);
document.addEventListener('visibilitychange',()=>{pauseTimer();startTimer();save();});
window.addEventListener('pagehide',()=>{pauseTimer();save();});
window.addEventListener('pageshow',()=>startTimer());
function rich(target,html){target.innerHTML=clean(html);for(const c of [...target.querySelectorAll('code')])if(!c.closest('pre')&&c.textContent.trim().includes('\n')){const pre=document.createElement('pre');c.replaceWith(pre);pre.append(c);}for(const table of [...target.querySelectorAll('table')]){const wrap=document.createElement('div');wrap.className='scroll-region';table.replaceWith(wrap);wrap.append(table);}for(const code of target.querySelectorAll('pre code')){code.className=pythonCode(code.textContent)?'language-python':'language-plaintext';}}
function enhance(){if(window.hljs)for(const c of $('questionCard').querySelectorAll('pre code'))if(!c.dataset.highlighted)hljs.highlightElement(c);if(window.MathJax?.typesetPromise){const serial=++renderSerial;mathQueue=mathQueue.then(()=>{if(serial===renderSerial)return MathJax.typesetPromise([$('questionCard')]);}).catch(()=>{$('libraryNote').textContent='Không render được một số công thức; đang hiển thị nội dung nguồn.';});}}
let mathQueue=Promise.resolve();
function render(){if(!active)return;pauseTimer();startTimer();viewIndices=currentIndices();if(!viewIndices.includes(position)&&viewIndices.length)position=viewIndices[0];$('emptyReview').hidden=!!viewIndices.length;$('questionCard').hidden=!viewIndices.length;const x=active.items[position],s=score(active),n=active.items.length;$('counter').textContent=`Câu ${position+1} / ${n}`;$('modeLabel').textContent=readonly?'Xem lại · chỉ đọc':'Đang làm';$('topicLabel').textContent=x.q.topic===CHAPTERS[x.q.chapter]?x.q.topic:CHAPTERS[x.q.chapter]+' — '+x.q.topic;$('stats').textContent=`Đã trả lời: ${s.answered}/${n} · Đúng: ${s.correct} · Sai: ${s.wrong} · Chưa trả lời: ${s.unanswered} · Điểm toàn đề: ${s.correct}/${n} (${(100*s.correct/n).toFixed(1)}%)`;$('progress').value=100*s.answered/n;
 if(!readonly){active.position=position;if(!state.seen.includes(x.q.id)){state.seen.push(x.q.id);seenLabel();}save();}
 if(window.MathJax?.typesetClear)MathJax.typesetClear([$('questionCard')]);$('questionCard').replaceChildren();const prompt=document.createElement('div');prompt.className='prompt';rich(prompt,x.q.html);$('questionCard').append(prompt);
 x.order.forEach((original,i)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.disabled=readonly||x.answer!==null;const reveal=readonly||x.answer!==null;if(reveal&&original===x.q.correct)button.classList.add('correct');if(x.answer===i){button.classList.add('selected');if(original!==x.q.correct)button.classList.add('wrong');}const letter=document.createElement('strong');letter.textContent='ABCD'[i]+'.';const content=document.createElement('span');content.className='content';rich(content,x.q.choices[original]);button.append(letter,content);if(reveal&&(original===x.q.correct||x.answer===i)){const tag=document.createElement('span');tag.textContent=original===x.q.correct?(x.answer===i?' ✓ Bạn chọn · Đáp án đúng':' ✓ Đáp án đúng'):' ✗ Bạn chọn';content.append(tag);}button.onclick=()=>answer(i);$('questionCard').append(button);});
 $('feedback').className='';$('feedback').textContent=x.answer===null?(readonly?'Chưa trả lời':''):x.order[x.answer]===x.q.correct?'✓ Đúng':`✗ Sai — Đáp án đúng: ${'ABCD'[x.order.indexOf(x.q.correct)]}`;$('feedback').className=x.answer===null?'unanswered':x.order[x.answer]===x.q.correct?'ok':'bad';$('prev').disabled=viewIndices.indexOf(position)<=0;$('next').disabled=viewIndices.indexOf(position)>=viewIndices.length-1;$('finish').hidden=readonly;$('resume').hidden=!readonly||active.status!=='active';$('redo').hidden=!readonly;$('reviewFilterLabel').hidden=!readonly;
 $('navigator').replaceChildren();for(const i of viewIndices){const b=document.createElement('button');b.textContent=i+1;b.className=(active.items[i].answer!==null?'answered ':'')+(i===position?'current':'');if(i===position)b.setAttribute('aria-current','step');b.setAttribute('aria-label',`Câu ${i+1}, ${active.items[i].answer===null?'chưa trả lời':'đã trả lời'}`);b.onclick=()=>{position=i;render();};$('navigator').append(b);}enhance();}
function answer(i){if(readonly||!active||active.status!=='active')return;const x=active.items[position];if(x.answer!==null)return;x.answer=i;pauseTimer();startTimer();save();render();}
async function finish(){if(!active||readonly)return;const s=score(active);if(s.unanswered&&!await ask(`Còn ${s.unanswered} câu chưa trả lời. Kết thúc sớm?`))return;active.ended=new Date().toISOString();pauseTimer();active.status=s.unanswered?'early':'completed';save();readonly=true;$('reviewFilter').value='all';render();}
function view(a,resume=false){pauseTimer();active=a;readonly=!resume;position=Math.min(a.position||0,a.items.length-1);$('reviewFilter').value='all';screen('work');render();}
function history(){screen('history');const ordered=state.attempts.slice().sort((a,b)=>b.started.localeCompare(a.started));historyPage=Math.min(historyPage,Math.max(0,Math.ceil(ordered.length/10)-1));$('historyList').replaceChildren();for(const a of ordered.slice(historyPage*10,historyPage*10+10)){const item=document.createElement('div');item.className='history-item';const s=score(a),p=document.createElement('p');p.textContent=`${new Date(a.started).toLocaleString('vi-VN')} · ${a.status==='active'?'Đang làm':a.status==='early'?'Kết thúc sớm':'Hoàn thành'} · ${a.items.length} câu · Đúng ${s.correct}, sai ${s.wrong}, chưa trả lời ${s.unanswered} · ${Math.round(a.duration/1000)} giây`;item.append(p);const meta=document.createElement('small');meta.textContent=`Kết thúc: ${a.ended?new Date(a.ended).toLocaleString('vi-VN'):'—'} · Phần: ${a.filters.chapters.length?a.filters.chapters.map(c=>CHAPTERS[c]).join(', '):'Tất cả'} · Chủ đề: ${a.filters.topics.length?a.filters.topics.join('; '):'Tất cả'}`;item.append(meta);const row=document.createElement('div');row.className='actions';const add=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;row.append(b);};add('Xem lại',()=>view(a));if(a.status==='active')add('Tiếp tục',()=>view(a,true));add('Làm lại',()=>createAttempt(a.items.length,a.filters));add('Xóa lượt',async()=>{if(await ask('Xóa lượt này? Bộ đếm đã gặp không thay đổi.')){state.attempts=state.attempts.filter(x=>x.id!==a.id);if(active?.id===a.id){pauseTimer();active=null;}await save();history();}});item.append(row);$('historyList').append(item);}if(!ordered.length)$('historyList').textContent='Chưa có lượt làm bài.';$('historyPage').textContent=`${historyPage+1} / ${Math.max(1,Math.ceil(ordered.length/10))}`;$('historyPrev').disabled=historyPage===0;$('historyNext').disabled=(historyPage+1)*10>=ordered.length;}
function backup(){pauseTimer();startTimer();return {bankId:BANK_ID,version:VERSION,exported:new Date().toISOString(),...structuredClone(state)};}
function downloadJSON(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function validateBackup(v){if(!v||v.bankId!==BANK_ID||v.version!==VERSION||!Array.isArray(v.seen)||!v.seen.every(x=>typeof x==='string')||!Array.isArray(v.attempts)||!Array.isArray(v.extra))throw Error('Bản sao lưu không hợp lệ hoặc sai mã ngân hàng.');const ids=new Set();const attempts=v.attempts.map(a=>{if(!a||typeof a.id!=='string'||ids.has(a.id)||!Number.isFinite(Date.parse(a.started))||!['active','early','completed'].includes(a.status)||!Array.isArray(a.items)||!a.items.length||!a.filters||!Array.isArray(a.filters.chapters)||!a.filters.chapters.every(c=>Object.hasOwn(CHAPTERS,c))||!Array.isArray(a.filters.topics)||!a.filters.topics.every(t=>typeof t==='string')||!Number.isFinite(a.duration)||a.duration<0||(a.ended!==null&&!Number.isFinite(Date.parse(a.ended))))throw Error('Dữ liệu lượt không hợp lệ.');ids.add(a.id);const qids=new Set();const items=a.items.map(x=>{const q=safeQuestion(x.q);if(qids.has(q.id)||!Array.isArray(x.order)||x.order.length!==4||x.order.slice().sort().join('')!=='0123'||(x.answer!==null&&(!Number.isInteger(x.answer)||x.answer<0||x.answer>3)))throw Error('Thứ tự câu hoặc đáp án không hợp lệ.');qids.add(q.id);return {q,order:x.order,answer:x.answer};});return {id:a.id,started:a.started,ended:a.ended,status:a.status,filters:a.filters,duration:a.duration,position:Number.isInteger(a.position)&&a.position>=0&&a.position<items.length?a.position:0,items};});return {seen:[...new Set(v.seen)],attempts,extra:v.extra.map(safeQuestion)};}
function mergeExtra(questions){const known=new Map([...BASE.questions,...state.extra].map(q=>[q.id,q]));const fresh=[];for(const q of questions){const old=known.get(q.id);if(old){if(JSON.stringify([old.html,old.choices,old.correct])!==JSON.stringify([q.html,q.choices,q.correct]))throw Error('ID trùng nhưng nội dung khác: '+q.id);continue;}if(positional(q))throw Error('Câu tham chiếu vị trí phương án cần xử lý trước khi xáo trộn: '+q.id);known.set(q.id,q);fresh.push(q);}return fresh;}
async function importData(value,mode){if(mode==='questions'){if(value?.bankId!==BANK_ID||!Array.isArray(value.questions))throw Error('JSON bổ sung không đúng schema.');const fresh=mergeExtra(value.questions.map(safeQuestion));state.extra.push(...fresh);notice(`Đã bổ sung ${fresh.length} câu.`);}else{const v=validateBackup(value),fresh=mergeExtra(v.extra),known=new Map(state.attempts.map(a=>[a.id,a]));let added=0,conflicts=0;for(const a of v.attempts){if(known.has(a.id)){if(JSON.stringify(known.get(a.id))!==JSON.stringify(a))conflicts++;continue;}state.attempts.push(a);known.set(a.id,a);added++;}state.seen=[...new Set([...state.seen,...v.seen])];state.extra.push(...fresh);notice(`Đã nhập ${added} lượt mới; ${conflicts} lượt cùng ID có dữ liệu khác được giữ theo bản hiện tại.`);}BANK=[...BASE.questions,...state.extra];setupFilters();await save();}
$('fileInput').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>100*1024*1024)throw Error('File vượt 100 MB.');await importData(JSON.parse(await f.text()),importMode);}catch(e){notice('Không nhập được: '+e.message);}finally{$('fileInput').value='';}};
$('exportBtn').onclick=()=>downloadJSON(backup(),BANK_ID+'-backup.json');$('importBtn').onclick=()=>{importMode='backup';$('fileInput').click();};$('addBtn').onclick=()=>{importMode='questions';$('fileInput').click();};
$('startForm').onsubmit=e=>{e.preventDefault();createAttempt(Number($('count').value),filters());};$('prev').onclick=()=>{const i=viewIndices.indexOf(position);if(i>0){position=viewIndices[i-1];render();}};$('next').onclick=()=>{const i=viewIndices.indexOf(position);if(i<viewIndices.length-1){position=viewIndices[i+1];render();}};$('finish').onclick=finish;$('resume').onclick=()=>view(active,true);$('redo').onclick=()=>createAttempt(active.items.length,active.filters);$('reviewFilter').onchange=render;
$('homeBtn').onclick=async()=>{if(active&&!readonly&&active.status==='active'&&!await ask('Về thiết lập lượt mới? Lượt đang làm vẫn được lưu để tiếp tục.'))return;readonly=true;screen('setup');setupFilters();};$('historyBtn').onclick=history;$('historyPrev').onclick=()=>{historyPage--;history();};$('historyNext').onclick=()=>{historyPage++;history();};$('resetSeen').onclick=async()=>{if(await ask('Reset bộ đếm đã gặp? Điểm và lịch sử làm bài được giữ nguyên.')){state.seen=[];seenLabel();save();}};$('deleteAll').onclick=async()=>{if(await ask('Xóa toàn bộ lịch sử làm bài? Bộ đếm đã gặp được giữ nguyên.')){pauseTimer();state.attempts=[];active=null;save();history();}};
document.addEventListener('keydown',e=>{if($('work').hidden||$('confirm').open||e.ctrlKey||e.altKey||e.metaKey||e.target.closest('input,textarea,select,button,[contenteditable]'))return;if(/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1);}if(e.key==='ArrowLeft'){$('prev').click();e.preventDefault();}if(e.key==='ArrowRight'){$('next').click();e.preventDefault();}});
function loadLibraries(){window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']},startup:{typeset:false,ready(){MathJax.startup.defaultReady();MathJax.startup.promise.then(()=>{if(active)enhance();});}}};const load=(src,name)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onerror=()=>{$('libraryNote').textContent='Thư viện hiển thị chưa tải được; công thức nguồn, code và quiz vẫn dùng được. Kết nối mạng để tải MathJax/highlight.js.';};s.onload=()=>{if(active)enhance();};document.head.append(s);};load('https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js','MathJax');load('https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js','highlight.js');}
async function init(){try{const stored=await openDB();if(stored)state=validateBackup({bankId:BANK_ID,version:VERSION,...stored});}catch(e){db=null;notice('Không đọc được bộ nhớ: '+e.message+'. Có thể tiếp tục luyện tập và xuất JSON; dữ liệu cũ không bị tự xóa.');}try{const checkpoint=JSON.parse(localStorage.getItem(BANK_ID+'-timer')||'null');const a=state.attempts.find(a=>a.id===checkpoint?.id);if(a&&Number.isFinite(checkpoint.duration)&&checkpoint.duration>=0)a.duration=Math.max(a.duration,checkpoint.duration);}catch{}BANK=[...BASE.questions,...state.extra];setupFilters();const r=BASE.report;$('report').textContent=`Đọc ${r.total} câu; hợp lệ ${r.valid}; tạm loại ${r.excluded.length}; ${r.duplicates} lần ID nguồn trùng đã được cấp mã riêng; hợp nhất ${r.merged} câu. `+Object.entries(r.chapters).map(([c,n])=>`${CHAPTERS[c]}: ${n}`).join(' · ');if(r.excluded.length){const pre=document.createElement('pre');pre.textContent=JSON.stringify(r.excluded,null,2);$('report').append(pre);}loadLibraries();window.appReady=true;}

// Presentation only: derive every card from the existing BANK and state.seen.
function paintBlockStats(host, questions, seen){
 const ids=new Set(questions.map(q=>q.id)),n=ids.size,x=[...ids].filter(id=>seen.has(id)).length,pct=n?100*x/n:0;
 let stats=host.querySelector('.block-stats'),bar=host.querySelector('.block-progress');
 if(!stats){stats=document.createElement('span');stats.className='block-stats';bar=document.createElement('progress');bar.className='block-progress';bar.max=100;host.append(stats,bar);}
 stats.textContent=`Tổng: ${n} câu · Đã gặp: ${x} / ${n} câu · ${pct.toFixed(1)}%`;
 bar.value=pct;bar.setAttribute('aria-label',`Đã gặp ${x} trên ${n} câu, ${pct.toFixed(1)}%`);
}
function refreshBlockStats(){
 const seen=new Set(state.seen);
 for(const [id,key] of [['chapters','chapters'],['topics','topics']]){
  const container=document.getElementById(id);if(!container)continue;
  for(const label of container.querySelectorAll('label')){
   const input=label.querySelector('input');if(!input)continue;
   let info=label.querySelector('.block-info');
   if(!info){info=document.createElement('span');info.className='block-info';const name=document.createElement('span');name.className='block-name';for(const node of [...label.childNodes])if(node!==input)name.append(node);info.append(name);label.append(info);}
   const f={chapters:[],topics:[]};f[key]=[input.value];paintBlockStats(info,pool(f),seen);
  }
 }
 const host=document.getElementById('bankCount');if(!host)return;
 let all=host.querySelector('.all-block');
 if(!all){host.replaceChildren();all=document.createElement('button');all.type='button';all.className='all-block';const name=document.createElement('span');name.className='block-name';name.textContent='Tất cả';all.append(name);all.onclick=()=>{for(const id of ['chapters','topics'])document.getElementById(id)?.querySelectorAll('input').forEach(i=>i.checked=false);updatePool();};host.append(all);}
 const f=filters();all.setAttribute('aria-pressed',String(!f.chapters.length&&!f.topics.length));paintBlockStats(all,BANK,seen);
}
const originalSeenLabel=seenLabel;seenLabel=function(){originalSeenLabel();refreshBlockStats();};
const originalUpdatePool=updatePool;updatePool=function(){originalUpdatePool();refreshBlockStats();};

init();
