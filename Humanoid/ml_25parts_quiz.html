<script id="bankData" type="application/json">{"questions":[{"id":"ml-8r4pzp1jn991h","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-q01","label":"Câu 1","batch":"ml-p01-b01"},"html":"\n      \n      \u003cp\u003eMột bộ dữ liệu dự đoán việc giao hàng có các cột \u003ccode\u003edistance_m\u003c/code\u003e, \u003ccode\u003epayload_kg\u003c/code\u003e và \u003ccode\u003esuccess\u003c/code\u003e. Trong đó \u003ccode\u003esuccess\u003c/code\u003e nhận giá trị 0 hoặc 1 và là kết quả cần dự đoán. Cách xác định feature và label nào đúng?\u003c/p\u003e\n      \n    ","choices":["\u003ccode\u003edistance_m\u003c/code\u003e là label; \u003ccode\u003epayload_kg\u003c/code\u003e và \u003ccode\u003esuccess\u003c/code\u003e là feature","\u003ccode\u003edistance_m\u003c/code\u003e và \u003ccode\u003epayload_kg\u003c/code\u003e là feature; \u003ccode\u003esuccess\u003c/code\u003e là label","Cả ba cột đều là feature và không có label","\u003ccode\u003esuccess\u003c/code\u003e là feature; hai cột còn lại đều là label"],"correct":1},{"id":"ml-110pfuc1wpkosw","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-q02","label":"Câu 2","batch":"ml-p01-b01"},"html":"\n      \n      \u003cp\u003eMỗi phần tử của \u003ccode\u003erows\u003c/code\u003e là một mẫu. Hai feature là \u003ccode\u003edistance_m\u003c/code\u003e và \u003ccode\u003epayload_kg\u003c/code\u003e; label là \u003ccode\u003esuccess\u003c/code\u003e. Có bao nhiêu mẫu trong dữ liệu sau?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erows = [\n    {\"distance_m\": 2.0, \"payload_kg\": 1.0, \"success\": 1},\n    {\"distance_m\": 4.0, \"payload_kg\": 2.0, \"success\": 0},\n    {\"distance_m\": 5.5, \"payload_kg\": 1.5, \"success\": 1},\n    {\"distance_m\": 7.0, \"payload_kg\": 3.0, \"success\": 0}\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["2","3","4","12"],"correct":2},{"id":"ml-1selbatslvy2f","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và :"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-q07","label":"Câu 7","batch":"ml-p01-b01"},"html":"\n      \n      \u003cp\u003eMỗi phần tử của \u003ccode\u003erows\u003c/code\u003e là một mẫu. \u003ccode\u003eage\u003c/code\u003e và \u003ccode\u003eincome\u003c/code\u003e là feature; \u003ccode\u003eapproved\u003c/code\u003e là label. Chỉ \u003ccode\u003eNone\u003c/code\u003e được xem là missing. Đoạn code sau in ra gì?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erows = [\n    {\"age\": 20,   \"income\": None,  \"approved\": 0},\n    {\"age\": None, \"income\": 30000, \"approved\": 0},\n    {\"age\": 35,   \"income\": 45000, \"approved\": 1},\n    {\"age\": 42,   \"income\": None,  \"approved\": 1},\n    {\"age\": 29,   \"income\": 38000, \"approved\": 0}\n]\n\nclass_counts = {\n    0: sum(row[\"approved\"] == 0 for row in rows),\n    1: sum(row[\"approved\"] == 1 for row in rows)\n}\n\nmissing_counts = {\n    \"age\": sum(row[\"age\"] is None for row in rows),\n    \"income\": sum(row[\"income\"] is None for row in rows)\n}\n\nprint(len(rows), class_counts, missing_counts)\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003e5 {0: 3, 1: 2} {'age': 1, 'income': 2}\u003c/code\u003e","\u003ccode\u003e5 {0: 2, 1: 3} {'age': 1, 'income': 2}\u003c/code\u003e","\u003ccode\u003e3 {0: 3, 1: 2} {'age': 2, 'income': 1}\u003c/code\u003e","\u003ccode\u003e5 {0: 3, 1: 2} {'age': 1, 'income': 1}\u003c/code\u003e"],"correct":0},{"id":"ml-kx54z61qka40","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-q08","label":"Câu 8","batch":"ml-p01-b01"},"html":"\n      \n      \u003cp\u003eMỗi phần tử của \u003ccode\u003erows\u003c/code\u003e là một mẫu. \u003ccode\u003esensor_a\u003c/code\u003e và \u003ccode\u003esensor_b\u003c/code\u003e là feature; \u003ccode\u003ealarm\u003c/code\u003e là label. Yêu cầu là đếm missing chỉ ở các feature và chỉ \u003ccode\u003eNone\u003c/code\u003e được xem là missing. Đoạn code nào thực hiện đúng yêu cầu?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erows = [\n    {\"sensor_a\": None, \"sensor_b\": 2.0,  \"alarm\": 0},\n    {\"sensor_a\": 1.5,  \"sensor_b\": None, \"alarm\": 1},\n    {\"sensor_a\": 0.0,  \"sensor_b\": 3.0,  \"alarm\": 0}\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["\u003ccode\u003esum(v == 0 for row in rows for v in row.values())\u003c/code\u003e","\u003ccode\u003esum(row[\"alarm\"] is None for row in rows)\u003c/code\u003e","\u003ccode\u003e{f: sum(row[f] is None for row in rows) for f in [\"sensor_a\", \"sensor_b\"]}\u003c/code\u003e","\u003ccode\u003e{f: sum(row[f] == 0 for row in rows) for f in [\"sensor_a\", \"sensor_b\", \"alarm\"]}\u003c/code\u003e"],"correct":2},{"id":"ml-1lmnfcm1g0g162","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-q09","label":"Câu 9","batch":"ml-p01-b01"},"html":"\n      \n      \u003cp\u003eMỗi phần tử của \u003ccode\u003erows\u003c/code\u003e là một mẫu. \u003ccode\u003ehours\u003c/code\u003e và \u003ccode\u003escore\u003c/code\u003e là feature; \u003ccode\u003epassed\u003c/code\u003e là label. Chỉ \u003ccode\u003eNone\u003c/code\u003e được xem là missing. Một sinh viên nói: “Có 3 giá trị thiếu vì tôi thấy hai \u003ccode\u003eNone\u003c/code\u003e và một label bằng 0.” Nhận định nào đúng?\u003c/p\u003e\n      \u003cpre\u003e\u003ccode\u003erows = [\n    {\"hours\": None, \"score\": 75,   \"passed\": 1},\n    {\"hours\": 4,    \"score\": None, \"passed\": 0},\n    {\"hours\": 0,    \"score\": 60,   \"passed\": 1}\n]\u003c/code\u003e\u003c/pre\u003e\n      \n    ","choices":["Sinh viên đúng vì mọi số 0 đều biểu diễn dữ liệu thiếu","Sinh viên sai vì chỉ có 2 giá trị thiếu ở các feature","Sinh viên sai vì không có giá trị thiếu nào","Sinh viên đúng vì label bằng 0 luôn phải được tính vào missing"],"correct":1},{"id":"ml-1t7qfw3insggr","chapter":"1","topic":"Phần 1 — Đợt 1: Dữ liệu và nhãn","source":{"id":"ml-p01-b01-q10","la
